<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Elemental Shrine</title>
  <desc id="desc">A dark arched altar with stacked stones, a halo of light, a small flame, and a shallow water basin.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191c17"/>
      <stop offset="0.52" stop-color="#111310"/>
      <stop offset="1" stop-color="#080a08"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff8dc" stop-opacity=".95"/>
      <stop offset=".12" stop-color="#f1ddb0" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#f1ddb0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f1ddb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aaa594"/>
      <stop offset=".48" stop-color="#77766f"/>
      <stop offset="1" stop-color="#41433d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c7"/>
      <stop offset=".44" stop-color="#efbb72"/>
      <stop offset="1" stop-color="#c96f32"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93bec0" stop-opacity=".42"/>
      <stop offset="1" stop-color="#1c2e2d" stop-opacity=".9"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
    <pattern id="grain" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".65" fill="#fff" opacity=".09"/>
      <circle cx="8" cy="7" r=".5" fill="#fff" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#field)"/>
  <circle cx="178" cy="500" r="260" fill="#668b8e" opacity=".08" filter="url(#blur24)"/>
  <circle cx="1035" cy="490" r="220" fill="#c96f32" opacity=".07" filter="url(#blur24)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <path d="M160 548V238C160 98 340 52 600 52s440 46 440 186v310" fill="none" stroke="#ddd0ae" stroke-opacity=".16" stroke-width="2"/>
  <path d="M330 548V286M870 548V286" fill="none" stroke="#ddd0ae" stroke-opacity=".09" stroke-width="1"/>

  <circle cx="600" cy="172" r="122" fill="url(#halo)"/>
  <circle cx="600" cy="172" r="29" fill="none" stroke="#f1ddb0" stroke-opacity=".66" stroke-width="2"/>
  <circle cx="600" cy="172" r="8" fill="#fff8dc"/>
  <path d="M600 202 552 382M600 202 648 382M600 202V386" stroke="#f1ddb0" stroke-opacity=".15"/>

  <g filter="url(#shadow)">
    <ellipse cx="313" cy="497" rx="102" ry="22" fill="#000" opacity=".38"/>
    <path d="M225 478c6-33 30-46 88-45 58 1 83 14 88 45-16 25-157 25-176 0Z" fill="url(#stone)" stroke="#ddd0ae" stroke-opacity=".24"/>
    <path d="M250 429c7-28 25-39 64-38 39 1 58 12 65 38-19 24-109 24-129 0Z" fill="url(#stone)" stroke="#ddd0ae" stroke-opacity=".24"/>
    <path d="M273 387c4-24 18-33 42-32 26 1 39 10 43 32-17 21-68 21-85 0Z" fill="url(#stone)" stroke="#ddd0ae" stroke-opacity=".24"/>
    <path d="M292 352c3-20 12-28 25-27 14 1 23 8 25 27-11 16-39 16-50 0Z" fill="url(#stone)" stroke="#ddd0ae" stroke-opacity=".24"/>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="895" cy="500" rx="87" ry="19" fill="#c96f32" opacity=".18"/>
    <path d="M895 488c-52-30-44-80-8-117 1 30 18 35 24 56 11-23 16-47 3-73 47 35 60 99-19 134Z" fill="url(#flame)"/>
    <path d="M897 485c-24-21-18-46 2-69 1 18 12 24 12 39 8-13 7-24 4-36 26 23 24 51-18 66Z" fill="#fff2c7" opacity=".82"/>
  </g>

  <ellipse cx="600" cy="510" rx="350" ry="76" fill="none" stroke="#ddd0ae" stroke-opacity=".25" stroke-width="2"/>
  <ellipse cx="600" cy="510" rx="337" ry="63" fill="url(#water)"/>
  <ellipse cx="600" cy="510" rx="84" ry="17" fill="none" stroke="#93bec0" stroke-opacity=".72" stroke-width="2"/>
  <ellipse cx="600" cy="510" rx="158" ry="30" fill="none" stroke="#93bec0" stroke-opacity=".34"/>
  <ellipse cx="600" cy="510" rx="238" ry="45" fill="none" stroke="#93bec0" stroke-opacity=".18"/>

  <text x="64" y="80" fill="#ddd0ae" opacity=".58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">A PLACE TO SET DOWN WHAT YOU CARRY</text>
  <text x="600" y="287" fill="#ddd0ae" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="72" letter-spacing="8">ELEMENTAL SHRINE</text>
  <text x="600" y="322" fill="#ddd0ae" opacity=".62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">STONE · LIGHT · FIRE · WATER</text>
</svg>
