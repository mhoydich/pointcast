<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Texas football history rendered as geological strata</title>
  <desc id="desc">Abstract burnt orange, limestone, black, blue, and gold layers hold a sun, a memorial arch, a West Texas derrick, a wishbone play diagram, and a river-like white line moving from 1893 to 2026.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#fff7e8" opacity=".3"/></pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100c0a"/><stop offset=".58" stop-color="#28140e"/><stop offset="1" stop-color="#50200f"/></linearGradient>
  </defs>
  <rect width="1800" height="1100" fill="url(#sky)"/>
  <circle cx="1420" cy="215" r="148" fill="#f5c85a"/>
  <circle cx="1420" cy="215" r="118" fill="#f8e8bd" opacity=".28"/>
  <path d="M0 338C210 277 371 419 574 360c234-69 337-230 590-176 192 41 287 173 636 109v807H0Z" fill="#bf4d20"/>
