  <path d="M0 603c226-81 427 61 689-12 259-72 370-154 598-89 214 62 338 135 513 96v502H0Z" fill="#19395d"/>
  <path d="M0 720c281-105 451 77 719 11 298-73 424-114 655-38 179 59 302 82 426 57v350H0Z" fill="#0d0d0c"/>
  <path d="M0 874c211-58 439 77 724 22 306-58 463-71 731 15 142 45 252 55 345 41v148H0Z" fill="#a83d1a"/>
  <path d="M0 319C250 250 389 419 588 353c229-76 341-225 580-175 211 45 305 165 632 103" fill="none" stroke="#fff8e9" stroke-width="8" opacity=".92"/>
  <path d="M110 654C335 572 479 717 704 652c237-69 379-170 618-111 182 45 288 127 430 87" fill="none" stroke="#f5c85a" stroke-width="5" stroke-dasharray="18 18" opacity=".9"/>
  <g fill="none" stroke="#fff8e9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M255 442v-155l77-82 77 82v155"/>
    <path d="M221 442h222M281 442V314h102v128"/>
