<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="THE FRONT DOOR — twelve shelves lighting up one by one on a white register card">
  <style>
    .s { animation: lit 9s steps(1, end) infinite; }
    .s2 { animation-delay: .75s; } .s3 { animation-delay: 1.5s; } .s4 { animation-delay: 2.25s; }
    .s5 { animation-delay: 3s; } .s6 { animation-delay: 3.75s; } .s7 { animation-delay: 4.5s; }
    .s8 { animation-delay: 5.25s; } .s9 { animation-delay: 6s; } .s10 { animation-delay: 6.75s; }
    .s11 { animation-delay: 7.5s; } .s12 { animation-delay: 8.25s; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes lit { 0% { opacity: .14; } 8% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="#ffffff" stroke="#12110E" stroke-width="4"/>
  <rect x="34" y="34" width="1152" height="582" fill="none" stroke="#185FA5" stroke-width="10"/>
  <text x="64" y="86" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#185FA5">CH.FD · № 0580 · THE FRONT DOOR · 2026-09-01</text>
  <text x="64" y="176" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="-4" fill="#12110E">Still experimental.</text>
  <text x="64" y="262" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="-4" fill="#e53f47">Still on.</text>
  <text x="64" y="316" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#38373A">A small internet town, broadcasting from El Segundo. The whole town on one page.</text>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#12110E">
    <g class="s s1"><rect x="64" y="360" width="256" height="52" fill="#eef4fa" stroke="#12110E" stroke-width="2"/><text x="80" y="392">PLAY FIRST</text></g>
    <g class="s s2"><rect x="336" y="360" width="256" height="52" fill="#fffdf6" stroke="#12110E" stroke-width="2"/><text x="352" y="392">START HERE</text></g>
    <g class="s s3"><rect x="608" y="360" width="256" height="52" fill="#fff" stroke="#12110E" stroke-width="2"/><text x="624" y="392">AT A GLANCE</text></g>
    <g class="s s4"><rect x="880" y="360" width="256" height="52" fill="#f6ecef" stroke="#12110E" stroke-width="2"/><text x="896" y="392">THE MAGAZINE RACK</text></g>
    <g class="s s5"><rect x="64" y="428" width="256" height="52" fill="#fbeee9" stroke="#12110E" stroke-width="2"/><text x="80" y="460">THE DRUM HOUSE</text></g>
    <g class="s s6"><rect x="336" y="428" width="256" height="52" fill="#eef6ef" stroke="#12110E" stroke-width="2"/><text x="352" y="460">ROOMS &amp; RITUALS</text></g>
    <g class="s s7"><rect x="608" y="428" width="256" height="52" fill="#eaf0f7" stroke="#12110E" stroke-width="2"/><text x="624" y="460">THE CONSTELLATION</text></g>
    <g class="s s8"><rect x="880" y="428" width="256" height="52" fill="#eef4fa" stroke="#12110E" stroke-width="2"/><text x="896" y="460">THE AGENT DESK</text></g>
    <g class="s s9"><rect x="64" y="496" width="256" height="52" fill="#f3f3f1" stroke="#12110E" stroke-width="2"/><text x="80" y="528">THE SHIP LOG</text></g>
    <g class="s s10"><rect x="336" y="496" width="256" height="52" fill="#fff" stroke="#12110E" stroke-width="2"/><text x="352" y="528">THE REGISTER</text></g>
    <g class="s s11"><rect x="608" y="496" width="256" height="52" fill="#eef4fa" stroke="#12110E" stroke-width="2"/><text x="624" y="528">THE WIRE</text></g>
    <g class="s s12"><rect x="880" y="496" width="256" height="52" fill="#fffdf6" stroke="#12110E" stroke-width="2"/><text x="896" y="528">TEN CHANNELS</text></g>
  </g>
  <circle class="dot" cx="76" cy="580" r="6" fill="#1f7a3a"/>
  <text x="94" y="586" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#5F5E5A">355 BLOCKS · 395 DOORS · 22 SATELLITES · 50 MCP TOOLS · THE COFFEE POT, STILL ON</text>
</svg>
