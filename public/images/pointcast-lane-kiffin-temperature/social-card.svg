<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lane Kiffin Temperature Check</title>
  <desc id="desc">A purple, gold, red, and cream PointCast editorial card showing a 96 degree preseason signal and the LSU merger audit.</desc>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f04b3f"/>
      <stop offset="1" stop-color="#f4c430"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f4c430" stroke-opacity=".17" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#180b29"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="18" fill="#f4c430"/>
  <rect x="865" y="18" width="335" height="612" fill="#3a1263"/>
  <rect x="865" y="18" width="4" height="612" fill="#f4c430"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f3edda">
    <text x="58" y="72" fill="#f4c430" font-size="18" font-weight="700" letter-spacing="4">POINTCAST COLLEGE FOOTBALL · COACHES DESK 003</text>
    <line x1="58" y1="92" x2="810" y2="92" stroke="#f4c430" stroke-width="2"/>
    <text x="52" y="244" font-size="146" font-weight="900" letter-spacing="-8">LANE</text>
    <text x="52" y="378" font-size="146" font-weight="900" letter-spacing="-8">KIFFIN</text>
    <text x="58" y="456" fill="#f04b3f" font-family="Georgia, serif" font-size="88" font-style="italic">check.</text>
    <text x="58" y="526" font-size="22" font-weight="700">THE LSU MERGER AUDIT BEFORE GAME ONE</text>
    <rect x="58" y="553" width="618" height="40" fill="#f4c430"/>
    <text x="78" y="580" fill="#17121f" font-size="18" font-weight="900" letter-spacing="2">PLAYERS · CAPITAL · AREA · PRESS · FOES · FANS</text>
  </g>

  <g>
    <text x="910" y="74" fill="#f4c430" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">PRESEASON SIGNAL</text>
    <text x="900" y="252" fill="#f3edda" font-family="Impact, Arial Black, sans-serif" font-size="188" font-weight="900" letter-spacing="-8">96</text>
    <text x="1104" y="156" fill="#f3edda" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900">°</text>
    <rect x="912" y="274" width="132" height="34" fill="#f04b3f"/>
    <text x="928" y="297" fill="#17121f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" letter-spacing="2">BOILING</text>

    <rect x="1067" y="268" width="62" height="250" rx="31" fill="none" stroke="#f3edda" stroke-width="5"/>
    <rect x="1085" y="302" width="26" height="190" rx="13" fill="url(#heat)"/>
    <circle cx="1098" cy="491" r="23" fill="#f04b3f"/>
    <line x1="910" y1="348" x2="1034" y2="348" stroke="#f4c430" stroke-width="2"/>
    <line x1="910" y1="390" x2="1034" y2="390" stroke="#f4c430" stroke-opacity=".7"/>
    <line x1="910" y1="432" x2="1034" y2="432" stroke="#f4c430" stroke-opacity=".7"/>
    <line x1="910" y1="474" x2="1034" y2="474" stroke="#f4c430" stroke-opacity=".7"/>

    <g fill="#f3edda" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      <text x="910" y="370">NEW JOB</text>
      <text x="910" y="412">40 TRANSFERS</text>
      <text x="910" y="454">RANK #09</text>
      <text x="910" y="496">0 GAMES</text>
    </g>
    <text x="910" y="573" fill="#f4c430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">OXFORD · SEP 19</text>
    <text x="910" y="597" fill="#f3edda" font-family="Arial, Helvetica, sans-serif" font-size="12" opacity=".7">TEMPERATURE IS PRESSURE, NOT A PREDICTION.</text>
  </g>
</svg>
