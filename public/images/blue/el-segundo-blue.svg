<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">The El Segundo Blue</title>
  <desc id="d">Blue hour over the El Segundo dunes. Seacliff buckwheat in bloom, six El Segundo Blue butterflies drifting, a crescent moon, marine layer coming in, one plane on quiet approach to LAX.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10173a"/>
      <stop offset="0.52" stop-color="#2e2f63"/>
      <stop offset="0.76" stop-color="#6b4f86"/>
      <stop offset="0.92" stop-color="#c77e58"/>
      <stop offset="1" stop-color="#e0925f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0a468" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0a468" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5a6b"/>
      <stop offset="1" stop-color="#123243"/>
    </linearGradient>

    <!-- Seacliff buckwheat — stems, basal leaves, pom flower heads -->
    <g id="buckwheat">
      <path d="M0,0 C-2,-14 -8,-24 -14,-30" stroke="#6d7a5f" stroke-width="1.6" fill="none"/>
      <path d="M0,0 C0,-16 -1,-28 2,-38" stroke="#6d7a5f" stroke-width="1.6" fill="none"/>
      <path d="M0,0 C2,-12 8,-22 13,-27" stroke="#6d7a5f" stroke-width="1.6" fill="none"/>
      <path d="M0,0 C4,-10 10,-14 16,-16" stroke="#5f6b53" stroke-width="1.4" fill="none"/>
      <ellipse cx="-4" cy="-2" rx="6" ry="2.4" fill="#57654c"/>
      <ellipse cx="4" cy="-1" rx="6" ry="2.4" fill="#4d5a43"/>
      <g fill="#d9b8ae">
        <circle cx="-14" cy="-32" r="5"/><circle cx="-18" cy="-29" r="3.6"/><circle cx="-10" cy="-29" r="3.4"/>
      </g>
      <g fill="#c8a49b">
        <circle cx="2" cy="-40" r="5.6"/><circle cx="-2" cy="-37" r="3.8"/><circle cx="6" cy="-37" r="3.8"/>
      </g>
      <g fill="#d9b8ae">
        <circle cx="13" cy="-29" r="4.6"/><circle cx="9" cy="-26" r="3.2"/><circle cx="17" cy="-26" r="3.2"/>
      </g>
      <g fill="#c8a49b">
        <circle cx="16" cy="-17" r="3.8"/><circle cx="12" cy="-15" r="2.8"/>
      </g>
    </g>

    <!-- Dune grass tuft -->
    <g id="tuft">
      <path d="M0,0 C-3,-8 -7,-13 -11,-16 M0,0 C-1,-9 -1,-15 -3,-20 M0,0 C1,-8 4,-14 8,-18 M0,0 C3,-6 7,-9 11,-10"
            stroke="#4a5a44" stroke-width="1.3" fill="none"/>
    </g>

    <!-- El Segundo Blue, top view. Wingspan ~44 local units; seam at origin. -->
    <g id="esblue">
      <g class="wing wingL">
        <path d="M-1,-2 C-10,-13 -21,-11 -20,-2 C-19,4 -9,3 -1,0 Z" fill="#8aa6e4" stroke="#3d5a99" stroke-width="0.9"/>
        <path d="M-1,0 C-9,2 -14,8 -10,12 C-6,14 -2,8 -1,3 Z" fill="#7f9fe0" stroke="#3d5a99" stroke-width="0.9"/>
        <circle cx="-14" cy="-5" r="1.1" fill="#c7d6f5"/>
      </g>
      <g class="wing wingR">
        <path d="M1,-2 C10,-13 21,-11 20,-2 C19,4 9,3 1,0 Z" fill="#93b1ea" stroke="#3d5a99" stroke-width="0.9"/>
        <path d="M1,0 C9,2 14,8 10,12 C6,14 2,8 1,3 Z" fill="#86a5e6" stroke="#3d5a99" stroke-width="0.9"/>
        <circle cx="14" cy="-5" r="1.1" fill="#c7d6f5"/>
      </g>
      <ellipse cx="0" cy="1" rx="1.7" ry="5.2" fill="#23233a"/>
      <path d="M-1,-3 Q-4,-8 -6,-9 M1,-3 Q4,-8 6,-9" stroke="#23233a" stroke-width="0.9" fill="none"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#sky)"/>
  <ellipse cx="430" cy="402" rx="330" ry="90" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle class="tw1" cx="120" cy="80" r="1.4"/>
    <circle class="tw2" cx="235" cy="150" r="1.1"/>
    <circle class="tw3" cx="330" cy="60" r="1.5"/>
    <circle class="tw1" cx="470" cy="120" r="1.0"/>
    <circle class="tw2" cx="565" cy="55" r="1.3"/>
    <circle class="tw3" cx="660" cy="140" r="1.0"/>
    <circle class="tw1" cx="760" cy="75" r="1.4"/>
    <circle class="tw2" cx="855" cy="180" r="1.0"/>
    <circle class="tw3" cx="1055" cy="70" r="1.3"/>
    <circle class="tw1" cx="1130" cy="160" r="1.1"/>
    <circle class="tw2" cx="905" cy="45" r="1.2"/>
    <circle class="tw3" cx="55" cy="190" r="1.0"/>
  </g>

  <!-- Waxing crescent, lit limb toward the set sun -->
  <mask id="crescent">
    <circle r="26" fill="#fff"/>
    <circle cx="9" cy="-7" r="24" fill="#000"/>
  </mask>
  <g transform="translate(972,110)">
    <circle r="26" fill="#f2e9d8" mask="url(#crescent)"/>
  </g>

  <!-- One plane on quiet approach, over-ocean ops. Base position is the
       static frame; CSS animation offsets from there in browsers. -->
  <g transform="translate(940,215)">
    <g class="plane">
      <circle cx="0" cy="0" r="1.6" fill="#ff6b6b"/>
      <circle class="strobe" cx="7" cy="1" r="1.3" fill="#ffffff"/>
      <circle cx="14" cy="2" r="1.2" fill="#8fd08f"/>
    </g>
  </g>

  <!-- Ocean -->
  <rect x="0" y="398" width="1200" height="46" fill="url(#sea)"/>
  <g stroke-linecap="round">
    <line class="shm1" x1="330" y1="412" x2="530" y2="412" stroke="#f0a468" stroke-width="2.2" opacity="0.3"/>
    <line class="shm2" x1="380" y1="422" x2="500" y2="422" stroke="#e8b07e" stroke-width="1.8" opacity="0.2"/>
    <line class="shm3" x1="300" y1="432" x2="460" y2="432" stroke="#d98e5f" stroke-width="1.6" opacity="0.14"/>
  </g>

  <!-- Marine layer, coming in slow -->
  <g transform="translate(0,0)">
    <g class="fogA" opacity="0.16">
      <ellipse cx="380" cy="400" rx="420" ry="26" fill="#b9c4d9"/>
      <ellipse cx="720" cy="392" rx="300" ry="18" fill="#b9c4d9"/>
    </g>
  </g>
  <g transform="translate(0,0)">
    <g class="fogB" opacity="0.11">
      <ellipse cx="820" cy="418" rx="460" ry="22" fill="#c7d0e2"/>
    </g>
  </g>

  <!-- Dunes, back to front -->
  <path d="M0,470 C180,430 340,452 520,436 C700,420 840,446 1010,428 C1090,420 1150,424 1200,418 L1200,675 L0,675 Z" fill="#4a4468"/>
  <path d="M0,520 C150,478 320,502 470,486 C660,466 780,502 950,480 C1070,466 1150,478 1200,468 L1200,675 L0,675 Z" fill="#322e4e"/>
  <path d="M0,590 C160,548 330,574 520,556 C720,538 860,572 1040,552 C1110,545 1160,552 1200,546 L1200,675 L0,675 Z" fill="#201d36"/>

  <!-- Wind ripples in the sand -->
  <g stroke="#2c2947" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M60,640 C140,632 220,636 300,630"/>
    <path d="M340,662 C430,654 520,658 610,650"/>
    <path d="M600,624 C670,618 740,622 810,616"/>
    <path d="M760,656 C850,648 940,652 1030,644"/>
    <path d="M980,632 C1050,626 1120,630 1180,624"/>
    <path d="M140,608 C200,602 260,606 320,600"/>
  </g>

  <!-- Buckwheat + grass on the front dune -->
  <use href="#tuft" transform="translate(120,576) rotate(-4)"/>
  <use href="#buckwheat" transform="translate(185,572)"/>
  <use href="#tuft" transform="translate(262,566)"/>
  <use href="#buckwheat" transform="translate(430,602) scale(1.18) rotate(2)"/>
  <use href="#tuft" transform="translate(536,588)"/>
  <use href="#buckwheat" transform="translate(762,588) scale(0.92)"/>
  <use href="#tuft" transform="translate(852,596) rotate(6)"/>
  <use href="#buckwheat" transform="translate(988,616) scale(1.3)"/>
  <use href="#tuft" transform="translate(1096,600)"/>
  <use href="#buckwheat" transform="translate(640,652) scale(1.08) rotate(-3)"/>
  <use href="#tuft" transform="translate(710,660)"/>
  <use href="#tuft" transform="translate(60,646) rotate(3)"/>

  <!-- The blues. Five in the air, one resting on the tall buckwheat. -->
  <g transform="translate(300,470) scale(1.05)"><g class="drift d1"><use href="#esblue"/></g></g>
  <g transform="translate(520,430) scale(0.8)"><g class="drift d2"><use href="#esblue"/></g></g>
  <g transform="translate(700,500) scale(1.25)"><g class="drift d3"><use href="#esblue"/></g></g>
  <g transform="translate(880,455) scale(0.7)"><g class="drift d4"><use href="#esblue"/></g></g>
  <g transform="translate(150,520) scale(0.9)"><g class="drift d5"><use href="#esblue"/></g></g>
  <g transform="translate(988,568) scale(0.85) rotate(-12)"><g class="rest"><use href="#esblue"/></g></g>

  <style>
    .wing { transform-box: fill-box; }
    .wingL { transform-origin: right center; animation: flap 0.46s ease-in-out infinite alternate; }
    .wingR { transform-origin: left center; animation: flap 0.46s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(0.18); } }
    .rest .wingL, .rest .wingR { animation-duration: 2.9s; }

    .drift { animation: 30s ease-in-out infinite alternate; }
    .d1 { animation-name: drift1; animation-duration: 34s; }
    .d2 { animation-name: drift2; animation-duration: 26s; animation-delay: -8s; }
    .d3 { animation-name: drift3; animation-duration: 42s; animation-delay: -16s; }
    .d4 { animation-name: drift4; animation-duration: 22s; animation-delay: -4s; }
    .d5 { animation-name: drift5; animation-duration: 38s; animation-delay: -20s; }
    @keyframes drift1 { 0% { transform: translate(0,0) rotate(0deg); } 35% { transform: translate(90px,-40px) rotate(9deg); } 70% { transform: translate(30px,-90px) rotate(-7deg); } 100% { transform: translate(140px,-25px) rotate(4deg); } }
    @keyframes drift2 { 0% { transform: translate(0,0) rotate(0deg); } 40% { transform: translate(-70px,35px) rotate(-8deg); } 100% { transform: translate(60px,-50px) rotate(6deg); } }
    @keyframes drift3 { 0% { transform: translate(0,0) rotate(0deg); } 30% { transform: translate(-110px,-30px) rotate(6deg); } 65% { transform: translate(-40px,-80px) rotate(-9deg); } 100% { transform: translate(-160px,10px) rotate(0deg); } }
    @keyframes drift4 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(55px,60px) rotate(-6deg); } 100% { transform: translate(-45px,25px) rotate(8deg); } }
    @keyframes drift5 { 0% { transform: translate(0,0) rotate(0deg); } 45% { transform: translate(75px,-55px) rotate(7deg); } 100% { transform: translate(25px,15px) rotate(-5deg); } }

    .tw1 { opacity: 0.9; animation: twinkle 4.2s ease-in-out infinite alternate; }
    .tw2 { opacity: 0.6; animation: twinkle 5.6s ease-in-out infinite alternate; animation-delay: -2s; }
    .tw3 { opacity: 0.75; animation: twinkle 6.8s ease-in-out infinite alternate; animation-delay: -4s; }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 0.95; } }

    .fogA { animation: fogA 80s ease-in-out infinite alternate; }
    .fogB { animation: fogB 64s ease-in-out infinite alternate; }
    @keyframes fogA { from { transform: translateX(0); } to { transform: translateX(85px); } }
    @keyframes fogB { from { transform: translateX(0); } to { transform: translateX(-70px); } }

    .shm1 { animation: shimmer 7s ease-in-out infinite alternate; }
    .shm2 { animation: shimmer 9s ease-in-out infinite alternate; animation-delay: -3s; }
    .shm3 { animation: shimmer 11s ease-in-out infinite alternate; animation-delay: -6s; }
    @keyframes shimmer { from { opacity: 0.08; } to { opacity: 0.34; } }

    .plane { animation: approach 52s linear infinite; }
    @keyframes approach {
      0% { transform: translate(300px,-95px); opacity: 0; }
      4% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translate(-1020px,115px); opacity: 0; }
    }
    .strobe { animation: strobe 1.4s step-end infinite; }
    @keyframes strobe { 0%, 88% { opacity: 0.15; } 90%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .wingL, .wingR, .drift, .tw1, .tw2, .tw3, .fogA, .fogB, .shm1, .shm2, .shm3, .plane, .strobe { animation: none; }
    }
  </style>
</svg>
