<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Rounds</title>
  <desc id="d">Five gold bells hang in a row against a night sky, swinging one after another the way change-ringers ring rounds, each sending a ripple of sound outward. A caption reads: eleven castings became seventeen.</desc>

  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131022"/>
      <stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#c4a35a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky2)"/>

  <g fill="#f5e6d3">
    <circle cx="120" cy="100" r="2" opacity=".6"/>
    <circle cx="420" cy="70" r="1.5" opacity=".5"/>
    <circle cx="760" cy="90" r="2" opacity=".6"/>
    <circle cx="1080" cy="130" r="1.5" opacity=".5"/>
    <circle cx="950" cy="60" r="1.5" opacity=".4"/>
  </g>

  <!-- beam -->
  <rect x="120" y="150" width="960" height="16" fill="#2a2044"/>
  <rect x="104" y="120" width="16" height="420" fill="#2a2044"/>
  <rect x="1080" y="120" width="16" height="420" fill="#2a2044"/>

  <!-- five bells, ringing rounds: staggered swings, largest last -->
  <g>
    <g transform="translate(240,170)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -16 0 0; 12 0 0; -6 0 0; 0 0 0" keyTimes="0;.15;.4;.7;1" dur="3.4s" begin="0s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="8" stroke="#c4a35a" stroke-width="3"/>
        <path d="M -14 32 Q -16 8 -5 1 Q 0 -2 5 1 Q 16 8 14 32 L 18 32 L 18 37 L -18 37 L -18 32 Z" fill="url(#metal2)"/>
        <circle cx="0" cy="41" r="3.5" fill="#ffd76a"/>
      </g>
      <circle cx="0" cy="30" fill="none" stroke="#c4a35a" stroke-width="1.5">
        <animate attributeName="r" values="8;80" dur="3.4s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="3.4s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(420,170)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -16 0 0; 12 0 0; -6 0 0; 0 0 0" keyTimes="0;.15;.4;.7;1" dur="3.4s" begin="0.34s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="9" stroke="#c4a35a" stroke-width="3"/>
        <path d="M -16 36 Q -18 9 -6 1 Q 0 -2 6 1 Q 18 9 16 36 L 20 36 L 20 42 L -20 42 L -20 36 Z" fill="url(#metal2)"/>
        <circle cx="0" cy="46" r="4" fill="#ffd76a"/>
      </g>
      <circle cx="0" cy="34" fill="none" stroke="#c4a35a" stroke-width="1.5">
        <animate attributeName="r" values="8;85" dur="3.4s" begin="0.54s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="3.4s" begin="0.54s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(600,170)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -16 0 0; 12 0 0; -6 0 0; 0 0 0" keyTimes="0;.15;.4;.7;1" dur="3.4s" begin="0.68s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="10" stroke="#c4a35a" stroke-width="3"/>
        <path d="M -18 40 Q -20 10 -6 1 Q 0 -3 6 1 Q 20 10 18 40 L 23 40 L 23 46 L -23 46 L -23 40 Z" fill="url(#metal2)"/>
        <circle cx="0" cy="51" r="4.5" fill="#ffd76a"/>
      </g>
      <circle cx="0" cy="38" fill="none" stroke="#c4a35a" stroke-width="1.5">
        <animate attributeName="r" values="9;90" dur="3.4s" begin="0.88s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="3.4s" begin="0.88s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(780,170)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -16 0 0; 12 0 0; -6 0 0; 0 0 0" keyTimes="0;.15;.4;.7;1" dur="3.4s" begin="1.02s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="11" stroke="#c4a35a" stroke-width="3"/>
        <path d="M -20 45 Q -22 11 -7 1 Q 0 -3 7 1 Q 22 11 20 45 L 26 45 L 26 52 L -26 52 L -26 45 Z" fill="url(#metal2)"/>
        <circle cx="0" cy="57" r="5" fill="#ffd76a"/>
      </g>
      <circle cx="0" cy="42" fill="none" stroke="#c4a35a" stroke-width="1.5">
        <animate attributeName="r" values="9;95" dur="3.4s" begin="1.22s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="3.4s" begin="1.22s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(960,170)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -16 0 0; 12 0 0; -6 0 0; 0 0 0" keyTimes="0;.15;.4;.7;1" dur="3.4s" begin="1.36s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="12" stroke="#c4a35a" stroke-width="3"/>
        <path d="M -23 52 Q -25 12 -8 1 Q 0 -4 8 1 Q 25 12 23 52 L 29 52 L 29 60 L -29 60 L -29 52 Z" fill="url(#metal2)"/>
        <circle cx="0" cy="66" r="5.5" fill="#ffd76a"/>
      </g>
      <circle cx="0" cy="48" fill="none" stroke="#c4a35a" stroke-width="1.5">
        <animate attributeName="r" values="10;100" dur="3.4s" begin="1.56s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="3.4s" begin="1.56s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="540" width="1200" height="135" fill="#0e0c1a"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#2a2244" stroke-width="2"/>

  <g font-family="Courier New, monospace" fill="#f5e6d3">
    <text x="100" y="600" font-size="30">eleven castings became seventeen.</text>
    <text x="100" y="636" font-size="16" fill="#c4a35a" letter-spacing="4">ROUNDS · OFFSHORE · KNOCK · PENNY · PENDULUM · FARAWAY</text>
  </g>
</svg>
