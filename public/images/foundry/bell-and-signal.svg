<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Bell &amp; Signal</title>
  <desc id="d">A night scene in El Segundo. A small foundry shed with amber-lit windows stands under a dark sky, with a bell tower beside it. Inside the tower's arch, a gold bell swings slowly, and rings of sound ripple outward across the sky. A caption reads: the town has a foundry now.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131022"/>
      <stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
    <linearGradient id="bellmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#c4a35a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f5e6d3">
    <circle cx="150" cy="90" r="2" opacity=".7"/>
    <circle cx="320" cy="150" r="1.5" opacity=".5"/>
    <circle cx="520" cy="70" r="2" opacity=".6"/>
    <circle cx="1050" cy="110" r="2" opacity=".7"/>
    <circle cx="920" cy="60" r="1.5" opacity=".5"/>
    <circle cx="1140" cy="230" r="1.5" opacity=".4"/>
    <circle cx="70" cy="250" r="1.5" opacity=".4"/>
  </g>

  <!-- sound rings from the bell -->
  <g fill="none" stroke="#c4a35a" stroke-width="2">
    <circle cx="820" cy="285">
      <animate attributeName="r" values="20;190" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="285">
      <animate attributeName="r" values="20;190" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="285">
      <animate attributeName="r" values="20;190" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ground -->
  <rect x="0" y="520" width="1200" height="155" fill="#0e0c1a"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#2a2244" stroke-width="2"/>

  <!-- foundry shed -->
  <g>
    <rect x="360" y="380" width="300" height="140" fill="#231a38"/>
    <polygon points="345,380 675,380 630,320 390,320" fill="#2e2348"/>
    <rect x="395" y="415" width="52" height="62" fill="#ffb547">
      <animate attributeName="opacity" values="1;.82;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="475" y="415" width="52" height="62" fill="#ff9b2f" opacity=".9"/>
    <rect x="560" y="430" width="60" height="90" fill="#171126"/>
    <line x1="421" y1="415" x2="421" y2="477" stroke="#231a38" stroke-width="4"/>
    <line x1="395" y1="446" x2="447" y2="446" stroke="#231a38" stroke-width="4"/>
    <line x1="501" y1="415" x2="501" y2="477" stroke="#231a38" stroke-width="4"/>
    <line x1="475" y1="446" x2="527" y2="446" stroke="#231a38" stroke-width="4"/>
    <!-- chimney with drifting smoke -->
    <rect x="600" y="290" width="24" height="60" fill="#2e2348"/>
    <circle cx="612" cy="278" r="8" fill="#f5e6d3" opacity=".15">
      <animate attributeName="cy" values="278;236" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".18;0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bell tower -->
  <g>
    <rect x="760" y="230" width="120" height="290" fill="#2a2044"/>
    <polygon points="748,230 892,230 820,175" fill="#352a54"/>
    <path d="M 786 320 L 786 250 Q 820 222 854 250 L 854 320 Z" fill="#131022"/>
    <!-- the bell, swinging -->
    <g transform="translate(820,252)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-13 0 0; 13 0 0; -13 0 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
        <line x1="0" y1="0" x2="0" y2="8" stroke="#c4a35a" stroke-width="4"/>
        <path d="M -20 44 Q -22 12 -7 2 Q 0 -2 7 2 Q 22 12 20 44 L 25 44 L 25 50 L -25 50 L -25 44 Z" fill="url(#bellmetal)"/>
        <circle cx="0" cy="55" r="5" fill="#ffd76a"/>
      </g>
    </g>
  </g>

  <!-- caption -->
  <g font-family="Courier New, monospace" fill="#f5e6d3">
    <text x="100" y="590" font-size="30">the town has a foundry now.</text>
    <text x="100" y="626" font-size="16" fill="#c4a35a" letter-spacing="4">BELL &amp; SIGNAL — CASTINGS IN CODE · NO SAMPLES · EL SEGUNDO</text>
  </g>
</svg>
