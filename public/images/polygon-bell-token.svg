<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">PointCast Polygon Bell #001</title>
  <desc id="desc">A geometric yellow bell token on a Polygon-purple and PointCast-green field.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.42" stop-color="#e8f3ee"/>
      <stop offset="1" stop-color="#f0e8ff"/>
    </linearGradient>
    <linearGradient id="bell" x1="0.2" y1="0.05" x2="0.78" y2="0.9">
      <stop offset="0" stop-color="#fff7b8"/>
      <stop offset="0.45" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#b67316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="22" dy="28" stdDeviation="0" flood-color="#171717" flood-opacity="0.22"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#171717" stroke-opacity="0.09" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="url(#sky)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <polygon points="144,184 1058,126 1110,922 546,1102 104,824" fill="#ffffff" opacity="0.68"/>
  <polygon points="242,244 938,166 1040,690 744,1014 216,864 98,480" fill="#8247e5" opacity="0.18"/>
  <polygon points="574,114 1004,360 1004,850 574,1098 146,850 146,360" fill="none" stroke="#8247e5" stroke-width="34" stroke-linejoin="round" opacity="0.92"/>
  <polygon points="574,210 920,410 920,806 574,1008 228,806 228,410" fill="none" stroke="#0f6e56" stroke-width="18" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <polygon points="596,244 780,334 850,610 950,758 814,840 378,840 242,758 342,610 412,334" fill="url(#bell)" stroke="#171717" stroke-width="28" stroke-linejoin="round"/>
    <polygon points="420,812 818,812 742,926 498,926" fill="#ffd24a" stroke="#171717" stroke-width="26" stroke-linejoin="round"/>
    <circle cx="620" cy="948" r="54" fill="#0f6e56" stroke="#171717" stroke-width="24"/>
    <polygon points="516,240 596,170 676,240" fill="#ffd24a" stroke="#171717" stroke-width="26" stroke-linejoin="round"/>
    <path d="M462 390c64 34 210 34 276 0" fill="none" stroke="#fffdf8" stroke-width="34" stroke-linecap="round" opacity="0.74"/>
    <path d="M404 612c88 58 306 58 394 0" fill="none" stroke="#8a2432" stroke-width="22" stroke-linecap="round" opacity="0.76"/>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" fill="#171717">
    <text x="600" y="82" font-size="34" font-weight="700" letter-spacing="10">POINTCAST</text>
    <text x="600" y="1138" font-size="30" font-weight="700" letter-spacing="8">POLYGON BELL #001</text>
    <text x="600" y="1180" font-size="20" letter-spacing="6">CHAIN 137 / 5 RINGS / 100 EDITIONS</text>
  </g>
