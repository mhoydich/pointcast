<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Saturday Atlas — all 266 Division I football programs</title>
  <desc id="desc">An original PointCast directory-desk card in black, acid green, field blue, and warm paper.</desc>
  <rect width="1200" height="630" fill="#f4f0df"/>
  <rect width="258" height="630" fill="#10130f"/>
  <rect x="950" width="250" height="630" fill="#87cfff"/>
  <ellipse cx="130" cy="320" rx="238" ry="116" fill="none" stroke="#d7ff35" stroke-width="28" transform="rotate(-18 130 320)"/>
  <text x="35" y="55" fill="#d7ff35" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="5">DIVISION</text>
  <text x="68" y="430" fill="#d7ff35" font-family="Arial, sans-serif" font-size="330" font-weight="900">I</text>
  <text x="35" y="590" fill="#d7ff35" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4">2026–27</text>
  <text x="308" y="72" fill="#10130f" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4">POINTCAST · DIRECTORY DESK 001</text>
  <text x="308" y="190" fill="#10130f" font-family="Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-7">THE</text>
  <text x="308" y="285" fill="#145df5" font-family="Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-7">SATURDAY</text>
  <text x="308" y="380" fill="#10130f" font-family="Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-7">ATLAS</text>
  <line x1="308" y1="420" x2="900" y2="420" stroke="#10130f" stroke-width="3"/>
  <text x="308" y="465" fill="#10130f" font-family="Arial, sans-serif" font-size="26" font-weight="700">Every Division I football program.</text>
  <text x="308" y="500" fill="#10130f" font-family="Arial, sans-serif" font-size="26" font-weight="700">One honest place to begin.</text>
  <rect x="308" y="548" width="156" height="40" fill="#d7ff35" stroke="#10130f" stroke-width="2"/>
  <text x="327" y="575" fill="#10130f" font-family="Arial, sans-serif" font-size="17" font-weight="900">138 FBS</text>
  <rect x="476" y="548" width="156" height="40" fill="#87cfff" stroke="#10130f" stroke-width="2"/>
  <text x="493" y="575" fill="#10130f" font-family="Arial, sans-serif" font-size="17" font-weight="900">128 FCS</text>
  <text x="1072" y="110" fill="#10130f" font-family="Arial, sans-serif" font-size="100" font-weight="900" text-anchor="middle">266</text>
  <text x="1072" y="143" fill="#10130f" font-family="Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle">PROGRAMS</text>
  <line x1="984" y1="180" x2="1160" y2="180" stroke="#10130f" stroke-width="2"/>
  <text x="1072" y="252" fill="#10130f" font-family="Arial, sans-serif" font-size="58" font-weight="900" text-anchor="middle">21</text>
  <text x="1072" y="279" fill="#10130f" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">HBCUs</text>
  <line x1="984" y1="316" x2="1160" y2="316" stroke="#10130f" stroke-width="2"/>
  <text x="1072" y="384" fill="#10130f" font-family="Arial, sans-serif" font-size="58" font-weight="900" text-anchor="middle">48</text>
  <text x="1072" y="411" fill="#10130f" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">STATES + DC</text>
  <line x1="984" y1="448" x2="1160" y2="448" stroke="#10130f" stroke-width="2"/>
  <text x="1072" y="512" fill="#10130f" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">TOP 25</text>
  <text x="1072" y="541" fill="#10130f" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">+ HONEST DIRECTORY</text>
  <text x="1072" y="595" fill="#10130f" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" text-anchor="middle">POINTCAST.XYZ</text>
