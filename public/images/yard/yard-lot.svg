<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="An empty staked lot in the builders yard, lamp on, waiting for its first builder">
  <style>
    .ground { fill: #ffffff; }
    .plot { fill: #f2f6fa; stroke: #185FA5; stroke-width: 3; stroke-dasharray: 14 10; animation: march 14s linear infinite; }
    .stake { fill: #185FA5; }
    .stake-cap { fill: #12477c; }
    .lamp-post { stroke: #5F5E5A; stroke-width: 5; }
    .lamp-head { fill: #BA7517; animation: glow 3.6s ease-in-out infinite alternate; }
    .lamp-halo { fill: #BA7517; opacity: 0.14; animation: halo 3.6s ease-in-out infinite alternate; }
    .meadow { fill: #0F6E56; opacity: 0.55; }
    .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.12em; }
    .label { fill: #12477c; font-size: 21px; }
    .sub { fill: #5F5E5A; font-size: 15px; }
    @keyframes march { to { stroke-dashoffset: -240; } }
    @keyframes glow { from { opacity: 0.55; } to { opacity: 1; } }
    @keyframes halo { from { opacity: 0.06; r: 34; } to { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .plot, .lamp-head, .lamp-halo { animation: none; }
    }
  </style>

  <rect class="ground" width="800" height="420" />

  <!-- the staked plot -->
  <rect class="plot" x="150" y="120" width="380" height="220" />

  <!-- corner survey stakes -->
  <g>
    <rect class="stake" x="144" y="102" width="12" height="30" />
    <rect class="stake-cap" x="141" y="99" width="18" height="7" />
    <rect class="stake" x="524" y="102" width="12" height="30" />
    <rect class="stake-cap" x="521" y="99" width="18" height="7" />
    <rect class="stake" x="144" y="322" width="12" height="30" />
    <rect class="stake-cap" x="141" y="319" width="18" height="7" />
    <rect class="stake" x="524" y="322" width="12" height="30" />
    <rect class="stake-cap" x="521" y="319" width="18" height="7" />
  </g>

  <!-- a few meadow tufts waiting their turn -->
  <g>
    <rect class="meadow" x="220" y="296" width="4" height="14" />
    <rect class="meadow" x="228" y="300" width="4" height="10" />
    <rect class="meadow" x="418" y="176" width="4" height="12" />
    <rect class="meadow" x="426" y="180" width="4" height="8" />
    <rect class="meadow" x="310" y="238" width="4" height="12" />
  </g>

  <!-- the night-shift lamp, on -->
  <g>
    <circle class="lamp-halo" cx="640" cy="150" r="34" />
    <line class="lamp-post" x1="640" y1="330" x2="640" y2="168" />
    <rect fill="#5F5E5A" x="616" y="326" width="48" height="8" />
    <circle class="lamp-head" cx="640" cy="150" r="16" />
  </g>

  <!-- plot card -->
  <text class="mono label" x="150" y="84">PLOT 01 — OPEN</text>
  <text class="mono sub" x="150" y="384">THE BUILDERS YARD · PULL A PERMIT · KETTLE ON</text>
</svg>
