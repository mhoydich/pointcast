<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A constellation path of stars rising from the El Segundo horizon — the dotpath announcement, night-walk set">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1e"/>
      <stop offset="0.72" stop-color="#101c45"/>
      <stop offset="1" stop-color="#16244f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#night)"/>

  <!-- starfield — a few twinkle -->
  <g fill="#e8ecff">
    <circle cx="94" cy="88" r="1.6" opacity="0.7"/><circle cx="211" cy="142" r="1.2" opacity="0.5"/>
    <circle cx="318" cy="64" r="1.8" opacity="0.8"/><circle cx="431" cy="188" r="1.3" opacity="0.5"/>
    <circle cx="529" cy="96" r="1.5" opacity="0.6"/><circle cx="668" cy="58" r="1.2" opacity="0.5"/>
    <circle cx="742" cy="171" r="1.7" opacity="0.7"/><circle cx="866" cy="84" r="1.4" opacity="0.6"/>
    <circle cx="958" cy="176" r="1.2" opacity="0.5"/><circle cx="1063" cy="99" r="1.7" opacity="0.7"/>
    <circle cx="1141" cy="205" r="1.3" opacity="0.5"/><circle cx="167" cy="264" r="1.4" opacity="0.6"/>
    <circle cx="299" cy="331" r="1.2" opacity="0.4"/><circle cx="87" cy="412" r="1.5" opacity="0.5"/>
    <circle cx="1102" cy="341" r="1.5" opacity="0.6"/><circle cx="1010" cy="437" r="1.2" opacity="0.4"/>
    <circle cx="576" cy="243" r="1.2" opacity="0.4"/><circle cx="384" cy="472" r="1.3" opacity="0.4"/>
    <circle cx="484" cy="41" r="1.1" opacity="0.5"/><circle cx="613" cy="146" r="1.4" opacity="0.55"/>
    <circle cx="801" cy="257" r="1.2" opacity="0.45"/><circle cx="921" cy="308" r="1.3" opacity="0.5"/>
    <circle cx="139" cy="181" r="1.2" opacity="0.5"/><circle cx="1173" cy="128" r="1.4" opacity="0.6"/>
    <circle cx="53" cy="303" r="1.2" opacity="0.45"/><circle cx="723" cy="345" r="1.2" opacity="0.4"/>
    <circle cx="245" cy="215" r="2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="905" cy="141" r="2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.1s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="486" cy="132" r="1.9" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1084" cy="256" r="1.8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3.7s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="352" cy="152" r="1.7" opacity="0.65">
      <animate attributeName="opacity" values="0.65;0.2;0.65" dur="4.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- dotted moon — a ring of pale dots, slowly turning -->
  <g transform="translate(1040,120)">
    <g fill="#c9d4f6" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <circle cx="0" cy="-46" r="3.4"/><circle cx="32.5" cy="-32.5" r="3"/><circle cx="46" cy="0" r="3.4"/>
      <circle cx="32.5" cy="32.5" r="3"/><circle cx="0" cy="46" r="3.4"/><circle cx="-32.5" cy="32.5" r="3"/>
      <circle cx="-46" cy="0" r="3.4"/><circle cx="-32.5" cy="-32.5" r="3"/>
      <circle cx="17.6" cy="-42.5" r="2.2"/><circle cx="42.5" cy="-17.6" r="2.2"/><circle cx="42.5" cy="17.6" r="2.2"/>
      <circle cx="17.6" cy="42.5" r="2.2"/><circle cx="-17.6" cy="42.5" r="2.2"/><circle cx="-42.5" cy="17.6" r="2.2"/>
      <circle cx="-42.5" cy="-17.6" r="2.2"/><circle cx="-17.6" cy="-42.5" r="2.2"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="#e8ecff" opacity="0.9"/>
  </g>

  <!-- the constellation — six link-stars, drawn in, pulsing in walk order -->
  <g stroke="#4d7fc4" stroke-width="1.6" opacity="0.9" fill="none" stroke-dasharray="600" stroke-dashoffset="600">
    <path d="M 313 519 L 425 431 L 561 462 L 668 352 L 820 316 L 918 212">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="4s" fill="freeze" begin="0.6s"/>
    </path>
  </g>
  <g>
    <circle cx="313" cy="519" r="26" fill="url(#glow)"/>
    <circle cx="313" cy="519" r="7" fill="#ffd97a">
      <animate attributeName="r" values="7;9;7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="431" r="22" fill="url(#glow)" opacity="0.8"/>
    <circle cx="425" cy="431" r="6" fill="#e8ecff">
      <animate attributeName="r" values="6;7.6;6" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="561" cy="462" r="22" fill="url(#glow)" opacity="0.8"/>
    <circle cx="561" cy="462" r="6" fill="#ffd97a">
      <animate attributeName="r" values="6;7.6;6" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="668" cy="352" r="22" fill="url(#glow)" opacity="0.8"/>
    <circle cx="668" cy="352" r="6" fill="#e8ecff">
      <animate attributeName="r" values="6;7.6;6" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="316" r="22" fill="url(#glow)" opacity="0.8"/>
    <circle cx="820" cy="316" r="6" fill="#ffd97a">
      <animate attributeName="r" values="6;7.6;6" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="918" cy="212" r="28" fill="url(#glow)"/>
    <circle cx="918" cy="212" r="8" fill="#ffffff">
      <animate attributeName="r" values="8;10;8" dur="2.6s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- runway dots — the path lighting up from the door to the first star -->
  <g fill="#ffd97a">
    <circle cx="163" cy="612" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="193" cy="594" r="4.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="224" cy="577" r="4.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="558" r="5.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="285" cy="539" r="5.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pixel horizon — blocky El Segundo silhouettes, water tower, two lit windows -->
  <g fill="#060913">
    <rect x="0" y="628" width="1200" height="47"/>
    <rect x="52" y="596" width="74" height="32"/>
    <rect x="176" y="608" width="112" height="20"/>
    <rect x="340" y="588" width="58" height="40"/>
    <rect x="447" y="604" width="132" height="24"/>
    <rect x="630" y="592" width="66" height="36"/>
    <rect x="740" y="612" width="150" height="16"/>
    <rect x="946" y="598" width="84" height="30"/>
    <rect x="1080" y="586" width="60" height="42"/>
    <!-- water tower -->
    <rect x="560" y="530" width="8" height="62"/><rect x="596" y="530" width="8" height="62"/>
    <rect x="548" y="502" width="68" height="34" rx="6"/>
    <rect x="572" y="484" width="20" height="18"/>
  </g>
  <g fill="#ffd97a">
    <rect x="72" y="606" width="6" height="6" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="962" y="608" width="6" height="6" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="6s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="578" y="512" width="8" height="8" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.4;0.95" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
