<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .orbit{animation:spin 26s linear infinite;transform-origin:200px 218px}
    .bob1{animation:bob 2.8s ease-in-out infinite}
    .bob2{animation:bob 3.4s ease-in-out .6s infinite}
    .drip{animation:drip 1.8s ease-in-out infinite}
    .drip2{animation:drip 1.8s ease-in-out .9s infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes drip{0%,100%{opacity:.25}50%{opacity:.7}}
  </style>

  <rect x="0" y="0" width="800" height="420" fill="#f2efe9"/>
  <g fill="#d8d2c6">
    <circle cx="40" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="600" cy="40" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/>
    <circle cx="40" cy="380" r="1.5"/><circle cx="120" cy="380" r="1.5"/><circle cx="200" cy="380" r="1.5"/><circle cx="280" cy="380" r="1.5"/><circle cx="360" cy="380" r="1.5"/><circle cx="440" cy="380" r="1.5"/><circle cx="520" cy="380" r="1.5"/><circle cx="600" cy="380" r="1.5"/><circle cx="680" cy="380" r="1.5"/><circle cx="760" cy="380" r="1.5"/>
  </g>

  <!-- ====== left: the savings circle ====== -->
  <circle cx="200" cy="218" r="52" fill="#ffffff" stroke="#241f1c" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="200" y="212" text-anchor="middle" font-family="Menlo, monospace" font-size="26" font-weight="bold" fill="#b3402a">5ꜩ</text>
  <text x="200" y="236" text-anchor="middle" font-family="Menlo, monospace" font-size="13" fill="#6b6259">the pot</text>

  <g class="orbit">
    <g>
      <circle cx="200" cy="110" r="26" fill="#ffffff" stroke="#241f1c" stroke-width="2.5"/>
      <text x="200" y="118" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#b3402a">ꜩ</text>
    </g>
    <g>
      <circle cx="303" cy="185" r="26" fill="#0f61ff" stroke="#241f1c" stroke-width="2.5"/>
      <text x="303" y="193" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#ffffff">ꜩ</text>
    </g>
    <g>
      <circle cx="263" cy="305" r="26" fill="#ffffff" stroke="#241f1c" stroke-width="2.5"/>
      <text x="263" y="313" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#b3402a">ꜩ</text>
    </g>
    <g>
      <circle cx="137" cy="305" r="26" fill="#ffffff" stroke="#241f1c" stroke-width="2.5"/>
      <text x="137" y="313" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#b3402a">ꜩ</text>
    </g>
    <g>
      <circle cx="97" cy="185" r="26" fill="#b3402a" stroke="#241f1c" stroke-width="2.5"/>
      <text x="97" y="193" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#ffffff">ꜩ</text>
    </g>
  </g>

  <!-- ====== right: the fountain ====== -->
  <ellipse cx="580" cy="330" rx="150" ry="42" fill="#e6ecfb" stroke="#241f1c" stroke-width="2.5"/>
  <rect x="572" y="218" width="16" height="80" fill="#ffffff" stroke="#241f1c" stroke-width="2.5"/>
  <ellipse cx="580" cy="218" rx="80" ry="24" fill="#e6ecfb" stroke="#241f1c" stroke-width="2.5"/>
  <rect x="574" y="140" width="12" height="58" fill="#ffffff" stroke="#241f1c" stroke-width="2.5"/>
  <ellipse cx="580" cy="140" rx="42" ry="14" fill="#e6ecfb" stroke="#241f1c" stroke-width="2.5"/>
  <line class="drip" x1="580" y1="106" x2="580" y2="128" stroke="#0f61ff" stroke-width="4" stroke-linecap="round"/>
  <line class="drip2" x1="530" y1="230" x2="524" y2="252" stroke="#0f61ff" stroke-width="3" stroke-linecap="round"/>
  <line class="drip" x1="632" y1="232" x2="640" y2="254" stroke="#0f61ff" stroke-width="3" stroke-linecap="round"/>

  <g class="bob1">
    <circle cx="516" cy="322" r="20" fill="#ffffff" stroke="#241f1c" stroke-width="2.5"/>
    <text x="516" y="329" text-anchor="middle" font-family="Menlo, monospace" font-size="16" font-weight="bold" fill="#b3402a">ꜩ</text>
  </g>
  <g class="bob2">
    <circle cx="600" cy="336" r="20" fill="#ffffff" stroke="#241f1c" stroke-width="2.5"/>
    <text x="600" y="343" text-anchor="middle" font-family="Menlo, monospace" font-size="16" font-weight="bold" fill="#b3402a">ꜩ</text>
  </g>
  <g class="bob1">
    <circle cx="656" cy="318" r="20" fill="#0f61ff" stroke="#241f1c" stroke-width="2.5"/>
    <text x="656" y="325" text-anchor="middle" font-family="Menlo, monospace" font-size="16" font-weight="bold" fill="#ffffff">ꜩ</text>
  </g>

  <!-- caption rule -->
  <text x="400" y="55" text-anchor="middle" font-family="Menlo, monospace" font-size="15" letter-spacing="4" fill="#6b6259">THE MONEY GAMES · NET ZERO · NO HOUSE, NO ODDS</text>
</svg>
