  <text x="70" y="176" font-family="Inter, system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="-3" fill="#111">A frame your friends program.</text>
  <text x="70" y="222" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#3d3a34">Seven frames, one friend a day. A picture, a poem, a note.</text>
