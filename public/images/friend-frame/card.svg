    @keyframes ff-glow { 0%, 10%, 100% { opacity: 0 } 3%, 7% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .lit { animation: none; opacity: 0 } .lit.f4 { opacity: 1 } }
  </style>
