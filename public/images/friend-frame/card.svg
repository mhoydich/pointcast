<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Seven small frames in a row, one lit for today">
  <style>
    .lit { animation: ff-glow 7s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
