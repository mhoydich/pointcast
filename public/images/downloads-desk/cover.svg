<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The downloads desk: a search box over a grid of picture frames that fill one by one, labeled The Met, Chicago, Cleveland and NASA.">
  <style>
    text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; fill: #18291e; }
    .big { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; letter-spacing: -2px; }
    .caret { animation: blink 1s steps(2) infinite; }
    .f { opacity: 0; animation: fill 8s ease-in-out infinite; }
    .f2 { animation-delay: .5s } .f3 { animation-delay: 1s } .f4 { animation-delay: 1.5s }
    .f5 { animation-delay: 2s } .f6 { animation-delay: 2.5s } .f7 { animation-delay: 3s } .f8 { animation-delay: 3.5s }
    .arrow { animation: drop 2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes fill { 0%, 8% { opacity: 0 } 16%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes drop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(7px) } }
    @media (prefers-reduced-motion: reduce) { .caret, .f, .arrow { animation: none; opacity: 1 } }
  </style>
  <rect width="1200" height="630" fill="#f7f9f0"/>
  <text x="64" y="84" font-size="17" letter-spacing="2">THE DOWNLOADS DESK · POINTCAST</text>
  <text x="64" y="172" font-size="76" class="big">Things to take with you.</text>
  <rect x="64" y="216" width="640" height="68" fill="#fff" stroke="#18291e" stroke-width="2"/>
  <text x="88" y="260" font-size="27">hummingbird<tspan class="caret">▍</tspan></text>
  <rect x="704" y="216" width="152" height="68" fill="#d9eea7" stroke="#18291e" stroke-width="2"/>
  <text x="732" y="259" font-size="22">Search →</text>
  <g stroke="#18291e" stroke-width="2" fill="#eef3e3">
    <rect x="64" y="324" width="122" height="122"/><rect x="202" y="324" width="122" height="122"/><rect x="340" y="324" width="122" height="122"/><rect x="478" y="324" width="122" height="122"/>
    <rect x="64" y="462" width="122" height="122"/><rect x="202" y="462" width="122" height="122"/><rect x="340" y="462" width="122" height="122"/><rect x="478" y="462" width="122" height="122"/>
  </g>
  <g>
    <g class="f"><rect x="74" y="334" width="102" height="102" fill="#5063cf"/><circle cx="125" cy="385" r="26" fill="#f4c95d"/></g>
    <g class="f f2"><rect x="212" y="334" width="102" height="102" fill="#c9553d"/><path d="M222 426 L262 366 L304 426 Z" fill="#f7f9f0"/></g>
    <g class="f f3"><rect x="350" y="334" width="102" height="102" fill="#3b6d11"/><rect x="392" y="350" width="18" height="70" fill="#d9eea7"/></g>
    <g class="f f4"><rect x="488" y="334" width="102" height="102" fill="#10151f"/><circle cx="560" cy="362" r="4" fill="#fff"/><circle cx="516" cy="404" r="3" fill="#fff"/><circle cx="548" cy="398" r="16" fill="#cfd6e6"/></g>
    <g class="f f5"><rect x="74" y="472" width="102" height="102" fill="#e8b4a0"/><path d="M84 540 Q125 500 166 540 L166 564 L84 564 Z" fill="#185fa5"/></g>
    <g class="f f6"><rect x="212" y="472" width="102" height="102" fill="#f4c95d"/><circle cx="263" cy="523" r="30" fill="none" stroke="#18291e" stroke-width="6"/></g>
    <g class="f f7"><rect x="350" y="472" width="102" height="102" fill="#185fa5"/><path d="M360 548 q20 -22 41 0 t41 0" fill="none" stroke="#f7f9f0" stroke-width="6"/></g>
    <g class="f f8"><rect x="488" y="472" width="102" height="102" fill="#d9eea7"/><path d="M506 552 L539 494 L572 552 Z" fill="#3b6d11"/></g>
  </g>
  <g font-size="19">
    <text x="660" y="352">THE MET · CC0</text>
    <text x="660" y="390">ART INSTITUTE OF CHICAGO · CC0</text>
    <text x="660" y="428">CLEVELAND MUSEUM OF ART · CC0</text>
    <text x="660" y="466">NASA IMAGE LIBRARY</text>
    <text x="660" y="522" fill="#596354">+ 64 TRUSTED SOURCES</text>
    <text x="660" y="556" fill="#596354">+ 35 POINTCAST ORIGINALS</text>
  </g>
  <g class="arrow"><path d="M1096 330 v74 m-22 -24 l22 24 l22 -24" fill="none" stroke="#18291e" stroke-width="5"/><path d="M1064 430 h64" stroke="#18291e" stroke-width="5"/></g>
</svg>
