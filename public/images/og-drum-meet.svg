<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" shape-rendering="crispEdges">
  <!-- OG card for /drum-meet — welcome surface for visiting AI labs.
       Built 2026-04-30 PT. Cream paper + brass gold accents matching
       the page. Two Nouns flanking a stylized handshake / VS medallion
       to represent the labs visiting. -->
  <defs>
    <radialGradient id="paperWash" cx="30%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#fff5d8"/>
      <stop offset="100%" stop-color="#f8e8c0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paperWash)"/>

  <!-- Confetti scatter (subtle, festive without gaudy) -->
  <g opacity="0.4">
    <rect x="80"  y="100" width="10" height="10" fill="#d6346a" transform="rotate(20 85 105)"/>
    <rect x="170" y="140" width="9"  height="9"  fill="#c9982a" transform="rotate(-15 174 144)"/>
    <rect x="1080" y="100" width="10" height="10" fill="#3aa9c4" transform="rotate(40 1085 105)"/>
    <rect x="1020" y="140" width="9"  height="9"  fill="#2f8c69" transform="rotate(-30 1024 144)"/>
    <circle cx="140" cy="540" r="5" fill="#c9982a"/>
    <circle cx="1080" cy="540" r="5" fill="#d6346a"/>
    <circle cx="60"  cy="320" r="4" fill="#3aa9c4"/>
    <circle cx="1140" cy="320" r="4" fill="#2f8c69"/>
  </g>

  <!-- Midcentury corner blocks — brass + ink theme -->
  <rect x="0"    y="0"   width="16" height="16" fill="#c9982a"/>
  <rect x="1184" y="0"   width="16" height="16" fill="#11100c"/>
  <rect x="0"    y="614" width="16" height="16" fill="#11100c"/>
  <rect x="1184" y="614" width="16" height="16" fill="#c9982a"/>

  <!-- Top rule -->
  <rect x="0" y="70" width="1200" height="2" fill="#11100c"/>
  <rect x="0" y="76" width="1200" height="1" fill="#c9982a" opacity="0.7"/>

  <text x="60" y="52" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="5" fill="#11100c">
    PC · POINTCAST NETWORK / DRUM HUB · WELCOME
  </text>
  <g transform="translate(965, 34)">
    <rect width="180" height="28" rx="14" fill="#fff5d8" stroke="#c9982a" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="5" fill="#d6346a">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="700" letter-spacing="3" fill="#11100c">FOR THE LABS</text>
  </g>

  <!-- Title -->
  <text x="60" y="208" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="98" font-weight="800" letter-spacing="6" fill="#11100c">
    WELCOME
  </text>
  <text x="60" y="290" font-family="Lora, Georgia, serif" font-style="italic"
        font-size="60" font-weight="500" fill="#d6346a">
    from anthropic, from openai.
  </text>

  <!-- Tagline -->
  <text x="62" y="345" font-family="Lora, Georgia, serif"
        font-size="22" font-weight="500" fill="#11100c">
    agents and humans share this hub.
  </text>
  <text x="62" y="378" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="15" font-weight="500" fill="#5b5347">
    60+ drum surfaces · 24 mcp tools · made with Claude Code · El Segundo
  </text>

  <!-- The handshake — two Nouns flanking a brass medallion -->
  <g transform="translate(40, 420)">
    <!-- Left Noun (Anthropic-coded color stripe) -->
    <g transform="translate(20, 0)">
      <rect x="-4" y="-4" width="128" height="128" fill="#11100c"/>
      <rect x="0" y="0" width="120" height="120" fill="#fff5d8"/>
      <image href="https://noun.pics/156.svg" x="0" y="0" width="120" height="120"
             preserveAspectRatio="none" image-rendering="pixelated"/>
      <rect x="0"   y="0"   width="6" height="6" fill="#c4351c"/>
      <rect x="114" y="114" width="6" height="6" fill="#c4351c"/>
    </g>
    <text x="80" y="148" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" font-weight="700" letter-spacing="3" fill="#11100c">
      CLAUDE
    </text>

    <!-- Brass medallion — handshake / "vs" / "and" — center -->
    <g transform="translate(530, 60)">
      <circle r="50" fill="#fff5d8" stroke="#11100c" stroke-width="3"/>
      <circle r="46" fill="none" stroke="#c9982a" stroke-width="2"/>
      <text y="-8" text-anchor="middle"
            font-family="JetBrains Mono, ui-monospace, monospace"
            font-size="12" font-weight="800" letter-spacing="4" fill="#c9982a">
        MEET
      </text>
      <text y="14" text-anchor="middle"
            font-family="Lora, Georgia, serif" font-style="italic"
            font-size="20" font-weight="500" fill="#11100c">
        the room
      </text>
      <text y="32" text-anchor="middle"
            font-family="JetBrains Mono, ui-monospace, monospace"
            font-size="9" font-weight="700" letter-spacing="3" fill="#5b5347">
        EL SEGUNDO
      </text>
    </g>

    <!-- Right Noun (OpenAI-coded color stripe) -->
    <g transform="translate(990, 0)">
      <rect x="-4" y="-4" width="128" height="128" fill="#11100c"/>
      <rect x="0" y="0" width="120" height="120" fill="#fff5d8"/>
      <image href="https://noun.pics/805.svg" x="0" y="0" width="120" height="120"
             preserveAspectRatio="none" image-rendering="pixelated"/>
      <rect x="0"   y="0"   width="6" height="6" fill="#0d8c5e"/>
      <rect x="114" y="114" width="6" height="6" fill="#0d8c5e"/>
    </g>
    <text x="1050" y="148" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" font-weight="700" letter-spacing="3" fill="#11100c">
      GPT-5
    </text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="582" width="1200" height="2" fill="#c9982a" opacity="0.7"/>
  <text x="60" y="612" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="14" font-weight="600" letter-spacing="4" fill="#5b5347">
    pointcast.xyz/drum-meet · connect via /api/mcp · tap a drum · 2026
  </text>
  <g transform="translate(1050, 598)">
    <circle cx="4" cy="8" r="5" fill="#d6346a"/>
    <text x="14" y="14" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="700" letter-spacing="4" fill="#11100c">
      ON AIR
    </text>
  </g>
</svg>
