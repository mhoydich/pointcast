<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Courier New', monospace">
  <title>PointCast Retro Arcade — six new Win95 Nouns games</title>
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12123a"/><stop offset="1" stop-color="#05051a"/>
    </linearGradient>
    <clipPath id="scr" clipPathUnits="userSpaceOnUse"><rect x="6" y="6" width="344" height="134"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000" opacity="0"/>
      <rect width="4" height="1.5" fill="#000" opacity="0.18"/>
    </pattern>
    <style>
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0.15} }
      .drop { animation: drop 2.4s cubic-bezier(.4,0,.9,.3) infinite; }
      @keyframes drop { 0%{transform:translateY(-40px)} 70%,100%{transform:translateY(88px)} }
      .rowflash { animation: rowflash 2.4s steps(1) infinite; }
      @keyframes rowflash { 0%,68%{opacity:.9} 72%{opacity:.15} 76%{opacity:.9} 80%{opacity:.15} 84%,100%{opacity:.9} }
      .t2a { animation: t2a 2.6s ease-in-out infinite; }
      @keyframes t2a { 0%,20%{transform:translateX(0)} 45%,100%{transform:translateX(46px)} }
      .t4 { animation: t4 2.6s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes t4 { 0%,45%{opacity:0; transform:scale(.3)} 55%{opacity:1; transform:scale(1.18)} 70%,100%{opacity:1; transform:scale(1)} }
      .t2b { animation: t2b 2.6s ease-in-out infinite; }
      @keyframes t2b { 0%,44%{opacity:1} 46%,100%{opacity:0} }
      .snake { animation: snakeMove 3s linear infinite; }
      @keyframes snakeMove { 0%{transform:translateX(0)} 100%{transform:translateX(150px)} }
      .bean { animation: bean 3s steps(1) infinite; }
      @keyframes bean { 0%,62%{opacity:1} 64%,100%{opacity:0} }
      .grow { animation: grow 3s steps(1) infinite; }
      @keyframes grow { 0%,63%{opacity:0} 66%,100%{opacity:1} }
      .stile { animation: stile 2.8s cubic-bezier(.5,0,.3,1) infinite; }
      @keyframes stile { 0%,30%{transform:translate(0,0)} 60%,100%{transform:translate(56px,0)} }
      .flip1 { animation: flip 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .flip2 { animation: flip 2.8s ease-in-out .18s infinite; transform-box:fill-box; transform-origin:center; }
      .flip3 { animation: flip 2.8s ease-in-out .36s infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes flip { 0%,30%{transform:scaleX(1); fill:#4A9EFF} 45%{transform:scaleX(0)} 46%{fill:#E84D6A} 60%,100%{transform:scaleX(1); fill:#E84D6A} }
      .newdisc { animation: newdisc 2.8s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes newdisc { 0%,10%{opacity:0; transform:scale(.2)} 25%,100%{opacity:1; transform:scale(1)} }
      .ball { animation: ball 1.9s cubic-bezier(.5,0,.5,1) infinite alternate; }
      @keyframes ball { 0%{transform:translate(0,0)} 100%{transform:translate(120px,-96px)} }
      .paddle { animation: paddle 1.9s cubic-bezier(.5,0,.5,1) infinite alternate; }
      @keyframes paddle { 0%{transform:translateX(0)} 100%{transform:translateX(96px)} }
      .brickpop { animation: brickpop 3.8s steps(1) infinite; }
      @keyframes brickpop { 0%,20%{opacity:1} 24%,100%{opacity:0} }
      .flick { animation: flick 5s steps(1) infinite; }
      @keyframes flick { 0%,97%{opacity:1} 98%{opacity:.82} 99%{opacity:1} }
    </style>
  </defs>

  <!-- desktop -->
  <rect width="1200" height="630" fill="#008080"/>

  <!-- window shell (Win95 bevel) -->
  <g class="flick">
  <rect x="16" y="14" width="1168" height="602" fill="#000" opacity="0.25"/>
  <rect x="14" y="12" width="1168" height="602" fill="#c0c0c0"/>
  <rect x="14" y="12" width="1168" height="3" fill="#ffffff"/>
  <rect x="14" y="12" width="3" height="602" fill="#ffffff"/>
  <rect x="14" y="611" width="1168" height="3" fill="#404040"/>
  <rect x="1179" y="12" width="3" height="602" fill="#404040"/>

  <!-- titlebar -->
  <rect x="22" y="20" width="1152" height="34" fill="url(#tb)"/>
  <text x="34" y="43" fill="#ffffff" font-size="19" font-weight="bold">PointCast Retro Arcade</text>
  <g>
    <rect x="1092" y="24" width="24" height="24" fill="#c0c0c0"/><rect x="1092" y="24" width="24" height="2" fill="#fff"/><text x="1098" y="45" font-size="18" fill="#000">_</text>
    <rect x="1120" y="24" width="24" height="24" fill="#c0c0c0"/><rect x="1120" y="24" width="24" height="2" fill="#fff"/><rect x="1125" y="29" width="14" height="12" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="1148" y="24" width="24" height="24" fill="#c0c0c0"/><rect x="1148" y="24" width="24" height="2" fill="#fff"/><text x="1153" y="44" font-size="18" fill="#000" font-weight="bold">x</text>
  </g>

  <!-- marquee strip -->
  <rect x="22" y="62" width="1152" height="46" fill="url(#mar)"/>
  <text x="600" y="93" text-anchor="middle" font-size="24" font-weight="bold" letter-spacing="3" fill="#F7C325">
    <tspan class="blink">&#9733;</tspan> SIX NEW GAMES IN THE ARCADE <tspan class="blink">&#9733;</tspan>
  </text>
  <!-- little noggle mark -->
  <g transform="translate(38,72)">
    <rect x="0" y="0" width="15" height="12" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="4" y="3" width="7" height="6" fill="#E84D6A"/>
    <rect x="15" y="4.5" width="6" height="3" fill="#fff"/>
    <rect x="21" y="0" width="15" height="12" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="25" y="3" width="7" height="6" fill="#E84D6A"/>
  </g>

  <!-- ============ SCREEN 1: NOGGLE DROP ============ -->
  <g transform="translate(32,124)">
    <rect x="0" y="0" width="356" height="170" fill="#808080"/>
    <rect x="6" y="6" width="344" height="134" fill="#0a0a12"/>
    <g clip-path="url(#scr)">
      <!-- settled rows -->
      <g class="rowflash">
        <rect x="130" y="122" width="16" height="16" fill="#F7C325"/><rect x="148" y="122" width="16" height="16" fill="#E84D6A"/>
        <rect x="166" y="122" width="16" height="16" fill="#2CC5A0"/><rect x="184" y="122" width="16" height="16" fill="#4A9EFF"/>
        <rect x="202" y="122" width="16" height="16" fill="#F7C325"/><rect x="220" y="122" width="16" height="16" fill="#D22209"/>
      </g>
      <rect x="130" y="106" width="16" height="16" fill="#4A9EFF"/><rect x="220" y="106" width="16" height="16" fill="#2CC5A0"/>
      <!-- falling S-piece -->
      <g class="drop">
        <rect x="166" y="20" width="16" height="16" fill="#E84D6A"/><rect x="184" y="20" width="16" height="16" fill="#E84D6A"/>
        <rect x="148" y="36" width="16" height="16" fill="#E84D6A"/><rect x="166" y="36" width="16" height="16" fill="#E84D6A"/>
      </g>
    </g>
    <rect x="6" y="6" width="344" height="134" fill="url(#scan)"/>
    <rect x="0" y="144" width="356" height="26" fill="#c0c0c0"/><rect x="0" y="144" width="356" height="2" fill="#fff"/>
    <text x="12" y="162" font-size="14" font-weight="bold" fill="#000080">NOGGLE DROP</text>
    <text x="344" y="162" text-anchor="end" font-size="12" fill="#404040">tetris</text>
  </g>

  <!-- ============ SCREEN 2: NOUNS 2048 ============ -->
  <g transform="translate(410,124)">
    <rect x="0" y="0" width="356" height="170" fill="#808080"/>
    <rect x="6" y="6" width="344" height="134" fill="#0a0a12"/>
    <!-- board hint -->
    <rect x="120" y="34" width="116" height="78" fill="#1c1c28"/>
    <g transform="translate(0,0)">
      <!-- tile 2 (static, left) -->
      <g><rect x="128" y="52" width="42" height="42" rx="3" fill="#d5d7e3"/><text x="149" y="80" text-anchor="middle" font-size="22" font-weight="bold" fill="#12110E">2</text></g>
      <!-- tile 2 (slides in) -->
      <g class="t2b"><g class="t2a"><rect x="188" y="52" width="42" height="42" rx="3" fill="#d5d7e3"/><text x="209" y="80" text-anchor="middle" font-size="22" font-weight="bold" fill="#12110E">2</text></g></g>
      <!-- merged 4 (pops) -->
      <g class="t4"><rect x="188" y="52" width="42" height="42" rx="3" fill="#F7C325"/><text x="209" y="80" text-anchor="middle" font-size="22" font-weight="bold" fill="#12110E">4</text></g>
    </g>
    <rect x="6" y="6" width="344" height="134" fill="url(#scan)"/>
    <rect x="0" y="144" width="356" height="26" fill="#c0c0c0"/><rect x="0" y="144" width="356" height="2" fill="#fff"/>
    <text x="12" y="162" font-size="14" font-weight="bold" fill="#000080">NOUNS 2048</text>
    <text x="344" y="162" text-anchor="end" font-size="12" fill="#404040">merge</text>
  </g>

  <!-- ============ SCREEN 3: NOUNS SNAKE ============ -->
  <g transform="translate(788,124)">
    <rect x="0" y="0" width="356" height="170" fill="#808080"/>
    <rect x="6" y="6" width="344" height="134" fill="#0a0a12"/>
    <g clip-path="url(#scr)">
      <!-- coffee bean -->
      <g class="bean" transform="translate(250,66)">
        <ellipse cx="0" cy="0" rx="11" ry="8" fill="#6b4423"/><path d="M -8 -5 Q 0 6 8 -5" stroke="#3a2412" stroke-width="2" fill="none"/>
      </g>
      <!-- snake -->
      <g class="snake" transform="translate(40,58)">
        <rect x="0" y="0" width="20" height="20" rx="3" fill="#2CC5A0"/>
        <rect x="-22" y="0" width="20" height="20" rx="3" fill="#25a888"/>
        <rect x="-44" y="0" width="20" height="20" rx="3" fill="#25a888"/>
        <!-- head noggle eyes -->
        <rect x="4" y="6" width="5" height="8" fill="#fff"/><rect x="5.5" y="8" width="2.5" height="4" fill="#12110E"/>
        <rect x="11" y="6" width="5" height="8" fill="#fff"/><rect x="12.5" y="8" width="2.5" height="4" fill="#12110E"/>
        <rect class="grow" x="-66" y="0" width="20" height="20" rx="3" fill="#25a888"/>
      </g>
    </g>
    <rect x="6" y="6" width="344" height="134" fill="url(#scan)"/>
    <rect x="0" y="144" width="356" height="26" fill="#c0c0c0"/><rect x="0" y="144" width="356" height="2" fill="#fff"/>
    <text x="12" y="162" font-size="14" font-weight="bold" fill="#000080">NOUNS SNAKE</text>
    <text x="344" y="162" text-anchor="end" font-size="12" fill="#404040">grow</text>
  </g>

  <!-- ============ SCREEN 4: NOUNS SLIDE ============ -->
  <g transform="translate(32,330)">
    <rect x="0" y="0" width="356" height="170" fill="#808080"/>
    <rect x="6" y="6" width="344" height="134" fill="#0a0a12"/>
    <g transform="translate(122,16)">
      <!-- 3x3 puzzle of noggle-colored tiles, one blank top-right, a tile slides right -->
      <rect x="0" y="0" width="36" height="36" fill="#d5d7e3"/><rect x="4" y="4" width="28" height="10" fill="#E84D6A"/>
      <g class="stile"><rect x="0" y="38" width="36" height="36" fill="#d5d7e3"/><rect x="8" y="46" width="20" height="20" fill="#12110E"/></g>
      <rect x="0" y="76" width="36" height="36" fill="#d5d7e3"/><rect x="4" y="90" width="28" height="8" fill="#2CC5A0"/>
      <rect x="76" y="0" width="36" height="36" fill="#d5d7e3"/><rect x="80" y="4" width="12" height="28" fill="#4A9EFF"/>
      <rect x="76" y="38" width="36" height="36" fill="#d5d7e3"/><rect x="84" y="46" width="20" height="20" fill="#fff"/>
      <rect x="76" y="76" width="36" height="36" fill="#d5d7e3"/><rect x="80" y="80" width="28" height="12" fill="#F7C325"/>
      <!-- blank slot (middle col, top) revealed as tile slides away -->
    </g>
    <rect x="6" y="6" width="344" height="134" fill="url(#scan)"/>
    <rect x="0" y="144" width="356" height="26" fill="#c0c0c0"/><rect x="0" y="144" width="356" height="2" fill="#fff"/>
    <text x="12" y="162" font-size="14" font-weight="bold" fill="#000080">NOUNS SLIDE</text>
    <text x="344" y="162" text-anchor="end" font-size="12" fill="#404040">daily</text>
  </g>

  <!-- ============ SCREEN 5: NOUNS REVERSI ============ -->
  <g transform="translate(410,330)">
    <rect x="0" y="0" width="356" height="170" fill="#808080"/>
    <rect x="6" y="6" width="344" height="134" fill="#0e5c3f"/>
    <!-- grid lines -->
    <g stroke="#0a4530" stroke-width="1">
      <line x1="6" y1="40" x2="350" y2="40"/><line x1="6" y1="74" x2="350" y2="74"/><line x1="6" y1="108" x2="350" y2="108"/>
      <line x1="74" y1="6" x2="74" y2="140"/><line x1="142" y1="6" x2="142" y2="140"/><line x1="210" y1="6" x2="210" y2="140"/><line x1="278" y1="6" x2="278" y2="140"/>
    </g>
    <!-- a row of discs that flip blue->red, plus a new red disc dropping at left -->
    <circle class="newdisc" cx="40" cy="74" r="14" fill="#E84D6A"/>
    <circle class="flip1" cx="108" cy="74" r="14" fill="#4A9EFF"/>
    <circle class="flip2" cx="176" cy="74" r="14" fill="#4A9EFF"/>
    <circle class="flip3" cx="244" cy="74" r="14" fill="#4A9EFF"/>
    <circle cx="312" cy="74" r="14" fill="#4A9EFF"/>
    <rect x="6" y="6" width="344" height="134" fill="url(#scan)"/>
    <rect x="0" y="144" width="356" height="26" fill="#c0c0c0"/><rect x="0" y="144" width="356" height="2" fill="#fff"/>
    <text x="12" y="162" font-size="14" font-weight="bold" fill="#000080">NOUNS REVERSI</text>
    <text x="344" y="162" text-anchor="end" font-size="12" fill="#404040">othello</text>
  </g>

  <!-- ============ SCREEN 6: NOUNS BREAKOUT ============ -->
  <g transform="translate(788,330)">
    <rect x="0" y="0" width="356" height="170" fill="#808080"/>
    <rect x="6" y="6" width="344" height="134" fill="#0a0a12"/>
    <g clip-path="url(#scr)">
      <!-- bricks -->
      <g>
        <rect x="18" y="18" width="46" height="12" fill="#D22209"/><rect x="70" y="18" width="46" height="12" fill="#D22209"/><rect x="122" y="18" width="46" height="12" fill="#D22209"/>
        <rect class="brickpop" x="174" y="18" width="46" height="12" fill="#D22209"/>
        <rect x="226" y="18" width="46" height="12" fill="#D22209"/><rect x="278" y="18" width="46" height="12" fill="#D22209"/>
        <rect x="18" y="34" width="46" height="12" fill="#F7C325"/><rect x="70" y="34" width="46" height="12" fill="#F7C325"/><rect x="122" y="34" width="46" height="12" fill="#F7C325"/><rect x="174" y="34" width="46" height="12" fill="#F7C325"/><rect x="226" y="34" width="46" height="12" fill="#F7C325"/><rect x="278" y="34" width="46" height="12" fill="#F7C325"/>
        <rect x="18" y="50" width="46" height="12" fill="#2CC5A0"/><rect x="70" y="50" width="46" height="12" fill="#2CC5A0"/><rect x="122" y="50" width="46" height="12" fill="#2CC5A0"/><rect x="174" y="50" width="46" height="12" fill="#2CC5A0"/><rect x="226" y="50" width="46" height="12" fill="#2CC5A0"/><rect x="278" y="50" width="46" height="12" fill="#2CC5A0"/>
      </g>
      <!-- ball -->
      <rect class="ball" x="120" y="118" width="12" height="12" rx="2" fill="#fff"/>
      <!-- paddle -->
      <rect class="paddle" x="120" y="126" width="60" height="10" rx="2" fill="#4A9EFF"/>
    </g>
    <rect x="6" y="6" width="344" height="134" fill="url(#scan)"/>
    <rect x="0" y="144" width="356" height="26" fill="#c0c0c0"/><rect x="0" y="144" width="356" height="2" fill="#fff"/>
    <text x="12" y="162" font-size="14" font-weight="bold" fill="#000080">NOUNS BREAKOUT</text>
    <text x="344" y="162" text-anchor="end" font-size="12" fill="#404040">bricks</text>
  </g>

  <!-- footer / status bar -->
  <rect x="22" y="516" width="1152" height="90" fill="#c0c0c0"/>
  <rect x="22" y="516" width="1152" height="2" fill="#fff"/>
  <rect x="30" y="526" width="700" height="70" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <rect x="30" y="526" width="700" height="2" fill="#404040"/>
  <text x="46" y="556" font-size="20" font-weight="bold" fill="#12110E">Play free · local high scores · no account</text>
  <text x="46" y="584" font-size="17" fill="#000080">pointcast.xyz/win95-games</text>
  <!-- START button -->
  <g>
    <rect x="770" y="530" width="384" height="62" fill="#c0c0c0"/>
    <rect x="770" y="530" width="384" height="3" fill="#fff"/><rect x="770" y="530" width="3" height="62" fill="#fff"/>
    <rect x="770" y="589" width="384" height="3" fill="#404040"/><rect x="1151" y="530" width="3" height="62" fill="#404040"/>
    <text x="962" y="570" text-anchor="middle" font-size="26" font-weight="bold" fill="#12110E">&#9654; INSERT NOUN TO PLAY</text>
  </g>
  </g>
</svg>
