<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d">
  <title id="t">A candle for someone</title>
  <desc id="d">Three votive candles of different heights on a dark wall, each flame flickering, with small tally marks under each counting one day, seven days and thirty days.</desc>
  <style>
    .f1 { animation: flick 1.7s ease-in-out infinite; transform-origin: 220px 430px; }
    .f2 { animation: flick 2.3s ease-in-out infinite; transform-origin: 400px 360px; }
    .f3 { animation: flick 1.9s ease-in-out infinite; transform-origin: 580px 300px; }
    .glow { animation: breathe 3.2s ease-in-out infinite; }
    .chip { animation: blink 4s steps(1) infinite; }
    @keyframes flick { 0%,100% { transform: scale(1,1) rotate(0deg); } 30% { transform: scale(.92,1.08) rotate(-3deg); } 60% { transform: scale(1.05,.95) rotate(2deg); } }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: .85; } }
    @keyframes blink { 0%,70% { opacity: 1; } 71%,100% { opacity: .35; } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wax" x1="0" x2="1">
      <stop offset="0" stop-color="#e9dcc4"/>
      <stop offset=".5" stop-color="#fbf3e2"/>
      <stop offset="1" stop-color="#d7c6a7"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="800" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="800" height="800" fill="#141225"/>
    <g fill="#1d1a33">
      <rect x="0" y="0" width="800" height="40"/>
      <rect x="0" y="80" width="800" height="2"/>
      <rect x="0" y="160" width="800" height="2"/>
      <rect x="0" y="240" width="800" height="2"/>
    </g>
    <rect x="0" y="600" width="800" height="200" fill="#0d0b19"/>
    <rect x="0" y="598" width="800" height="6" fill="#3b2f5c"/>

    <circle class="glow" cx="220" cy="410" r="120" fill="url(#g)"/>
    <circle class="glow" cx="400" cy="340" r="150" fill="url(#g)"/>
    <circle class="glow" cx="580" cy="280" r="180" fill="url(#g)"/>

    <rect x="180" y="450" width="80" height="150" rx="6" fill="url(#wax)"/>
    <rect x="352" y="380" width="96" height="220" rx="6" fill="url(#wax)"/>
    <rect x="526" y="320" width="108" height="280" rx="6" fill="url(#wax)"/>
    <path d="M180 470 q20 14 40 0 t40 0" fill="none" stroke="#cdb995" stroke-width="3"/>
    <path d="M352 400 q24 16 48 0 t48 0" fill="none" stroke="#cdb995" stroke-width="3"/>
    <path d="M526 340 q27 18 54 0 t54 0" fill="none" stroke="#cdb995" stroke-width="3"/>

    <rect x="218" y="434" width="4" height="18" fill="#2a2216"/>
    <rect x="398" y="362" width="4" height="20" fill="#2a2216"/>
    <rect x="578" y="300" width="4" height="22" fill="#2a2216"/>

    <path class="f1" d="M220 380 C238 404 236 426 220 434 C204 426 202 404 220 380 Z" fill="#ffb43a"/>
    <path class="f1" d="M220 404 C228 416 227 428 220 432 C213 428 212 416 220 404 Z" fill="#fff1b8"/>
    <path class="f2" d="M400 302 C422 330 420 356 400 364 C380 356 378 330 400 302 Z" fill="#ffb43a"/>
    <path class="f2" d="M400 330 C410 344 409 358 400 362 C391 358 390 344 400 330 Z" fill="#fff1b8"/>
    <path class="f3" d="M580 234 C606 266 604 294 580 302 C556 294 554 266 580 234 Z" fill="#ffb43a"/>
    <path class="f3" d="M580 266 C592 282 591 296 580 300 C569 296 568 282 580 266 Z" fill="#fff1b8"/>

    <g fill="#ffcf5a">
      <rect class="chip" x="214" y="640" width="12" height="28"/>
    </g>
    <g fill="#ffcf5a">
      <rect x="354" y="640" width="8" height="28"/><rect x="366" y="640" width="8" height="28"/><rect x="378" y="640" width="8" height="28"/><rect x="390" y="640" width="8" height="28"/>
      <rect x="402" y="640" width="8" height="28"/><rect x="414" y="640" width="8" height="28"/><rect class="chip" x="426" y="640" width="8" height="28"/>
    </g>
    <g fill="#ffcf5a">
      <rect x="520" y="636" width="120" height="6"/><rect x="520" y="648" width="120" height="6"/><rect x="520" y="660" width="120" height="6"/><rect x="520" y="672" width="120" height="6"/><rect class="chip" x="520" y="684" width="60" height="6"/>
    </g>
    <g fill="#8f84c7" font-family="ui-monospace, Menlo, monospace" font-size="22" text-anchor="middle">
      <text x="220" y="726">1 DAY $1</text>
      <text x="400" y="726">7 DAYS $3</text>
      <text x="580" y="726">30 DAYS $9</text>
    </g>
    <text x="400" y="110" fill="#efe6ff" font-family="Georgia, serif" font-size="44" text-anchor="middle">a candle for someone</text>
    <text x="400" y="150" fill="#8f84c7" font-family="ui-monospace, Menlo, monospace" font-size="20" text-anchor="middle">a prayer is still one cent · always</text>
  </g>
</svg>
