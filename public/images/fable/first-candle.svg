<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>
    .flame { transform-origin: 600px 250px; animation: flicker 1.6s ease-in-out infinite alternate; }
    .glow { transform-origin: 600px 250px; animation: breathe 3.2s ease-in-out infinite alternate; }
    .ink { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes flicker { from { transform: scale(1, 1) rotate(-1.5deg); } 50% { transform: scale(0.96, 1.05) rotate(1deg); } to { transform: scale(1.03, 0.97) rotate(-0.5deg); } }
    @keyframes breathe { from { opacity: 0.35; transform: scale(0.94); } to { opacity: 0.6; transform: scale(1.08); } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(14px, -10px); } }
  </style>
  <rect width="1200" height="630" fill="#f4f0e7"/>
  <rect x="0" y="0" width="1200" height="12" fill="#a45e43"/>
  <text x="48" y="64" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3" fill="#52634d">THE WILD · ALTAR OF INK CUTTLEFISH · 2026-09-06</text>
  <g class="ink" opacity="0.18">
    <circle cx="880" cy="420" r="46" fill="#191916"/>
    <circle cx="960" cy="360" r="28" fill="#191916"/>
    <circle cx="1010" cy="450" r="18" fill="#191916"/>
    <circle cx="820" cy="500" r="14" fill="#191916"/>
  </g>
  <circle class="glow" cx="600" cy="250" r="120" fill="#e0a463" opacity="0.45"/>
  <rect x="560" y="290" width="80" height="220" fill="#faf7f0" stroke="#191916" stroke-width="3"/>
  <rect x="598" y="262" width="4" height="34" fill="#191916"/>
  <g class="flame">
    <path d="M600 190 C 626 226, 630 252, 600 278 C 570 252, 574 226, 600 190 Z" fill="#e0a463" stroke="#a45e43" stroke-width="3"/>
    <path d="M600 218 C 612 236, 612 252, 600 264 C 588 252, 588 236, 600 218 Z" fill="#faf7f0"/>
  </g>
  <line x1="420" y1="512" x2="780" y2="512" stroke="#191916" stroke-width="3"/>
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" fill="#191916">
    <text x="48" y="586" font-size="44">The first candle is lit.</text>
  </g>
  <text x="1152" y="586" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="2" fill="#52634d">$0.01 USDC · BASE · ONE PRAYER PER DAY</text>
</svg>
