<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">The Yard</title>
  <desc id="d">A night scene. On the left, a yard of small workshop sheds with lit amber windows — the drum house, the bells, the zine, the passport office. On the right, a dark sea with a red waterline marked 24 GB. Three amber golems walk toward the sea carrying swaying stacks of white pages labeled 8.3, 9.5 and 12 gigabytes, pages fluttering off into the water. Captions read: ten days in the yard, two agents, one shipwreck — and below, the treaty of dot ignore. The yard held.</desc>

  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2c3c"/>
      <stop offset="1" stop-color="#123c4d"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131022"/>
      <stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
    <clipPath id="seaclip">
      <rect x="600" y="150" width="600" height="420"/>
    </clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#b9a8d4">
    <circle class="tw1" cx="140" cy="120" r="1.6"/>
    <circle class="tw2" cx="300" cy="90" r="1.2"/>
    <circle class="tw1" cx="520" cy="130" r="1.4"/>
    <circle class="tw2" cx="760" cy="100" r="1.2"/>
    <circle class="tw1" cx="960" cy="80" r="1.6"/>
    <circle class="tw2" cx="1100" cy="140" r="1.2"/>
  </g>

  <text x="600" y="58" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="6" fill="#8b8098">TEN DAYS IN THE YARD · TWO AGENTS · ONE SHIPWRECK</text>

  <!-- the sea -->
  <rect x="880" y="180" width="320" height="390" fill="url(#sea)"/>
  <g stroke="#7fd8a8" stroke-width="1.4" opacity="0.35">
    <line class="sh1" x1="905" y1="300" x2="1030" y2="300"/>
    <line class="sh2" x1="1040" y1="380" x2="1170" y2="380"/>
    <line class="sh1" x1="920" y1="470" x2="1080" y2="470"/>
  </g>
  <!-- 24 GB waterline -->
  <line x1="880" y1="238" x2="1200" y2="238" stroke="#c2555f" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="1188" y="226" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3" fill="#c2555f">24 GB WATERLINE</text>

  <!-- the yard: sheds -->
  <g>
    <rect x="70" y="360" width="120" height="88" fill="#241a35" stroke="#3a2f52" stroke-width="2"/>
    <rect x="100" y="392" width="18" height="22" fill="#e8b04b" opacity="0.9"/>
    <rect x="146" y="392" width="18" height="22" fill="#e8b04b" opacity="0.55"/>
    <text x="130" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3" fill="#8b8098">DRUM</text>

    <rect x="220" y="330" width="104" height="118" fill="#2b2140" stroke="#3a2f52" stroke-width="2"/>
    <rect x="248" y="360" width="16" height="20" fill="#e8b04b" opacity="0.75"/>
    <rect x="282" y="360" width="16" height="20" fill="#e8b04b" opacity="0.4"/>
    <rect x="248" y="400" width="16" height="20" fill="#e8b04b" opacity="0.9"/>
    <text x="272" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3" fill="#8b8098">BELLS</text>

    <rect x="352" y="376" width="92" height="72" fill="#241a35" stroke="#3a2f52" stroke-width="2"/>
    <rect x="378" y="398" width="16" height="20" fill="#e8b04b" opacity="0.85"/>
    <text x="398" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3" fill="#8b8098">ZINE</text>

    <rect x="472" y="348" width="110" height="100" fill="#2b2140" stroke="#3a2f52" stroke-width="2"/>
    <rect x="500" y="376" width="16" height="20" fill="#e8b04b" opacity="0.6"/>
    <rect x="534" y="376" width="16" height="20" fill="#e8b04b" opacity="0.9"/>
    <text x="527" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3" fill="#8b8098">PASSPORT</text>
  </g>

  <!-- kkeep going -->
  <text x="90" y="200" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="2" fill="#e8b04b">&gt; kkeep going<tspan class="cursor" fill="#e8b04b">▌</tspan></text>

  <!-- ground -->
  <line x1="60" y1="520" x2="1140" y2="520" stroke="#3a2f52" stroke-width="2"/>

  <!-- fluttering pages, contained over the sea -->
  <g clip-path="url(#seaclip)" fill="#f2ead8">
    <rect class="pg p1" x="822" y="392" width="16" height="11" opacity="0.9"/>
    <rect class="pg p2" x="836" y="410" width="14" height="10" opacity="0.85"/>
    <rect class="pg p3" x="810" y="428" width="15" height="10" opacity="0.8"/>
    <rect class="pg p4" x="828" y="372" width="13" height="9" opacity="0.85"/>
  </g>

  <!-- three golems, walking toward the sea -->
  <!-- golem 1 · 8.3 GB -->
  <g class="g1">
    <rect x="586" y="440" width="44" height="66" rx="12" fill="#b97a3c" stroke="#7a4a1e" stroke-width="2.5"/>
    <circle cx="608" cy="428" r="15" fill="#d99a4e" stroke="#7a4a1e" stroke-width="2.5"/>
    <rect x="590" y="386" width="38" height="44" fill="#f2ead8" stroke="#b6ab93" stroke-width="1.5" transform="rotate(-3 609 408)"/>
    <line x1="592" y1="398" x2="626" y2="396" stroke="#b6ab93" stroke-width="1.2"/>
    <line x1="592" y1="410" x2="626" y2="408" stroke="#b6ab93" stroke-width="1.2"/>
    <line x1="592" y1="422" x2="626" y2="420" stroke="#b6ab93" stroke-width="1.2"/>
  </g>
  <text x="608" y="546" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#d99a4e">8.3 GB</text>

  <!-- golem 2 · 9.5 GB -->
  <g class="g2">
    <rect x="686" y="432" width="48" height="74" rx="13" fill="#b97a3c" stroke="#7a4a1e" stroke-width="2.5"/>
    <circle cx="710" cy="418" r="16" fill="#d99a4e" stroke="#7a4a1e" stroke-width="2.5"/>
    <rect x="690" y="360" width="40" height="58" fill="#f2ead8" stroke="#b6ab93" stroke-width="1.5" transform="rotate(2 710 389)"/>
    <line x1="694" y1="374" x2="728" y2="376" stroke="#b6ab93" stroke-width="1.2"/>
    <line x1="694" y1="388" x2="728" y2="390" stroke="#b6ab93" stroke-width="1.2"/>
    <line x1="694" y1="402" x2="728" y2="404" stroke="#b6ab93" stroke-width="1.2"/>
  </g>
  <text x="710" y="546" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#d99a4e">9.5 GB</text>

  <!-- golem 3 · 12 GB -->
  <g class="g3">
    <rect x="788" y="424" width="52" height="82" rx="14" fill="#b97a3c" stroke="#7a4a1e" stroke-width="2.5"/>
    <circle cx="814" cy="408" r="17" fill="#d99a4e" stroke="#7a4a1e" stroke-width="2.5"/>
    <rect x="792" y="330" width="44" height="78" fill="#f2ead8" stroke="#b6ab93" stroke-width="1.5" transform="rotate(-4 814 369)"/>
    <line x1="796" y1="346" x2="832" y2="343" stroke="#b6ab93" stroke-width="1.2"/>
    <line x1="796" y1="362" x2="832" y2="359" stroke="#b6ab93" stroke-width="1.2"/>
    <line x1="796" y1="378" x2="832" y2="375" stroke="#b6ab93" stroke-width="1.2"/>
    <line x1="796" y1="394" x2="832" y2="391" stroke="#b6ab93" stroke-width="1.2"/>
  </g>
  <text x="814" y="546" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#d99a4e">12 GB</text>

  <text x="600" y="610" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="3" fill="#7fd8a8">.ignore — the treaty at the gate: catacombs closed, galleries sleep in the cloud</text>
  <text x="600" y="646" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="4" fill="#5a557e">JOIN US YEE · EL SEGUNDO · JETSAM 15:12:47 · THE YARD HELD</text>

  <style>
    .g1, .g2, .g3 { transform-box: fill-box; transform-origin: center bottom; }
    .g1 { animation: bob 2.6s ease-in-out infinite alternate; }
    .g2 { animation: bob 3.1s ease-in-out infinite alternate; animation-delay: 0.4s; }
    .g3 { animation: bob 2.2s ease-in-out infinite alternate; animation-delay: 0.9s; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    .pg { transform-box: fill-box; transform-origin: center; }
    .p1 { animation: drift 7s linear infinite; }
    .p2 { animation: drift 9s linear infinite; animation-delay: 2s; }
    .p3 { animation: drift 8s linear infinite; animation-delay: 4.5s; }
    .p4 { animation: drift 10s linear infinite; animation-delay: 1s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.9; }
      70%  { opacity: 0.7; }
      100% { transform: translate(300px, 110px) rotate(140deg); opacity: 0; }
    }
    .sh1 { animation: sheen 5s ease-in-out infinite alternate; }
    .sh2 { animation: sheen 6.5s ease-in-out infinite alternate; animation-delay: 1.2s; }
    @keyframes sheen { from { opacity: 0.15; } to { opacity: 0.5; } }
    .tw1 { animation: twinkle 3.4s ease-in-out infinite alternate; }
    .tw2 { animation: twinkle 4.6s ease-in-out infinite alternate; animation-delay: 1.4s; }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 0.95; } }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .g1, .g2, .g3, .pg, .sh1, .sh2, .tw1, .tw2, .cursor { animation: none; } }
  </style>
</svg>
