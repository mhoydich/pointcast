<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">The v1 Wing</title>
  <desc id="d">A miniature of the old PointCast front page framed on a museum wall, lit by a picture lamp, dust drifting in the beam. A plaque reads V1 · 2025 to APRIL 2026.</desc>

  <!-- Museum wall -->
  <rect width="1200" height="675" fill="#3d3a44"/>
  <rect width="1200" height="675" fill="url(#wallshade)"/>
  <defs>
    <linearGradient id="wallshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Picture lamp -->
  <rect x="520" y="88" width="160" height="10" rx="5" fill="#8a7a55"/>
  <path class="beam" d="M540,98 L470,560 L730,560 L660,98 Z" fill="url(#beam)"/>

  <!-- Frame -->
  <rect x="440" y="130" width="320" height="410" fill="#6b5636"/>
  <rect x="452" y="142" width="296" height="386" fill="#8a7247"/>
  <rect x="462" y="152" width="276" height="366" fill="#faf7f1"/>

  <!-- The v1 page, miniature -->
  <g>
    <!-- masthead -->
    <line x1="478" y1="176" x2="722" y2="176" stroke="#d8d2c6" stroke-width="2"/>
    <text x="478" y="200" font-family="ui-monospace, Menlo, monospace" font-size="19" letter-spacing="5" font-weight="bold" fill="#2a2724">POINTCAST</text>
    <circle cx="700" cy="193" r="9" fill="#e8e2d2" stroke="#c9885f" stroke-width="1.5"/>
    <line x1="478" y1="212" x2="722" y2="212" stroke="#d8d2c6" stroke-width="2"/>
    <!-- byline -->
    <text x="478" y="238" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#2a2724">Michael Hoydich</text>
    <text x="478" y="254" font-family="ui-monospace, Menlo, monospace" font-size="8" letter-spacing="2" fill="#8b8375">COO AT GOOD FEELS · EL SEGUNDO CA</text>
    <!-- feed rules + text lines -->
    <g stroke="#e2dccf" stroke-width="1.6">
      <line x1="478" y1="274" x2="722" y2="274"/>
      <line x1="478" y1="336" x2="722" y2="336"/>
      <line x1="478" y1="398" x2="722" y2="398"/>
      <line x1="478" y1="460" x2="722" y2="460"/>
    </g>
    <g fill="#575043">
      <rect x="478" y="286" width="150" height="7"/>
      <rect x="478" y="300" width="230" height="4" opacity="0.5"/>
      <rect x="478" y="310" width="196" height="4" opacity="0.5"/>
      <rect x="478" y="348" width="170" height="7"/>
      <rect x="478" y="362" width="225" height="4" opacity="0.5"/>
      <rect x="478" y="372" width="140" height="4" opacity="0.5"/>
      <rect x="478" y="410" width="130" height="7"/>
      <rect x="478" y="424" width="238" height="4" opacity="0.5"/>
      <rect x="478" y="434" width="180" height="4" opacity="0.5"/>
      <rect x="478" y="472" width="160" height="7"/>
      <rect x="478" y="486" width="210" height="4" opacity="0.5"/>
    </g>
  </g>

  <!-- Plaque -->
  <rect x="520" y="574" width="160" height="44" fill="#c9b88a"/>
  <rect x="524" y="578" width="152" height="36" fill="none" stroke="#8a7247" stroke-width="1.5"/>
  <text x="600" y="594" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#3a3020">POINTCAST V1</text>
  <text x="600" y="608" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#6b5a3a">2025 – APRIL 2026 · 7fea01c</text>

  <!-- Dust in the beam -->
  <g fill="#ffe9b0">
    <circle class="mote m1" cx="560" cy="220" r="1.8"/>
    <circle class="mote m2" cx="640" cy="180" r="1.4"/>
    <circle class="mote m3" cx="600" cy="330" r="1.6"/>
    <circle class="mote m4" cx="530" cy="420" r="1.3"/>
    <circle class="mote m5" cx="670" cy="470" r="1.5"/>
    <circle class="mote m6" cx="580" cy="520" r="1.2"/>
  </g>

  <!-- Exit arrows to the rest of the attic -->
  <text x="120" y="640" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="4" fill="#8b8880">← /ATTIC</text>
  <text x="1080" y="640" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="4" fill="#8b8880">/ATTIC/V1</text>

  <style>
    .beam { animation: breathe 6s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: 0.55; } to { opacity: 0.95; } }

    .mote { animation: drift 11s ease-in-out infinite; opacity: 0.6; }
    .m2 { animation-delay: -3s; } .m3 { animation-delay: -5s; }
    .m4 { animation-delay: -7s; } .m5 { animation-delay: -9s; } .m6 { animation-delay: -10s; }
    @keyframes drift {
      0% { transform: translate(0,0); opacity: 0.1; }
      50% { transform: translate(10px,30px); opacity: 0.65; }
      100% { transform: translate(-8px,64px); opacity: 0.08; }
    }

    @media (prefers-reduced-motion: reduce) { .beam, .mote { animation: none; } }
  </style>
</svg>
