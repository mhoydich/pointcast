<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d">
  <title id="t">The Wild, filed</title>
  <desc id="d">An open wooden card-catalog drawer full of index cards; one card lifts out and back, labelled with the name of an agent directory, while a small votive candle burns on the cabinet top.</desc>
  <style>
    .lift { animation: lift 5s ease-in-out infinite; }
    .flame { animation: flick 1.8s ease-in-out infinite; transform-origin: 640px 196px; }
    .halo { animation: breathe 3s ease-in-out infinite; }
    .tick { animation: blink 1.2s steps(1) infinite; }
    @keyframes lift { 0%, 20%, 100% { transform: translateY(0); } 45%, 70% { transform: translateY(-120px); } }
    @keyframes flick { 0%,100% { transform: scale(1,1) rotate(0deg); } 35% { transform: scale(.92,1.08) rotate(-3deg); } 70% { transform: scale(1.05,.95) rotate(2deg); } }
    @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: .85; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: .2; } }
  </style>
  <defs>
    <linearGradient id="wood" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="1" stop-color="#5c3a20"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="drawer"><rect x="150" y="300" width="500" height="380"/></clipPath>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="800" height="800" fill="#151227"/>
    <rect y="700" width="800" height="100" fill="#0d0b19"/>
    <rect y="698" width="800" height="4" fill="#3b2f5c"/>

    <rect x="120" y="230" width="560" height="470" rx="10" fill="url(#wood)"/>
    <rect x="120" y="230" width="560" height="14" fill="#a06c40"/>
    <circle class="halo" cx="640" cy="196" r="70" fill="url(#g)"/>
    <rect x="620" y="200" width="40" height="30" rx="4" fill="#f3e7cf"/>
    <rect x="638" y="186" width="4" height="16" fill="#2a2216"/>
    <path class="flame" d="M640 158 C652 174 651 188 640 194 C629 188 628 174 640 158 Z" fill="#ffb43a"/>

    <g clip-path="url(#drawer)">
      <rect x="150" y="300" width="500" height="380" fill="#2b1b10"/>
      <g fill="#efe4cc" stroke="#c9b892" stroke-width="2">
        <rect x="180" y="520" width="440" height="150" rx="4"/>
        <rect x="180" y="490" width="440" height="150" rx="4"/>
        <rect x="180" y="460" width="440" height="150" rx="4"/>
      </g>
      <g class="lift">
        <rect x="180" y="420" width="440" height="180" rx="4" fill="#fbf4e3" stroke="#c9b892" stroke-width="2"/>
        <rect x="380" y="404" width="80" height="26" rx="6" fill="#fbf4e3" stroke="#c9b892" stroke-width="2"/>
        <g font-family="ui-monospace, Menlo, monospace" fill="#2a2440">
          <text x="204" y="462" font-size="22" font-weight="700">THE WILD</text>
          <text x="204" y="492" font-size="16" fill="#6b6290">dev.workers.mhoydich.the-wild-x402</text>
          <rect x="204" y="506" width="392" height="2" fill="#c9b892"/>
          <text x="204" y="536" font-size="16">prayer $0.01 · witness $0.01</text>
          <text x="204" y="562" font-size="16">votive candle $1 · $3 · $9</text>
          <text x="204" y="588" font-size="15" fill="#6b6290">402 on every door<tspan class="tick" fill="#2f9e5b"> ●</tspan></text>
        </g>
      </g>
    </g>
    <rect x="150" y="300" width="500" height="380" fill="none" stroke="#3a2412" stroke-width="10"/>
    <rect x="360" y="660" width="80" height="18" rx="9" fill="#d9b46a"/>

    <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#8f84c7" text-anchor="middle">
      <text x="230" y="730">MCP REGISTRY</text>
      <text x="400" y="730">x402scan</text>
      <text x="570" y="730">402index · nohumans</text>
    </g>
    <text x="400" y="92" fill="#efe6ff" font-family="Georgia, serif" font-size="46" text-anchor="middle">filed under: the wild</text>
    <text x="400" y="134" fill="#8f84c7" font-family="ui-monospace, Menlo, monospace" font-size="19" text-anchor="middle">a shop nobody can find has no customers</text>
  </g>
</svg>
