<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Townsfolk</title>
  <desc id="d">Five navy passport covers on a wooden shelf, each with a pixel head wearing noggles. A brass hand-stamp presses a red wax seal onto the center one; a green verified mark glows on another.</desc>

  <defs>
    <!-- Noggles — the CC0 glasses, drawn plain -->
    <g id="noggles">
      <rect x="0" y="0" width="16" height="12" fill="#fff" stroke="#d22209" stroke-width="3"/>
      <rect x="22" y="0" width="16" height="12" fill="#fff" stroke="#d22209" stroke-width="3"/>
      <rect x="16" y="4" width="6" height="3" fill="#d22209"/>
      <rect x="-8" y="4" width="8" height="3" fill="#d22209"/>
      <rect x="4" y="2" width="6" height="8" fill="#12110e"/>
      <rect x="26" y="2" width="6" height="8" fill="#12110e"/>
    </g>
    <linearGradient id="shelfwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2a"/><stop offset="1" stop-color="#4a3018"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#17142b"/>

  <!-- Shelf -->
  <rect x="80" y="470" width="1040" height="26" fill="url(#shelfwood)"/>
  <rect x="80" y="496" width="1040" height="10" fill="#2c1d0e"/>

  <!-- Covers -->
  <!-- 1 -->
  <g transform="translate(120,270)">
    <rect width="170" height="200" fill="#1b3560" stroke="#0d1e3a" stroke-width="3"/>
    <rect x="55" y="36" width="60" height="52" fill="#c9885f"/>
    <use href="#noggles" transform="translate(68,54)"/>
    <text x="85" y="130" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#f2ead8">PC-04A1F2</text>
    <text x="85" y="152" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#c9d4ea">Marine Layer Gate</text>
    <text x="85" y="180" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#8fa3c8">tz1abc…9f2k</text>
  </g>
  <!-- 2, verified -->
  <g transform="translate(320,258)">
    <rect width="170" height="212" fill="#1b3560" stroke="#0d1e3a" stroke-width="3"/>
    <rect x="55" y="38" width="60" height="52" fill="#8bc34a"/>
    <use href="#noggles" transform="translate(68,56)"/>
    <text x="85" y="134" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#f2ead8">PC-B33D01</text>
    <text x="85" y="156" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#c9d4ea">Kettle Customs</text>
    <g class="verified" transform="translate(136,26)">
      <circle r="17" fill="#0f6e56"/>
      <path d="M-7,0 L-2,6 L8,-6" fill="none" stroke="#eafff5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="85" y="188" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#8fa3c8">tz2mno…44qq</text>
  </g>
  <!-- 3, center — being sealed -->
  <g transform="translate(520,246)">
    <rect width="180" height="224" fill="#22406f" stroke="#0d1e3a" stroke-width="3"/>
    <rect x="60" y="40" width="60" height="52" fill="#e8b3d1"/>
    <use href="#noggles" transform="translate(73,58)"/>
    <text x="90" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#f2ead8">PC-EL2ND0</text>
    <text x="90" y="162" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#c9d4ea">El Segundo Terminal</text>
    <g class="wax" transform="translate(90,196)">
      <circle r="22" fill="#8a2432"/>
      <circle r="16" fill="none" stroke="#5c1620" stroke-width="2.5"/>
      <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#f2d8dc">PC</text>
    </g>
  </g>
  <!-- Brass hand-stamp above the center cover -->
  <g class="press" transform="translate(610,120)">
    <rect x="-11" y="0" width="22" height="55" rx="6" fill="#8a7a55"/>
    <rect x="-30" y="52" width="60" height="26" rx="6" fill="#c4952e"/>
    <rect x="-24" y="78" width="48" height="12" fill="#6b5a3a"/>
  </g>
  <!-- 4 -->
  <g transform="translate(730,272)">
    <rect width="170" height="198" fill="#1b3560" stroke="#0d1e3a" stroke-width="3"/>
    <rect x="55" y="34" width="60" height="52" fill="#7fd8d4"/>
    <use href="#noggles" transform="translate(68,52)"/>
    <text x="85" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#f2ead8">PC-77C0DE</text>
    <text x="85" y="150" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#c9d4ea">The Quiet Border</text>
    <text x="85" y="178" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#8fa3c8">tz1xyz…77aa</text>
  </g>
  <!-- 5, still empty slot -->
  <g transform="translate(930,276)">
    <rect width="150" height="194" fill="none" stroke="#3a3560" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="75" y="92" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#5a557e">YOURS</text>
    <text x="75" y="114" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#5a557e">/passport →</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="24" letter-spacing="8" fill="#c9d4ea">TOWNSFOLK · SEALED ON PURPOSE</text>
  <text x="600" y="626" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="4" fill="#5a557e">VERIFIED IN YOUR BROWSER · /TOWNSFOLK</text>

  <style>
    .press { animation: press 5s ease-in-out infinite; }
    @keyframes press {
      0%, 55%, 100% { transform: translate(610px,120px); }
      65% { transform: translate(610px,196px); }
      72% { transform: translate(610px,188px); }
      80% { transform: translate(610px,120px); }
    }
    .wax { transform-box: fill-box; transform-origin: center; animation: wax 5s ease-in-out infinite; }
    @keyframes wax {
      0%, 64% { transform: scale(0.92); opacity: 0.75; }
      68% { transform: scale(1.12); opacity: 1; }
      74%, 100% { transform: scale(1); opacity: 1; }
    }
    .verified { transform-box: fill-box; transform-origin: center; animation: verified 4s ease-in-out infinite alternate; }
    @keyframes verified { from { transform: scale(1); } to { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .press, .wax, .verified { animation: none; } }
  </style>
</svg>
