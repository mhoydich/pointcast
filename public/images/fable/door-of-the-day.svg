<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Door of the Day</title>
  <desc id="d">One quiet door under a porch lamp in a dark field, easing open. Today we dust.</desc>

  <rect width="1200" height="675" fill="#12110e"/>

  <!-- Faint neighbors, unlit -->
  <g stroke="#2c2a26" stroke-width="3" fill="none">
    <rect x="150" y="240" width="110" height="162"/>
    <rect x="330" y="240" width="110" height="162"/>
    <rect x="760" y="240" width="110" height="162"/>
    <rect x="940" y="240" width="110" height="162"/>
  </g>
  <g fill="#2c2a26">
    <circle cx="242" cy="325" r="5"/><circle cx="422" cy="325" r="5"/>
    <circle cx="852" cy="325" r="5"/><circle cx="1032" cy="325" r="5"/>
  </g>

  <!-- Porch lamp -->
  <line x1="600" y1="96" x2="600" y2="128" stroke="#5f5e5a" stroke-width="4"/>
  <circle class="lamp" cx="600" cy="142" r="14" fill="#ffd400"/>
  <!-- Light cone -->
  <path class="cone" d="M600,142 L440,470 L760,470 Z" fill="#ffd400" opacity="0.1"/>

  <!-- The door of the day -->
  <g class="sway">
    <rect x="512" y="230" width="176" height="240" fill="#f4f1ea" stroke="#ffd400" stroke-width="4"/>
    <rect x="538" y="258" width="124" height="82" fill="none" stroke="#12110e" stroke-width="3" opacity="0.5"/>
    <rect x="538" y="360" width="124" height="82" fill="none" stroke="#12110e" stroke-width="3" opacity="0.5"/>
    <circle cx="664" cy="352" r="7" fill="#12110e"/>
  </g>

  <!-- Doorstep glow -->
  <ellipse class="step" cx="600" cy="480" rx="150" ry="14" fill="#ffd400" opacity="0.16"/>

  <!-- Dust motes in the light -->
  <g fill="#ffe9a3">
    <circle class="mote m1" cx="560" cy="300" r="2"/>
    <circle class="mote m2" cx="630" cy="260" r="1.6"/>
    <circle class="mote m3" cx="590" cy="380" r="1.8"/>
    <circle class="mote m4" cx="650" cy="420" r="1.4"/>
    <circle class="mote m5" cx="530" cy="430" r="1.5"/>
  </g>

  <text x="600" y="580" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="30" letter-spacing="10" fill="#f4f1ea">TODAY WE DUST</text>
  <text x="600" y="622" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="18" letter-spacing="6" fill="#8b8880">/DOOR · TURNS AT MIDNIGHT PT</text>

  <style>
    .lamp { animation: warm 3.4s ease-in-out infinite alternate; }
    .cone { animation: cone 3.4s ease-in-out infinite alternate; }
    .step { animation: cone 3.4s ease-in-out infinite alternate; animation-delay: -1s; }
    @keyframes warm { from { opacity: 0.85; } to { opacity: 1; } }
    @keyframes cone { from { opacity: 0.07; } to { opacity: 0.15; } }

    .sway { transform-box: fill-box; transform-origin: left center; animation: ajar 7s ease-in-out infinite; }
    @keyframes ajar {
      0%, 62%, 100% { transform: scaleX(1) skewY(0deg); }
      74% { transform: scaleX(0.86) skewY(-2.5deg); }
      84% { transform: scaleX(1) skewY(0deg); }
    }

    .mote { animation: float 9s ease-in-out infinite; opacity: 0.7; }
    .m2 { animation-delay: -2s; } .m3 { animation-delay: -4s; }
    .m4 { animation-delay: -6s; } .m5 { animation-delay: -7.5s; }
    @keyframes float {
      0% { transform: translate(0,0); opacity: 0.15; }
      50% { transform: translate(8px,26px); opacity: 0.75; }
      100% { transform: translate(-6px,54px); opacity: 0.1; }
    }

    @media (prefers-reduced-motion: reduce) { .lamp, .cone, .step, .sway, .mote { animation: none; } }
  </style>
</svg>
