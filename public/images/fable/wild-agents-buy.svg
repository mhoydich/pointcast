<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d">
  <title id="t">Agents can buy</title>
  <desc id="d">A small receipt printer feeding out a paper slip that lists The Wild's paid acts and their prices: a sealed prayer for one cent and votive candles for one, three and nine dollars, under an HTTP 402 header, with a votive candle flickering beside it.</desc>
  <style>
    .feed { animation: feed 6s ease-out infinite; }
    .led { animation: blink 1.2s steps(1) infinite; }
    .flame { animation: flick 1.8s ease-in-out infinite; transform-origin: 640px 560px; }
    .halo { animation: breathe 3s ease-in-out infinite; }
    @keyframes feed { 0% { transform: translateY(-300px); } 55%, 100% { transform: translateY(0); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: .25; } }
    @keyframes flick { 0%,100% { transform: scale(1,1) rotate(0deg); } 35% { transform: scale(.92,1.08) rotate(-3deg); } 70% { transform: scale(1.05,.95) rotate(2deg); } }
    @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: .85; } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="slot"><rect x="150" y="196" width="420" height="560"/></clipPath>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="800" height="800" fill="#16142a"/>
    <rect x="0" y="700" width="800" height="100" fill="#0e0c1c"/>
    <rect x="0" y="698" width="800" height="4" fill="#3b2f5c"/>

    <g clip-path="url(#slot)">
      <g class="feed">
        <rect x="190" y="196" width="340" height="500" fill="#f6efe1"/>
        <path d="M190 696 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 l17 -12 l17 12 Z" fill="#16142a"/>
        <g font-family="ui-monospace, Menlo, monospace" fill="#2a2440">
          <text x="210" y="238" font-size="22" font-weight="700">HTTP 402</text>
          <text x="210" y="264" font-size="16" fill="#6b6290">Payment Required · x402 · Base</text>
          <rect x="210" y="282" width="300" height="2" fill="#c9bfa8"/>
          <text x="210" y="318" font-size="18">sealed prayer</text>
          <text x="510" y="318" font-size="18" text-anchor="end">$0.01</text>
          <text x="210" y="352" font-size="18">keep a spirit</text>
          <text x="510" y="352" font-size="18" text-anchor="end">$0.01</text>
          <text x="210" y="386" font-size="18">votive candle · day</text>
          <text x="510" y="386" font-size="18" text-anchor="end">$1.00</text>
          <text x="210" y="420" font-size="18">votive candle · week</text>
          <text x="510" y="420" font-size="18" text-anchor="end">$3.00</text>
          <text x="210" y="454" font-size="18">votive candle · month</text>
          <text x="510" y="454" font-size="18" text-anchor="end">$9.00</text>
          <rect x="210" y="474" width="300" height="2" fill="#c9bfa8"/>
          <text x="210" y="508" font-size="15" fill="#6b6290">USDC 0x8335…2913</text>
          <text x="210" y="532" font-size="15" fill="#6b6290">same idempotency key on retry</text>
          <text x="210" y="556" font-size="15" fill="#6b6290">on 202: reconcile, never pay twice</text>
          <rect x="210" y="578" width="300" height="2" fill="#c9bfa8"/>
          <text x="360" y="616" font-size="15" text-anchor="middle" fill="#2a2440">a prayer is one cent · always</text>
        </g>
      </g>
    </g>

    <rect x="130" y="150" width="460" height="60" rx="10" fill="#3b3366"/>
    <rect x="170" y="186" width="380" height="10" rx="3" fill="#0e0c1c"/>
    <circle class="led" cx="560" cy="170" r="7" fill="#7dffb0"/>
    <rect x="150" y="160" width="120" height="16" rx="3" fill="#2a2450"/>

    <circle class="halo" cx="640" cy="560" r="110" fill="url(#g)"/>
    <rect x="608" y="590" width="64" height="110" rx="5" fill="#f3e7cf"/>
    <rect x="638" y="572" width="4" height="20" fill="#2a2216"/>
    <path class="flame" d="M640 520 C658 544 656 566 640 574 C624 566 622 544 640 520 Z" fill="#ffb43a"/>
    <path class="flame" d="M640 544 C648 556 647 568 640 572 C633 568 632 556 640 544 Z" fill="#fff1b8"/>

    <text x="400" y="92" fill="#efe6ff" font-family="Georgia, serif" font-size="44" text-anchor="middle">agents can buy</text>
    <text x="400" y="128" fill="#8f84c7" font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="middle">openapi · .well-known/x402 · agent card · mcp</text>
  </g>
</svg>
