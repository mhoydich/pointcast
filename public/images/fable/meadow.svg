<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">The meadow is open</title>
  <desc id="d">Night over the El Segundo dunes. A procession of released butterflies rises from the buckwheat — mostly blue, a few aberrants in gold and pink. Everyone's blues.</desc>

  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#23234c"/>
      <stop offset="0.85" stop-color="#4b3b6e"/>
      <stop offset="1" stop-color="#6e4f74"/>
    </linearGradient>
    <linearGradient id="nsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4356"/>
      <stop offset="1" stop-color="#0d2635"/>
    </linearGradient>

    <g id="bwheat">
      <path d="M0,0 C-2,-14 -8,-24 -14,-30" stroke="#5c6852" stroke-width="1.6" fill="none"/>
      <path d="M0,0 C0,-16 -1,-28 2,-38" stroke="#5c6852" stroke-width="1.6" fill="none"/>
      <path d="M0,0 C2,-12 8,-22 13,-27" stroke="#5c6852" stroke-width="1.6" fill="none"/>
      <ellipse cx="-4" cy="-2" rx="6" ry="2.4" fill="#48553f"/>
      <g fill="#c39c94"><circle cx="-14" cy="-32" r="5"/><circle cx="-18" cy="-29" r="3.6"/><circle cx="-10" cy="-29" r="3.4"/></g>
      <g fill="#b28d86"><circle cx="2" cy="-40" r="5.6"/><circle cx="-2" cy="-37" r="3.8"/><circle cx="6" cy="-37" r="3.8"/></g>
      <g fill="#c39c94"><circle cx="13" cy="-29" r="4.6"/><circle cx="9" cy="-26" r="3.2"/></g>
    </g>

    <!-- Generic released butterfly — takes currentColor for the wings. -->
    <g id="rbf">
      <g class="wing wL">
        <path d="M-1,-2 C-10,-13 -21,-11 -20,-2 C-19,4 -9,3 -1,0 Z" fill="currentColor" stroke="#2b2b44" stroke-width="0.9"/>
        <path d="M-1,0 C-9,2 -14,8 -10,12 C-6,14 -2,8 -1,3 Z" fill="currentColor" opacity="0.85" stroke="#2b2b44" stroke-width="0.9"/>
      </g>
      <g class="wing wR">
        <path d="M1,-2 C10,-13 21,-11 20,-2 C19,4 9,3 1,0 Z" fill="currentColor" stroke="#2b2b44" stroke-width="0.9"/>
        <path d="M1,0 C9,2 14,8 10,12 C6,14 2,8 1,3 Z" fill="currentColor" opacity="0.85" stroke="#2b2b44" stroke-width="0.9"/>
      </g>
      <ellipse cx="0" cy="1" rx="1.7" ry="5.2" fill="#1d1d30"/>
    </g>
  </defs>

  <rect width="1200" height="675" fill="url(#nsky)"/>

  <g fill="#fff">
    <circle class="tw1" cx="110" cy="70" r="1.4"/>
    <circle class="tw2" cx="260" cy="140" r="1.1"/>
    <circle class="tw3" cx="420" cy="55" r="1.5"/>
    <circle class="tw1" cx="600" cy="110" r="1.1"/>
    <circle class="tw2" cx="760" cy="60" r="1.3"/>
    <circle class="tw3" cx="900" cy="150" r="1.0"/>
    <circle class="tw1" cx="1120" cy="90" r="1.3"/>
    <circle class="tw2" cx="1010" cy="45" r="1.1"/>
    <circle class="tw3" cx="60" cy="180" r="1.0"/>
    <circle class="tw1" cx="330" cy="200" r="0.9"/>
  </g>

  <mask id="mcr">
    <circle r="24" fill="#fff"/>
    <circle cx="8" cy="-7" r="22" fill="#000"/>
  </mask>
  <g transform="translate(1010,95)">
    <circle r="24" fill="#efe6d3" mask="url(#mcr)"/>
  </g>

  <rect x="0" y="402" width="1200" height="40" fill="url(#nsea)"/>
  <g stroke-linecap="round">
    <line class="shm1" x1="420" y1="414" x2="580" y2="414" stroke="#efe6d3" stroke-width="1.6" opacity="0.16"/>
    <line class="shm2" x1="470" y1="426" x2="590" y2="426" stroke="#efe6d3" stroke-width="1.3" opacity="0.1"/>
  </g>

  <path d="M0,468 C180,430 340,452 520,436 C700,420 840,446 1010,428 C1090,420 1150,424 1200,418 L1200,675 L0,675 Z" fill="#3b3757"/>
  <path d="M0,520 C150,478 320,502 470,486 C660,466 780,502 950,480 C1070,466 1150,478 1200,468 L1200,675 L0,675 Z" fill="#282443"/>
  <path d="M0,590 C160,548 330,574 520,556 C720,538 860,572 1040,552 C1110,545 1160,552 1200,546 L1200,675 L0,675 Z" fill="#191630"/>

  <use href="#bwheat" transform="translate(180,574)"/>
  <use href="#bwheat" transform="translate(430,602) scale(1.15)"/>
  <use href="#bwheat" transform="translate(700,590) scale(0.95)"/>
  <use href="#bwheat" transform="translate(980,614) scale(1.25)"/>
  <use href="#bwheat" transform="translate(620,650)"/>

  <!-- The procession. Columns of released blues, a few aberrants. -->
  <g transform="translate(180,560) scale(0.85)" color="#7f9fe0"><g class="rise r1"><use href="#rbf"/></g></g>
  <g transform="translate(250,580) scale(0.6)" color="#93b1ea"><g class="rise r2"><use href="#rbf"/></g></g>
  <g transform="translate(340,555) scale(0.75)" color="#6f8fd6"><g class="rise r3"><use href="#rbf"/></g></g>
  <g transform="translate(430,590) scale(1.0)" color="#8aa6e4"><g class="rise r4"><use href="#rbf"/></g></g>
  <g transform="translate(505,570) scale(0.55)" color="#e0c67f"><g class="rise r5"><use href="#rbf"/></g></g>
  <g transform="translate(585,600) scale(0.8)" color="#7f9fe0"><g class="rise r6"><use href="#rbf"/></g></g>
  <g transform="translate(660,575) scale(0.7)" color="#9db8ee"><g class="rise r7"><use href="#rbf"/></g></g>
  <g transform="translate(730,595) scale(0.9)" color="#86a5e6"><g class="rise r8"><use href="#rbf"/></g></g>
  <g transform="translate(815,565) scale(0.6)" color="#e08fbc"><g class="rise r9"><use href="#rbf"/></g></g>
  <g transform="translate(900,585) scale(0.85)" color="#7f9fe0"><g class="rise r10"><use href="#rbf"/></g></g>
  <g transform="translate(985,600) scale(0.7)" color="#a8c0f0"><g class="rise r11"><use href="#rbf"/></g></g>
  <g transform="translate(1065,575) scale(0.8)" color="#8aa6e4"><g class="rise r12"><use href="#rbf"/></g></g>
  <g transform="translate(120,600) scale(0.65)" color="#d8e2f8"><g class="rise r13"><use href="#rbf"/></g></g>
  <g transform="translate(560,545) scale(0.7)" color="#7f9fe0"><g class="rise r14"><use href="#rbf"/></g></g>

  <style>
    .wing { transform-box: fill-box; }
    .wL { transform-origin: right center; animation: flap 0.48s ease-in-out infinite alternate; }
    .wR { transform-origin: left center; animation: flap 0.48s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(0.18); } }

    .rise { animation: 30s ease-in-out infinite; opacity: 0.95; }
    .r1 { animation-name: riseA; animation-duration: 26s; }
    .r2 { animation-name: riseB; animation-duration: 34s; animation-delay: -6s; }
    .r3 { animation-name: riseA; animation-duration: 30s; animation-delay: -12s; }
    .r4 { animation-name: riseB; animation-duration: 24s; animation-delay: -3s; }
    .r5 { animation-name: riseA; animation-duration: 38s; animation-delay: -18s; }
    .r6 { animation-name: riseB; animation-duration: 28s; animation-delay: -9s; }
    .r7 { animation-name: riseA; animation-duration: 32s; animation-delay: -21s; }
    .r8 { animation-name: riseB; animation-duration: 26s; animation-delay: -14s; }
    .r9 { animation-name: riseA; animation-duration: 36s; animation-delay: -5s; }
    .r10 { animation-name: riseB; animation-duration: 30s; animation-delay: -24s; }
    .r11 { animation-name: riseA; animation-duration: 27s; animation-delay: -11s; }
    .r12 { animation-name: riseB; animation-duration: 33s; animation-delay: -16s; }
    .r13 { animation-name: riseA; animation-duration: 29s; animation-delay: -20s; }
    .r14 { animation-name: riseB; animation-duration: 35s; animation-delay: -8s; }
    @keyframes riseA {
      0% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.95; }
      50% { transform: translate(40px,-160px) rotate(8deg); }
      88% { opacity: 0.9; }
      100% { transform: translate(-25px,-330px) rotate(-6deg); opacity: 0; }
    }
    @keyframes riseB {
      0% { transform: translate(0,0) rotate(0deg); opacity: 0; }
      12% { opacity: 0.95; }
      45% { transform: translate(-50px,-140px) rotate(-8deg); }
      86% { opacity: 0.9; }
      100% { transform: translate(30px,-300px) rotate(7deg); opacity: 0; }
    }

    .tw1 { opacity: 0.9; animation: twinkle 4.2s ease-in-out infinite alternate; }
    .tw2 { opacity: 0.6; animation: twinkle 5.6s ease-in-out infinite alternate; animation-delay: -2s; }
    .tw3 { opacity: 0.75; animation: twinkle 6.8s ease-in-out infinite alternate; animation-delay: -4s; }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 0.95; } }

    .shm1 { animation: shimmer 8s ease-in-out infinite alternate; }
    .shm2 { animation: shimmer 11s ease-in-out infinite alternate; animation-delay: -4s; }
    @keyframes shimmer { from { opacity: 0.05; } to { opacity: 0.2; } }

    @media (prefers-reduced-motion: reduce) {
      .wL, .wR, .rise, .tw1, .tw2, .tw3, .shm1, .shm2 { animation: none; }
      .rise { opacity: 0.95; }
    }
  </style>
</svg>
