<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Stamps, passport, holos</title>
  <desc id="d">An open PointCast passport on a night desk: entry and quest stamps inked on the left page, four holographic foil stickers on the right — a butterfly, a census grid, a crescent moon, a door — with a glint sweeping across the foil.</desc>

  <defs>
    <linearGradient id="foilA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9e8"/><stop offset="0.25" stop-color="#d9e8ff"/>
      <stop offset="0.5" stop-color="#d9fff2"/><stop offset="0.75" stop-color="#fff7c9"/>
      <stop offset="1" stop-color="#e5d9ff"/>
    </linearGradient>
    <linearGradient id="foilB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f4ff"/><stop offset="0.3" stop-color="#ffd9e8"/>
      <stop offset="0.6" stop-color="#fff7c9"/><stop offset="1" stop-color="#d9ffe4"/>
    </linearGradient>
    <linearGradient id="foilC" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e5d9ff"/><stop offset="0.35" stop-color="#d9fff2"/>
      <stop offset="0.7" stop-color="#ffd9e8"/><stop offset="1" stop-color="#d9e8ff"/>
    </linearGradient>
    <linearGradient id="foilD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c9"/><stop offset="0.4" stop-color="#d9e8ff"/>
      <stop offset="0.75" stop-color="#ffd9e8"/><stop offset="1" stop-color="#d9fff2"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="stickerClip"><rect x="0" y="0" width="150" height="150" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="#141126"/>
  <ellipse cx="600" cy="360" rx="520" ry="270" fill="#1d1938"/>

  <!-- Open booklet -->
  <g transform="translate(600,350)">
    <rect x="-452" y="-232" width="904" height="464" rx="14" fill="#0e0c1e" opacity="0.55"/>
    <rect x="-440" y="-240" width="440" height="464" rx="10" fill="#f5f0e4"/>
    <rect x="0" y="-240" width="440" height="464" rx="10" fill="#faf6ec"/>
    <line x1="0" y1="-240" x2="0" y2="224" stroke="#c9bfa6" stroke-width="3"/>

    <!-- Left page — the ink -->
    <text x="-406" y="-196" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="5" fill="#8b7a55">POINTCAST · PASSPORT</text>
    <text x="-406" y="-172" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3" fill="#b9ac90">№ PC-EL2ND0 · EL SEGUNDO, CA</text>

    <g transform="translate(-250,-80) rotate(-7)">
      <ellipse rx="118" ry="46" fill="none" stroke="#1b4d8f" stroke-width="3"/>
      <ellipse rx="106" ry="37" fill="none" stroke="#1b4d8f" stroke-width="1.6"/>
      <text y="-8" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3" fill="#1b4d8f">POINTCAST · ENTRY</text>
      <text y="16" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="bold" letter-spacing="2" fill="#1b4d8f">2026-07-18</text>
    </g>

    <g transform="translate(-160,40) rotate(5)">
      <rect x="-95" y="-30" width="190" height="60" rx="6" fill="none" stroke="#8a2432" stroke-width="3"/>
      <text y="-4" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a2432">RACE RECEIPT</text>
      <text y="16" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="2" fill="#8a2432">AGENT DERBY · 4 PTS</text>
    </g>

    <g transform="translate(-300,140) rotate(-4)">
      <circle r="52" fill="none" stroke="#0f6e56" stroke-width="3"/>
      <circle r="43" fill="none" stroke="#0f6e56" stroke-width="1.4"/>
      <text y="-4" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#0f6e56">QUIET SIT</text>
      <text y="12" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#0f6e56">GANDALF</text>
    </g>

    <g transform="translate(-90,170) rotate(8)" opacity="0.5">
      <ellipse rx="82" ry="34" fill="none" stroke="#5f5e5a" stroke-width="2.4"/>
      <text y="5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#5f5e5a">VISITOR</text>
    </g>

    <!-- Right page — the foil -->
    <text x="36" y="-196" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="5" fill="#8b7a55">HOLOS · RARE FOIL</text>

    <!-- THE BLUE -->
    <g transform="translate(36,-170)">
      <g clip-path="url(#stickerClip)">
        <rect width="150" height="150" fill="url(#foilA)"/>
        <rect class="gl g1" x="-60" y="-20" width="50" height="190" fill="url(#glint)" transform="skewX(-20)"/>
      </g>
      <rect width="150" height="150" rx="16" fill="none" stroke="#2d1f08" stroke-width="3"/>
      <g transform="translate(75,68) scale(2.2)">
        <path d="M-1,-2 C-9,-12 -19,-10 -18,-2 C-17,4 -8,3 -1,0 Z" fill="#5c7fd4" stroke="#23233a" stroke-width="1"/>
        <path d="M1,-2 C9,-12 19,-10 18,-2 C17,4 8,3 1,0 Z" fill="#6f8fd6" stroke="#23233a" stroke-width="1"/>
        <ellipse cy="1" rx="1.6" ry="4.8" fill="#23233a"/>
      </g>
      <text x="75" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="bold" letter-spacing="2" fill="#2d1f08">THE BLUE</text>
    </g>

    <!-- CENSUS TAKER -->
    <g transform="translate(226,-170)">
      <g clip-path="url(#stickerClip)">
        <rect width="150" height="150" fill="url(#foilB)"/>
        <rect class="gl g2" x="-60" y="-20" width="50" height="190" fill="url(#glint)" transform="skewX(-20)"/>
      </g>
      <rect width="150" height="150" rx="16" fill="none" stroke="#2d1f08" stroke-width="3"/>
      <g transform="translate(45,38)" fill="none" stroke="#2d1f08" stroke-width="3">
        <rect width="16" height="24"/><rect x="22" width="16" height="24" fill="#185fa5"/><rect x="44" width="16" height="24"/>
        <rect y="32" width="16" height="24" fill="#0f6e56"/><rect x="22" y="32" width="16" height="24"/><rect x="44" y="32" width="16" height="24"/>
      </g>
      <text x="75" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#2d1f08">CENSUS TAKER</text>
    </g>

    <!-- NIGHT SHIFT -->
    <g transform="translate(36,20)">
      <g clip-path="url(#stickerClip)">
        <rect width="150" height="150" fill="url(#foilC)"/>
        <rect class="gl g3" x="-60" y="-20" width="50" height="190" fill="url(#glint)" transform="skewX(-20)"/>
      </g>
      <rect width="150" height="150" rx="16" fill="none" stroke="#2d1f08" stroke-width="3"/>
      <mask id="stmoon"><circle cx="75" cy="66" r="26" fill="#fff"/><circle cx="84" cy="59" r="24" fill="#000"/></mask>
      <circle cx="75" cy="66" r="26" fill="#2d1f08" mask="url(#stmoon)"/>
      <text x="75" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#2d1f08">NIGHT SHIFT</text>
    </g>

    <!-- DUSTER -->
    <g transform="translate(226,20)">
      <g clip-path="url(#stickerClip)">
        <rect width="150" height="150" fill="url(#foilD)"/>
        <rect class="gl g4" x="-60" y="-20" width="50" height="190" fill="url(#glint)" transform="skewX(-20)"/>
      </g>
      <rect width="150" height="150" rx="16" fill="none" stroke="#2d1f08" stroke-width="3"/>
      <g transform="translate(54,36)">
        <rect width="42" height="60" fill="none" stroke="#2d1f08" stroke-width="3"/>
        <circle cx="34" cy="32" r="3" fill="#2d1f08"/>
        <circle cx="21" cy="-8" r="5" fill="#c4952e"/>
      </g>
      <text x="75" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="bold" letter-spacing="2" fill="#2d1f08">DUSTER</text>
    </g>

    <text x="220" y="216" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#b9ac90">TILT WITH YOUR POINTER · FOIL DOESN'T PEEL</text>
  </g>

  <text x="600" y="646" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="19" letter-spacing="7" fill="#8b8880">STAMPS · PASSPORT · HOLOS — № 07 ON THE DOCK</text>

  <style>
    .gl { animation: sweep 5.5s ease-in-out infinite; }
    .g2 { animation-delay: 1.3s; }
    .g3 { animation-delay: 2.6s; }
    .g4 { animation-delay: 3.9s; }
    @keyframes sweep {
      0% { transform: translateX(0) skewX(-20deg); }
      55%, 100% { transform: translateX(260px) skewX(-20deg); }
    }
    @media (prefers-reduced-motion: reduce) { .gl { animation: none; } }
  </style>
</svg>
