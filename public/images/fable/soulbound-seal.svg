<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">The soulbound seal</title>
  <desc id="d">A large red wax seal with a PC monogram on dark velvet, ringed by slowly rotating text reading soulbound, one per address, claimed by the wallet itself. Below, claim_seal succeeds and transfer is denied.</desc>

  <defs>
    <radialGradient id="wax" cx="0.38" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#a83646"/>
      <stop offset="0.55" stop-color="#8a2432"/>
      <stop offset="1" stop-color="#5c1620"/>
    </radialGradient>
    <path id="ringpath" d="M600,120 A190,190 0 1,1 599.9,120" fill="none"/>
  </defs>

  <rect width="1200" height="675" fill="#1a1226"/>
  <ellipse cx="600" cy="330" rx="430" ry="240" fill="#241a35" opacity="0.6"/>

  <text x="600" y="64" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="6" fill="#8b8098">PASSPORT SEALS FA2 · COMPILED · AWAITING ORIGINATION</text>

  <!-- Rotating ring text -->
  <g class="ring">
    <text font-family="ui-monospace, Menlo, monospace" font-size="19" letter-spacing="5" fill="#b9a8d4">
      <textPath href="#ringpath">SOULBOUND · ONE PER ADDRESS · CLAIMED BY THE WALLET ITSELF · FOIL DOESN'T PEEL ·</textPath>
    </text>
  </g>

  <!-- The wax -->
  <g transform="translate(600,310)">
    <path d="M-148,18 C-160,-30 -132,-118 -52,-140 C30,-162 122,-122 142,-52 C162,18 128,108 44,134 C-40,160 -128,120 -148,18 Z" fill="url(#wax)"/>
    <path d="M-150,20 C-166,34 -176,30 -186,40 C-172,46 -158,42 -148,36 Z" fill="#5c1620"/>
    <path d="M146,-44 C160,-52 172,-48 182,-56 C170,-64 156,-60 144,-54 Z" fill="#5c1620"/>
    <circle r="104" fill="none" stroke="#5c1620" stroke-width="5"/>
    <circle r="92" fill="none" stroke="#c2555f" stroke-width="1.6" opacity="0.7"/>
    <text y="24" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="bold" fill="#f2d8dc" class="mono-emboss">PC</text>
    <ellipse class="sheen" cx="-38" cy="-52" rx="56" ry="26" fill="#ffffff" opacity="0.1" transform="rotate(-28)"/>
  </g>

  <!-- The two calls -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="21" letter-spacing="2">
    <text x="600" y="560" text-anchor="middle" fill="#7fd8a8">claim_seal() → yours, once, forever</text>
    <text x="600" y="598" text-anchor="middle" fill="#c2555f">transfer() → <tspan class="denied">FA2_TX_DENIED</tspan></text>
  </g>
  <text x="600" y="642" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="4" fill="#5a557e">CONTRACTS/V2/PASSPORT_SEALS_FA2.PY · ONLY MIKE SIGNS ORIGINATIONS</text>

  <style>
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 80s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .sheen { animation: sheen 7s ease-in-out infinite alternate; }
    @keyframes sheen { from { opacity: 0.05; } to { opacity: 0.18; } }
    .denied { animation: deny 4s step-end infinite; }
    @keyframes deny { 0%, 82% { opacity: 1; } 86%, 92% { opacity: 0.25; } 96%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ring, .sheen, .denied { animation: none; } }
  </style>
</svg>
