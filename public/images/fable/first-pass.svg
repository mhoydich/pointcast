<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">First pass, new engine</title>
  <desc id="d">An open book on a desk at dusk, one El Segundo Blue butterfly rising from the pages toward a crescent moon. A fable, beginning.</desc>

  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10173a"/>
      <stop offset="0.6" stop-color="#2e2f63"/>
      <stop offset="0.88" stop-color="#6b4f86"/>
      <stop offset="1" stop-color="#8a5f7e"/>
    </linearGradient>
    <g id="bfly">
      <g class="wing wL">
        <path d="M-1,-2 C-11,-14 -23,-12 -22,-2 C-21,5 -10,4 -1,0 Z" fill="#8aa6e4" stroke="#3d5a99" stroke-width="1"/>
        <path d="M-1,0 C-10,2 -15,9 -11,13 C-7,15 -2,9 -1,3 Z" fill="#7f9fe0" stroke="#3d5a99" stroke-width="1"/>
      </g>
      <g class="wing wR">
        <path d="M1,-2 C11,-14 23,-12 22,-2 C21,5 10,4 1,0 Z" fill="#93b1ea" stroke="#3d5a99" stroke-width="1"/>
        <path d="M1,0 C10,2 15,9 11,13 C7,15 2,9 1,3 Z" fill="#86a5e6" stroke="#3d5a99" stroke-width="1"/>
      </g>
      <ellipse cx="0" cy="1" rx="1.9" ry="5.8" fill="#23233a"/>
      <path d="M-1,-3 Q-4,-9 -7,-10 M1,-3 Q4,-9 7,-10" stroke="#23233a" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <rect width="1200" height="675" fill="url(#dusk)"/>

  <g fill="#fff">
    <circle class="tw1" cx="150" cy="90" r="1.5"/>
    <circle class="tw2" cx="320" cy="160" r="1.1"/>
    <circle class="tw3" cx="500" cy="70" r="1.4"/>
    <circle class="tw1" cx="700" cy="130" r="1.1"/>
    <circle class="tw2" cx="1080" cy="200" r="1.2"/>
    <circle class="tw3" cx="1140" cy="90" r="1.4"/>
    <circle class="tw1" cx="920" cy="60" r="1.2"/>
    <circle class="tw2" cx="60" cy="220" r="1.0"/>
  </g>

  <!-- Crescent, same moon as over the dunes -->
  <mask id="cr">
    <circle r="30" fill="#fff"/>
    <circle cx="11" cy="-8" r="28" fill="#000"/>
  </mask>
  <g transform="translate(880,130)">
    <circle r="30" fill="#f2e9d8" mask="url(#cr)"/>
  </g>

  <!-- Desk -->
  <rect x="0" y="560" width="1200" height="115" fill="#241d2e"/>
  <rect x="0" y="560" width="1200" height="6" fill="#3a2f47"/>

  <!-- The book, open -->
  <g transform="translate(600,560)">
    <path d="M-260,-10 C-170,-40 -60,-44 0,-30 C60,-44 170,-40 260,-10 L260,10 C170,-16 60,-20 0,-6 C-60,-20 -170,-16 -260,10 Z" fill="#d9cfc0"/>
    <path d="M-252,-16 C-166,-44 -58,-48 0,-34 C58,-48 166,-44 252,-16 L252,-8 C166,-34 58,-38 0,-24 C-58,-38 -166,-34 -252,-8 Z" fill="#f4ede1"/>
    <path d="M0,-34 L0,-6" stroke="#b8a894" stroke-width="3"/>
    <!-- Faint lines of the story so far -->
    <g stroke="#b8a894" stroke-width="2" opacity="0.7" stroke-linecap="round">
      <path d="M-215,-26 C-150,-40 -80,-42 -30,-34"/>
      <path d="M-208,-18 C-148,-32 -85,-34 -35,-27"/>
      <path d="M-198,-10 C-142,-23 -90,-26 -40,-20"/>
      <path d="M30,-34 C80,-42 150,-40 215,-26"/>
      <path d="M35,-27 C85,-34 148,-32 208,-18"/>
    </g>
  </g>

  <!-- The one that got out -->
  <g transform="translate(600,470) scale(1.5)">
    <g class="rise"><use href="#bfly"/></g>
  </g>

  <!-- A little light off the pages -->
  <ellipse class="glow" cx="600" cy="540" rx="240" ry="46" fill="#f2e0c0" opacity="0.1"/>

  <style>
    .wing { transform-box: fill-box; }
    .wL { transform-origin: right center; animation: flap 0.5s ease-in-out infinite alternate; }
    .wR { transform-origin: left center; animation: flap 0.5s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(0.16); } }

    .rise { animation: rise 26s ease-in-out infinite; }
    @keyframes rise {
      0% { transform: translate(0,40px) rotate(0deg); opacity: 0; }
      8% { opacity: 1; }
      35% { transform: translate(60px,-90px) rotate(8deg); }
      65% { transform: translate(-40px,-190px) rotate(-8deg); }
      92% { opacity: 1; }
      100% { transform: translate(150px,-290px) rotate(6deg); opacity: 0; }
    }

    .tw1 { opacity: 0.9; animation: twinkle 4.4s ease-in-out infinite alternate; }
    .tw2 { opacity: 0.6; animation: twinkle 5.8s ease-in-out infinite alternate; animation-delay: -2s; }
    .tw3 { opacity: 0.75; animation: twinkle 7s ease-in-out infinite alternate; animation-delay: -4s; }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 0.95; } }

    .glow { animation: breathe 9s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: 0.06; } to { opacity: 0.16; } }

    @media (prefers-reduced-motion: reduce) { .wL, .wR, .rise, .tw1, .tw2, .tw3, .glow { animation: none; } }
  </style>
</svg>
