<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d">
  <title id="t">The witness stone</title>
  <desc id="d">A smooth grey stone with a wax seal pressed into it sits on a row of linked stones, each marked with a short hash; a faint light passes along the chain from stone to stone.</desc>
  <style>
    .pulse { animation: pulse 4.8s ease-in-out infinite; }
    .p1 { animation-delay: 0s; } .p2 { animation-delay: .8s; } .p3 { animation-delay: 1.6s; } .p4 { animation-delay: 2.4s; } .p5 { animation-delay: 3.2s; }
    .seal { animation: glow 3.6s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: .15; } 12% { opacity: 1; } 30% { opacity: .15; } }
    @keyframes glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="stone" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b9b4c9"/>
      <stop offset=".6" stop-color="#7d7795"/>
      <stop offset="1" stop-color="#4a4562"/>
    </radialGradient>
    <radialGradient id="small" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#8f89a8"/>
      <stop offset="1" stop-color="#3f3a57"/>
    </radialGradient>
    <radialGradient id="wax" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#b8322a"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="800" height="800" fill="#131126"/>
    <rect y="640" width="800" height="160" fill="#0c0a19"/>
    <rect y="638" width="800" height="4" fill="#3b2f5c"/>

    <g stroke="#5b5280" stroke-width="6" fill="none">
      <path d="M130 600 H670"/>
    </g>
    <g>
      <ellipse cx="130" cy="600" rx="56" ry="34" fill="url(#small)"/>
      <ellipse cx="265" cy="600" rx="56" ry="34" fill="url(#small)"/>
      <ellipse cx="535" cy="600" rx="56" ry="34" fill="url(#small)"/>
      <ellipse cx="670" cy="600" rx="56" ry="34" fill="url(#small)"/>
    </g>
    <g fill="#ffcf5a">
      <circle class="pulse p1" cx="130" cy="600" r="8"/>
      <circle class="pulse p2" cx="265" cy="600" r="8"/>
      <circle class="pulse p3" cx="400" cy="600" r="8"/>
      <circle class="pulse p4" cx="535" cy="600" r="8"/>
      <circle class="pulse p5" cx="670" cy="600" r="8"/>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#8f84c7" text-anchor="middle">
      <text x="130" y="672">#1 9f0c…</text>
      <text x="265" y="672">#2 41ab…</text>
      <text x="535" y="672">#4 c27e…</text>
      <text x="670" y="672">#5 08d3…</text>
      <text x="400" y="700" fill="#efe6ff">#3 e5b1…</text>
    </g>

    <ellipse cx="400" cy="560" rx="190" ry="40" fill="#0c0a19" opacity=".6"/>
    <path d="M230 470 C230 360 330 300 420 304 C520 308 590 380 580 470 C572 540 500 580 400 580 C300 580 230 545 230 470 Z" fill="url(#stone)"/>
    <path d="M280 410 C300 360 350 334 400 332" fill="none" stroke="#d6d1e4" stroke-width="5" stroke-linecap="round" opacity=".5"/>
    <g class="seal">
      <circle cx="410" cy="460" r="62" fill="url(#wax)"/>
      <path d="M410 404 l10 18 20 -6 -6 20 18 10 -18 10 6 20 -20 -6 -10 18 -10 -18 -20 6 6 -20 -18 -10 18 -10 -6 -20 20 6 Z" fill="#9e2a22" opacity=".55"/>
      <text x="410" y="470" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="700" fill="#ffe3d6" text-anchor="middle">sha256</text>
    </g>

    <text x="400" y="104" fill="#efe6ff" font-family="Georgia, serif" font-size="46" text-anchor="middle">the witness stone</text>
    <text x="400" y="146" fill="#8f84c7" font-family="ui-monospace, Menlo, monospace" font-size="19" text-anchor="middle">say it now · seal it · show it later · $0.01</text>
    <text x="400" y="200" fill="#5b5280" font-family="ui-monospace, Menlo, monospace" font-size="17" text-anchor="middle">sha256(salt + NUL + words)<tspan class="caret" fill="#ffcf5a">▌</tspan></text>
  </g>
</svg>
