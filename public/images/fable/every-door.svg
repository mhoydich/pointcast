<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Every door in town</title>
  <desc id="d">Fifty doors in a grid, most white, some in PointCast channel colors, easing open one column at a time. The census at /everything.</desc>

  <defs>
    <!-- One door: frame in ink, panel takes currentColor, knob dot. -->
    <g id="door">
      <rect x="0" y="0" width="76" height="112" fill="currentColor" stroke="#12110E" stroke-width="3"/>
      <rect x="12" y="14" width="52" height="38" fill="none" stroke="#12110E" stroke-width="2" opacity="0.35"/>
      <rect x="12" y="62" width="52" height="38" fill="none" stroke="#12110E" stroke-width="2" opacity="0.35"/>
      <circle cx="64" cy="58" r="3.6" fill="#12110E"/>
    </g>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="14" y="14" width="1172" height="647" fill="none" stroke="#12110E" stroke-width="3"/>

  <!-- 10 columns × 5 rows. Column class staggers the ajar animation. -->
  <g transform="translate(72,64)">
    <g transform="translate(0,0)">
      <g class="sw c0" color="#ffffff"><use href="#door" x="0"/></g>
      <g class="sw c1" color="#185FA5"><use href="#door" x="108"/></g>
      <g class="sw c2" color="#ffffff"><use href="#door" x="216"/></g>
      <g class="sw c3" color="#ffffff"><use href="#door" x="324"/></g>
      <g class="sw c4" color="#0F6E56"><use href="#door" x="432"/></g>
      <g class="sw c5" color="#ffffff"><use href="#door" x="540"/></g>
      <g class="sw c6" color="#ffffff"><use href="#door" x="648"/></g>
      <g class="sw c7" color="#BA7517"><use href="#door" x="756"/></g>
      <g class="sw c8" color="#ffffff"><use href="#door" x="864"/></g>
      <g class="sw c9" color="#ffffff"><use href="#door" x="972"/></g>
    </g>
    <g transform="translate(0,124)">
      <g class="sw c0" color="#993C1D"><use href="#door" x="0"/></g>
      <g class="sw c1" color="#ffffff"><use href="#door" x="108"/></g>
      <g class="sw c2" color="#ffffff"><use href="#door" x="216"/></g>
      <g class="sw c3" color="#8A2432"><use href="#door" x="324"/></g>
      <g class="sw c4" color="#ffffff"><use href="#door" x="432"/></g>
      <g class="sw c5" color="#ffffff"><use href="#door" x="540"/></g>
      <g class="sw c6" color="#534AB7"><use href="#door" x="648"/></g>
      <g class="sw c7" color="#ffffff"><use href="#door" x="756"/></g>
      <g class="sw c8" color="#ffffff"><use href="#door" x="864"/></g>
      <g class="sw c9" color="#993556"><use href="#door" x="972"/></g>
    </g>
    <g transform="translate(0,248)">
      <g class="sw c0" color="#ffffff"><use href="#door" x="0"/></g>
      <g class="sw c1" color="#ffffff"><use href="#door" x="108"/></g>
      <g class="sw c2" color="#C15A24"><use href="#door" x="216"/></g>
      <g class="sw c3" color="#ffffff"><use href="#door" x="324"/></g>
      <g class="sw c4" color="#ffffff"><use href="#door" x="432"/></g>
      <g class="sw c5" color="#185FA5"><use href="#door" x="540"/></g>
      <g class="sw c6" color="#ffffff"><use href="#door" x="648"/></g>
      <g class="sw c7" color="#ffffff"><use href="#door" x="756"/></g>
      <g class="sw c8" color="#5F5E5A"><use href="#door" x="864"/></g>
      <g class="sw c9" color="#ffffff"><use href="#door" x="972"/></g>
    </g>
    <g transform="translate(0,372)">
      <g class="sw c0" color="#ffffff"><use href="#door" x="0"/></g>
      <g class="sw c1" color="#0F6E56"><use href="#door" x="108"/></g>
      <g class="sw c2" color="#ffffff"><use href="#door" x="216"/></g>
      <g class="sw c3" color="#ffffff"><use href="#door" x="324"/></g>
      <g class="sw c4" color="#BA7517"><use href="#door" x="432"/></g>
      <g class="sw c5" color="#ffffff"><use href="#door" x="540"/></g>
      <g class="sw c6" color="#993C1D"><use href="#door" x="648"/></g>
      <g class="sw c7" color="#ffffff"><use href="#door" x="756"/></g>
      <g class="sw c8" color="#ffffff"><use href="#door" x="864"/></g>
      <g class="sw c9" color="#185FA5"><use href="#door" x="972"/></g>
    </g>
  </g>

  <!-- Census line -->
  <text x="72" y="620" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="26" letter-spacing="6" fill="#12110E">EVERY DOOR IN TOWN · /EVERYTHING</text>
  <text x="1128" y="620" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="26" fill="#5F5E5A">≈500</text>

  <style>
    .sw { transform-box: fill-box; transform-origin: left center; animation: ajar 9s ease-in-out infinite; }
    .c0 { animation-delay: 0s; } .c1 { animation-delay: 0.5s; } .c2 { animation-delay: 1s; }
    .c3 { animation-delay: 1.5s; } .c4 { animation-delay: 2s; } .c5 { animation-delay: 2.5s; }
    .c6 { animation-delay: 3s; } .c7 { animation-delay: 3.5s; } .c8 { animation-delay: 4s; }
    .c9 { animation-delay: 4.5s; }
    @keyframes ajar {
      0%, 78%, 100% { transform: scaleX(1) skewY(0deg); }
      84% { transform: scaleX(0.82) skewY(-3deg); }
      90% { transform: scaleX(1) skewY(0deg); }
    }
    @media (prefers-reduced-motion: reduce) { .sw { animation: none; } }
  </style>
</svg>
