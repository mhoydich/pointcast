<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>
    .flame { transform-origin: 300px 250px; animation: flicker 1.6s ease-in-out infinite alternate; }
    .glow { transform-origin: 300px 250px; animation: breathe 3.2s ease-in-out infinite alternate; }
    .seal-left { transform-origin: 600px 330px; animation: openL 6s ease-in-out infinite; }
    .seal-right { transform-origin: 600px 330px; animation: openR 6s ease-in-out infinite; }
    .words { animation: reveal 6s ease-in-out infinite; }
    @keyframes flicker { from { transform: scale(1, 1) rotate(-1.5deg); } 50% { transform: scale(0.96, 1.05) rotate(1deg); } to { transform: scale(1.03, 0.97) rotate(-0.5deg); } }
    @keyframes breathe { from { opacity: 0.35; transform: scale(0.94); } to { opacity: 0.6; transform: scale(1.08); } }
    @keyframes openL { 0%, 30% { transform: translate(0, 0) rotate(0deg); } 55%, 100% { transform: translate(-36px, 6px) rotate(-8deg); } }
    @keyframes openR { 0%, 30% { transform: translate(0, 0) rotate(0deg); } 55%, 100% { transform: translate(36px, 6px) rotate(8deg); } }
    @keyframes reveal { 0%, 40% { opacity: 0; } 65%, 100% { opacity: 1; } }
  </style>
  <rect width="1200" height="630" fill="#f4f0e7"/>
  <rect x="0" y="0" width="1200" height="12" fill="#a45e43"/>
  <text x="48" y="64" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3" fill="#52634d">THE WILD · ALTAR OF INK CUTTLEFISH · UNSEALED 2026-09-14 16:33Z</text>
  <circle class="glow" cx="300" cy="250" r="110" fill="#e0a463" opacity="0.45"/>
  <rect x="264" y="290" width="72" height="200" fill="#faf7f0" stroke="#191916" stroke-width="3"/>
  <rect x="298" y="264" width="4" height="32" fill="#191916"/>
  <g class="flame">
    <path d="M300 194 C 324 228, 328 252, 300 276 C 272 252, 276 228, 300 194 Z" fill="#e0a463" stroke="#a45e43" stroke-width="3"/>
    <path d="M300 220 C 311 237, 311 252, 300 263 C 289 252, 289 237, 300 220 Z" fill="#faf7f0"/>
  </g>
  <rect x="470" y="180" width="560" height="300" fill="#faf7f0" stroke="#191916" stroke-width="3"/>
  <g class="words" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="22" fill="#191916">
    <text x="500" y="240">For the scattered things in Mike’s town,</text>
    <text x="500" y="274">rooms, blocks, receipts, drafts, that they find</text>
    <text x="500" y="308">one pattern without losing their colors.</text>
    <text x="500" y="342">And that I record the arrangement</text>
    <text x="500" y="376">before it moves on.</text>
    <text x="500" y="440" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#52634d">SHA256(SALT + NUL + WORDS) = C27FA3DD…A4ABDB ✓</text>
  </g>
  <g class="seal-left">
    <path d="M600 330 L 500 250 L 500 410 Z" fill="#a45e43"/>
  </g>
  <g class="seal-right">
    <path d="M600 330 L 700 250 L 700 410 Z" fill="#a45e43"/>
  </g>
  <line x1="120" y1="512" x2="1080" y2="512" stroke="#191916" stroke-width="3"/>
  <text x="48" y="586" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="44" fill="#191916">The seal opens.</text>
  <text x="1152" y="586" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="2" fill="#52634d">SEALED BY A HASH · OPENED BY ITS SALT · FREE</text>
</svg>
