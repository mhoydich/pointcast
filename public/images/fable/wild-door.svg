<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>
    .glow { transform-origin: 300px 300px; animation: breathe 4s ease-in-out infinite alternate; }
    .flame { transform-origin: 300px 300px; animation: flicker 1.7s ease-in-out infinite alternate; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .seal { animation: stamp 5s ease-in-out infinite; transform-origin: 830px 405px; }
    @keyframes breathe { from { opacity: .3; transform: scale(.94); } to { opacity: .55; transform: scale(1.08); } }
    @keyframes flicker { from { transform: scale(1,1) rotate(-1.5deg); } 50% { transform: scale(.96,1.05) rotate(1deg); } to { transform: scale(1.03,.97) rotate(-.5deg); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes stamp { 0%, 45% { opacity: 0; transform: scale(1.5) rotate(-8deg); } 60%, 100% { opacity: 1; transform: scale(1) rotate(-8deg); } }
  </style>
  <rect width="1200" height="630" fill="#f4f0e7"/>
  <rect x="0" y="0" width="1200" height="12" fill="#a45e43"/>
  <text x="48" y="64" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3" fill="#52634d">THE WILD · A DOOR FOR PEOPLE · ONE CENT</text>
  <circle class="glow" cx="300" cy="300" r="120" fill="#e0a463" opacity="0.45"/>
  <rect x="264" y="336" width="72" height="196" fill="#faf7f0" stroke="#191916" stroke-width="3"/>
  <rect x="298" y="310" width="4" height="30" fill="#191916"/>
  <g class="flame">
    <path d="M300 240 C 324 274, 328 298, 300 322 C 272 298, 276 274, 300 240 Z" fill="#e0a463" stroke="#a45e43" stroke-width="3"/>
    <path d="M300 266 C 311 283, 311 298, 300 309 C 289 298, 289 283, 300 266 Z" fill="#faf7f0"/>
  </g>
  <rect x="470" y="150" width="660" height="330" fill="#faf7f0" stroke="#191916" stroke-width="3"/>
  <text x="500" y="196" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2" fill="#52634d">WRITE IT HERE. IT IS SEALED BEFORE ANYTHING LEAVES THE PAGE.</text>
  <line x1="500" y1="220" x2="1100" y2="220" stroke="#d7d0c2" stroke-width="2"/>
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="30" fill="#191916">
    <text x="500" y="272">For the thing I have not said</text>
    <text x="500" y="318">out loud yet<tspan class="cursor" font-family="ui-monospace, Menlo, monospace">▌</tspan></text>
  </g>
  <g class="seal">
    <rect x="700" y="372" width="260" height="66" fill="none" stroke="#a45e43" stroke-width="3"/>
    <text x="830" y="415" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="19" letter-spacing="3" fill="#a45e43">SEALED ON DEVICE</text>
  </g>
  <text x="500" y="462" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1" fill="#52634d">ONLY A HASH LEAVES · YOU KEEP THE KEY · $0.01 USDC ON BASE</text>
  <line x1="120" y1="546" x2="1080" y2="546" stroke="#191916" stroke-width="3"/>
  <text x="48" y="600" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="40" fill="#191916">A door for people.</text>
  <text x="1152" y="600" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2" fill="#52634d">24 ALTARS · ONE PRAYER EACH PER DAY</text>
</svg>
