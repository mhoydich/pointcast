<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe6ec"/>
      <stop offset="0.62" stop-color="#eadfcb"/>
      <stop offset="1" stop-color="#c46a2f"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="630"/></clipPath>
    <style>
      .core { transform-origin: 600px 312px; animation: breathe 14s cubic-bezier(.45,0,.35,1) infinite; }
      .orbit { transform-origin: 600px 312px; animation: spin 60s linear infinite; }
      .sun { animation: sink 40s ease-in-out infinite alternate; }
      .swell { animation: swell 9s ease-in-out infinite alternate; }
      @keyframes breathe { 0% { transform: scale(1); } 28.5% { transform: scale(1.42); } 43% { transform: scale(1.42); } 86% { transform: scale(1); } 100% { transform: scale(1); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes sink { from { transform: translateY(0); } to { transform: translateY(26px); } }
      @keyframes swell { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="url(#sky)"/>
    <circle class="sun" cx="960" cy="468" r="54" fill="#f2b56b" stroke="#14201b" stroke-width="2"/>
    <rect x="0" y="500" width="1200" height="130" fill="#3b5b8f"/>
    <rect class="swell" x="0" y="494" width="1200" height="14" fill="#7d9bc7" opacity="0.7"/>
    <rect x="0" y="536" width="1200" height="2" fill="#2a3a5c" opacity="0.5"/>
    <rect x="0" y="566" width="1200" height="2" fill="#2a3a5c" opacity="0.35"/>
    <rect x="0" y="596" width="1200" height="2" fill="#2a3a5c" opacity="0.25"/>

    <g fill="none" stroke="#14201b">
      <circle cx="600" cy="312" r="214" stroke-opacity="0.18" stroke-width="2"/>
      <circle cx="600" cy="312" r="152" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 12"/>
    </g>
    <circle class="core" cx="600" cy="312" r="106" fill="#0f6e56" stroke="#14201b" stroke-width="3"/>
    <g class="orbit"><circle cx="600" cy="98" r="9" fill="#14201b"/></g>

    <g font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill="#14201b">
      <text x="48" y="50" font-size="18" letter-spacing="2">THURSDAY SITTING · CH.GDN · BLOCK 0614</text>
      <text x="48" y="78" font-size="18" letter-spacing="2" fill="#0f6e56">SEPTEMBER 24, 2026 · THE FIRST THURSDAY OF AUTUMN</text>
      <text x="48" y="590" font-size="18" letter-spacing="2" fill="#eef0e8">SUN UP 6:43 · DOWN 6:47 · ONE BELL IN · ONE BELL OUT</text>
    </g>
    <g font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" fill="#14201b">
      <text x="48" y="470" font-size="72" letter-spacing="-3">The Still Hour.</text>
    </g>
    <text x="1152" y="590" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#eef0e8">POINTCAST.XYZ/STILL-HOUR</text>
  </g>
</svg>
