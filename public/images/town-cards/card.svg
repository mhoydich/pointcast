<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A PointCast town card hands a one-time code to three sites. Each site gets a different id for the same person.">
  <style>
    .code { animation: tc-run 6s linear infinite; }
    .c2 { animation-delay: 2s } .c3 { animation-delay: 4s }
    @keyframes tc-run { 0% { opacity: 0; offset-distance: 0% } 4% { opacity: 1 } 26% { opacity: 1; offset-distance: 100% } 30%, 100% { opacity: 0; offset-distance: 100% } }
    .id { animation: tc-id 6s ease-out infinite; }
    .i2 { animation-delay: 2s } .i3 { animation-delay: 4s }
    @keyframes tc-id { 0%, 24% { opacity: .15 } 30%, 88% { opacity: 1 } 100% { opacity: .15 } }
    .check { animation: tc-check 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes tc-check { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.12) } }
  </style>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <text x="60" y="78" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="3" fill="#185fa5">POINTCAST · TOWN CARDS · CONNECT</text>
  <text x="60" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="800" fill="#14181c">Sign in with PointCast.</text>
  <text x="60" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#5b6670">Your card goes with you. Nothing follows you home.</text>

  <!-- the town card -->
  <g transform="translate(60 250)">
    <rect width="400" height="300" fill="#ffffff" stroke="#d5dde4" stroke-width="2"/>
    <rect width="14" height="300" fill="#185fa5"/>
    <rect x="44" y="40" width="112" height="112" fill="#e3f1f8"/>
    <rect x="66" y="70" width="68" height="72" fill="#e0a100"/>
    <rect x="56" y="82" width="38" height="24" fill="#c0262d"/><rect x="104" y="82" width="38" height="24" fill="#c0262d"/>
    <rect x="94" y="90" width="10" height="6" fill="#c0262d"/>
    <rect x="62" y="86" width="12" height="16" fill="#ffffff"/><rect x="74" y="86" width="12" height="16" fill="#14181c"/>
    <rect x="110" y="86" width="12" height="16" fill="#ffffff"/><rect x="122" y="86" width="12" height="16" fill="#14181c"/>
    <text x="180" y="86" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#14181c">Your Name</text>
    <g class="check"><circle cx="360" cy="76" r="17" fill="#185fa5"/><path d="M351 76 l6 7 l12 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="180" y="122" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#5b6670">@yourname</text>
    <rect x="44" y="186" width="312" height="12" fill="#e6ecf0"/>
    <rect x="44" y="210" width="250" height="12" fill="#e6ecf0"/>
    <text x="44" y="264" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#185fa5">♫ one song · El Segundo</text>
  </g>

  <!-- the paths the one-time codes travel -->
  <path id="p1" d="M460 330 C 600 330, 640 250, 760 250" fill="none" stroke="#b9c7d2" stroke-width="3" stroke-dasharray="8 10"/>
  <path id="p2" d="M460 400 C 600 400, 640 400, 760 400" fill="none" stroke="#b9c7d2" stroke-width="3" stroke-dasharray="8 10"/>
  <path id="p3" d="M460 470 C 600 470, 640 550, 760 550" fill="none" stroke="#b9c7d2" stroke-width="3" stroke-dasharray="8 10"/>
  <circle class="code" r="10" fill="#e0a100" style="offset-path: path('M460 330 C 600 330, 640 250, 760 250')" opacity="0"/>
  <circle class="code c2" r="10" fill="#e0a100" style="offset-path: path('M460 400 C 600 400, 640 400, 760 400')" opacity="0"/>
  <circle class="code c3" r="10" fill="#e0a100" style="offset-path: path('M460 470 C 600 470, 640 550, 760 550')" opacity="0"/>

  <!-- three sites, three different ids -->
  <g font-family="ui-monospace, Menlo, monospace">
    <g transform="translate(760 206)">
      <rect width="380" height="88" fill="#ffffff" stroke="#14181c" stroke-width="2"/>
      <rect width="380" height="26" fill="#14181c"/>
      <text x="14" y="19" font-size="15" fill="#ffffff">tonebloom.xyz</text>
      <text class="id" x="14" y="66" font-size="24" fill="#185fa5">sub pc_7Kq2…vN</text>
    </g>
    <g transform="translate(760 356)">
      <rect width="380" height="88" fill="#ffffff" stroke="#14181c" stroke-width="2"/>
      <rect width="380" height="26" fill="#14181c"/>
      <text x="14" y="19" font-size="15" fill="#ffffff">industrynext.xyz</text>
      <text class="id i2" x="14" y="66" font-size="24" fill="#2f8f4e">sub pc_Xa9d…3p</text>
    </g>
    <g transform="translate(760 506)">
      <rect width="380" height="88" fill="#ffffff" stroke="#14181c" stroke-width="2"/>
      <rect width="380" height="26" fill="#14181c"/>
      <text x="14" y="19" font-size="15" fill="#ffffff">your.site</text>
      <text class="id i3" x="14" y="66" font-size="24" fill="#c0262d">sub pc_m4Tw…Qe</text>
    </g>
  </g>
</svg>
