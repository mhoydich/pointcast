<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Doubles coverage can coordinate at different depths</title>
<desc id="desc">A top-down court shows player A deeper after a drop and player B closer to the kitchen line. A dashed possible drop path reaches a broad opposing kitchen target. Both players have short arrows labelled read then move. An opponent's next contact has a question mark. Overlapping dashed coverage bands indicate coordination to discuss, not measured positions or guaranteed trajectories.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#d6f64c"/></marker></defs>
<rect width="1200" height="800" fill="#074b35"/>
<g font-family="Arial,sans-serif" fill="#ffffff"><text x="45" y="53" fill="#d6f64c" font-size="16" letter-spacing="3" font-weight="700">POINTCAST / READ THE DEVELOPING BALL</text><text x="43" y="120" font-size="52" font-weight="800" letter-spacing="-1.5">Different depths. Shared coverage.</text><text x="46" y="164" font-size="22">Coordinate the next reply before choosing the next step.</text></g>
<g transform="translate(45 202)"><rect width="680" height="465" fill="#164cca"/><rect x="30" y="25" width="620" height="415" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M30 169h620M30 296h620M340 25v144M340 296v144" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M14 232h652" stroke="#ffffff" stroke-width="6"/><g font-family="Arial,sans-serif" fill="#ffffff" font-size="15"><text x="43" y="204">KITCHEN</text><text x="43" y="266">KITCHEN</text><text x="585" y="223">NET</text><text x="508" y="421">YOUR END ↑</text></g><rect x="130" y="177" width="210" height="42" rx="12" fill="#d6f64c" fill-opacity=".15" stroke="#d6f64c" stroke-width="2" stroke-dasharray="7 6"/><circle cx="258" cy="136" r="23" fill="none" stroke="#ffffff" stroke-width="3"/><text x="258" y="144" fill="#d6f64c" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">?</text><circle cx="510" cy="82" r="23" fill="none" stroke="#ffffff" stroke-width="3"/>
<rect x="47" y="352" width="365" height="65" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="2" stroke-dasharray="9 6"/><rect x="258" y="302" width="367" height="66" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="2" stroke-dasharray="9 6"/>
<path d="M221 376Q185 286 253 199" fill="none" stroke="#d6f64c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><circle cx="219" cy="384" r="28" fill="#074b35" stroke="#ffffff" stroke-width="3"/><circle cx="480" cy="326" r="28" fill="#074b35" stroke="#ffffff" stroke-width="3"/><g font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#ffffff" text-anchor="middle"><text x="219" y="393">A</text><text x="480" y="335">B</text></g><path d="M260 385v-37M522 324v-32" stroke="#d6f64c" stroke-width="3" marker-end="url(#arrow)"/><g font-family="Arial,sans-serif" fill="#ffffff" font-size="13"><text x="291" y="396">READ</text><text x="555" y="342">READ</text></g></g>
<g font-family="Arial,sans-serif" fill="#ffffff"><g transform="translate(778 224)"><text x="0" y="23" fill="#d6f64c" font-size="14" letter-spacing="2">A / DEEPER HITTER</text><text x="0" y="66" font-size="26" font-weight="700">A drop is an invitation.</text><text x="0" y="103" font-size="18">Its quality and the next contact</text><text x="0" y="131" font-size="18">inform whether to advance.</text></g><g transform="translate(778 400)"><text x="0" y="23" fill="#d6f64c" font-size="14" letter-spacing="2">B / ADVANCED PARTNER</text><text x="0" y="66" font-size="26" font-weight="700">Stay in the next play.</text><text x="0" y="103" font-size="18">Read the opponent and protect</text><text x="0" y="131" font-size="18">the space the reply can reach.</text></g><text x="780" y="607" fill="#d6f64c" font-size="19" font-weight="700">READ → THEN MOVE</text><text x="45" y="714" font-size="16">Dashed lime = possible ball path. Dashed white = coverage to discuss. Question mark = next contact.</text><text x="45" y="746" font-size="16">A and B are neutral roles. Schematics do not prescribe exact positions or guarantee a successful shot.</text><text x="45" y="782" font-size="12" fill="#d6f64c" letter-spacing="2">ORIGINAL POINTCAST INSTRUCTIONAL DRAWING / OCTOBER 2026</text></g>
</svg>
