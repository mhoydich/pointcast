<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Doubles practice: record the decision separately from the result</title>
<desc id="desc">The first row asks four questions: balanced, controllable contact, useful target, and next position. Two labelled options follow: consider a controlled attack when the situation fits, or consider a reset when simplifying helps. A separate second row records intention, landing spot, and readiness for the reply. No branch guarantees a point or assigns numeric success odds.</desc>
<rect width="1200" height="700" fill="#074b35"/>
<g font-family="Arial,sans-serif" fill="#ffffff"><text x="45" y="53" fill="#d6f64c" font-size="16" letter-spacing="3" font-weight="700">POINTCAST / CHOICE AND RESULT ARE SEPARATE</text><text x="43" y="121" font-size="52" font-weight="800" letter-spacing="-1.5">What did you choose? What happened?</text><text x="46" y="160" font-size="22">A lucky point is an outcome. A repeatable choice needs another test.</text></g>
<g font-family="Arial,sans-serif" fill="#ffffff"><text x="45" y="212" fill="#d6f64c" font-size="15" letter-spacing="2">1 / READ THE CONTACT</text><g transform="translate(45 236)"><rect width="260" height="102" fill="#164cca"/><text x="20" y="42" font-size="28" font-weight="700">Balanced?</text><text x="20" y="76" font-size="17">Can you organize the shot?</text></g><g transform="translate(330 236)"><rect width="260" height="102" fill="#164cca"/><text x="20" y="42" font-size="26" font-weight="700">Controllable?</text><text x="20" y="76" font-size="17">Can you meet this ball?</text></g><g transform="translate(615 236)"><rect width="260" height="102" fill="#164cca"/><text x="20" y="42" font-size="26" font-weight="700">Useful target?</text><text x="20" y="76" font-size="17">Where is the margin?</text></g><g transform="translate(900 236)"><rect width="260" height="102" fill="#164cca"/><text x="20" y="42" font-size="26" font-weight="700">Next position?</text><text x="20" y="76" font-size="17">Who covers the reply?</text></g>
<g transform="translate(45 360)"><rect width="535" height="83" fill="none" stroke="#d6f64c" stroke-width="2"/><text x="20" y="33" fill="#d6f64c" font-size="21" font-weight="700">OPTION / Consider a controlled attack</text><text x="20" y="63" font-size="18">When balance, contact, target, and recovery fit.</text></g><g transform="translate(625 360)"><rect width="535" height="83" fill="none" stroke="#d6f64c" stroke-width="2"/><text x="20" y="33" fill="#d6f64c" font-size="21" font-weight="700">OPTION / Consider a reset</text><text x="20" y="63" font-size="18">When a simpler reply gives you room to recover.</text></g>
<text x="45" y="491" fill="#d6f64c" font-size="15" letter-spacing="2">2 / RECORD WHAT HAPPENED</text><g transform="translate(45 515)"><rect width="347" height="91" fill="#ffffff"/><text x="20" y="38" fill="#074b35" font-size="27" font-weight="700">Intention</text><text x="20" y="70" fill="#074b35" font-size="18">Attack or reset?</text></g><g transform="translate(428 515)"><rect width="347" height="91" fill="#ffffff"/><text x="20" y="38" fill="#074b35" font-size="27" font-weight="700">Landing spot</text><text x="20" y="70" fill="#074b35" font-size="18">Where did the reply go?</text></g><g transform="translate(813 515)"><rect width="347" height="91" fill="#ffffff"/><text x="20" y="38" fill="#074b35" font-size="27" font-weight="700">Ready for the reply</text><text x="20" y="70" fill="#074b35" font-size="18">Could both partners play again?</text></g><text x="45" y="650" font-size="16">Questions guide options. They are not a scoring formula or a guarantee that either shot will succeed.</text><text x="45" y="683" fill="#d6f64c" font-size="12" letter-spacing="2">ORIGINAL POINTCAST INSTRUCTIONAL DRAWING / OCTOBER 2026</text></g>
</svg>
