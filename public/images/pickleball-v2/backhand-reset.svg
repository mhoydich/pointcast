<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Backhand reset: soften the reply, then read before advancing</title>
<desc id="desc">A top-down court shows an abstract player A in the transition area. A dashed lime possible reset path leads toward a broad target in the opposing kitchen. A separate dashed white movement cue leads to an optional next ready position outside the player's kitchen. Read the reply before advancing. Both feet must be fully outside the kitchen before a volley after entering it. Paths and positions are coaching examples, not guaranteed trajectories.</desc>
<defs><marker id="ballArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#d6f64c"/></marker><marker id="moveArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#ffffff"/></marker></defs>
<rect width="1200" height="800" fill="#074b35"/>
<g font-family="Arial,sans-serif" fill="#ffffff"><text x="45" y="53" fill="#d6f64c" font-size="16" letter-spacing="3" font-weight="700">POINTCAST / A RESET IS A CHOICE</text><text x="43" y="120" font-size="53" font-weight="800" letter-spacing="-1.5">Soften the ball. Read the reply.</text><text x="46" y="164" font-size="22">The next contact decides what movement is available.</text></g>
<g transform="translate(45 202)"><rect width="680" height="465" fill="#164cca"/><rect x="30" y="25" width="620" height="415" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M30 169h620M30 296h620M340 25v144M340 296v144" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M14 232h652" stroke="#ffffff" stroke-width="6"/><g font-family="Arial,sans-serif" fill="#ffffff" font-size="15"><text x="43" y="204">KITCHEN</text><text x="43" y="266">KITCHEN</text><text x="585" y="223">NET</text><text x="501" y="422">YOUR END ↑</text></g><rect x="176" y="178" width="246" height="42" rx="12" fill="#d6f64c" fill-opacity=".2" stroke="#d6f64c" stroke-width="2" stroke-dasharray="8 6"/><text x="299" y="205" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13">BROAD TARGET</text><circle cx="250" cy="106" r="23" fill="none" stroke="#ffffff" stroke-width="3"/><circle cx="512" cy="79" r="23" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M220 374Q153 294 282 199" fill="none" stroke="#d6f64c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ballArrow)"/><circle cx="219" cy="390" r="28" fill="#074b35" stroke="#ffffff" stroke-width="3"/><text x="219" y="399" fill="#ffffff" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">A</text><path d="M258 390Q330 381 389 330" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 7" marker-end="url(#moveArrow)"/><circle cx="417" cy="323" r="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 4"/><g font-family="Arial,sans-serif" fill="#ffffff" font-size="13"><text x="287" y="416">CONDITIONAL MOVE</text><text x="450" y="330">NEXT READY</text></g></g>
<g font-family="Arial,sans-serif" fill="#ffffff"><g transform="translate(780 224)"><text x="0" y="23" fill="#d6f64c" font-size="14" letter-spacing="2">1 / MAKE THE REPLY MANAGEABLE</text><text x="0" y="67" font-size="27" font-weight="700">Use a generous target.</text><text x="0" y="104" font-size="18">Start with a feed you can control.</text><text x="0" y="132" font-size="18">The reset may still miss.</text></g><g transform="translate(780 400)"><text x="0" y="23" fill="#d6f64c" font-size="14" letter-spacing="2">2 / READ BEFORE THE NEXT STEP</text><text x="0" y="67" font-size="27" font-weight="700">Advance if the reply allows.</text><text x="0" y="104" font-size="18">After kitchen entry, establish both</text><text x="0" y="132" font-size="18">feet fully outside before volleying.</text></g><text x="780" y="617" fill="#d6f64c" font-size="16">Rule check: USA Pickleball 11.A.3</text><text x="45" y="713" font-size="16">Dashed lime = possible soft reply. Dashed white = conditional movement. A = neutral player marker.</text><text x="45" y="745" font-size="16">Top-down coaching schematic. These paths and positions do not guarantee a legal or successful shot.</text><text x="45" y="781" font-size="12" fill="#d6f64c" letter-spacing="2">ORIGINAL POINTCAST INSTRUCTIONAL DRAWING / OCTOBER 2026</text></g>
</svg>
