<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">One-handed and two-handed backhands: compare the same feeds</title>
<desc id="desc">Two equal panels show abstract paddles with one or two circular hand markers on their handles. Each has identical empty ten-dot tally rows for target hits and readiness. No option is declared the winner. The hand markers show an option to explore, not a mandatory grip.</desc>
<rect width="1200" height="700" fill="#074b35"/>
<g font-family="Arial,sans-serif" fill="#ffffff"><text x="45" y="53" fill="#d6f64c" font-size="16" letter-spacing="3" font-weight="700">POINTCAST / A FAIR COMPARISON</text><text x="43" y="121" font-size="51" font-weight="800" letter-spacing="-1.5">Same feed. Same questions.</text><text x="46" y="160" font-size="22">Where did it land? Were you ready for the next ball?</text></g>
<g transform="translate(45 203)"><rect width="535" height="373" fill="#164cca"/><g font-family="Arial,sans-serif" fill="#ffffff"><text x="25" y="42" fill="#d6f64c" font-size="15" font-weight="700" letter-spacing="2">OPTION 1</text><text x="25" y="87" font-size="32" font-weight="700">One-handed</text><text x="25" y="120" font-size="18">Ten comfortable feeds</text><text x="25" y="226" font-size="17">TARGET</text><text x="25" y="296" font-size="17">READY</text></g><g transform="translate(390 35) rotate(18)"><rect x="-42" y="0" width="84" height="110" rx="25" fill="none" stroke="#ffffff" stroke-width="5"/><rect x="-9" y="110" width="18" height="62" fill="#ffffff"/><circle cx="-3" cy="142" r="19" fill="#d6f64c" stroke="#074b35" stroke-width="3"/></g><g fill="none" stroke="#ffffff" stroke-width="2"><circle cx="50" cy="249" r="12"/><circle cx="95" cy="249" r="12"/><circle cx="140" cy="249" r="12"/><circle cx="185" cy="249" r="12"/><circle cx="230" cy="249" r="12"/><circle cx="275" cy="249" r="12"/><circle cx="320" cy="249" r="12"/><circle cx="365" cy="249" r="12"/><circle cx="410" cy="249" r="12"/><circle cx="455" cy="249" r="12"/><circle cx="50" cy="319" r="12"/><circle cx="95" cy="319" r="12"/><circle cx="140" cy="319" r="12"/><circle cx="185" cy="319" r="12"/><circle cx="230" cy="319" r="12"/><circle cx="275" cy="319" r="12"/><circle cx="320" cy="319" r="12"/><circle cx="365" cy="319" r="12"/><circle cx="410" cy="319" r="12"/><circle cx="455" cy="319" r="12"/></g></g>
<g transform="translate(620 203)"><rect width="535" height="373" fill="#164cca"/><g font-family="Arial,sans-serif" fill="#ffffff"><text x="25" y="42" fill="#d6f64c" font-size="15" font-weight="700" letter-spacing="2">OPTION 2</text><text x="25" y="87" font-size="32" font-weight="700">Two-handed</text><text x="25" y="120" font-size="18">Ten comfortable feeds</text><text x="25" y="226" font-size="17">TARGET</text><text x="25" y="296" font-size="17">READY</text></g><g transform="translate(390 35) rotate(18)"><rect x="-42" y="0" width="84" height="110" rx="25" fill="none" stroke="#ffffff" stroke-width="5"/><rect x="-9" y="110" width="18" height="62" fill="#ffffff"/><circle cx="-3" cy="152" r="19" fill="#d6f64c" stroke="#074b35" stroke-width="3"/><circle cx="3" cy="117" r="19" fill="#d6f64c" stroke="#074b35" stroke-width="3"/></g><g fill="none" stroke="#ffffff" stroke-width="2"><circle cx="50" cy="249" r="12"/><circle cx="95" cy="249" r="12"/><circle cx="140" cy="249" r="12"/><circle cx="185" cy="249" r="12"/><circle cx="230" cy="249" r="12"/><circle cx="275" cy="249" r="12"/><circle cx="320" cy="249" r="12"/><circle cx="365" cy="249" r="12"/><circle cx="410" cy="249" r="12"/><circle cx="455" cy="249" r="12"/><circle cx="50" cy="319" r="12"/><circle cx="95" cy="319" r="12"/><circle cx="140" cy="319" r="12"/><circle cx="185" cy="319" r="12"/><circle cx="230" cy="319" r="12"/><circle cx="275" cy="319" r="12"/><circle cx="320" cy="319" r="12"/><circle cx="365" cy="319" r="12"/><circle cx="410" cy="319" r="12"/><circle cx="455" cy="319" r="12"/></g></g>
<g font-family="Arial,sans-serif" fill="#ffffff"><text x="45" y="622" font-size="18">Lime circles = schematic hands. Empty circles = tally spaces, not recorded results.</text><text x="45" y="656" font-size="16">Explore an option. Keep observations specific. Hand placement does not prescribe a bevel grip.</text><text x="45" y="683" font-size="12" fill="#d6f64c" letter-spacing="2">ORIGINAL POINTCAST INSTRUCTIONAL DRAWING / OCTOBER 2026</text></g>
</svg>
