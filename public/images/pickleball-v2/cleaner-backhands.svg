<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Cleaner backhands: read, prepare, meet, recover</title>
<desc id="desc">An original four-panel coaching schematic. Read the incoming ball; prepare the paddle early; meet the ball in a comfortable contact space; recover to a ready position. Green circles represent a player without assigning a dominant hand. Lime circles represent a ball. Lime arrows show a cue or recovery direction, not a predicted ball trajectory.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#d6f64c"/></marker></defs>
<rect width="1200" height="800" fill="#074b35"/>
<text x="46" y="55" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#d6f64c">POINTCAST / THE PRACTICE FILES</text>
<text x="44" y="130" font-family="Arial,sans-serif" font-size="61" font-weight="800" letter-spacing="-2" fill="#ffffff">A calmer backhand.</text>
<text x="47" y="177" font-family="Arial,sans-serif" font-size="22" fill="#ffffff">One cue at a time. A repeatable feed before a faster rally.</text>
<g font-family="Arial,sans-serif" fill="#ffffff">
<g transform="translate(45 225)"><rect width="260" height="400" fill="#164cca"/><text x="20" y="40" font-size="15" fill="#d6f64c">01 / READ</text><path d="M209 92 Q169 105 157 159" fill="none" stroke="#d6f64c" stroke-width="4" stroke-dasharray="7 8" marker-end="url(#arrow)"/><circle cx="212" cy="87" r="12" fill="#d6f64c"/><circle cx="130" cy="220" r="30" fill="#ffffff"/><circle cx="130" cy="220" r="19" fill="#074b35"/><path d="M84 257h94" stroke="#ffffff" stroke-width="4"/><text x="20" y="328" font-size="26" font-weight="700">See the bounce.</text><text x="20" y="361" font-size="17">Give yourself time to move.</text></g>
<g transform="translate(330 225)"><rect width="260" height="400" fill="#164cca"/><text x="20" y="40" font-size="15" fill="#d6f64c">02 / PREPARE</text><circle cx="111" cy="220" r="30" fill="#ffffff"/><circle cx="111" cy="220" r="19" fill="#074b35"/><rect x="167" y="137" width="37" height="55" rx="13" fill="#ffffff" transform="rotate(20 185 165)"/><path d="m180 191-9 27" stroke="#ffffff" stroke-width="9"/><path d="M117 116 Q174 82 209 121" fill="none" stroke="#d6f64c" stroke-width="4" marker-end="url(#arrow)"/><text x="20" y="328" font-size="26" font-weight="700">Set up early.</text><text x="20" y="361" font-size="17">Turn and organize the paddle.</text></g>
<g transform="translate(615 225)"><rect width="260" height="400" fill="#164cca"/><text x="20" y="40" font-size="15" fill="#d6f64c">03 / MEET</text><circle cx="97" cy="223" r="30" fill="#ffffff"/><circle cx="97" cy="223" r="19" fill="#074b35"/><rect x="140" y="140" width="37" height="55" rx="13" fill="#ffffff"/><path d="M158 195v31" stroke="#ffffff" stroke-width="9"/><circle cx="192" cy="152" r="12" fill="#d6f64c"/><circle cx="167" cy="165" r="57" fill="none" stroke="#d6f64c" stroke-width="3" stroke-dasharray="6 8"/><text x="20" y="328" font-size="26" font-weight="700">Keep some space.</text><text x="20" y="361" font-size="17">A comfortable contact window.</text></g>
<g transform="translate(900 225)"><rect width="260" height="400" fill="#164cca"/><text x="20" y="40" font-size="15" fill="#d6f64c">04 / RECOVER</text><circle cx="108" cy="235" r="30" fill="#ffffff"/><circle cx="108" cy="235" r="19" fill="#074b35"/><circle cx="143" cy="137" r="29" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 7"/><path d="m124 204 14-32" stroke="#d6f64c" stroke-width="4" marker-end="url(#arrow)"/><text x="20" y="328" font-size="26" font-weight="700">Ready again.</text><text x="20" y="361" font-size="17">Recover balanced and ready.</text></g>
</g>
<g font-family="Arial,sans-serif" fill="#ffffff" font-size="16"><circle cx="58" cy="675" r="9" fill="#d6f64c"/><text x="80" y="681">Ball</text><circle cx="183" cy="675" r="9" fill="#ffffff"/><text x="205" y="681">Player / no dominant hand assigned</text><path d="M570 675h42" stroke="#d6f64c" stroke-width="3" marker-end="url(#arrow)"/><text x="631" y="681">Cue or movement direction</text><text x="47" y="731">Coach’s schematic, not an anatomical model or a trajectory prediction. Mirror the setup as needed.</text><text x="47" y="767" font-size="12" fill="#d6f64c" letter-spacing="2">ORIGINAL POINTCAST INSTRUCTIONAL DRAWING / OCTOBER 2026</text></g>
</svg>
