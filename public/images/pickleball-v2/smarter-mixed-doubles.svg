<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Smarter mixed doubles: read the ball and share the seam</title>
<desc id="desc">Original top-down doubles court schematic. Players A and B occupy different depths, read the next contact, and communicate about the middle, highlighted with a lime strip. Neither role is assigned by gender or dominant hand. Three coaching cues read agree on the middle, read then move, and simplify then recover. Arrows show a communication and movement cue, not a guaranteed shot path.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#d6f64c"/></marker></defs>
<rect width="1200" height="800" fill="#074b35"/>
<g font-family="Arial,sans-serif" fill="#ffffff"><text x="45" y="55" font-size="16" font-weight="700" letter-spacing="3" fill="#d6f64c">POINTCAST / THE PRACTICE FILES</text><text x="43" y="128" font-size="59" font-weight="800" letter-spacing="-2">Two players. One shared plan.</text><text x="46" y="173" font-size="22">Call the seam. Read the ball. Cover the next reply.</text></g>
<g transform="translate(45 216)"><rect width="680" height="430" fill="#164cca"/><rect x="30" y="25" width="620" height="380" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M30 156h620M30 274h620M340 25v131M340 274v131" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M14 215h652" stroke="#ffffff" stroke-width="6"/><rect x="298" y="274" width="84" height="130" fill="#d6f64c" fill-opacity=".25"/><g font-family="Arial,sans-serif" font-size="15" fill="#ffffff"><text x="42" y="193">KITCHEN</text><text x="42" y="248">KITCHEN</text><text x="585" y="207">NET</text></g><circle cx="210" cy="80" r="23" fill="none" stroke="#ffffff" stroke-width="3"/><circle cx="492" cy="80" r="23" fill="none" stroke="#ffffff" stroke-width="3"/><circle cx="228" cy="348" r="29" fill="#074b35" stroke="#ffffff" stroke-width="3"/><circle cx="485" cy="315" r="29" fill="#074b35" stroke="#ffffff" stroke-width="3"/><g font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle"><text x="228" y="356">A</text><text x="485" y="323">B</text></g><path d="M190 345h-49M447 312h-49" stroke="#d6f64c" stroke-width="4" marker-end="url(#arrow)"/><circle cx="107" cy="251" r="11" fill="#d6f64c"/><path d="M340 314v-30" stroke="#d6f64c" stroke-width="3"/><text x="340" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ffffff">SHARED SEAM</text></g>
<g font-family="Arial,sans-serif" fill="#ffffff"><g transform="translate(780 223)"><text x="0" y="24" font-size="13" fill="#d6f64c" letter-spacing="2">01 / BEFORE THE RALLY</text><text x="0" y="67" font-size="26" font-weight="700">Agree on the middle.</text><text x="0" y="101" font-size="18">Name the ball you can take.</text><text x="0" y="127" font-size="18">Your partner confirms the plan.</text></g><g transform="translate(780 381)"><text x="0" y="24" font-size="13" fill="#d6f64c" letter-spacing="2">02 / WHILE IT MOVES</text><text x="0" y="67" font-size="26" font-weight="700">Read, then move.</text><text x="0" y="101" font-size="18">Keep coverage connected.</text><text x="0" y="127" font-size="18">Roles can change with the rally.</text></g><g transform="translate(780 539)"><text x="0" y="24" font-size="13" fill="#d6f64c" letter-spacing="2">03 / WHEN STRETCHED</text><text x="0" y="67" font-size="26" font-weight="700">Simplify, then recover.</text><text x="0" y="101" font-size="18">Choose a controllable ball.</text><text x="0" y="127" font-size="18">Cover the next reply as it develops.</text></g><text x="45" y="718" font-size="16">A and B are player roles, never gender assignments. Lime arrows = possible movement after reading; shaded strip = shared seam.</text><text x="45" y="749" font-size="15">Top-down coaching schematic. No exact positions or successful trajectories are guaranteed.</text><text x="45" y="781" font-size="12" fill="#d6f64c" letter-spacing="2">ORIGINAL POINTCAST INSTRUCTIONAL DRAWING / OCTOBER 2026</text></g>
</svg>
