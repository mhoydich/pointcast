<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="velvet" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#3a1240"/>
      <stop offset="55%" stop-color="#1a0820"/>
      <stop offset="100%" stop-color="#0c0410"/>
    </radialGradient>
    <linearGradient id="brassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c855"/>
      <stop offset="50%" stop-color="#d4a437"/>
      <stop offset="100%" stop-color="#6b4d12"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ff6b3a"/>
      <stop offset="50%" stop-color="#f6c15e"/>
      <stop offset="100%" stop-color="#f6c15e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#velvet)"/>

  <!-- Damask-ish ornament dots -->
  <g opacity="0.18" fill="#d4a437">
    <circle cx="80"   cy="100" r="2"/>
    <circle cx="160"  cy="180" r="2"/>
    <circle cx="240"  cy="100" r="2"/>
    <circle cx="320"  cy="180" r="2"/>
    <circle cx="880"  cy="100" r="2"/>
    <circle cx="960"  cy="180" r="2"/>
    <circle cx="1040" cy="100" r="2"/>
    <circle cx="1120" cy="180" r="2"/>
    <circle cx="80"   cy="540" r="2"/>
    <circle cx="160"  cy="500" r="2"/>
    <circle cx="240"  cy="540" r="2"/>
    <circle cx="1120" cy="540" r="2"/>
    <circle cx="1040" cy="500" r="2"/>
  </g>

  <!-- Brass corners -->
  <rect x="0"    y="0"   width="20" height="20" fill="#d4a437"/>
  <rect x="1180" y="0"   width="20" height="20" fill="#d4a437"/>
  <rect x="0"    y="610" width="20" height="20" fill="#d4a437"/>
  <rect x="1180" y="610" width="20" height="20" fill="#d4a437"/>

  <!-- Top brass line -->
  <rect x="0" y="68" width="1200" height="2" fill="#d4a437"/>
  <rect x="0" y="74" width="1200" height="1" fill="#6b4d12" opacity="0.7"/>

  <!-- Header chrome -->
  <text x="60" y="50" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="5" fill="#d4a437">
    PC · POINTCAST NETWORK / DRUM HUB · TRIBUTE CHAMBER
  </text>
  <g transform="translate(965, 32)">
    <rect width="180" height="28" rx="14" fill="rgba(0,0,0,0.5)" stroke="#6b4d12" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="5" fill="#f6c15e"/>
    <text x="32" y="19" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="700" letter-spacing="3" fill="#d4a437">FIVE ALTARS</text>
  </g>

  <!-- Title -->
  <text x="600" y="180" text-anchor="middle"
        font-family="Gloock, Lora, Georgia, serif"
        font-size="86" font-weight="400" letter-spacing="6" fill="#d4a437">
    NOUN ALTAR
  </text>
  <text x="600" y="232" text-anchor="middle"
        font-family="Lora, Georgia, serif" font-style="italic"
        font-size="30" font-weight="500" fill="#c9b78c">
    tribute chamber · ring the bell · leave a beat
  </text>

  <!-- Five altars row -->
  <!-- Altar centers: x = 130, 348, 566, 784, 1002 (218px apart) -->
  <!-- Each altar: pediment glyph above a 110×110 brass-framed Noun, instrument label below -->

  <!-- ALTAR 1 — bell · seed 42 -->
  <g transform="translate(130, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="22" fill="#d4a437">✦</text>
    <rect x="-58" y="14" width="116" height="116" fill="url(#brassEdge)"/>
    <rect x="-54" y="18" width="108" height="108" fill="#0c0410"/>
    <image href="https://noun.pics/42.svg" x="-54" y="18" width="108" height="108"
           preserveAspectRatio="none" image-rendering="pixelated"/>
    <text x="0" y="158" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" letter-spacing="3" fill="#c9b78c">NOUN 0042</text>
    <text x="0" y="184" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="20" letter-spacing="3" fill="#f4e7c8">BELL</text>
    <!-- Candle -->
    <rect x="-7" y="208" width="14" height="22" fill="#f4e7c8"/>
    <rect x="-7" y="208" width="1" height="22" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="0" cy="200" rx="5" ry="9" fill="url(#flame)"/>
  </g>

  <!-- ALTAR 2 — bowl · seed 156 -->
  <g transform="translate(348, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="22" fill="#d4a437">◉</text>
    <rect x="-58" y="14" width="116" height="116" fill="url(#brassEdge)"/>
    <rect x="-54" y="18" width="108" height="108" fill="#0c0410"/>
    <image href="https://noun.pics/156.svg" x="-54" y="18" width="108" height="108"
           preserveAspectRatio="none" image-rendering="pixelated"/>
    <text x="0" y="158" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" letter-spacing="3" fill="#c9b78c">NOUN 0156</text>
    <text x="0" y="184" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="20" letter-spacing="3" fill="#f4e7c8">BOWL</text>
    <rect x="-7" y="208" width="14" height="22" fill="#f4e7c8"/>
    <rect x="-7" y="208" width="1" height="22" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="0" cy="200" rx="5" ry="9" fill="url(#flame)"/>
  </g>

  <!-- ALTAR 3 — chime · seed 411 (centered) -->
  <g transform="translate(566, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="22" fill="#d4a437">✧</text>
    <rect x="-58" y="14" width="116" height="116" fill="url(#brassEdge)"/>
    <rect x="-54" y="18" width="108" height="108" fill="#0c0410"/>
    <image href="https://noun.pics/411.svg" x="-54" y="18" width="108" height="108"
           preserveAspectRatio="none" image-rendering="pixelated"/>
    <text x="0" y="158" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" letter-spacing="3" fill="#c9b78c">NOUN 0411</text>
    <text x="0" y="184" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="20" letter-spacing="3" fill="#f4e7c8">CHIME</text>
    <rect x="-7" y="208" width="14" height="22" fill="#f4e7c8"/>
    <rect x="-7" y="208" width="1" height="22" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="0" cy="200" rx="5" ry="9" fill="url(#flame)"/>
  </g>

  <!-- ALTAR 4 — gong · seed 678 -->
  <g transform="translate(784, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="22" fill="#d4a437">◈</text>
    <rect x="-58" y="14" width="116" height="116" fill="url(#brassEdge)"/>
    <rect x="-54" y="18" width="108" height="108" fill="#0c0410"/>
    <image href="https://noun.pics/678.svg" x="-54" y="18" width="108" height="108"
           preserveAspectRatio="none" image-rendering="pixelated"/>
    <text x="0" y="158" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" letter-spacing="3" fill="#c9b78c">NOUN 0678</text>
    <text x="0" y="184" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="20" letter-spacing="3" fill="#f4e7c8">GONG</text>
    <rect x="-7" y="208" width="14" height="22" fill="#f4e7c8"/>
    <rect x="-7" y="208" width="1" height="22" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="0" cy="200" rx="5" ry="9" fill="url(#flame)"/>
  </g>

  <!-- ALTAR 5 — drone · seed 805 -->
  <g transform="translate(1002, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="22" fill="#d4a437">✦</text>
    <rect x="-58" y="14" width="116" height="116" fill="url(#brassEdge)"/>
    <rect x="-54" y="18" width="108" height="108" fill="#0c0410"/>
    <image href="https://noun.pics/805.svg" x="-54" y="18" width="108" height="108"
           preserveAspectRatio="none" image-rendering="pixelated"/>
    <text x="0" y="158" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" letter-spacing="3" fill="#c9b78c">NOUN 0805</text>
    <text x="0" y="184" text-anchor="middle" font-family="Gloock, Lora, Georgia, serif"
          font-size="20" letter-spacing="3" fill="#f4e7c8">DRONE</text>
    <rect x="-7" y="208" width="14" height="22" fill="#f4e7c8"/>
    <rect x="-7" y="208" width="1" height="22" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="0" cy="200" rx="5" ry="9" fill="url(#flame)"/>
  </g>

  <!-- Bottom brass rule + footer -->
  <rect x="0" y="582" width="1200" height="2" fill="#d4a437" opacity="0.7"/>
  <rect x="0" y="588" width="1200" height="1" fill="#6b4d12" opacity="0.5"/>

  <text x="60" y="612" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="14" font-weight="600" letter-spacing="4" fill="#c9b78c">
    pointcast.xyz/drum-altars · POST /api/altar · five seeds rotate weekly · 2026
  </text>

  <g transform="translate(1050, 598)">
    <circle cx="4" cy="8" r="5" fill="#ff6b3a"/>
    <text x="14" y="14" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="700" letter-spacing="4" fill="#d4a437">ON AIR</text>
  </g>
</svg>
