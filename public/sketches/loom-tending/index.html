<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152221">
  <title>Tending · The Bonfire</title>
  <link rel="stylesheet" href="./tending.css">
</head>
<body>
  <main>
    <header><a href="https://pointcast.xyz/loom">← The Loom</a><span>El Segundo, CA</span></header>
    <section class="fire" aria-labelledby="title">
      <div class="label"><i aria-hidden="true"></i> #BONFIRE</div>
      <h1 id="title">Tending.</h1>
      <p class="intro">Each original note in this room adds a log. After 24 hours, it burns away.</p>
      <figure>
        <canvas width="360" height="260" aria-hidden="true"></canvas>
        <figcaption><span>THE ROOM FIRE</span><span class="rule"></span><span>LAST 24 HOURS</span></figcaption>
      </figure>
      <div aria-live="polite" aria-atomic="true">
        <h2 id="state">Reading the room…</h2>
        <p id="caption">Checking the public notes in #bonfire.</p>
      </div>
      <button type="button" id="action" disabled>Reading…</button>
      <noscript><p><a href="https://pointcast.xyz/loom/topic/bonfire">Read the public room ↗</a></p></noscript>
    </section>
  </main>
  <dialog aria-labelledby="sheet-title">
    <div class="sheet-head"><div><div class="label">#BONFIRE</div><h2 id="sheet-title">Beside the fire</h2></div><form method="dialog"><button aria-label="Close notes" class="close">×</button></form></div>
    <div id="notes"></div>
  </dialog>
  <script type="module" src="./tending.mjs"></script>
</body>
</html>
