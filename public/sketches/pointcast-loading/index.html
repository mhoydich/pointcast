<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ec">
  <title>Block Atlas · Loom Kit sketch · PointCast</title>
  <link rel="stylesheet" href="./atlas.css">
  <script type="module" src="./atlas.mjs"></script>
</head>
<body>
  <header>
    <a class="brand" href="/"><i aria-hidden="true"></i>PointCast</a>
    <span>Loom Kit sketch</span>
  </header>
  <main>
    <h1>Block Atlas</h1>
    <p class="intro">Find a published PointCast block by title.</p>
    <div id="sketch" hidden>
      <label for="search-input">Search titles</label>
      <input id="search-input" type="search" value="Moon orchard" autocomplete="off">
      <section id="state-card" data-state="loading" aria-labelledby="state-title">
        <div class="hearth" aria-hidden="true">
          <div id="flame-view" aria-hidden="true">
            <img id="flame-still" alt="" width="480" height="328">
          </div>
        </div>
        <h2 id="state-title" tabindex="-1">Loading the atlas…</h2>
        <p id="state-detail" hidden></p>
        <div class="action-slot"><button id="state-action" type="button" hidden></button></div>
        <ul id="matches" hidden></ul>
      </section>
      <p id="announcement" class="sr-only" role="status" aria-atomic="true"></p>
      <nav aria-label="Atlas sketch">
        <button id="replay" type="button" disabled>Replay loading</button>
        <a href="/atlas/">Open the full atlas</a>
      </nav>
    </div>
    <noscript><p><a href="/atlas/">Open the full atlas</a></p></noscript>
  </main>
</body>
</html>
