<style>
:root{color-scheme:light;--paper:#faf4e8;--ink:#3c2623;--rust:#853e2b;--rule:#d4bda4;font-family:"Baskervville",Georgia,serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(16px,4vw,44px)}
main{width:min(100%,34rem);text-align:center}
figure{margin:0}
.art{width:clamp(13rem,65vw,19rem);max-width:100%;display:block;margin:0 auto}
.art [data-scene]{display:none}
.art[data-fire="hearth"] [data-scene="hearth"],.art[data-fire="candle"] [data-scene="candle"],.art[data-fire="campfire"] [data-scene="campfire"]{display:block}
figcaption{font-size:clamp(1.75rem,5.8vw,2.65rem);letter-spacing:-.035em;line-height:1.15;max-width:22ch;margin:.4em auto .7em;text-wrap:balance;overflow-wrap:anywhere}
.rule{display:block;width:52px;height:8px;margin:0 auto 1.2rem;color:var(--rust)}
[hidden]{display:none!important}
button,input,textarea{font:inherit}
button,label{touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid #9c421d;outline-offset:3px}
form{max-width:24rem;margin:0 auto;text-align:left;font:15px/1.45 system-ui,sans-serif}
fieldset{border:0;padding:0;margin:0}
legend,.field-label{display:block;font-weight:650;font-size:.88rem;margin-bottom:.3rem}
textarea,input[type="url"]{display:block;background:#fffaf1;border:1px solid #a88b73;color:var(--ink);border-radius:6px;padding:9px 11px;width:100%;font:1rem/1.35 system-ui,sans-serif}
textarea{resize:vertical;min-height:3.6rem;margin-bottom:.75rem}
.choices{display:flex;gap:6px;flex-wrap:wrap}
.choice{position:relative;flex:1;display:flex;min-width:max-content}
.choice input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.choice span{width:100%;display:flex;justify-content:center;align-items:center;gap:.36rem;border:1px solid var(--rule);border-radius:30px;min-height:44px;padding:0 .55rem;color:#624a3e;font-size:.87rem}
.choice span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--swatch)}
.choice input:checked+span{border-color:var(--rust);background:#f4e1cc;color:#5d2d20;font-weight:650}
.choice input:focus-visible+span{outline:3px solid #9c421d;outline-offset:2px}
.copy,.make{min-height:44px;border:0;border-radius:6px;padding:.7rem 1.1rem;font:650 .94rem/1.3 system-ui,sans-serif}
.copy{display:block;width:100%;margin-top:.9rem;background:#863d2a;color:#fffaf2}
.copy:hover{background:#71311f}
.make{background:transparent;color:var(--rust);text-decoration:underline;text-underline-offset:3px}
.status{font-size:.87rem;margin:.45rem 0 0}
.status:empty{display:none}
.fallback{margin-top:.6rem}
@media(min-width:700px){form{border-top:1px solid var(--rule);padding-top:1rem}}
@media(min-width:780px){
 main:has(#maker[hidden]){width:min(66rem,100%)}
 main:has(#maker[hidden]) figure{display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:3%;position:relative;padding:3% 5%;border:1px solid var(--rule);outline:1px solid var(--rule);outline-offset:-6px}
 main:has(#maker[hidden]) .art{width:100%;grid-area:1/1/3/2}
 main:has(#maker[hidden]) figcaption{grid-area:1/2;align-self:end;max-width:13ch;font-size:clamp(2.45rem,4vw,3.8rem);margin:0 auto .5em}
 main:has(#maker[hidden]) .rule{grid-area:2/2;align-self:start;margin:0 auto}
 .make{margin-top:1rem}
}
@media(prefers-reduced-motion:no-preference){.settle .flame{animation:kindle 1.45s ease-out both;transform-box:fill-box;transform-origin:center bottom}
@keyframes kindle{0%{transform:scale(.92,.9)}30%{transform:scale(1.035,1.045) skewX(-2deg)}65%{transform:scale(.985,1.012) skewX(1deg)}100%{transform:none}}}
</style>

<figcaption id="line">I left a light on for you.</figcaption>
<svg class="rule" viewBox="0 0 52 8" aria-hidden="true"><path d="M1 4h17m16 0h17" fill="none" stroke="currentColor"/><path d="m26 0 4 4-4 4-4-4Z" fill="currentColor"/></svg>
</figure>
<form id="maker" hidden>
<label for="words" class="field-label">Your line</label>
<textarea id="words" rows="2" maxlength="140" required>I left a light on for you.</textarea>
<fieldset><legend>Choose a fire</legend><div class="choices">
<label class="choice"><input type="radio" name="fire" value="hearth" checked><span style="--swatch:#aa492f">Hearth</span></label>
<label class="choice"><input type="radio" name="fire" value="candle"><span style="--swatch:#c68632">Candle</span></label>
<label class="choice"><input type="radio" name="fire" value="campfire"><span style="--swatch:#70443a">Campfire</span></label>
</div></fieldset>
<button class="copy" type="submit">Copy link</button>
<p id="status" class="status" role="status"></p>
<div id="fallback" class="fallback" hidden><label class="field-label" for="link">Select and copy your link</label><input type="url" id="link" readonly></div>
</form>
<button id="make" class="make" type="button" hidden>Make a light for someone</button>
</main>
<script>
(() => {
  const fires = {hearth:'A bright fire above a pair of hearth logs',candle:'A single candle glowing in a brass holder',campfire:'A campfire burning among pine trees'};
  const art = document.getElementById('art');
  const title = document.getElementById('fire-title');
  const line = document.getElementById('line');
  const maker = document.getElementById('maker');
  const words = document.getElementById('words');
  const status = document.getElementById('status');
  const make = document.getElementById('make');
  const fallback = document.getElementById('fallback');
  const link = document.getElementById('link');
  const defaultLine = words.defaultValue;
  const tidy = value => value.replace(/\s+/gu,' ').trim();
  function draw(fire, text) {
    if (art.dataset.fire !== fire) {
      art.classList.remove('settle');
      void art.getBoundingClientRect();
    }
    art.dataset.fire = fire;
    title.textContent = fires[fire];
    line.textContent = text;
    art.classList.add('settle');
  }
  function resetCopy() {
    status.textContent = '';
    fallback.hidden = true;
    link.value = '';
    words.setCustomValidity('');
  }
  function showCard(fire, text, shared) {
    maker.elements.fire.value = fire;
    words.value = text;
    draw(fire, text);
    maker.hidden = shared;
    make.hidden = !shared;
    resetCopy();
  }
  function readLink() {
    const fragment = location.hash.slice(1);
    const params = new URLSearchParams(fragment.length <= 2400 ? fragment : '');
    const fire = params.get('fire');
    const text = tidy(params.get('line') || '');
    const shared = Object.hasOwn(fires, fire) && text.length > 0 && text.length <= 140;
    if (shared) showCard(fire, text, true);
    else showCard('hearth', defaultLine, false);
  }
  maker.addEventListener('input', () => {
    resetCopy();
    draw(maker.elements.fire.value, tidy(words.value) || defaultLine);
  });
  make.addEventListener('click', () => {
    showCard('hearth', defaultLine, false);
    words.focus();
    words.select();
  });
  maker.addEventListener('submit', async event => {
    event.preventDefault();
    const text = tidy(words.value);
    if (!text) {
      words.setCustomValidity('Write a line to send.');
      words.reportValidity();
      return;
    }
    const url = new URL(location.pathname, location.href);
    url.hash = new URLSearchParams({fire:maker.elements.fire.value,line:text});
    try {
      await navigator.clipboard.writeText(url.href);
      status.textContent = 'Link copied.';
      fallback.hidden = true;
    } catch {
      link.value = url.href;
      fallback.hidden = false;
      link.focus();
      link.select();
    }
  });
  window.addEventListener('hashchange', readLink);
  readLink();
})();
</script>
</body>
