<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6ed">
<title>A family of fires · The Loom</title>
<link rel="stylesheet" href="./style.css">
<main>
  <header><span>The Loom</span><span>Room studies</span></header>
  <h1>A family of fires<span>.</span></h1>
  <p class="intro">Six ways to gather around a flame.</p>
  <nav aria-label="Choose a room fire"></nav>
  <article aria-labelledby="fire-name">
    <div class="scene" role="img" aria-label=""><svg id="vessel" viewBox="0 0 360 224" aria-hidden="true"></svg><div id="flame" aria-hidden="true"></div></div>
    <div class="caption"><span id="kind"></span><span id="place"></span></div>
    <h2 id="fire-name">Campfire</h2>
    <p class="description" id="description" aria-live="polite"></p>
    <div class="controls">
      <button id="empty" type="button" aria-pressed="false">Empty room</button>
      <button id="sound" type="button" aria-pressed="false" disabled>Sound off</button>
    </div>
    <p class="sound-note" id="sound-note"></p>
    <p id="status" role="status"></p>
  </article>
  <noscript>This study uses JavaScript to draw the room fires.</noscript>
</main>
<script type="module" src="./rooms.mjs"></script>
</html>
