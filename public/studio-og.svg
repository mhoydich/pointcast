<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid slice">
  <!--
    Static OG fallback for /studio/share/{id} pages.
    Per-composition OG images are queued as a follow-up sprint
    (codex review brief, PR 2 of the 3-sprint plan); this is the
    "ship a real /studio-og.png immediately" half of that recommendation.
    Brand colors lifted from src/styles/global.css @theme.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e7c8" />
      <stop offset="1" stop-color="#fbf7ee" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- channel-warm rule across the top -->
  <rect x="0" y="0" width="1200" height="6" fill="#c4952e" />

  <!-- mono kicker -->
  <g font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" fill="#c4952e">
    <text x="80" y="120" font-size="24" letter-spacing="6" font-weight="700">CH.STUDIO &#xb7; BLOCK MAKER</text>
  </g>

  <!-- big headline -->
  <g font-family="'Syne', 'Outfit', system-ui, sans-serif" fill="#1f1b15">
    <text x="80" y="240" font-size="86" font-weight="600" letter-spacing="-2">Drag, type, ship.</text>
    <text x="80" y="320" font-size="86" font-weight="600" letter-spacing="-2">Make a block.</text>
  </g>

  <!-- editorial dek -->
  <g font-family="'Lora', 'Georgia', serif" fill="#6a6154">
    <text x="80" y="420" font-size="28" font-style="italic">Templates &#xb7; Nouns &#xb7; text &#xb7; filters &#xb7; 4-frame GIFs.</text>
    <text x="80" y="460" font-size="28" font-style="italic">Publish to a permanent share URL anyone can remix.</text>
  </g>

  <!-- footer wordmark -->
  <g font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" fill="#1f1b15">
    <text x="80" y="570" font-size="22" letter-spacing="3" font-weight="700">POINTCAST &#xb7; pointcast.xyz/studio</text>
  </g>

  <!-- brass dot accent (echoes the home ring pad) -->
  <circle cx="1080" cy="120" r="36" fill="#d4a437" stroke="#6b4d12" stroke-width="3" />
  <circle cx="1080" cy="120" r="14" fill="#f6c15e" />
</svg>
