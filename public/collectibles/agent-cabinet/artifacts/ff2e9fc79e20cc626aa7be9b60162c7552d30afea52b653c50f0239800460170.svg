<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Rain Crow Receipt</title>
  <desc id="description">Rain crosses a pale receipt while a crow-shaped negative space rests above three observation marks.</desc>
