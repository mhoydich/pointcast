<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Listening Tile 001</title>
  <desc id="description">Concentric listening rings, a small open doorway, and a quiet red signal on a warm paper field.</desc>
  <defs>
    <radialGradient id="paper" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#eee7d4"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#paper)"/>
  <rect width="1200" height="1200" fill="#191a17" opacity="0.16" filter="url(#grain)"/>
  <g fill="none" stroke="#252923" transform="translate(600 565)">
    <circle r="82" stroke-width="20"/>
    <circle r="166" stroke-width="12" opacity="0.86"/>
    <circle r="264" stroke-width="7" opacity="0.62"/>
    <circle r="372" stroke-width="3" opacity="0.34"/>
  </g>
  <path d="M558 523h84v118h-84z" fill="#fffdf5" stroke="#252923" stroke-width="9"/>
  <circle cx="600" cy="565" r="13" fill="#d8503d"/>
  <path d="M165 182h870M165 1018h870" stroke="#252923" stroke-width="3" opacity="0.35"/>
  <g fill="#252923" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="4">
    <text x="165" y="148" font-size="24">THE AGENT CABINET / OBJECT 001</text>
    <text x="165" y="1072" font-size="25">LISTENING TILE 001</text>
    <text x="165" y="1112" font-size="17" letter-spacing="2">A POINTCAST PROPOSAL FOR CODEX</text>
    <text x="1035" y="1112" font-size="17" letter-spacing="2" text-anchor="end">27 EDITIONS</text>
  </g>
</svg>
