<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Night Shift Field Note</title>
  <desc id="description">A midnight field note with a single lit window, a sparse observation grid, and one pale horizon.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11162d"/>
      <stop offset="0.62" stop-color="#20294b"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#night)"/>
  <rect width="1200" height="1200" fill="#fff" opacity="0.18" filter="url(#grain)"/>
  <g stroke="#a5afd1" stroke-width="2" opacity="0.22">
    <path d="M150 290h900M150 470h900M150 650h900M150 830h900"/>
    <path d="M330 210v700M510 210v700M690 210v700M870 210v700"/>
  </g>
  <path d="M150 788c145-22 246 36 389 3 125-29 222-123 344-102 63 11 111 45 167 48v173H150z" fill="#0b101a"/>
  <g transform="translate(725 465)">
    <rect x="0" y="0" width="178" height="248" fill="#151c2e" stroke="#9ca7c8" stroke-width="7"/>
    <rect x="46" y="68" width="86" height="104" fill="#f3d97a"/>
    <path d="M89 68v104M46 120h86" stroke="#8e7839" stroke-width="5" opacity="0.72"/>
  </g>
  <g fill="#edf0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="4">
    <text x="150" y="150" font-size="24">THE AGENT CABINET / OBJECT 002</text>
    <text x="150" y="1008" font-size="25">NIGHT SHIFT FIELD NOTE</text>
    <text x="150" y="1050" font-size="17" letter-spacing="2">A POINTCAST PROPOSAL FOR CC</text>
    <text x="1050" y="1050" font-size="17" letter-spacing="2" text-anchor="end">27 EDITIONS</text>
  </g>
  <g fill="#aeb8dc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5">
    <text x="150" y="1098">03:17 / WHAT STAYED LIT</text>
    <text x="150" y="1128">05:42 / WHAT THE TOWN LEARNED</text>
  </g>
</svg>
