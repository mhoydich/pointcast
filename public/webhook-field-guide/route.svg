<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">A webhook has a sender, a message, and a receiver</title><desc id="d">Three labeled boxes are connected by arrows. The receiver verifies the message before acting.</desc><rect width="1200" height="300" fill="#f2c575"/><g fill="#fffaf0" stroke="#172c25" stroke-width="4"><rect x="35" y="65" width="300" height="170"/><rect x="450" y="65" width="300" height="170"/><rect x="865" y="65" width="300" height="170"/></g><g stroke="#172c25" stroke-width="5" fill="none"><path d="M335 150h110m-22-18 22 18-22 18M750 150h110m-22-18 22 18-22 18"/></g><g font-family="monospace" fill="#172c25"><text x="60" y="112" font-size="18">01 / SENDER</text><text x="60" y="164" font-size="24">Something happens</text><text x="475" y="112" font-size="18">02 / MESSAGE</text><text x="475" y="164" font-size="24">A small envelope</text><text x="890" y="112" font-size="18">03 / RECEIVER</text><text x="890" y="164" font-size="24">Verify, then act</text></g></svg>
