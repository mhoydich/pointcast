<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Opening Hours</title>
<style>
:root{--stone:#151a1c;--ink:#ece6d6;--accent:#c98b4a;--dim:#8d8676;--halo:#c98b4a2e;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark;box-sizing:border-box}
html,body{height:100%}
body{background:var(--stone);color:var(--ink);font-family:var(--serif);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center;overflow:hidden}
main{display:flex;flex-direction:column;align-items:center;gap:2rem;max-width:30rem;width:100%;padding-block:2rem}
.mark{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;gap:1rem;justify-content:space-between;align-items:center;width:100%}
.air{display:inline-flex;align-items:center;gap:.5em}.air i{width:.55em;height:.55em;border-radius:50%;background:#5a2a24;display:inline-block}
.on .air i{background:#ff4a3a;box-shadow:0 0 8px #ff4a3a}
button.n{all:unset;cursor:pointer;position:relative;width:11rem;height:11rem;display:grid;place-items:center;border-radius:50%}
button.n:focus-visible{outline:1px solid var(--accent);outline-offset:6px}
.halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--halo),transparent 70%);opacity:.5;transition:opacity 2.4s}
.on .halo{opacity:1;transition:opacity .15s}
svg{width:9rem;height:auto}.head{transform-box:fill-box;transform-origin:50% 0}
.on .head{animation:sway 3.2s ease-out}
@keyframes sway{0%{transform:rotate(0)}10%{transform:rotate(7deg)}25%{transform:rotate(-5deg)}42%{transform:rotate(3deg)}60%{transform:rotate(-1.2deg)}100%{transform:rotate(0)}}
.verse{display:flex;flex-direction:column;gap:1.3rem;width:100%}
.verse p{margin:0;font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.6;font-style:italic}
.verse p.coda{font-style:normal;color:var(--accent)}
.hint{text-transform:lowercase}
@media (prefers-reduced-motion:reduce){.on .head{animation:none}}
</style></head><body>
<main id="m">
  <div class="mark"><span>church of nouns</span><span class="air"><i></i>on air</span><span>mon · 11.23</span></div>
  <button class="n" id="n" aria-label="play the gong noun"><span class="halo"></span><svg viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true"><rect x="9" y="21" width="14" height="11" fill="#3f6f6a"/><rect x="11" y="21" width="10" height="1" fill="#ffffff22"/><rect x="13" y="25" width="6" height="1" fill="#e9e2cf"/><rect x="18" y="24" width="2" height="3" fill="#7a5230"/><g class="head"><rect x="12" y="5" width="8" height="2" fill="#b8863b"/><rect x="10" y="7" width="12" height="2" fill="#b8863b"/><rect x="8" y="9" width="16" height="9" fill="#b8863b"/><rect x="10" y="18" width="12" height="2" fill="#9c6f2e"/><rect x="12" y="20" width="8" height="1" fill="#9c6f2e"/><rect x="14" y="7" width="4" height="1" fill="#d8a85a"/><rect x="6" y="12" width="3" height="1" fill="#d22209"/><rect x="9" y="11" width="6" height="5" fill="#d22209"/><rect x="17" y="11" width="6" height="5" fill="#d22209"/><rect x="15" y="12" width="2" height="1" fill="#d22209"/><rect x="10" y="12" width="2" height="3" fill="#ffffff"/><rect x="12" y="12" width="2" height="3" fill="#000000"/><rect x="18" y="12" width="2" height="3" fill="#ffffff"/><rect x="20" y="12" width="2" height="3" fill="#000000"/></g></svg></button>
  <div class="verse"><p>the doors open at nine.</p><p>nobody checks a name at the door.</p><p class="coda">come in as you are.<br>leave as you are,<br>a little quieter.</p></div>
  <div class="mark"><span class="hint" id="hint">tap to play</span><span>opening hours</span></div>
</main>
<script>
(function(){
var ctx=null,m=document.getElementById('m'),b=document.getElementById('n'),h=document.getElementById('hint'),n=0,t0=0;
var S=[1,9/8,5/4,3/2,5/3,2],song=[0, 2, 4, 2, 0];
function tone(t,f,dur,amp){[[1,amp,dur],[2.01,amp*.4,dur*.7],[2.76,amp*.25,dur*.55],[5.4,amp*.08,dur*.3]].forEach(function(p){
var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*p[0];
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+p[2]);
o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+p[2]+.1);});}
function play(){
try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();var t=ctx.currentTime+.05,base=196;
song.forEach(function(k,i){var f=k<0?base/2:base*S[k];tone(t+i*.62,f,i===song.length-1?5:2.4,.32);});
tone(t,base/2,6,.18);}catch(e){}
m.classList.remove('on');void m.offsetWidth;m.classList.add('on');
clearTimeout(t0);t0=setTimeout(function(){m.classList.remove('on')},song.length*620+3000);
n++;h.textContent=n===1?'one more time':n+' times, same song';}
b.addEventListener('click',play);
})();
</script>
</body></html>
