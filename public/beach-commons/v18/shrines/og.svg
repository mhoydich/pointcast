  <title id="title">SHRINE/25 — Nothing Left Behind</title>
  <desc id="desc">Black, copper, and cream PointCast field poster with a glowing circular mark.</desc>
  <defs>
    <radialGradient id="field" cx="72%" cy="48%" r="54%"><stop offset="0" stop-color="#6b3927"/><stop offset=".22" stop-color="#2c1d18"/><stop offset=".67" stop-color="#090b0b"/></radialGradient>
