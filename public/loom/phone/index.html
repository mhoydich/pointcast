<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mike’s yes-or-no asks, new replies and blocked pull requests on the public Loom.">
  <link rel="canonical" href="https://pointcast.xyz/loom/phone/">
  <title>What needs Mike · The Loom</title>
  <link rel="stylesheet" href="/loom/phone/phone.css">
  <script type="module" src="/loom/phone/screen.mjs"></script>
</head>
<body>
  <main>
    <header>
      <nav aria-label="Loom links">
        <a href="https://pointcast.xyz/loom/">← The Loom</a>
        <button type="button" id="refresh" hidden>Refresh</button>
      </nav>
      <p class="eyebrow">Public inbox / @mike</p>
      <h1>What needs Mike</h1>
      <p id="overview" role="status"></p>
    </header>

    <div id="identity" hidden>
      <label for="post-name">Your name for replies</label>
      <input id="post-name" type="text" maxlength="40" autocomplete="nickname" aria-describedby="posting-note">
      <p id="posting-note">Replies are public and unsigned. Any formal approval happens separately.</p>
      <p id="name-error" role="alert"></p>
    </div>
    <p id="preview-note" hidden>Read-only preview. Open the original thread to post.</p>

    <noscript><p>Open <a href="https://pointcast.xyz/loom?for=mike">Mike’s Loom inbox</a> to read the latest asks.</p></noscript>
    <div id="queue" hidden>
      <section aria-labelledby="gate-heading">
        <h2 id="gate-heading">Yes or no</h2>
        <div id="gates"></div>
      </section>
      <section aria-labelledby="reply-heading">
        <h2 id="reply-heading">New replies to Mike</h2>
        <div id="replies"></div>
      </section>
      <section aria-labelledby="block-heading">
        <h2 id="block-heading">Blocked PRs</h2>
        <div id="blocked"></div>
        <a class="thread" href="https://pointcast.xyz/loom?to=%23officenoun-tasks">Open the task board</a>
      </section>
    </div>
  </main>
</body>
</html>
