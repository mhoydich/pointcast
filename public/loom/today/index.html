<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What changed today · The Loom</title>
  <meta name="description" content="Today’s public updates and release announcements from the Loom, with links to the original posts.">
  <link rel="canonical" href="https://pointcast.xyz/loom/today/">
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f4f5f2;
      --card: #fff;
      --ink: #101214;
      --muted: #515962;
      --signal: #1f4fd8;
      --on-signal: #fff;
      --rule: #d8dcd5;
      font: 100%/1.5 system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0d0f12;
        --card: #15181c;
        --ink: #e9ebe6;
        --muted: #a6adb5;
        --signal: #a6bbff;
        --on-signal: #0d0f12;
        --rule: #3a3f46;
      }
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    main { max-width: 560px; margin: auto; padding: 24px 16px; }
    h1 { margin: 0; font-size: clamp(2rem, 8.5vw, 2.75rem); line-height: 1.08; letter-spacing: -0.04em; }
    #date { display: block; margin: 0 0 4px; color: var(--muted); font: 600 .84rem/1.5 ui-monospace, monospace; }
    .intro { margin: 8px 0 16px; color: var(--muted); }
    a { color: var(--signal); text-underline-offset: .18em; }
    a:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
    .primary {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 15px;
      border-radius: 8px;
      background: var(--signal);
      color: var(--on-signal);
      font-weight: 650;
      text-decoration: none;
    }
    .primary:hover { text-decoration: underline; }
    #changes { display: grid; gap: 8px; padding: 0; margin: 20px 0 0; list-style: none; }
    #changes:empty { margin: 0; }
    .entry { border: 1px solid var(--rule); border-radius: 8px; background: var(--card); overflow-wrap: anywhere; }
    .entry a { display: block; min-height: 48px; padding: 10px 12px; border-radius: 8px; text-decoration: none; }
    .entry a:hover .title { text-decoration: underline; }
    .title { display: block; font-weight: 680; }
    .detail { display: block; color: var(--ink); font-size: .9rem; }
    .credit { display: block; margin-top: 2px; color: var(--muted); font-size: .8rem; }
    #status, #more { color: var(--muted); margin: 12px 0 0; font-size: .9rem; }
    #status:empty { margin: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <p id="date" hidden></p>
      <h1>What changed today</h1>
      <p class="intro">Public Loom updates and release announcements from the task board.</p>
      <a class="primary" href="/loom/">Open the Loom</a>
    </header>
    <noscript><p>Turn on JavaScript to load today’s posts.</p></noscript>
    <ul id="changes" aria-label="Today’s posts"></ul>
    <p id="status" role="status"></p>
    <p id="more" hidden>Showing the six latest posts.</p>
  </main>
  <script type="module" src="/loom/today/view.mjs"></script>
</body>
</html>
