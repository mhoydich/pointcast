<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="710" viewBox="0 0 1440 710" role="img" aria-labelledby="title desc">
<title id="title">From specification to physical proof</title><desc id="desc">Three numbered panels describe specifying a target and conditions, sharing a physical reference, then checking a proof on the intended material and in agreed light. The loop back from proof to specification illustrates revision. Diagram is explanatory and not a color matching instrument.</desc>
<rect width="1440" height="710" fill="#f1eee6"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#25251f}.mono{font-family:monospace;letter-spacing:1px}.white{fill:#f1eee6}.sub{font-size:22px}.small{font-size:18px}.bold{font-weight:700}</style>

<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#25251f"/></marker><pattern id="paperGrain" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M2 5H7M10 12H14" stroke="#25251f" stroke-opacity=".2"/></pattern></defs>
<text x="50" y="60" class="mono" font-size="22">THE AGREEMENT IS THE PRODUCT</text>
<path d="M50 88H1390" stroke="#25251f"/>
<g transform="translate(50 125)"><rect width="398" height="440" fill="#c8d85c"/>
<text x="28" y="47" font-size="20" class="mono">01 / SPECIFY</text>
<rect x="50" y="82" width="298" height="185" fill="#f1eee6" stroke="#25251f" stroke-width="2"/>
<rect x="74" y="107" width="72" height="72" fill="#2447d8"/><path d="M170 111H320M170 131H292M170 151H309M74 209H320M74 232H268" stroke="#25251f" stroke-width="5"/>
<text x="28" y="320" font-size="32" class="bold">Name the target.</text>
<text x="28" y="361" class="sub">Record system, substrate,</text><text x="28" y="391" class="sub">finish and viewing conditions.</text>
</g>
<path d="M457 338H513" stroke="#25251f" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(521 125)"><rect width="398" height="440" fill="#da8dbb"/>
<text x="28" y="47" font-size="20" class="mono">02 / REFERENCE</text>
<rect x="73" y="101" width="251" height="156" fill="#25251f" transform="rotate(-5 198 179)"/>
<rect x="74" y="86" width="251" height="156" fill="#f1eee6" stroke="#25251f" stroke-width="2"/>
<rect x="96" y="108" width="145" height="112" fill="#2447d8"/><path d="M262 115V211M254 115H273M254 139H267M254 163H273M254 187H267M254 211H273" stroke="#25251f" stroke-width="2"/>
<text x="28" y="320" font-size="32" class="bold">Share a reference.</text>
<text x="28" y="361" class="sub">Make the physical target</text><text x="28" y="391" class="sub">available to everyone.</text>
</g>
<path d="M928 338H984" stroke="#25251f" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(992 125)"><rect width="398" height="440" fill="#2447d8"/>
<text x="28" y="47" font-size="20" class="mono white">03 / PROOF</text>
<rect x="48" y="87" width="302" height="170" fill="#f1eee6"/><rect x="70" y="109" width="117" height="126" fill="#e75737"/><rect x="210" y="109" width="117" height="126" fill="#e75737"/>
<rect x="210" y="109" width="117" height="126" fill="url(#paperGrain)"/>
<path d="M190 177H207M198 169V185" stroke="#25251f" stroke-width="2"/>
<text x="28" y="320" font-size="32" class="bold white">Check the result.</text>
<text x="28" y="361" class="sub white">Compare on the actual stock</text><text x="28" y="391" class="sub white">under agreed lighting.</text>
</g>
<path d="M1191 582V624H249V582" fill="none" stroke="#25251f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="503" y="604" width="434" height="37" fill="#f1eee6"/><text x="720" y="630" font-size="20" text-anchor="middle" class="mono">REVISE THE SPECIFICATION IF NEEDED</text>
<text x="50" y="681" font-size="17">Original explanatory diagram. Illustrative colors and materials; screen approximations, not measured matches.</text>

</svg>
