<text x="54" y="852" font-size="38" class="bold">One intention. Many surfaces.</text>
<text x="54" y="902" font-size="22">A shared reference turns a subjective impression into a conversation people can check.</text>
<text x="1386" y="942" text-anchor="end" font-size="16" class="mono">ORIGINAL COLORS · SCREEN APPROXIMATIONS · NO CERTIFIED MATCH</text>

