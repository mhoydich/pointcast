<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">A local materials atlas, imagined</title><desc id="desc">Six original flat illustrations suggest sea glass, clay, painted metal, paper, concrete and woven fabric. This is a conceptual palette, not a survey, material measurement or certified color reference. All on-screen colors are approximations.</desc>
<rect width="1440" height="1100" fill="#f1eee6"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#25251f}.mono{font-family:monospace;letter-spacing:1px}.white{fill:#f1eee6}.sub{font-size:22px}.small{font-size:18px}.bold{font-weight:700}</style>

<defs><pattern id="weave" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#da8dbb"/><path d="M0 9H34M0 25H34" stroke="#25251f" stroke-width="4"/><path d="M9 0V34M25 0V34" stroke="#f1eee6" stroke-width="4"/></pattern><pattern id="aggregate" width="82" height="70" patternUnits="userSpaceOnUse"><path d="M10 11L25 6L31 23L14 28Z" fill="#25251f" opacity=".4"/><path d="M58 42L73 38L78 57L61 62Z" fill="#f1eee6" opacity=".8"/><circle cx="17" cy="58" r="3" fill="#25251f"/><circle cx="61" cy="15" r="2" fill="#25251f"/></pattern></defs>
<text x="50" y="62" font-size="22" class="mono">LOCAL MATERIALS ATLAS / A PROPOSAL</text>
<path d="M50 88H1390" stroke="#25251f"/>
<g transform="translate(50 125)"><rect width="420" height="318" fill="#2447d8"/><path d="M94 66Q128 28 184 52L270 88Q324 114 299 172L255 251Q235 284 187 264L104 232Q61 212 71 164Z" fill="#c8d85c"/><path d="M112 78Q134 59 164 64" stroke="#f1eee6" stroke-width="6" fill="none"/><text x="0" y="355" font-size="26" class="bold">01 / SEA GLASS</text><text x="0" y="387" font-size="20">Translucence changes the question.</text></g>
<g transform="translate(510 125)"><rect width="420" height="318" fill="#e75737"/><path d="M101 72H319L289 242H131Z" fill="#f1eee6"/><ellipse cx="210" cy="72" rx="109" ry="32" fill="#25251f"/><ellipse cx="210" cy="72" rx="88" ry="17" fill="#e75737"/><path d="M141 221H280M136 197H284" stroke="#e75737" stroke-width="4"/><text x="0" y="355" font-size="26" class="bold">02 / FIRED CLAY</text><text x="0" y="387" font-size="20">Glaze and firing become conditions.</text></g>
<g transform="translate(970 125)"><rect width="420" height="318" fill="#c8d85c"/><path d="M76 82L316 45L345 237L105 274Z" fill="#2447d8"/><path d="M89 96L329 59M97 137L337 100M105 178L345 141" stroke="#f1eee6" stroke-opacity=".3" stroke-width="6"/><circle cx="108" cy="105" r="7" fill="#f1eee6"/><circle cx="311" cy="77" r="7" fill="#f1eee6"/><circle cx="133" cy="243" r="7" fill="#f1eee6"/><circle cx="317" cy="211" r="7" fill="#f1eee6"/><text x="0" y="355" font-size="26" class="bold">03 / PAINTED METAL</text><text x="0" y="387" font-size="20">Gloss changes how light returns.</text></g>
<g transform="translate(50 575)"><rect width="420" height="318" fill="#da8dbb"/><path d="M88 77L293 49L336 249L131 277Z" fill="#25251f"/><path d="M74 64L279 36L322 236L117 264Z" fill="#f1eee6"/><path d="M104 107L258 86M112 143L266 122M120 179L274 158M128 215L282 194" stroke="#e75737" stroke-width="11"/><text x="0" y="355" font-size="26" class="bold">04 / PRINTED PAPER</text><text x="0" y="387" font-size="20">The substrate joins the palette.</text></g>
<g transform="translate(510 575)"><rect width="420" height="318" fill="#25251f"/><rect x="77" y="59" width="266" height="200" fill="#c8d85c"/><rect x="77" y="59" width="266" height="200" fill="url(#aggregate)"/><path d="M210 59V259M77 159H343" stroke="#25251f" stroke-width="6"/><text x="0" y="355" font-size="26" class="bold">05 / CONCRETE</text><text x="0" y="387" font-size="20">Aggregate interrupts a flat value.</text></g>
<g transform="translate(970 575)"><rect width="420" height="318" fill="#e75737"/><path d="M81 62H339V256H81Z" fill="url(#weave)"/><path d="M81 51V267M101 51V267M121 51V267M299 51V267M319 51V267M339 51V267" stroke="#f1eee6" stroke-width="3"/><text x="0" y="355" font-size="26" class="bold">06 / WOVEN FABRIC</text><text x="0" y="387" font-size="20">Structure can mix colors optically.</text></g>
<path d="M50 1000H1390" stroke="#25251f"/>
