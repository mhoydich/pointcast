<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noun Parade · Spot the character</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9d5df;color:#182b34;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;font-weight:900}a{color:inherit;text-decoration:none}h1{font-size:clamp(2.8rem,9vw,5.5rem);letter-spacing:-.07em;line-height:.9;margin:48px 0 15px}p{line-height:1.5}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.score{background:#fff7e9;border:2px solid #182b34;border-radius:16px;padding:16px 20px;display:flex;gap:25px;font-weight:900}.board{margin-top:30px;padding:24px;background:#fff7e9;border:3px solid #182b34;border-radius:22px;box-shadow:6px 7px 0 #182b34}.prompt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900;font-size:clamp(1.1rem,4vw,1.6rem)}.prompt strong{color:#d25937}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.character{aspect-ratio:1;border:2px solid #182b34;border-radius:15px;background:#eac99c;font-size:clamp(2rem,7vw,4rem);cursor:pointer;box-shadow:3px 4px 0 #182b34;transition:transform .12s}.character:nth-child(3n+2){background:#c7dfac}.character:nth-child(3n){background:#e8b4ae}.character:hover:not(:disabled){transform:translateY(-4px)}button:focus-visible{outline:4px solid #855bc7;outline-offset:3px}.character:disabled{cursor:default}.action{background:#182b34;color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:1rem;font-weight:800;cursor:pointer}.status{min-height:1.5em;font-weight:700}@media(max-width:500px){main{padding:18px}.board{padding:15px}.grid{gap:8px}.character{border-radius:10px}h1{margin-top:36px}}
</style></head><body><main><header><a href="../" data-local="../">← ARCADE</a><span>GAME 04 / QUICK EYES</span></header><div class="top"><div><h1>Noun<br>Parade</h1><p>The neighborhood is on the move. Find the character called out before the clock runs out.</p></div><div class="score"><div>FOUND <span id="score">0</span></div><div>TIME <span id="time">30</span>s</div></div></div><section class="board"><div class="prompt"><span>FIND THE <strong id="target">MUSHROOM</strong></span><button class="action" id="start">Start parade →</button></div><div class="grid" id="grid"></div><div class="status" id="status" role="status">You have 30 seconds. Wrong taps cost one point.</div></section></main><script>
const cast=[['🍄','MUSHROOM'],['🐸','FROG'],['🌻','SUNFLOWER'],['🤖','ROBOT'],['🍉','WATERMELON'],['🐙','OCTOPUS'],['🍋','LEMON'],['🐝','BEE'],['🌵','CACTUS'],['🐳','WHALE'],['🍓','STRAWBERRY'],['🦊','FOX']];let score=0,seconds=30,active=false,target,interval;const grid=document.querySelector('#grid'),status=document.querySelector('#status');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function round(){let choices=shuffle(cast).slice(0,8);target=choices[Math.floor(Math.random()*choices.length)];document.querySelector('#target').textContent=target[1];grid.replaceChildren();choices.forEach(c=>{let b=document.createElement('button');b.className='character';b.textContent=c[0];b.setAttribute('aria-label',c[1]);b.disabled=!active;b.onclick=()=>{if(!active)return;if(c===target){score++;status.textContent='Found! Next character coming through.';round()}else{score=Math.max(0,score-1);status.textContent='Oops! Look for the '+target[1].toLowerCase()+'.'}document.querySelector('#score').textContent=score};grid.append(b)})}function start(){clearInterval(interval);score=0;seconds=30;active=true;document.querySelector('#score').textContent=score;document.querySelector('#time').textContent=seconds;document.querySelector('#start').textContent='Restart ↻';status.textContent='Find as many as you can!';round();interval=setInterval(()=>{seconds--;document.querySelector('#time').textContent=seconds;if(seconds<=0){clearInterval(interval);active=false;status.textContent='Parade complete! You found '+score+' character'+(score===1?'':'s')+'. Play again?';[...grid.children].forEach(b=>b.disabled=true)}},1000)}document.querySelector('#start').onclick=start;target=cast[0];round();
</script><script>document.querySelectorAll("a[data-local]").forEach(a => { a.href = a.dataset.local; });</script></body></html>
