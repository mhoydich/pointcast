<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noun Picnic</title><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#cce9da;color:#1e3028;font-family:'Space Grotesk',system-ui,sans-serif}main{max-width:900px;margin:auto;padding:26px 20px 60px}header{display:flex;justify-content:space-between;font-weight:700}a{color:inherit;text-decoration:none;border-bottom:2px solid}h1{font-size:clamp(3rem,8vw,5.8rem);letter-spacing:-.06em;line-height:.9;margin:50px 0 12px}.intro{max-width:580px;font-size:1.1rem;line-height:1.5}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}.scene,.counter{border:2px solid #1e3028;border-radius:22px;padding:22px;background:#fff9e7;box-shadow:4px 5px 0 #1e3028}.scene{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#f7be76}.guest{font-size:8rem;line-height:1.2;filter:drop-shadow(4px 7px 0 #0002)}.speech{background:white;border:2px solid #1e3028;border-radius:17px;padding:13px 20px;font-size:1.25rem;font-weight:700}.counter h2{margin:0 0 8px;font-size:1.4rem}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}button{font:inherit;font-weight:700;cursor:pointer;color:inherit;border:2px solid #1e3028}.food{font-size:2.7rem;background:#fff;border-radius:14px;min-height:85px;box-shadow:2px 3px 0 #1e3028}.food:hover{background:#e6f8d3;transform:translateY(-2px)}.food:disabled{opacity:.55;cursor:default}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pill,.restart{padding:10px 15px;border-radius:99px;border:2px solid #1e3028;font-weight:700;background:white}.restart{background:#e9a3d0}.msg{min-height:30px;font-weight:700}.food:focus-visible,button:focus-visible,a:focus-visible{outline:4px solid #3279cd;outline-offset:3px}@media(max-width:620px){.layout{grid-template-columns:1fr}.scene{min-height:230px}.guest{font-size:6rem}}
.guest img{width:min(190px,45vw);height:auto;border-radius:16px;image-rendering:pixelated;vertical-align:middle}</style></head><body><main><header><a href="../index.html" data-local="../index.html">← Arcade</a><span>02 / NOUN PICNIC</span></header><h1>Lunch is<br>on you.</h1><p class="intro">The Nouns are hungry! Listen to each guest and serve the snack they ask for. Can you make eight friends happy?</p><div class="bar"><span class="pill" id="round">Guest 1 / 8</span><span class="pill" id="score">0 served</span><button class="restart" id="restart">Start over ↻</button></div><div class="layout"><section class="scene"><div class="guest" id="guest">🐸</div><div class="speech" id="request">I'd love a strawberry!</div></section><section class="counter"><h2>Choose a snack</h2><p id="hint">Tap what your guest asked for.</p><div class="choices" id="choices"></div><p class="msg" id="message" aria-live="polite"></p></section></div></main><script>
const guests=[0,1,2,3,4,5,6,7];const snacks=[['🍓','strawberry'],['🍉','watermelon'],['🍪','cookie'],['🍋','lemon'],['🍌','banana'],['🍇','grapes'],['🍒','cherries'],['🥕','carrot']];let round=0,score=0,target,finished=false,answering=false,game=0;const choices=document.querySelector('#choices'),message=document.querySelector('#message');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){game++;round=0;score=0;finished=false;answering=false;message.textContent='';next()}function next(){document.querySelector('#round').textContent=`Guest ${Math.min(round+1,8)} / 8`;document.querySelector('#score').textContent=`${score} served`;if(round>=8){finished=true;document.querySelector('#guest').textContent='🎉';document.querySelector('#request').textContent=`Picnic complete! ${score} of 8 guests served.`;document.querySelector('#hint').textContent='Thanks for helping the Nouns!';choices.innerHTML='';message.textContent='Play again for a new picnic.';return}document.querySelector('#hint').textContent='Tap what your guest asked for.';document.querySelector('#guest').innerHTML=`<img src="../assets/nouns/noun-${String(guests[round]).padStart(4,'0')}.svg" alt="Noun ${guests[round]}" draggable="false">`;target=snacks[Math.floor(Math.random()*snacks.length)];document.querySelector('#request').textContent=`I'd love ${['a','e','i','o','u'].includes(target[1][0])?'an':'a'} ${target[1]}!`;let options=shuffle([target,...shuffle(snacks.filter(x=>x!==target)).slice(0,3)]);choices.innerHTML='';options.forEach(item=>{let button=document.createElement('button');button.className='food';button.textContent=item[0];button.setAttribute('aria-label',item[1]);button.onclick=()=>answer(item);choices.appendChild(button)})}function answer(item){if(finished||answering)return;answering=true;let right=item===target;if(right)score++;message.textContent=right?'Yum! Happy guest. ✨':`Oops! They wanted ${target[0]} ${target[1]}.`;choices.querySelectorAll('button').forEach(b=>b.disabled=true);round++;let currentGame=game;setTimeout(()=>{if(currentGame!==game)return;answering=false;message.textContent='';next()},900)}document.querySelector('#restart').onclick=start;start();
</script><script>document.querySelectorAll("a[data-local]").forEach(a => { a.href = a.dataset.local; });</script></body></html>
