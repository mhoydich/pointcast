<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noun's Flower Quest</title><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#ffecbc;color:#27211d;font-family:'Space Grotesk',system-ui,sans-serif}main{max-width:860px;margin:auto;padding:26px 20px 60px}header{display:flex;justify-content:space-between;font-weight:700}a{color:inherit;text-decoration:none;border-bottom:2px solid}h1{font-size:clamp(3rem,8vw,5.8rem);line-height:.9;letter-spacing:-.06em;margin:50px 0 12px}.subtitle{font-size:1.1rem;max-width:550px;line-height:1.5}.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.pill,button{font:700 1rem 'Space Grotesk',system-ui;border:2px solid #27211d;border-radius:99px;padding:11px 17px;background:white;color:#27211d}.reset{background:#ff755e;cursor:pointer}.play{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:25px;align-items:center}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:10px;background:#86b982;border:2px solid #27211d;border-radius:18px;box-shadow:4px 5px 0 #27211d}.cell{aspect-ratio:1;background:#c9e4a3;border-radius:8px;display:grid;place-items:center;font-size:clamp(1.4rem,6vw,3rem)}.cell.rock{background:#94c78d}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.controls button{padding:10px 0;border-radius:12px;background:#fff8e6;cursor:pointer;font-size:1.3rem}.up{grid-column:2}.left{grid-column:1}.hint{font-size:.9rem;line-height:1.5}.message{min-height:28px;font-weight:700;margin:18px 0}.controls button:focus-visible,button:focus-visible,a:focus-visible{outline:4px solid #3279cd;outline-offset:3px}@media(max-width:600px){.play{grid-template-columns:1fr}.controls{width:180px;margin:auto}.hint{text-align:center}}
.noun-art{display:block;width:90%;height:90%;object-fit:contain;image-rendering:pixelated;border-radius:8px}</style></head><body><main><header><a href="../index.html" data-local="../index.html">← Arcade</a><span>01 / FLOWER QUEST</span></header><h1>Hop to it.</h1><p class="subtitle">Noun 1 has a big delivery to make. Guide them around the stones and find the flower in each garden.</p><div class="stats"><span class="pill" id="level">Garden 1 / 5</span><span class="pill" id="moves">0 hops</span><button class="reset" id="reset">Restart garden ↻</button></div><div class="play"><div class="board" id="board" aria-label="Garden maze"></div><div><div class="controls"><button class="up" data-direction="up" aria-label="Move up">↑</button><button class="left" data-direction="left" aria-label="Move left">←</button><button data-direction="down" aria-label="Move down">↓</button><button data-direction="right" aria-label="Move right">→</button></div><p class="hint">Tap the arrows or use your keyboard. Stones block your way.</p></div></div><p class="message" id="message" aria-live="polite">Your flower is waiting! 🌼</p></main><script>
const levels=[{start:[0,0],goal:[5,5],rocks:[[1,0],[1,1],[1,2],[3,1],[3,2],[3,3],[4,3]]},{start:[0,5],goal:[5,0],rocks:[[1,5],[1,4],[1,3],[3,4],[3,3],[3,2],[4,2]]},{start:[0,0],goal:[5,5],rocks:[[0,2],[1,2],[2,2],[3,2],[3,3],[3,4],[5,3]]},{start:[5,0],goal:[0,5],rocks:[[4,0],[4,1],[4,2],[2,1],[2,2],[2,3],[1,3],[4,4]]},{start:[0,0],goal:[5,5],rocks:[[1,0],[1,1],[1,2],[1,3],[3,1],[3,2],[3,3],[3,4],[4,4]]}];let level=0,pos,moves=0,done=false;const board=document.querySelector('#board'),msg=document.querySelector('#message');function reset(){pos=[...levels[level].start];moves=0;done=false;msg.textContent='Your flower is waiting! 🌼';render()}function render(){document.querySelector('#level').textContent=`Garden ${level+1} / 5`;document.querySelector('#moves').textContent=`${moves} ${moves===1?'hop':'hops'}`;board.innerHTML='';for(let y=0;y<6;y++)for(let x=0;x<6;x++){let c=document.createElement('div'),rock=levels[level].rocks.some(([rx,ry])=>rx===x&&ry===y);c.className='cell'+(rock?' rock':'');if(pos[0]===x&&pos[1]===y){c.innerHTML='<img class="noun-art" src="../assets/nouns/noun-0001.svg" alt="" draggable="false">';c.setAttribute('aria-label','Noun 1')}else c.textContent=levels[level].goal[0]===x&&levels[level].goal[1]===y?'🌼':rock?'🪨':'';board.appendChild(c)}}function move(dx,dy){if(done)return;let x=pos[0]+dx,y=pos[1]+dy;if(x<0||x>5||y<0||y>5||levels[level].rocks.some(([rx,ry])=>rx===x&&ry===y)){msg.textContent='There’s a stone or a garden edge there!';return}pos=[x,y];moves++;if(x===levels[level].goal[0]&&y===levels[level].goal[1]){if(level===4){done=true;msg.textContent=`All five flowers found! Wonderful hopping. 🎉`;render();return}level++;pos=[...levels[level].start];moves=0;msg.textContent='A flower found! On to the next garden. ✨'}else msg.textContent='Keep hopping!';render()}const directions={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>move(...directions[b.dataset.direction]));window.addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){e.preventDefault();move(...directions[k])}});document.querySelector('#reset').onclick=reset;reset();
</script><script>document.querySelectorAll("a[data-local]").forEach(a => { a.href = a.dataset.local; });</script></body></html>
