<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noun Neighbors · Memory</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4eddb;color:#24211f;font-family:system-ui,sans-serif}main{max-width:830px;margin:auto;padding:24px}a{color:#24211f;font-weight:800;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center}header span{font-size:12px;letter-spacing:.15em;font-weight:900}h1{font-size:clamp(2.6rem,9vw,5rem);letter-spacing:-.07em;line-height:.95;margin:48px 0 12px}p{line-height:1.5}.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:end}.stats{display:flex;gap:10px}.stat{background:#fff;border:2px solid #24211f;border-radius:12px;padding:10px 16px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}.card{aspect-ratio:1;border:3px solid #24211f;background:#e9a35e;border-radius:16px;cursor:pointer;box-shadow:3px 4px 0 #24211f;display:grid;place-items:center;transition:transform .15s;background-image:radial-gradient(#f7c78b 18%,transparent 19%);background-size:20px 20px}.card:hover{transform:translateY(-3px)}.card:focus-visible,button:focus-visible{outline:4px solid #8762db;outline-offset:3px}.card span{font-size:clamp(2rem,7vw,4rem);filter:drop-shadow(0 3px 0 #2223)}.card.hidden span{visibility:hidden}.card.hidden:after{content:'?';font-weight:1000;font-size:2rem}.card.matched{background:#b9dcbc;box-shadow:none;transform:translate(3px,4px)}button.action{background:#262220;color:white;border:0;border-radius:10px;padding:14px 20px;font-weight:800;font-size:1rem;cursor:pointer}.note{min-height:1.5em;font-weight:700}@media(max-width:500px){main{padding:18px}.grid{gap:7px}.card{border-radius:10px}.stat{padding:8px}h1{margin-top:36px}}
</style></head><body><main><header><a href="../" data-local="../">← ARCADE</a><span>GAME 03 / MEMORY</span></header><div class="top"><div><h1>Noun<br>Neighbors</h1><p>These little characters got mixed up. Find each pair and bring the neighbors back together.</p></div><div class="stats"><div class="stat">PAIRS <b id="pairs">0 / 8</b></div><div class="stat">MOVES <b id="moves">0</b></div></div></div><div class="grid" id="grid" aria-label="Memory cards"></div><p class="note" id="message" role="status">Pick two cards to start.</p><button class="action" id="reset">Shuffle & play again ↻</button></main><script>
const faces=['🍄','🐸','🌻','🤖','🍉','🐙','🍋','🐝'];let cards=[],open=[],moves=0,pairs=0,locked=false,timer;const grid=document.querySelector('#grid'),msg=document.querySelector('#message');function init(){clearTimeout(timer);cards=[...faces,...faces].map((face,i)=>({face,id:i,matched:false}));for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}open=[];moves=0;pairs=0;locked=false;msg.textContent='Pick two cards to start.';render()}function render(){document.querySelector('#pairs').textContent=pairs+' / 8';document.querySelector('#moves').textContent=moves;grid.replaceChildren();cards.forEach((c,i)=>{const b=document.createElement('button');b.className='card '+(c.matched?'matched':open.includes(i)?'':'hidden');b.setAttribute('aria-label',c.matched?'Matched '+c.face:open.includes(i)?c.face:'Hidden card '+(i+1));b.disabled=c.matched;b.innerHTML='<span>'+c.face+'</span>';b.onclick=()=>choose(i);grid.append(b)})}function choose(i){if(locked||open.includes(i)||cards[i].matched)return;open.push(i);render();if(open.length<2)return;moves++;if(cards[open[0]].face===cards[open[1]].face){cards[open[0]].matched=cards[open[1]].matched=true;pairs++;open=[];msg.textContent=pairs===8?'All neighbors reunited! Nice work.':'A perfect pair!';render()}else{locked=true;msg.textContent='Not quite — remember those faces.';render();timer=setTimeout(()=>{open=[];locked=false;render()},800)}}document.querySelector('#reset').onclick=init;init();
</script><script>document.querySelectorAll("a[data-local]").forEach(a => { a.href = a.dataset.local; });</script></body></html>
