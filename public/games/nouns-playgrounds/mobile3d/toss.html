<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#abe6d2"><title>Fruit Toss — Nouns Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#abe6d2;color:#26343c;font:600 16px system-ui,sans-serif;text-align:center}header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:680px;margin:auto}a{color:inherit}main{max-width:680px;margin:auto;padding:0 14px 24px}h1{font-size:clamp(30px,7vw,48px);margin:8px 0 0;letter-spacing:-.05em}p{margin:8px auto 16px}canvas{display:block;width:100%;height:min(65vh,560px);min-height:360px;border-radius:24px;background:#e6f8ed;touch-action:manipulation}button{font:inherit;background:#26343c;color:white;border:0;border-radius:99px;padding:12px 22px;margin:14px 4px;cursor:pointer}</style></head><body><header><a href="index.html" data-local="index.html">← 3D arcade</a><span id="score">0 / 10</span></header><main><h1>Fruit Toss</h1><p>Tap when the fruit lines up with the basket. You get 10 throws!</p><canvas id="game" aria-label="Fruit Toss. Tap when the moving fruit lines up with the basket."></canvas><button id="throw">Throw fruit</button><button id="restart">Restart</button><p id="status" aria-live="polite">Time your toss!</p></main><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),score=document.getElementById('score'),status=document.getElementById('status');let w,h,aim,dir,shots,hits,flight,last;function resize(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;w=r.width;h=r.height;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}function reset(){aim=-.8;dir=1;shots=0;hits=0;flight=null;score.textContent='0 / 10';status.textContent='Time your toss!'}function shoot(){if(flight||shots>=10)return;shots++;flight={x:aim,t:0,hit:Math.abs(aim)<.23};status.textContent='Flying!'}function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function draw(t){let dt=Math.min((t-(last||t))/1000,.04);last=t;if(!flight&&shots<10){aim+=dir*dt*1.35;if(aim>.9||aim<-.9)dir*=-1}ctx.clearRect(0,0,w,h);ctx.fillStyle='#c2ebd1';ctx.beginPath();ctx.moveTo(0,h*.84);ctx.lineTo(w*.3,h*.3);ctx.lineTo(w*.7,h*.3);ctx.lineTo(w,h*.84);ctx.closePath();ctx.fill();ctx.strokeStyle='#a4d8b7';ctx.lineWidth=2;for(let i=0;i<5;i++){let y=h*(.38+i*.11),half=w*(.22+i*.07);ctx.beginPath();ctx.moveTo(w/2-half,y);ctx.lineTo(w/2+half,y);ctx.stroke()}const bx=w/2,by=h*.32;ctx.fillStyle='#dd9a5f';ctx.beginPath();ctx.moveTo(bx-42,by);ctx.lineTo(bx+42,by);ctx.lineTo(bx+32,by+46);ctx.lineTo(bx-32,by+46);ctx.closePath();ctx.fill();ctx.fillStyle='#9b623e';ctx.beginPath();ctx.ellipse(bx,by,42,12,0,0,7);ctx.fill();let x=w/2+aim*w*.36,y=h*.77,r=24;if(flight){flight.t+=dt*1.1;let p=Math.min(flight.t,1);x=w/2+flight.x*w*.36*(1-p*.55);y=h*.77-(h*.45*p)-Math.sin(Math.PI*p)*h*.19;r=24-12*p;if(p>=1){if(flight.hit){hits++;status.textContent='Sweet shot!'}else status.textContent='Almost! Try again.';flight=null;score.textContent=hits+' points · '+shots+' / 10';if(shots===10)status.textContent=`Game over! ${hits} out of 10. Tap restart to play again.`}}circle(x,y,r,'#fa735d');circle(x-r*.3,y-r*.2,r*.12,'#583f37');circle(x+r*.3,y-r*.2,r*.12,'#583f37');ctx.strokeStyle='#55844d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+4,y-r-8);ctx.stroke();ctx.fillStyle='#476b61';ctx.font='bold 13px system-ui';ctx.textAlign='center';if(!flight&&shots<10)ctx.fillText('TAP TO TOSS',w/2,h*.93);requestAnimationFrame(draw)}canvas.addEventListener('pointerdown',shoot);document.getElementById('throw').onclick=shoot;document.getElementById('restart').onclick=reset;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();shoot()}});window.addEventListener('resize',resize);reset();resize();requestAnimationFrame(draw);
</script><script>document.querySelectorAll("a[data-local]").forEach(a => { a.href = a.dataset.local; });</script></body></html>
