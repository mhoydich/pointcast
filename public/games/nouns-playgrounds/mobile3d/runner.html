<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#a9e4f4"><title>Bean Dash — Nouns Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f3e8;color:#241b37;font-family:ui-rounded,system-ui,sans-serif}main{max-width:700px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#483863;font-weight:800;text-decoration:none}h1{font-size:clamp(1.5rem,6vw,2.4rem);margin:.25rem 0}p{margin:.25rem 0 .8rem;color:#625572}.stage{position:relative;overflow:hidden;border:4px solid #241b37;border-radius:24px;box-shadow:0 7px 0 #241b37;background:#afe4f1}canvas{display:block;width:100%;height:min(60vh,510px);touch-action:none}.hud{position:absolute;top:13px;left:13px;display:flex;gap:7px;pointer-events:none}.pill{background:#fff;border:2px solid #241b37;border-radius:100px;padding:6px 12px;font-weight:900}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#241b3744;text-align:center;padding:20px}.overlay[hidden]{display:none}.card{background:#fff8e8;border:3px solid #241b37;border-radius:22px;padding:22px;box-shadow:0 6px 0 #241b37;max-width:310px}.card h2{margin:0 0 8px;font-size:2rem}.card p{margin:0 0 15px}button{cursor:pointer;background:#ffce4f;color:#241b37;border:3px solid #241b37;border-radius:15px;font:900 1.1rem system-ui;padding:10px 20px;box-shadow:0 4px 0 #241b37}button:active{transform:translateY(3px);box-shadow:0 1px 0 #241b37}.controls{display:flex;gap:12px;justify-content:center;padding:17px}.controls button{width:100px;background:#fff}.hint{text-align:center;font-size:.9rem}
</style></head><body><main><header><a href="index.html">← 3D arcade</a><span>☕ Nouns Arcade</span></header><h1>Bean Dash</h1><p>Help a speedy coffee cup collect beans and dodge crates.</p><div class="stage"><canvas id="game" aria-label="Bean Dash game"></canvas><div class="hud"><span class="pill" id="score">Beans 0</span><span class="pill" id="distance">0 m</span></div><div class="overlay" id="overlay"><div class="card"><h2 id="title">Ready to roll?</h2><p id="message">Switch lanes to collect beans. Watch out for crates!</p><button id="start">Let's go!</button></div></div></div><div class="controls"><button id="left" aria-label="Move left">←</button><button id="right" aria-label="Move right">→</button></div><p class="hint">Tap the arrows, swipe, or use your keyboard's arrow keys.</p></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),distEl=document.querySelector('#distance');let w,h,dpr,run=false,objects=[],lane=1,displayLane=1,score=0,distance=0,last=0,spawn=0,speed=0.3,roadOffset=0;function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();function move(d){if(run)lane=Math.max(0,Math.min(2,lane+d))}document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();move(1)}});let startX=0;canvas.addEventListener('pointerdown',e=>{startX=e.clientX});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-startX;if(Math.abs(dx)>20)move(dx<0?-1:1);else move(e.offsetX<w/2?-1:1)});function start(){objects=[];lane=displayLane=1;score=distance=spawn=roadOffset=0;speed=.3;last=0;run=true;overlay.hidden=true;requestAnimationFrame(tick)}document.querySelector('#start').onclick=start;function lose(){run=false;document.querySelector('#title').textContent='Nice run!';document.querySelector('#message').textContent=`You collected ${score} beans and dashed ${Math.floor(distance)} meters.`;document.querySelector('#start').textContent='Run again';overlay.hidden=false}function project(l,z){let t=1-z;return {x:w/2+(l-1)*w*.33*t,y:h*.23+h*.72*t,s:.12+t*.95}}function rounded(x,y,ww,hh,r,fill,stroke='#241b37',line=2){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fill();if(line)ctx.stroke()}function draw(){ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#9cdcea');sky.addColorStop(.55,'#d8f4ea');sky.addColorStop(.55,'#92d893');sky.addColorStop(1,'#74bf80');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff9';for(let i=0;i<3;i++){let x=(i*w*.4+70)%w;ctx.beginPath();ctx.ellipse(x,h*.12+(i%2)*20,40,12,0,0,7);ctx.fill()}ctx.fillStyle='#f5c45e';ctx.beginPath();ctx.moveTo(w*.43,h*.23);ctx.lineTo(w*.57,h*.23);ctx.lineTo(w*1.12,h);ctx.lineTo(-w*.12,h);ctx.closePath();ctx.fill();for(let l=0;l<2;l++){ctx.strokeStyle='#fff7dc99';ctx.lineWidth=3;ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(w/2+(l-.5)*w*.045,h*.23);ctx.lineTo(w/2+(l-.5)*w*.37,h);ctx.stroke();ctx.setLineDash([])}for(const o of [...objects].sort((a,b)=>b.z-a.z)){let p=project(o.lane,o.z);if(o.type==='crate'){let s=42*p.s;rounded(p.x-s/2,p.y-s,s,s,4*p.s,'#d1784e','#57362e',2*p.s);ctx.strokeStyle='#ffd397';ctx.lineWidth=3*p.s;ctx.beginPath();ctx.moveTo(p.x-s*.35,p.y-s*.8);ctx.lineTo(p.x+s*.35,p.y-s*.2);ctx.moveTo(p.x+s*.35,p.y-s*.8);ctx.lineTo(p.x-s*.35,p.y-s*.2);ctx.stroke()}else{ctx.fillStyle='#6a3b30';ctx.beginPath();ctx.ellipse(p.x,p.y-14*p.s,10*p.s,15*p.s,.35,0,7);ctx.fill();ctx.strokeStyle='#d9a17a';ctx.lineWidth=2*p.s;ctx.beginPath();ctx.moveTo(p.x-2*p.s,p.y-25*p.s);ctx.quadraticCurveTo(p.x+4*p.s,p.y-14*p.s,p.x-2*p.s,p.y-3*p.s);ctx.stroke()}}let p=project(displayLane,.04),s=Math.min(w/400,1.3);ctx.fillStyle='#43324b55';ctx.beginPath();ctx.ellipse(p.x,h*.94,34*s,10*s,0,0,7);ctx.fill();rounded(p.x-25*s,h*.83,50*s,49*s,7*s,'#f6eee2','#241b37',3*s);rounded(p.x-30*s,h*.81,60*s,10*s,4*s,'#e65341','#241b37',2*s);ctx.strokeStyle='#241b37';ctx.lineWidth=5*s;ctx.beginPath();ctx.arc(p.x+26*s,h*.85,10*s,-1.3,1.3);ctx.stroke();ctx.fillStyle='#241b37';ctx.beginPath();ctx.arc(p.x-8*s,h*.865,2.5*s,0,7);ctx.arc(p.x+8*s,h*.865,2.5*s,0,7);ctx.fill();ctx.beginPath();ctx.arc(p.x,h*.87,7*s,.2,Math.PI-.2);ctx.stroke();}
function tick(t){if(!run)return;if(!last)last=t;let dt=Math.min((t-last)/1000,.05);last=t;distance+=dt*12;speed=Math.min(.48,.3+distance*.00025);displayLane+=(lane-displayLane)*Math.min(1,dt*13);spawn-=dt;if(spawn<=0){let safe=Math.floor(Math.random()*3);for(let l=0;l<3;l++){if(l!==safe&&Math.random()<.65)objects.push({lane:l,z:1,type:'crate'});else if(Math.random()<.6)objects.push({lane:l,z:1,type:'bean'})}spawn=1.35}for(const o of objects){o.z-=dt*speed;if(o.z<.12&&!o.hit){o.hit=true;if(o.lane===lane){if(o.type==='crate'){lose();break}else score++}}}objects=objects.filter(o=>o.z>-.1&&!((o.hit)&&o.type==='bean'&&o.lane===lane));scoreEl.textContent=`Beans ${score}`;distEl.textContent=`${Math.floor(distance)} m`;draw();if(run)requestAnimationFrame(tick)}draw();
</script></body></html>
