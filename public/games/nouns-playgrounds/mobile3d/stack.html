<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8c9a7"><title>Cloud Stack — Nouns Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#f8c9a7;color:#27243a;font:600 16px system-ui,sans-serif;text-align:center}header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:680px;margin:auto}a{color:inherit}main{max-width:680px;margin:auto;padding:0 14px 24px}h1{font-size:clamp(30px,7vw,48px);margin:8px 0 0;letter-spacing:-.05em}p{margin:8px auto 16px}canvas{display:block;width:100%;height:min(65vh,560px);min-height:360px;border-radius:24px;background:#ffe9d5;touch-action:manipulation}button{font:inherit;background:#26233a;color:white;border:0;border-radius:99px;padding:12px 22px;margin:14px 4px;cursor:pointer}.score{font-size:18px}</style></head><body><header><a href="index.html">← 3D arcade</a><span class="score" id="score">0 blocks</span></header><main><h1>Cloud Stack</h1><p>Tap to stack a sky-high tower. Line up each block!</p><canvas id="game" aria-label="Cloud Stack game. Tap to place a moving block."></canvas><button id="place">Place block</button><button id="restart">Restart</button><p id="status" aria-live="polite">Build as high as you can.</p></main><script>
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d'), score=document.getElementById('score'), status=document.getElementById('status');
let layers, moving, count, over, last, width=600,height=520;
const palette=['#ff806f','#ffcc62','#72c9a3','#83a7ef','#c594db','#f2a9bc'];
function reset(){layers=[{x:0,w:180}];count=0;over=false;moving={x:-180,w:180,dir:1};status.textContent='Build as high as you can.';score.textContent='0 blocks';}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;width=r.width;height=r.height;canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0)}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill()}
function block(x,y,w,color){const scale=Math.min(width/440,1.12), depth=33*scale, bh=24*scale, X=width/2+x*scale, W=w*scale;poly([[X-W/2,y],[X,y-depth/2],[X+W/2,y],[X,y+depth/2]],color);poly([[X-W/2,y],[X,y+depth/2],[X,y+depth/2+bh],[X-W/2,y+bh]],'#cf766a');poly([[X,y+depth/2],[X+W/2,y],[X+W/2,y+bh],[X,y+depth/2+bh]],'#ad5d69')}
function place(){if(over){reset();return}const prev=layers[layers.length-1],left=Math.max(prev.x-prev.w/2,moving.x-moving.w/2),right=Math.min(prev.x+prev.w/2,moving.x+moving.w/2);if(right-left<8){over=true;status.textContent=`Tower complete! ${count} blocks. Tap or press restart to play again.`;return}layers.push({x:(left+right)/2,w:right-left});count++;score.textContent=count+' '+(count===1?'block':'blocks');moving={x:-190,w:right-left,dir:1};status.textContent=count%5===0?'Lovely tower! Keep going.':'Nice placement!';}
function frame(t){const dt=Math.min((t-(last||t))/1000,.04);last=t;if(!over){moving.x+=moving.dir*(100+count*6)*dt;if(moving.x>190||moving.x< -190)moving.dir*=-1}ctx.clearRect(0,0,width,height);ctx.fillStyle='#fff5ea';for(let i=0;i<5;i++){let x=(i*131+30)%width,y=50+i*42;ctx.beginPath();ctx.ellipse(x,y,30,12,0,0,7);ctx.fill()}const spacing=26*Math.min(width/440,1.12),shown=10,start=Math.max(0,layers.length-shown),base=height-90;for(let i=start;i<layers.length;i++){let y=base-(i-start)*spacing;block(layers[i].x,y,layers[i].w,palette[i%palette.length])}if(!over)block(moving.x,base-(layers.length-start)*spacing,moving.w,palette[layers.length%palette.length]);else{ctx.fillStyle='#27243a';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('Tower complete!',width/2,55)}requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',place);document.getElementById('place').onclick=place;document.getElementById('restart').onclick=reset;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();place()}});window.addEventListener('resize',resize);reset();resize();requestAnimationFrame(frame);
</script></body></html>
