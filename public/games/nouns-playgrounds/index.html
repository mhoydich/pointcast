<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f4e7"><title>Nouns Playgrounds</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f8f4e7;color:#29241e;font-family:'DM Sans',system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px 28px 80px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #29241e;padding-bottom:20px;font-weight:700}header span{font:700 20px 'Space Grotesk',sans-serif;letter-spacing:-1px}header small{font-size:12px;letter-spacing:.12em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:30px;padding:65px 0 50px}.tag{display:inline-block;background:#ffd766;border:2px solid #29241e;border-radius:30px;padding:8px 14px;font-weight:700;font-size:13px;transform:rotate(-2deg)}h1{font:700 clamp(52px,8vw,100px)/.92 'Space Grotesk',sans-serif;letter-spacing:-.07em;margin:25px 0}h1 em{color:#eb5c45;font-style:normal}.hero p{font-size:19px;line-height:1.5;max-width:460px}.art{height:300px;position:relative}.blob{position:absolute;width:210px;height:210px;border:3px solid #29241e;border-radius:45% 55% 45% 55%;display:grid;place-items:center;font-size:100px;box-shadow:7px 8px 0 #29241e}.blob:nth-child(1){background:#f4a695;left:4%;top:8%;transform:rotate(-12deg)}.blob:nth-child(2){background:#b9d9c4;right:0;top:20%;transform:rotate(10deg)}.section{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #29241e;margin-bottom:22px}.section h2{font:700 27px 'Space Grotesk',sans-serif;margin:0 0 12px}.section p{font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:2px solid #29241e;border-radius:18px;background:white;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:6px 6px 0 #29241e}.card:focus-visible{outline:3px solid #eb5c45;outline-offset:3px}.visual{height:190px;display:grid;place-items:center;font-size:100px;border-bottom:2px solid #29241e}.info{padding:20px}.num{font-size:11px;letter-spacing:.12em;font-weight:700;text-transform:uppercase}.info h3{font:700 24px 'Space Grotesk',sans-serif;margin:10px 0 5px}.info p{color:#625b52;line-height:1.45;min-height:44px;margin:0 0 16px}.play{font-weight:700}.card:nth-child(1) .visual{background:#f5b6a8}.card:nth-child(2) .visual{background:#b9d9c4}.card:nth-child(3) .visual{background:#ffd773}.card:nth-child(4) .visual{background:#b9c4ee}.card:nth-child(5) .visual{background:#edc5df}footer{margin-top:70px;border-top:2px solid #29241e;padding-top:20px;display:flex;justify-content:space-between;font-size:13px;font-weight:700}@media(max-width:700px){main{padding:22px 18px 60px}.hero{grid-template-columns:1fr;padding:45px 0 25px}.art{height:205px}.blob{width:150px;height:150px;font-size:75px}.grid{grid-template-columns:1fr 1fr}.visual{height:140px;font-size:75px}header small{display:none}}@media(max-width:440px){.grid{grid-template-columns:1fr}.visual{height:170px}}
</style></head><body><main><header><span>◼ NOUNS PLAYGROUNDS</span><small>A little world of play · 01—05</small></header><section class="hero"><div><span class="tag">Five tiny worlds. Big character.</span><h1>Come out<br>and <em>play.</em></h1><p>Meet a bunch of curious little Nouns and jump into five games made for a quick moment of joy.</p></div><div class="art" aria-hidden="true"><div class="blob">🐸</div><div class="blob">🍄</div></div></section><div class="section"><h2>Pick your playground</h2><p>FIND YOUR GAME ↓</p></div><div class="grid" id="games"></div><footer><span>Made for curious minds.</span><span>GO PLAY ↗</span></footer></main><script>
const games = [
  {path:'game1/', emoji:'🐸', kind:'Maze', name:"Frog's Flower Quest", description:'Guide a curious frog through five little garden mazes.'},
  {path:'game2/', emoji:'🍉', kind:'Matching', name:'Noun Picnic', description:'Match each hungry guest with the snack they love.'},
  {path:'game3/', emoji:'🍄', kind:'Memory', name:'Noun Neighbors', description:'Meet a colorful neighborhood and find the matching pairs.'},
  {path:'game4/', emoji:'🐝', kind:'Spotting', name:'Noun Parade', description:'Find the right character in a bustling, timed parade.'},
  {path:'game5/', emoji:'🌱', kind:'Quick reflexes', name:'Sprout Sprint', description:'Catch garden friends in a quick thirty-second sprint.'},
  {path:'mobile3d/', emoji:'🎲', kind:'3D arcade', name:'Pocket Worlds', description:'Explore three more playful games made for mobile.'}
];
document.querySelector('#games').innerHTML = games.map((g,i)=>`<a class="card" href="${g.path}"><div class="visual" aria-hidden="true">${g.emoji}</div><div class="info"><span class="num">Game 0${i+1} / ${g.kind}</span><h3>${g.name}</h3><p>${g.description}</p><span class="play">Let's play ↗</span></div></a>`).join('');
</script></body></html>
