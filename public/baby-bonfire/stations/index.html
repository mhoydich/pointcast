<style>
:root{
  /* Layout: controls on top, one long room you pan sideways (one panel per phone screen), the offer underneath. */
  --ink:#17112b;      /* page ground, deep aubergine */
  --ink-2:#251a44;    /* raised surfaces */
  --paper:#fff4e2;    /* text */
  --muted:#b9a9d6;    /* secondary text */
  --ember:#ff7a3d;    /* accent, the glow */
  --sun:#ffc94a;
  --sea:#2fb8ac;
  --berry:#e0457b;
  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:12px 0 18px}
.pad{padding:0 16px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:28px;line-height:1;margin:0;letter-spacing:.01em;font-weight:800;text-wrap:balance}
h1 span{color:var(--ember)}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:44ch}
.mute{flex:none;background:var(--ink-2);border:1.5px solid #4a3a78;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.mute i{width:9px;height:9px;border-radius:50%;background:var(--sea);display:block}
.mute[aria-pressed="true"] i{background:#6b5c8f}
.controls{display:flex;flex-direction:column;gap:8px}
.chips .lab{flex:none;width:50px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips button{background:transparent;border:1.5px solid #4a3a78;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--paper)}
.chips button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#2a1a08}
#time button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#062a27}
.room{display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:#0e0a1c;border-block:2px solid #0e0a1c}
.room::-webkit-scrollbar{display:none}
.panel{flex:0 0 min(100%,390px);margin:0;position:relative}
.panel canvas{display:block;width:100%;aspect-ratio:380/400;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.panel canvas:focus-visible{outline-offset:-4px}
.panel figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 9px;font-size:13px;font-weight:600;color:#fff8ea;background:linear-gradient(transparent,rgba(14,8,30,.72));pointer-events:none;min-height:52px;display:flex;align-items:flex-end;text-wrap:balance}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{background:var(--ink-2);border:1.5px solid transparent;border-radius:12px;padding:8px 4px 7px;font-family:var(--display);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button[aria-current="true"]{border-color:#6b5aa6}
.tabs small{font-family:var(--body);font-weight:500;font-size:10.5px;color:var(--muted);min-height:14px;letter-spacing:.02em}
.tabs button.inviting small{color:var(--sun)}
.tabs button.inviting::before{content:"";position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px 3px rgba(255,122,61,.7);animation:breathe 3.6s ease-in-out infinite}
.tabs button.passed{opacity:.62}
.tabs button.passed small{text-decoration:line-through}
@keyframes breathe{50%{opacity:.35}}
.offer{background:var(--ink-2);border-radius:16px;padding:10px 14px;display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:5px solid var(--ember)}
.offer.none{border-left-color:#4a3a78}
.offer div{flex:1 1 200px;min-width:0}
.offer h2{font-family:var(--display);font-size:17px;margin:0 0 2px;font-weight:800}
.offer p{margin:0;color:#e6dbfa;font-size:14px}
.acts{display:flex;gap:8px;flex:none}
.btn{border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;border:1.5px solid #6b5aa6;background:transparent}
.btn.go{background:var(--ember);border-color:var(--ember);color:#2a0f02}
.btn[hidden]{display:none}
.learn{font-size:12.5px;color:var(--muted);margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:20px}
.learn button{background:none;border:0;padding:0;color:var(--sun);text-decoration:underline;font-size:12.5px}
footer{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (min-width:800px){
  .wrap{padding-top:22px;gap:14px}
  h1{font-size:36px}
  .room{border-radius:18px;margin:0 16px;border:2px solid #0e0a1c}
  .tabs{max-width:520px}
}
@media (prefers-reduced-motion:reduce){
  .tabs button.inviting::before{animation:none}
}

/* PointCast: the way back to the Baby Bonfire street. Added on import; the scene below is unchanged. */
.bb-back{display:block;box-sizing:border-box;height:32px;padding:9px 16px 0;font:600 12px/14px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;color:inherit;text-decoration:none;opacity:.82}

<body>
<a class="bb-back" href="/baby-bonfire/">&larr; Back to the street</a>
<div class="wrap">
  <header class="pad">
    <div>
      <h1>Stations<span>.</span></h1>
      <p class="sub">Four places that like company. Sound starts on your first tap.</p>
    </div>
    <button class="mute" id="mute" type="button" aria-pressed="false"><i></i><span>Sound on</span></button>
  </header>

  <div class="controls pad">
    <div class="chips" id="weather" role="group" aria-labelledby="lw"><span class="lab" id="lw">Outside</span>
        <button type="button" data-w="fog">Fog</button>
        <button type="button" data-w="clear">Clear after rain</button>
        <button type="button" data-w="wind">Windy</button>
        <button type="button" data-w="hot">Hot, still</button>
        <button type="button" data-w="swell">Big swell</button>
        <button type="button" data-w="night">Night</button>
        <button type="button" data-w="plain">Nothing much</button>
    </div>
    <div class="chips" id="time" role="group" aria-labelledby="lt"><span class="lab" id="lt">Time</span>
        <button type="button" data-t="dawn">Dawn</button>
        <button type="button" data-t="midday">Midday</button>
        <button type="button" data-t="dusk">Dusk</button>
        <button type="button" data-t="night">Night</button>
    </div>
  </div>

  <div class="room" id="room" aria-label="The house, four stations side by side">
    <figure class="panel"><canvas id="c0" width="760" height="800" tabindex="0" role="application" aria-label="Drum station. Press D for the drum, B for the block."></canvas><figcaption id="cap0"></figcaption></figure>
    <figure class="panel"><canvas id="c1" width="760" height="800" tabindex="0" role="application" aria-label="Voice station. Hold Space to hum, arrow keys bend the note."></canvas><figcaption id="cap1"></figcaption></figure>
    <figure class="panel"><canvas id="c2" width="760" height="800" tabindex="0" role="application" aria-label="Dance station. Press Space to step."></canvas><figcaption id="cap2"></figcaption></figure>
    <figure class="panel"><canvas id="c3" width="760" height="800" tabindex="0" role="application" aria-label="Stretch station. Hold the up arrow to reach."></canvas><figcaption id="cap3"></figcaption></figure>
  </div>

  <nav class="tabs pad" id="tabs" aria-label="Stations">
    <button type="button" data-i="0">Drum<small></small></button>
    <button type="button" data-i="1">Voice<small></small></button>
    <button type="button" data-i="2">Dance<small></small></button>
    <button type="button" data-i="3">Stretch<small></small></button>
  </nav>

  <div class="pad">
    <section class="offer" id="offer" aria-live="polite">
      <div><h2 id="offerT"></h2><p id="offerR"></p></div>
      <div class="acts">
        <button class="btn go" id="show" type="button">Show me</button>
        <button class="btn" id="pass" type="button">Walk past</button>
      </div>
    </section>
  </div>
  <p class="learn pad"><span id="learnT"></span><button type="button" id="reset" hidden>Start a new day</button></p>

  <footer class="pad"><span>The tiles feel heat, light, vibration and footfall. No cameras, no microphones, no screens.</span><span>Concept sketch, Nov 2026</span></footer>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var W=380,H=400,FY=262,TAU=Math.PI*2;
var RM=window.matchMedia('(prefers-reduced-motion: reduce)');
var reduce=RM.matches; if(RM.addEventListener)RM.addEventListener('change',function(e){reduce=e.matches});
function clock(){return performance.now()/1000}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function pmod(a,n){return ((a%n)+n)%n}
function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function rgb(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')'}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ---------- state ---------- */
var NAMES=['Drum','Voice','Dance','Stretch'];
var WEATHER={
  fog:{st:0,why:"Fog's in. Make your own warmth and noise."},
  clear:{st:3,why:"First clear morning after rain. The window's open. Reach into it.",time:'dawn'},
  wind:{st:1,why:"The chimes are already going. Join in."},
  hot:{st:2,why:"Nothing out there is moving. Somebody should.",time:'dusk'},
  swell:{st:0,why:"The sea is thumping the shore. Answer it."},
  night:{st:1,why:"The house is quiet enough to hum in.",time:'night'},
  plain:{st:-1,why:""}
};
var TIMES={
  dawn:{st:3,why:"Dawn. Reach before the day asks for anything.",w1:[236,128,138],w2:[250,188,150],fl:[178,98,72],dim:0},
  midday:{st:0,why:"Midday. Drum break.",w1:[16,146,150],w2:[88,198,166],fl:[198,124,60],dim:0},
  dusk:{st:2,why:"Dusk. Shake the day out of your shoes.",w1:[150,44,122],w2:[238,106,70],fl:[130,58,76],dim:.08},
  night:{st:1,why:"Night. Hum the house quiet.",w1:[30,26,94],w2:[60,42,124],fl:[46,34,78],dim:.3}
};
var S={weather:'fog',time:'midday',walked:{},muted:false,invite:-1,why:''};
var cur={w1:TIMES.midday.w1.slice(),w2:TIMES.midday.w2.slice(),fl:TIMES.midday.fl.slice(),dim:0};
var amb=7.3; /* ambient animation time; frozen when motion is reduced */

/* ---------- audio ---------- */
var ac=null,master=null,noiseBuf=null,ghostBus=null;
function audio(){
  if(!ac){
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return null;
    try{ac=new AC({latencyHint:'interactive'})}catch(e){try{ac=new AC()}catch(e2){return null}}
    master=ac.createGain(); master.gain.value=S.muted?0:.9;
    var comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=5;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    ghostBus=ac.createGain(); ghostBus.gain.value=0; ghostBus.connect(master);
  }
  if(ac.state==='suspended'){try{var p=ac.resume(); if(p&&p.catch)p.catch(function(){})}catch(e){}}
  return ac;
}
['pointerup','touchend','click','keydown'].forEach(function(ev){
  document.addEventListener(ev,function(){ if(ac&&ac.state==='suspended'){try{var p=ac.resume(); if(p&&p.catch)p.catch(function(){})}catch(e){}} },{passive:true});
});
function toA(t){return ac.currentTime+Math.max(0,t-clock())}
function env(g,t,peak,dec){g.gain.setValueAtTime(Math.max(peak,.0002),t);g.gain.exponentialRampToValueAtTime(.0002,t+dec)}
function noise(t,type,f,q,peak,dec,dest){
  var s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  var g=ac.createGain(); env(g,t,peak,dec);
  s.connect(fl); fl.connect(g); g.connect(dest||master); s.start(t,Math.random()*.8); s.stop(t+dec+.05);
}
function tone(t,type,f0,f1,glide,peak,dec,dest){
  var o=ac.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+glide);
  var g=ac.createGain(); env(g,t,peak,dec);
  o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dec+.05);
}
function sndDrum(vel,edge,t,dest){ /* edge 0 = middle (deep), 1 = rim (tight) */
  if(!ac)return; t=t||ac.currentTime;
  var f=88+edge*120;
  tone(t,'sine',f*1.9,f,.09,vel*.95,.5-edge*.25,dest);
  tone(t,'triangle',f*2.9,f*2.2,.05,vel*.16*(.4+edge),.14,dest);
  noise(t,'bandpass',1400+edge*2600,1.2,vel*.3,.06,dest);
}
function sndBlock(vel,hi,t,dest){
  if(!ac)return; t=t||ac.currentTime;
  var f=hi?1040:760;
  tone(t,'sine',f,f,.01,vel*.55,.09,dest);
  tone(t,'triangle',f*2.42,f*2.42,.01,vel*.2,.05,dest);
  noise(t,'bandpass',f*2,6,vel*.2,.025,dest);
}
function sndShake(vel,t,dest){ if(ac)noise(t,'highpass',5200,.7,vel,.05,dest) }
function sndChime(){
  if(!ac||ac.state!=='running')return;
  var notes=[698.5,784,880,1046.5,1174.7,1396.9], f=notes[(Math.random()*notes.length)|0], t=ac.currentTime+.02;
  tone(t,'sine',f,f,.01,.035,1.6); tone(t,'sine',f*2.76,f*2.76,.01,.012,.7);
}
var chimeAt=0;

/* ---------- drum ---------- */
var R={miss:0,P:0,beats:0,last:-9,anchor:0,joined:false,lvl:0,pend:0,ang:0,gi:0,pos:0,lastSched:0,hits:[],ghostFx:[0,0],queue:[],was:false};
var NEED=16; /* four bars of four */
function drumTap(kind,p,t){
  audio();
  var vel,edge=0,hi=false;
  if(kind==='drum'){
    var dx=(p.x-150)/64,dy=(p.y-300)/30; edge=clamp(Math.sqrt(dx*dx+dy*dy),0,1); vel=1-.5*edge;
    if(ac)sndDrum(vel,edge); buzz(12);
  }else{
    hi=p.x>282; vel=.55+.45*(1-clamp(Math.abs(p.y-350)/34,0,1));
    if(ac)sndBlock(vel,hi); buzz(6);
  }
  R.hits.push({x:p.x,y:p.y,t:t,k:kind});
  if(R.hits.length>12)R.hits.shift();
  track(t);
}
function track(t){
  var d=t-R.last;
  if(R.P&&d<R.P*.3)return; /* two fingers landing together */
  if(d<.07)return;
  R.last=t;
  if(!R.P){
    if(d>.22&&d<1.3){R.P=d;R.beats=1;R.anchor=t}else{R.beats=0;R.anchor=t}
    return;
  }
  var ms=[.5,1,2,3,4],best=1,be=9;
  for(var i=0;i<ms.length;i++){var e=Math.abs(d-ms[i]*R.P)/(ms[i]*R.P); if(e<be){be=e;best=ms[i]}}
  if(R.joined){ /* once the others are in, fills and flubs are welcome */
    var hf=R.P/2, o2=t-R.anchor, er=o2-Math.round(o2/hf)*hf;
    if(Math.abs(er)<R.P*.14){R.miss=0;R.anchor+=er*.35;if(be<.12&&best>=1)R.P+=(d/best-R.P)*.2;regrid()}
    else if(++R.miss>=5){R.miss=0;R.beats=0;R.joined=false;R.anchor=t;R.P=(d>.22&&d<1.3)?d:0}
    return;
  }
  if(be<.17){
    R.beats+=best;
    if(best>=1)R.P+=(d/best-R.P)*.25;
    var half=R.P/2, off=t-R.anchor, err=off-Math.round(off/half)*half;
    R.anchor+=err*.6;
    regrid();
    if(!R.joined&&R.beats>=NEED){R.joined=true;buzz([20,60,20])}
  }else{
    R.beats=0; R.joined=false; R.anchor=t;
    R.P=(d>.22&&d<1.3)?d:0;
  }
}
function stepLen(){return R.P<.36?R.P:R.P/2}
function regrid(){
  var st=stepLen(), from=Math.max(R.lastSched+st*.5,clock());
  var gi=Math.ceil((from-R.anchor)/st);
  if(((gi^R.pos)&1)===1)R.pos++;
  R.gi=gi;
}
/* two soft players nobody can see: one low and round, one dry and quick */
var PAT_A=[1,0,0,.6,1,0,.5,0], PAT_B=[.4,.9,.5,1,.4,.9,.5,1], PAT_W=[0,0,1,0,0,0,1,.6];
function ghostTick(){
  if(!R.joined||!R.P)return;
  var st=stepLen(),now=clock();
  if(now-R.last>Math.max(2.6,R.P*4.5)){R.joined=false;R.beats=0;R.P=0;return}
  var guard=0;
  while(guard++<8){
    var ts=R.anchor+R.gi*st;
    if(ts>now+.16)break;
    if(ts>now-.02&&ts>R.lastSched+st*.5){
      var k=R.pos%8;
      if(ac){
        var ta=toA(ts);
        if(PAT_A[k])sndDrum(.42*PAT_A[k],.12,ta,ghostBus);
        sndShake(.07*PAT_B[k],ta,ghostBus);
        if(PAT_W[k])sndBlock(.26*PAT_W[k],false,ta,ghostBus);
      }
      if(PAT_A[k])R.queue.push({t:ts,who:0});
      if(PAT_W[k]||k%2===1)R.queue.push({t:ts,who:1});
      R.lastSched=ts;
    }
    R.gi++; R.pos++;
  }
}
setInterval(ghostTick,25);

/* ---------- voice ---------- */
var BOWL_F=174.61, BOWL_Y=215, SEMI=22;
var V={on:false,y:300,ty:300,id:null,near:0,match:0,glow:0,rings:[],ringAt:0,nodes:null,bowl:null,ring:0};
function vFreq(y){return BOWL_F*Math.pow(2,(BOWL_Y-y)/SEMI/12)}
function bowlNodes(){
  if(V.bowl||!ac)return;
  var g=ac.createGain(); g.gain.value=0; g.connect(master);
  var fs=[BOWL_F*2,BOWL_F*2+.9,BOWL_F*5.42,BOWL_F],gs=[.5,.5,.12,.35];
  for(var i=0;i<fs.length;i++){var o=ac.createOscillator();o.type='sine';o.frequency.value=fs[i];var og=ac.createGain();og.gain.value=gs[i];o.connect(og);og.connect(g);o.start()}
  V.bowl=g;
}
function humStart(p,id){
  if(V.on)return;
  audio(); V.on=true; V.id=id; V.y=V.ty=clamp(p.y,120,396);
  if(ac){
    bowlNodes();
    var f=vFreq(V.y),t=ac.currentTime;

  if(ac&&T.pad){T.pad.g.gain.setTargetAtTime(T.reach*.2,ac.currentTime,.1);T.pad.lp.frequency.setTargetAtTime(260+T.reach*1500,ac.currentTime,.1);
    T.pad.bg.gain.setTargetAtTime(T.reach*.07,ac.currentTime,.1);T.pad.bp.frequency.setTargetAtTime(400+T.reach*900,ac.currentTime,.1)}

var room=$('#room'),ptrs={};

/* ---------- which station is offering ---------- */

  var w=WEATHER[S.weather],t=TIMES[S.time],inv=-1,why='',passedFirst=false;
  if(w.st>=0&&!S.walked[w.st]){inv=w.st;why=w.why}
  else{
    if(w.st>=0)passedFirst=true;
    if(!S.walked[t.st]){inv=t.st;why=(S.weather==='plain'?'No weather to speak of. ':'')+t.why}
  }
  S.invite=inv;S.why=why;
  var off=$('#offer');
  if(inv>=0){
    $('#offerT').textContent=NAMES[inv]+' is glowing, faintly.';
    $('#offerR').textContent=why;off.classList.remove('none');
    $('#show').hidden=false;$('#pass').hidden=false;
  }else{

    $('#show').hidden=true;$('#pass').hidden=true;

  $('#reset').hidden=!names.length;
  [].forEach.call(document.querySelectorAll('#weather button'),function(b){b.setAttribute('aria-pressed',b.dataset.w===S.weather)});
  [].forEach.call(document.querySelectorAll('#time button'),function(b){b.setAttribute('aria-pressed',b.dataset.t===S.time)});
