<style>
:root{
  /* One world: a dim room at sunrise. Scene on top, one caption line and a few controls below. */
  color-scheme: dark;
  --room:#1c1114;        /* page ground, deep plum-brown */
  --panel:#2a1a1d;       /* control surfaces */
  --line:#4a3134;        /* hairlines */
  --paper:#f4e4d0;       /* text, card stock */
  --muted:#b79c8c;       /* secondary text */
  --ember:#ff9a4a;       /* accent: live fire */
  --brass:#d2ab63;       /* accent: tree rings, counters */
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--room);color:var(--paper);font-family:var(--body);
  display:flex;flex-direction:column;align-items:center;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.wrap{width:100%;max-width:560px;height:100%;min-height:520px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 6px}
.mark{display:flex;align-items:baseline;gap:8px;min-width:0;margin:0;font:inherit}
.mark b{font-family:var(--display);font-weight:600;font-style:italic;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.mark span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tools{display:flex;gap:6px}
.icon{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;
}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="true"]{color:var(--muted)}
.icon[aria-pressed="true"] .wave{display:none}
.icon[aria-pressed="false"] .slash{display:none}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:0;cursor:pointer}
.panel{padding:10px 16px 6px;display:flex;flex-direction:column;gap:8px}
#hint{
  font-family:var(--display);font-size:18px;line-height:1.3;margin:0;min-height:2.6em;
  display:flex;align-items:center;text-wrap:balance;
}
.slot{display:grid}
.slot>*{grid-area:1/1}
.controls{display:flex;flex-direction:column;gap:8px}
.off{visibility:hidden;pointer-events:none}
.fuel{display:flex;gap:6px}
.chip{
  flex:1 1 0;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);font:500 14px var(--body);cursor:pointer;padding:0 6px;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;opacity:.6}
.chip[aria-checked="true"]{color:var(--paper);border-color:var(--ember);background:#3a2220}
.chip[aria-checked="true"] i{opacity:1;box-shadow:0 0 8px var(--c)}
#forForm{margin:0}
#for{
  width:100%;height:44px;border-radius:22px;border:1px solid var(--line);background:#231518;
  color:var(--paper);font:16px var(--body);padding:0 16px;
}
#for::placeholder{color:var(--muted);opacity:.85}
.again{display:flex;align-items:flex-start}
#again{
  width:100%;min-height:48px;border-radius:24px;border:0;background:var(--ember);color:#2a1206;
  font:600 16px var(--body);cursor:pointer;
}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:2px 16px 12px;font-size:11px;color:var(--muted);white-space:nowrap}
#count{color:var(--brass);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:640px){
  #hint{font-size:16px;min-height:2.4em}
  .mark span{display:none}
}

<style>
/* PointCast: the way back to the Baby Bonfire street. Added on import; the scene below is unchanged. */
.bb-back{display:block;box-sizing:border-box;height:32px;padding:9px 16px 0;font:600 12px/14px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;color:inherit;text-decoration:none;opacity:.82}
.bb-back:hover,.bb-back:focus-visible{opacity:1;text-decoration:underline}

<body>
<a class="bb-back" href="/baby-bonfire/">&larr; Back to the street</a>
<div class="wrap">
  <header>
    <h1 class="mark"><b>Baby Bonfire</b><span>Light the hearth</span></h1>
    <div class="tools">
      <button class="icon" id="mute" type="button" aria-pressed="false" aria-label="Mute sound" title="Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="wave" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button class="icon" id="restart" type="button" aria-label="Start over" title="Start over">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M4.5 4.5v4h4"/></svg>
      </button>
    </div>
  </header>

  <div id="stage">
    <canvas id="scene" tabindex="0" role="img"
      aria-label="A desk at sunrise with a small ceramic hearth on a stone tile, a lit candle, a fluted air chimney and a lid. Keyboard: Space does the current step, hold Space to breathe, Enter puts the lid on."></canvas>
  </div>

  <div class="panel">
    <p id="hint" aria-live="polite">Tap the pallets to stack three.</p>
    <div class="slot">
    <div class="controls" id="controls">
      <div class="fuel" role="radiogroup" aria-label="Fuel">
        <button class="chip" type="button" role="radio" aria-checked="true" data-fuel="pallets" style="--c:#ffb057"><i></i>Pallets</button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-fuel="bundle" style="--c:#ffd76a"><i></i>Bundle</button>
        <button class="chip" type="button" role="radio" aria-checked="false" data-fuel="log" style="--c:#f0683c"><i></i>Pressed log</button>
      </div>
      <form id="forForm" autocomplete="off">
        <label class="sr" for="for">Who or what this one is for (optional)</label>
        <input id="for" name="for" type="text" maxlength="24" enterkeyhint="done" autocomplete="off" autocapitalize="words" placeholder="Who's this one for? (optional)">
      </form>
    </div>
    <div class="again off" id="againWrap"><button id="again" type="button" tabindex="-1">Light it again</button></div>
    </div>
  </div>

  <div class="meta">
    <span id="count">No rings yet</span>
    <span>Concept sketch — Hoydich Enterprises, Nov 2026</span>
  </div>
</div>

<script>
(function(){
'use strict';
var cv=document.getElementById('scene'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage'), hintEl=document.getElementById('hint');
var controls=document.getElementById('controls'), againWrap=document.getElementById('againWrap');
var forInput=document.getElementById('for'), countEl=document.getElementById('count');
var RMQ=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
var RM=RMQ.matches; if(RMQ.addEventListener) RMQ.addEventListener('change',function(e){RM=e.matches;});

/* ---------- geometry: virtual space is 390 wide; y is measured from the desk baseline B ---------- */
var W=390, VH=560, B=476, FRONT=84, scale=1, dpr=1;
var CX=195, CANDLE=75, CHIM=315;            // object centres
var RIM=-112;                               // hearth rim height
function resize(){
  var r=stage.getBoundingClientRect();
  var cw=Math.min(r.width,560), s=cw/W, vh=r.height/s;
  if(vh<430){ s=r.height/430; cw=W*s; vh=430; }
  if(vh>660) vh=660;
  VH=vh; B=VH-FRONT; scale=s;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=Math.round(cw)+'px'; cv.style.height=Math.round(VH*s)+'px';
  cv.width=Math.round(cw*dpr); cv.height=Math.round(VH*s*dpr);
}
window.addEventListener('resize',resize);

/* ---------- small helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(c,t,rate,dt){return c+(t-c)*(1-Math.exp(-rate*dt));}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function mix(a,b,t){return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))];}
function flick(t,s){var k=RM?0.25:1; return 0.5+0.5*(Math.sin(t*7.3*k+s*12.9)*0.6+Math.sin(t*13.7*k+s*4.1)*0.4);}

var FUELS={
  pallets:{outer:[255,118,38],mid:[255,182,72],core:[255,241,196],glow:[255,142,60],smoke:[216,202,192],smokeRate:1,crackle:1,roar:1,pop:[1500,4200],tall:1},
  bundle:{outer:[255,150,40],mid:[255,208,92],core:[255,250,220],glow:[255,172,74],smoke:[236,230,222],smokeRate:.6,crackle:1.9,roar:.7,pop:[2600,6200],tall:1.18},
  log:{outer:[228,78,40],mid:[255,138,58],core:[255,214,160],glow:[240,98,48],smoke:[172,174,190],smokeRate:1.5,crackle:.4,roar:1.5,pop:[700,1800],tall:.8}
};
var fuelKey='pallets', F=FUELS.pallets, smokeSprite=null;
function makeSprite(c){
  var s=document.createElement('canvas'); s.width=s.height=64; var g=s.getContext('2d');
  var gr=g.createRadialGradient(32,32,2,32,32,32);
  gr.addColorStop(0,rgba(c,.9)); gr.addColorStop(.5,rgba(c,.35)); gr.addColorStop(1,rgba(c,0));
  g.fillStyle=gr; g.fillRect(0,0,64,64); return s;
}

/* ---------- persistence ---------- */
var KEY='babybonfire.place.hearth.lit', memCount=0;
function loadCount(){ try{ var v=parseInt(window.localStorage.getItem(KEY),10); if(isFinite(v)&&v>0) memCount=v; }catch(e){} return memCount; }
function saveCount(n){ memCount=n; try{ window.localStorage.setItem(KEY,String(n)); }catch(e){} }
var count=loadCount();
function countText(){
  if(count<=0) return 'No rings yet';
  if(count===1) return 'Lit once';
  return 'Lit '+count+' times';
}

/* ---------- state ---------- */
var PILE=[[193,60,.02],[199,49,-.05],[190,38,.07]];
var S;
function fresh(){
  S={phase:'stack',placed:0,pieces:[],lit:false,heat:0,ember:0,char:0,blow:0,blowing:false,blowAcc:0,
     haze:0,cleared:false,lamp:1,roomT:0,
     taper:{drag:false,x:0,y:0,used:false},
     lid:{x:66,y:60,drag:false,seated:false,ox:0,oy:0},
     ringAnim:-1,smoke:[],sparks:[],forText:'',vibT:0,closeT:0};
}
fresh();
var hintNow='';
function hint(s){ if(s!==hintNow){hintNow=s; hintEl.textContent=s;} }
function fuelWord(){ return fuelKey==='pallets'?'pallets':fuelKey==='bundle'?'bundles':'logs'; }
function showStackUI(on){ controls.classList.toggle('off',!on); var els=controls.querySelectorAll('button,input'); for(var i=0;i<els.length;i++) els[i].tabIndex=on?0:-1; }
function showAgain(on){ againWrap.classList.toggle('off',!on); document.getElementById('again').tabIndex=on?0:-1; }

/* ---------- audio (all synthesized; starts on first gesture) ---------- */
var AC=null, master=null, noiseBuf=null, gBed=null, gAir=null, fAir=null, gDraw=null, muted=false;
function ensureAudio(){
  if(AC){ if(AC.state==='suspended'){ try{AC.resume();}catch(e){} } return; }
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C(); master=AC.createGain(); master.gain.value=muted?0:.9; master.connect(AC.destination);
    var n=AC.sampleRate*2; noiseBuf=AC.createBuffer(1,n,AC.sampleRate); var d=noiseBuf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    function loop(){var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.start(0,Math.random()*1.5); return s;}
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    gBed=AC.createGain(); gBed.gain.value=0; loop().connect(lp); lp.connect(gBed); gBed.connect(master);
    fAir=AC.createBiquadFilter(); fAir.type='bandpass'; fAir.frequency.value=600; fAir.Q.value=.7;
    gAir=AC.createGain(); gAir.gain.value=0; loop().connect(fAir); fAir.connect(gAir); gAir.connect(master);
    var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=240; bp.Q.value=1.4;
    gDraw=AC.createGain(); gDraw.gain.value=0; loop().connect(bp); bp.connect(gDraw); gDraw.connect(master);
  }catch(e){ AC=null; }
}
function pop(vol){
  if(!AC||muted) return;
  try{
    var t=AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf;
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=lerp(F.pop[0],F.pop[1],Math.random()); f.Q.value=1.2;
    var g=AC.createGain(), d=.015+Math.random()*.05;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()*1.8,d+.02);
  }catch(e){}
}
function tone(freq,dur,vol,type,slideTo){
  if(!AC||muted) return;
  try{
    var t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
function whoosh(dur,vol,from,to){
  if(!AC||muted) return;
  try{
    var t=AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(from,t); f.frequency.exponentialRampToValueAtTime(to,t+dur);
    var g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.2); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random(),dur+.05);
  }catch(e){}
}
function buzz(p){ if(RM) return; try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
document.addEventListener('visibilitychange',function(){
  if(!AC) return; try{ if(document.hidden) AC.suspend(); else AC.resume(); }catch(e){}
});

/* ---------- the ritual ---------- */
function placeNext(){
  if(S.phase!=='stack'||S.placed>=3) return;
  var n=S.placed, src=PILE[2-n];
  S.pieces.push({n:n,sx:src[0],sy:src[1],sr:src[2],tx:CX+[-2,3,-1][n],ty:-67-n*10,tr:[.02,-.03,.02][n],p:RM?1:0});
  S.placed++;
  tone(210-n*18,.12,.18,'sine',120); pop(.12); buzz(8);
  if(S.placed===1){ showStackUI(false); forInput.blur(); }
  if(S.placed===1) hint('Two more.');
  else if(S.placed===2) hint('One more.');
  else { S.phase='light'; hint('Touch the candle flame and carry it over.'); }
}
function ignite(){
  if(S.phase!=='light') return;
  S.lit=true; S.heat=.12; S.phase='breathe'; S.taper.drag=false; S.taper.used=true;
  whoosh(.7,.22,300,2400); buzz(20);
  hint('Press and hold the little door. Breathe.');
}
function startBlow(){ if(!S.lit) return; S.blowing=true; S.vibT=0; }
function stopBlow(){ S.blowing=false; }
function closeLid(){
  if(S.lid.seated) return;
  S.lid.seated=true; S.lid.drag=false; S.lid.x=CX; S.lid.y=RIM;
  S.lit=false; S.blowing=false; S.phase='closed'; S.closeT=0;
  tone(880,.09,.16,'triangle',700); whoosh(1.1,.14,2600,200); buzz([10,40,10]);
  for(var i=0;i<(RM?4:10);i++) S.smoke.push({x:CX+(Math.random()-.5)*60,y:RIM+10+Math.random()*30,vx:(Math.random()-.5)*8,vy:-10-Math.random()*10,r:6,life:0,max:2.5+Math.random()*1.5,a:.35});
  hint('Out. One more ring on the tile.');
}
function restart(){
  var t=S.forText; fresh(); forInput.value=''; showStackUI(true); showAgain(false);
  hint('Tap the '+fuelWord()+' to stack three.');
}
function setFuel(k){
  if(!FUELS[k]) return; fuelKey=k; F=FUELS[k]; smokeSprite=makeSprite(F.smoke);
  var chips=document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++) chips[i].setAttribute('aria-checked',chips[i].getAttribute('data-fuel')===k?'true':'false');
  if(S.phase==='stack'&&S.placed===0) hint('Tap the '+fuelWord()+' to stack three.');
}

/* ---------- input ---------- */
function pt(e){ var r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale-B,touch:e.pointerType==='touch'}; }
function inRect(p,x0,y0,x1,y1){return p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1;}
function taperCheck(){ var t=S.taper; if(t.x>CX-42&&t.x<CX+42&&t.y>-140&&t.y<-56) ignite(); }
cv.addEventListener('pointerdown',function(e){
  ensureAudio(); var p=pt(e);
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  if(S.phase==='stack'){
    if(inRect(p,140,14,250,FRONT)||inRect(p,145,-130,245,5)) placeNext();
  }else if(S.phase==='light'){
    if(Math.hypot(p.x-CANDLE,p.y+82)<44||inRect(p,30,-14,125,22)){
      S.taper.drag=true; S.taper.touch=p.touch; S.taper.x=p.x; S.taper.y=p.y-(p.touch?30:0);
      hint('Bring it to the wood.');
    }
  }else if(S.phase==='breathe'||S.phase==='room'){
    var l=S.lid;
    if(inRect(p,l.x-52,l.y-40,l.x+52,l.y+16)){ l.drag=true; l.ox=l.x-p.x; l.oy=l.y-p.y; hint('Set it down on top.'); }
    else if(inRect(p,130,-92,260,20)) startBlow();
  }
  e.preventDefault();
});
cv.addEventListener('pointermove',function(e){
  var p=pt(e);
  if(S.taper.drag){ S.taper.x=p.x; S.taper.y=p.y-(S.taper.touch?30:0); taperCheck(); }
  else if(S.lid.drag){ S.lid.x=p.x+S.lid.ox; S.lid.y=p.y+S.lid.oy; if(Math.abs(S.lid.x-CX)<24&&Math.abs(S.lid.y-RIM)<22) closeLid(); }
});
function release(){
  if(S.taper.drag){ S.taper.drag=false; if(S.phase==='light') hint('Touch the candle flame and carry it over.'); }
  if(S.lid.drag){ S.lid.drag=false; if(S.phase==='room') hint(S.cleared?'All clear. Lid on when you’re done.':'The chimney takes the smoke. The lamp steps back.'); else if(S.phase==='breathe') hint('Press and hold the little door. Breathe.'); }
  stopBlow();
}

/* ---------- update ---------- */
function update(dt,t){
  var i,p;
  for(i=0;i<S.pieces.length;i++){ p=S.pieces[i]; if(p.p<1) p.p=Math.min(1,p.p+dt/.55); }
  S.blow=ease(S.blow,S.blowing?1:0,S.blowing?3.2:2.2,dt);
  if(S.lit){
    if(S.blowing){ S.blowAcc+=dt; S.vibT-=dt; if(S.vibT<=0){ buzz(12); S.vibT=.38; } }
    var base=S.blowAcc>.6?.55:.26, target=base+(1-base)*S.blow;
    S.heat=ease(S.heat,target,target>S.heat?2.6:.7,dt);
    S.char=Math.min(.75,S.char+dt*S.heat*.03);
    if(S.phase==='breathe'){
      S.haze=Math.min(1,S.haze+S.blow*dt*.8);
      if(S.blowing&&S.blowAcc>.25) hint('Easy. It’s catching.');
      if(S.blowAcc>1.1){ S.phase='room'; S.roomT=0; S.haze=1; S.cleared=false; tone(196,.9,.05,'sine',147); hint('The chimney takes the smoke. The lamp steps back.'); }
    }else if(S.phase==='room'){
      S.roomT+=dt;
      if(S.blowing){ S.haze=Math.min(1,S.haze+dt*.6); if(S.cleared){ S.cleared=false; } }
      else S.haze=Math.max(0,S.haze-dt/20);
      if(!S.lid.drag){
        if(S.haze<=0&&!S.cleared){ S.cleared=true; tone(1320,.5,.05,'sine'); hint('All clear. Lid on when you’re done.'); }
        else if(!S.cleared&&S.roomT>7&&S.haze>0) hint('The ring goes clear when the air does.');
        else if(!S.cleared&&S.roomT<=7) hint('The chimney takes the smoke. The lamp steps back.');
      }
    }
  }else{
    S.heat=ease(S.heat,0,5,dt);
    if(S.phase==='closed'){
      S.closeT+=dt; S.haze=Math.max(0,S.haze-dt/6);
      if(S.ringAnim<0&&S.closeT>.7){ S.ringAnim=0; count++; saveCount(count); countEl.textContent=countText(); tone(1760,1.2,.07,'sine'); tone(2637,.9,.035,'sine'); }
      if(S.ringAnim>=0&&S.ringAnim<1){ S.ringAnim=Math.min(1,S.ringAnim+dt/(RM?.01:1.1)); if(S.ringAnim>=1){ showAgain(true); hint(count===1?'First ring. This place has been lit once.':'Ring '+count+'. This place has been lit '+count+' times.'); } }
    }
  }
  S.ember=Math.max(S.heat,S.ember-dt*.35);
  var dim=(S.phase==='room'&&S.haze>.02)||(S.phase==='breathe'&&S.haze>.6);
  S.lamp=ease(S.lamp,dim?.22:1,1.4,dt);
  if(!S.lid.drag&&!S.lid.seated){ S.lid.x=ease(S.lid.x,66,9,dt); S.lid.y=ease(S.lid.y,60,9,dt); }

  /* smoke */
  var draw=(S.phase==='room'||S.phase==='closed')?1:0;
  if(S.lit){
    var rate=F.smokeRate*(1.5+24*S.blow+9*S.haze)*(RM?.4:1);
    if(Math.random()<rate*dt&&S.smoke.length<(RM?40:130))
      S.smoke.push({x:CX+(Math.random()-.5)*34,y:RIM-10-Math.random()*20,vx:(Math.random()-.5)*6,vy:-16-Math.random()*14-S.blow*14,r:5+Math.random()*4,life:0,max:4+Math.random()*2.5,a:.2+Math.random()*.16});
    if(!RM&&S.blow>.2&&Math.random()<S.blow*dt*26&&S.sparks.length<50)
      S.sparks.push({x:CX+(Math.random()-.5)*40,y:RIM+10,vx:(Math.random()-.5)*26,vy:-50-Math.random()*70,life:0,max:.5+Math.random()*.7});
    if(Math.random()<dt*F.crackle*(1.5+9*S.heat+12*S.blow)) pop(.04+Math.random()*.16*(.4+S.heat));
  }
  for(i=S.smoke.length-1;i>=0;i--){
    p=S.smoke[i]; p.life+=dt;
    p.vx+=Math.sin(t*1.3+p.max*9+p.y*.03)*5*dt;
    if(draw&&p.y<RIM-6){
      var dx=CHIM-p.x, dy=-158-p.y, d=Math.hypot(dx,dy)+.01, pull=clamp((RIM-p.y)/30,.25,1)*78;
      p.vx+=dx/d*pull*dt; p.vy+=dy/d*pull*dt*.9; p.vx*=1-.9*dt; p.vy*=1-.9*dt;
      if(d<16){ p.life=Math.max(p.life,p.max-.25); p.r*=1-3*dt; }
    }else{ p.vx*=1-.5*dt; p.vy*=1-.25*dt; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=dt*(draw?3.2:6);
    if(p.life>=p.max) S.smoke.splice(i,1);
  }
  for(i=S.sparks.length-1;i>=0;i--){ p=S.sparks[i]; p.life+=dt; p.vy+=40*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.life>=p.max) S.sparks.splice(i,1); }

  if(AC&&!muted){
    try{
      var now=AC.currentTime;
      gBed.gain.setTargetAtTime(S.heat*.07*F.roar,now,.12);
      gAir.gain.setTargetAtTime(S.lit?S.blow*.2:0,now,.08);
      fAir.frequency.setTargetAtTime(480+900*S.blow,now,.1);
      gDraw.gain.setTargetAtTime(S.phase==='room'?.012+S.haze*.03:0,now,.3);
    }catch(e){}
  }
}

function bodyPath(front){
  ctx.beginPath();

function archPath(cx,top,bot,hw){ ctx.moveTo(cx-hw,bot); ctx.lineTo(cx-hw,top+hw); ctx.arc(cx,top+hw,hw,Math.PI,0,false); ctx.lineTo(cx+hw,bot); ctx.closePath(); }
function holes(){ archPath(CX-26,-101,-63,9); archPath(CX,-101,-63,9); archPath(CX+26,-101,-63,9); archPath(CX,-56,-42,12); }
function drawHearth(t){
  var e=S.ember, h=S.heat, i, f=flick(t,2.2);

    ctx.shadowBlur=0;
    for(i=0;i<N;i++){
      fl=flick(t,i*1.9+.4); x=CX+(i-2)*9.5+(fl-.5)*3; hh=(18+58*h+22*S.blow)*F.tall*(.55+.45*fl)*(i===2?1.12:i%2?.86:.7); w=6.5+4.5*h; sw=(flick(t*.8,i*3.3)-.5)*(8+10*S.blow);

}
function drawFireLight(t){

function drawPile(t){

function drawCard(){

function drawSmoke(){
  if(!smokeSprite) return;
  for(var i=0;i<S.smoke.length;i++){
    var p=S.smoke[i], k=p.life/p.max, a=p.a*Math.min(1,k*5)*(1-k);

function drawTarget(t){
  var x,y,r;
  if(S.phase==='stack'){ x=196; y=50; r=40; }
  else if(S.phase==='light'&&!S.taper.drag){ x=CANDLE; y=-82; r=20; }

  else if(S.phase==='room'&&S.cleared&&!S.lid.drag){ x=S.lid.x; y=S.lid.y-10; r=40; }

function render(t){

  ctx.clearRect(0,-B,W,VH);
  drawWall(t); drawDesk();
  drawTile(CANDLE,0); drawTile(CX,1); drawTile(CHIM,2);

  drawLampLight();

  drawFireLight(t);
  drawCandleFlame(t);
  drawRing(t);
  drawFlying(t);

  update(dt,T); render(T);
  window.requestAnimationFrame(frame);
}
smokeSprite=makeSprite(F.smoke);
countEl.textContent=countText();

window.requestAnimationFrame(frame);
})();
