.controls { display: flex; align-items: center; gap: 8px; }

  font-size: 13px; letter-spacing: .04em;
}
.pill .track { width: 26px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.14); position: relative; transition: background .3s; }

.pill[aria-checked="true"] .track::after { transform: translateX(12px); background: var(--ember); }
.icon { width: 40px; height: 40px; display: grid; place-items: center; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 50%; cursor: pointer; padding: 0; }

.icon .slash { display: none; }
.icon[aria-pressed="true"] .slash { display: block; }
.icon[aria-pressed="true"] .waves { display: none; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 3px; }

#hint {
  margin: 0; min-height: 2.8em; font-family: var(--font-display); font-style: italic; font-size: 16px;
  color: var(--flame); transition: opacity .5s; text-wrap: balance;
}
#hint.out { opacity: 0; }

.stage { position: relative; display: grid; grid-template-columns: 1fr; gap: 18px; }
#sparks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.home { --L: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.name {
  flex: 1 1 auto; min-width: 0; width: 100%; height: 40px; padding: 0 2px;
  background: transparent; border: 0; border-bottom: 1px solid transparent; border-radius: 0;
  color: var(--ink); font-family: var(--font-display); font-size: 22px;

.name:hover, .name:focus { border-bottom-color: var(--line); outline: none; }
.name:focus-visible { border-bottom-color: var(--flame); }
.when { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.when-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); min-width: 68px; text-align: right; }

.room {

  box-shadow: 0 0 0 1px rgba(255,255,255,.06),

.room .hit:focus-visible, .room .lid:focus-visible, .room .door:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.ledger { margin: 0; padding: 0 2px; font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
footer { margin-top: 6px; font-size: 12px; color: var(--ink-dim); letter-spacing: .03em; }

@media (min-width: 760px) {

  h1 { font-size: 30px; }
  .stage { grid-template-columns: 1fr 1fr; gap: 28px; }

      h.flame = ease(h.flame, h.lit ? 1 : 0, dt, h.lit ? 0.45 : 0.3);

      /* received glow: rises gently, fades slowly, follows the far breath live */
      var tgt = 0;
      if (!gone) {
        if (h.linkOn) tgt = o.holding ? 0.5 + 0.7 * oPhase : 0.8;
        if (now < h.bloomUntil) tgt = Math.max(tgt, 1);
      }
      var tau = o.holding && h.linkOn ? 0.12 : tgt > h.glow ? 1.1 : (gone ? 1.2 : 5.5);
      h.glow = ease(h.glow, tgt, dt, tau);

      h.emberAmt = ease(h.emberAmt, h.ember ? 1 : 0, dt, h.ember ? 1.2 : 0.6);
      h.awayAmt = ease(h.awayAmt, gone ? 1 : 0, dt, 0.7);
      h.door = ease(h.door, h.doorTarget, dt, 0.22);

      var flick = RM ? 0.5 : 0.5 + 0.5 * (Math.sin(t * 11 + h.ph) * 0.6 + Math.sin(t * 17.3 + h.ph * 2) * 0.4);
      var shimmer = RM ? 1 : 1 + 0.04 * Math.sin(t * 3.6 + h.ph);
      var own = h.flame * (0.8 + 0.2 * flick) * (1 + 0.25 * both + 0.3 * h.breath * hPhase);
      var got = h.glow * 0.78 * shimmer * (1 + 0.12 * both);
      var L = Math.max(own, got); h.L = L;

      e.home.style.setProperty('--L', clamp(L, 0, 1.3).toFixed(3));
      e.wgl.setAttribute('opacity', clamp(L * 0.95, 0, 1).toFixed(3));
      e.pool.setAttribute('opacity', clamp(L * 0.8, 0, 1).toFixed(3));
      e.warm.setAttribute('opacity', clamp(L * 0.2, 0, .3).toFixed(3));
      e.agl.setAttribute('opacity', clamp(Math.max(h.glow * shimmer, h.flame), 0, 1).toFixed(3));
      e.rim.setAttribute('opacity', clamp(L * 0.8, 0, 1).toFixed(3));
      e.fl.setAttribute('opacity', clamp(h.flame * 1.2, 0, 1).toFixed(3));
      if (h.flame > 0.01) {
        for (var k = 0; k < 3; k++) {
          var n = RM ? 0 : Math.sin(t * 9.1 + k * 2.1 + h.ph) * 0.5 + Math.sin(t * 15.7 + k) * 0.3 + Math.sin(t * 4.3 + k * 5) * 0.2;
          var sy = FLAME_S[k] * h.flame * (1 + 0.14 * n + 0.16 * both + 0.3 * h.breath * hPhase);
          var sx = FLAME_S[k] * h.flame * (1 - 0.06 * n);
          var rot = RM ? 0 : 5 * Math.sin(t * 6.3 + k * 1.7 + h.ph);
          e.f[k].setAttribute('transform', 'translate(' + FLAME_X[k] + ' 199) rotate(' + rot.toFixed(2) + ') scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ')');
        }
      }

      /* tile ring and waiting ember */
      var emPulse = h.emberAmt * (RM ? 0.85 : 0.7 + 0.3 * Math.sin(t * 1.3));
      var ring = clamp(Math.max(h.glow, h.flame * 0.45, emPulse * 0.22), 0, 1);
      e.ring.setAttribute('stroke', mix(RING_COLD, RING_WARM, ring));
      e.ringg.setAttribute('opacity', (ring * 0.4).toFixed(3));
      e.emh.setAttribute('opacity', emPulse.toFixed(3));

      /* lid */
      h.lidP = ease(h.lidP, h.lit ? 1 : 0, dt, RM ? 0.01 : 0.16);
      h.dragOff.x = ease(h.dragOff.x, 0, dt, 0.1); h.dragOff.y = ease(h.dragOff.y, 0, dt, 0.1);
      var lx, ly, lr = 0;
      if (h.drag) { lx = h.drag.x; ly = h.drag.y; }
      else {
        var p = h.lidP, arc = Math.sin(Math.PI * p);
        lx = lerp(LID_ON.x, LID_REST.x, p) + h.dragOff.x * p; ly = lerp(LID_ON.y, LID_REST.y, p) - arc * 30 + h.dragOff.y * p; lr = arc * 14;
      }
      e.lid.setAttribute('transform', 'translate(' + lx.toFixed(1) + ' ' + ly.toFixed(1) + ') rotate(' + lr.toFixed(1) + ')');

      /* night, absence, door */
      e.shade.setAttribute('opacity', clamp(0.52 - 0.4 * h.day + 0.3 * h.awayAmt, 0, 0.9).toFixed(3));
      if (i === 1) {
        var open = h.door;
        e.doorp.setAttribute('transform', 'translate(' + (349 * 0.62 * open).toFixed(2) + ' 0) scale(' + (1 - 0.62 * open).toFixed(3) + ' 1)');
        e.hall.setAttribute('width', (44 * 0.62 * open).toFixed(1));
        e.hall.setAttribute('opacity', (0.75 * open).toFixed(3));
      }
    }

    /* sound beds */
    if (ac && !muted) {
      var sum = A.flame + B.flame, now2 = ac.currentTime;
      bedGain.gain.setTargetAtTime(0.03 * sum, now2, 0.2);
      var hold = A.holding ? A : B.holding ? B : null;
      breathGain.gain.setTargetAtTime(hold ? 0.03 + 0.09 * (0.5 - 0.5 * Math.cos(Math.PI * 2 * hold.breathT / 2.2)) : 0, now2, 0.08);
      if (sum > 0.5 && Math.random() < dt * 3.5 * sum) sPop(A.lit && (!B.lit || Math.random() < 0.5) ? A : B);
    }

    drawSparks(dt, t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
