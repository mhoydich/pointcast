<style>
:root{
  /* layout: one sky-lit strip of four rooms on top, a single caption line, tide-table controls in a bottom drawer */

.snd i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.snd[aria-pressed="true"]{border-color:var(--sea)}
.snd[aria-pressed="true"] i{background:var(--sea)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:0 16px;gap:4px}
.tabs button{font-size:12px;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:5px 0;min-height:32px}
.tabs button[aria-current="true"]{color:var(--text);border-bottom-color:var(--ember)}
.rooms{position:relative;flex:1 1 0;min-height:250px;max-height:128vw;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=360,INK='#10151e';
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const sm=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const rnd=(a,b)=>a+Math.random()*(b-a);
const PI=Math.PI;

/* ---------- state ---------- */
const S={t:6.9,fog:.3,wind:8,swell:4,rain:0,moon:.62,lit:false,chim:false};
const V={t:S.t,fog:S.fog,wind:S.wind,swell:S.swell,rain:S.rain,moon:S.moon};
const PRESETS={
  gloom:{t:7.5,fog:.88,wind:5,swell:3,rain:0,moon:.8},
  ana:{t:15.5,fog:0,wind:32,swell:2,rain:0,moon:.3},
  swell:{t:18.1,fog:.15,wind:15,swell:10.5,rain:.4,moon:.55},
  night:{t:23,fog:0,wind:3,swell:2,rain:0,moon:0}
};
const PIECES={
  chime:{room:0,x:238,surf:-86,h:80,name:'Wind chime',text:'A tiny solenoid at the crown tugs the striker whenever a nearby wind reading gusts, so the tubes ring about as often as the trees outside move; it asks for a place to stand and a way to hush it at night.'},
  fog:{room:0,x:312,surf:-86,h:58,name:'Fog dome',text:'An ultrasonic mister under the glass makes more or less cool fog as the local marine-layer reading rises and falls; it asks for a cup of distilled water about once a week.'},
  ember:{room:1,x:289,surf:-50,h:62,name:'Ember',text:'A thumb-sized burner holds a real candle-scale flame, and a coin-sized fan leans its smoke with the wind outside until the glass chimney stands it back up; it asks you to light it, stay near it and snuff it.'},
  tide:{room:2,x:120,surf:-140,h:24,name:'Tide bowl',text:'A small quiet pump in the base pushes water in and out on the rhythm of the nearest buoy’s swell report; it asks you to top it up and wipe the rim now and then.'},
  rain:{room:2,x:246,surf:-140,h:72,name:'Rain roof',text:'When rain is reported outside, a solenoid valve lets drops from a small reservoir fall onto the tin and run into the dish, where a pump returns them; it asks for a refill after a wet week.'},
  lamp:{room:3,x:71,surf:-70,h:40,name:'Sunrise lamp',text:'Warm and cool LEDs travel a small arch on the sun’s computed path for your latitude, then hand over to a moon in tonight’s phase; it asks only for a plug and to be told where you live.'}
};
let sel=null,dirty=true,windNow=0,DPR=1;
let E={amb:[256,256,256]};
const C=(r,g,b,a=1)=>`rgba(${r*E.amb[0]>>8},${g*E.amb[1]>>8},${b*E.amb[2]>>8},${a})`;

/* ---------- sky + light model ---------- */
const KF=[[-.62,[5,8,20],[11,16,36]],[-.2,[9,13,34],[24,30,64]],[-.07,[24,32,76],[112,82,112]],[0,[56,78,142],[246,152,98]],[.1,[82,128,198],[255,198,134]],[.3,[70,138,214],[214,226,230]],[1,[46,118,208],[172,212,240]]];
function kf(alt){
  for(let i=1;i<KF.length;i++)if(alt<=KF[i][0]){const a=KF[i-1],b=KF[i],k=clamp((alt-a[0])/(b[0]-a[0]));return[mix(a[1],b[1],k),mix(a[2],b[2],k)]}
  return[KF[6][1],KF[6][2]];
}
function env(){
  const t=V.t,dayf=(t-6.25)/12.5,day=dayf>=0&&dayf<=1,nf=clamp(((t-18.75+48)%24)/11.5);
  const alt=day?Math.sin(PI*dayf):-.62*Math.sin(PI*nf);
  const L=sm(-.1,.22,alt),lum=.14+.86*L,eve=t>12.5,low=clamp(1-Math.abs(alt)/.22);
  let [top,hor]=kf(alt);
  if(eve){hor=mix(hor,[244,104,88],.38*low);top=mix(top,[78,52,124],.3*low)}
  let mid=mix(mix(top,hor,.6),eve?[240,120,112]:[255,176,128],.35*low);
  const ill=(1-Math.cos(2*PI*V.moon))/2,moonAlt=day?-1:Math.sin(PI*nf)*.8;
  const grey=[198*lum,202*lum,205*lum],storm=[90*lum,98*lum,112*lum],f=V.fog,r=V.rain;
  top=mix(mix(top,grey,f*.85),storm,r*.75);mid=mix(mix(mid,grey,f*.82),storm,r*.72);hor=mix(mix(hor,grey,f*.78),storm,r*.6);
  const sunCol=alt<.2?mix([255,122,62],[255,216,152],clamp(alt/.2)):mix([255,216,152],[255,250,238],clamp((alt-.2)/.4));
  let amb=mix([46,52,90],mix([256,247,234],sunCol,.3*low),L);
  const gl=.3+.7*L;
  amb=mix(amb,[172*gl,178*gl,188*gl],f*.5);
  const ml=(1-L)*ill*7*clamp(moonAlt*3);
  amb=amb.map(v=>v*(1-r*.28)+ml);
  E={t,day,dayf:clamp(dayf),nf,alt,L,lum,top,mid,hor,sunCol,amb,ill,moonAlt,
    clear:(1-f*.88)*(1-r*.8),sunX:.06+.88*dayf,moonX:.08+.84*nf,
    star:(1-L)*(1-f)*(1-r)*(1-ill*.45),fogC:[200*lum,204*lum,207*lum],wn:windNow/40};
}

/* ---------- drawing helpers ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function blob(g,x,y,r,c,a,sx=1){
  if(a<=.004||r<=.2)return;
  g.save();g.translate(x,y);g.scale(sx,1);
  const gr=g.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,css(c,a));gr.addColorStop(1,css(c,0));
  g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore();
}
function moon(g,x,y,r,p,a){
  g.save();g.translate(x,y);
  g.fillStyle=css([58,64,92],a*.6);g.beginPath();g.arc(0,0,r,0,7);g.fill();
  const k=Math.cos(2*PI*p);if(p>.5)g.scale(-1,1);
  if(p>.012&&p<.988){g.fillStyle=css([238,234,216],a);g.beginPath();g.arc(0,0,r,-PI/2,PI/2);g.ellipse(0,0,Math.abs(k)*r,r,0,PI/2,PI*1.5,k>0);g.fill()}
  g.restore();
}
function palm(g,bx,by,ht,sc,time,seed){
  const w=E.wn,cx=bx-ht*.12+w*9*sc,cy=by-ht;
  g.lineWidth=3.6*sc;g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(bx-ht*.14,by-ht*.5,cx,cy);g.stroke();
  g.lineWidth=2.4*sc;
  for(let k=0;k<7;k++){
    const a=-PI/2+(k-3)*.52,len=44*sc,push=w*22*sc+Math.sin(time*2.3+k*1.3+seed)*w*9*sc;
    const tx=cx+Math.cos(a)*len+push,ty=cy+Math.sin(a)*len*.7+16*sc+Math.abs(k-3)*3*sc;
    g.beginPath();g.moveTo(cx,cy);g.quadraticCurveTo(cx+Math.cos(a)*len*.6+push*.4,cy+Math.sin(a)*len*.8-6*sc,tx,ty);g.stroke();
  }
}
function sky(g,x,y,w,h,ri,kind,time){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  const sea=kind==='sea'||kind==='bed',yb=y+h,hy=y+h*(kind==='sea'?.7:kind==='bed'?.78:1.02);
  let gr=g.createLinearGradient(0,y-h*.4,0,hy);gr.addColorStop(0,css(E.top));gr.addColorStop(.7,css(E.mid));gr.addColorStop(1,css(E.hor));
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  if(E.star>.03){
    g.fillStyle='#fff';
    for(let k=0;k<26;k++){
      const px=x+((k*73.7+ri*31)%97)/97*w,py=y+((k*41.3+ri*17)%89)/89*(hy-y)*.95,s=k%5?1.1:1.7;
      g.globalAlpha=E.star*(.35+.65*Math.abs(Math.sin(time*.7+k*2.3)));g.fillRect(px,py,s,s);
    }
    g.globalAlpha=1;
  }
  const sx=E.sunX*4*W-ri*W,sy=hy-E.alt*h*1.2;
  const tw=sm(-.16,0,E.alt)*(1-.75*sm(.2,.7,E.alt))*E.clear;
  if(tw>.01){
    const gx=clamp(sx,x-120,x+w+120),gy=Math.min(sy,hy);
    gr=g.createRadialGradient(gx,gy,2,gx,gy,150);gr.addColorStop(0,css(E.sunCol,.85*tw));gr.addColorStop(.35,css(E.sunCol,.3*tw));gr.addColorStop(1,css(E.sunCol,0));
    g.fillStyle=gr;g.fillRect(x,y,w,h);
  }
  if(E.alt>-.03){g.fillStyle=css(mix(E.sunCol,[255,255,255],.35+V.fog*.5),(1-V.rain*.9)*(1-V.fog*.55));g.beginPath();g.arc(sx,sy,9,0,7);g.fill()}
  const mx=E.moonX*4*W-ri*W,my=hy-E.moonAlt*h*1.15,ma=(1-E.L)*(1-V.fog*.8)*(1-V.rain*.9);
  if(E.moonAlt>-.05&&ma>.02){blob(g,mx,my,36,[190,205,240],.24*ma*E.ill);moon(g,mx,my,8,V.moon,ma)}
  if(V.rain>.02)for(let k=0;k<4;k++){
    const span=w+200,cx=x+((k*97+time*(3+E.wn*16))%span+span)%span-100;
    blob(g,cx,y+8+(k*17)%44,62,[64*E.lum,70*E.lum,84*E.lum],V.rain*.62,1.9);
  }
  const silA=1-V.fog*.78,sil=css(mix(E.top,[6,10,18],.72),silA);
  if(sea){

  if(!RM||dirty){dirty=false;draw(T)}
  requestAnimationFrame(frame);
}
sync();caption();layout();
if(RM)for(let i=0;i<40;i++)update(.05,T+=.05);
requestAnimationFrame(ts=>{last=ts;frame(ts)});
})();
