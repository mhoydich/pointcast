<style>
/* Layout idea: one column, the floor plan is the page; the page's own sky colour follows the time of day. */
:root{
  color-scheme: light;
  --sky:#ffd3bd; --ink:#2b2140; --card:#fff7ef; --card-ink:#2b2140;
  --accent:#c2134a; --mate:#1746c9; --line:#2b2140;
  --display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand: "Bradley Hand", "Segoe Print", "Chalkboard SE", "Comic Sans MS", cursive;
}
body[data-time="midday"]{--sky:#b9e4f6; --card:#f5fcff}
body[data-time="dusk"]{--sky:#f5a27f; --card:#fff2e4}
body[data-time="night"]{--sky:#1a1f4d; --ink:#f3eeff; --card:#2c3272; --card-ink:#f3eeff; --line:#f3eeff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font:16px/1.4 var(--body);transition:background .8s,color .8s;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:800 30px/1 var(--display);margin:0;letter-spacing:-.5px}
.sub{margin:4px 0 0;font-size:14px}
h2{font:800 17px/1.2 var(--display);margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;min-height:40px}
button:focus-visible,input:focus-visible,.switch input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#snd{font-size:12px;padding:6px 10px;min-height:34px;white-space:nowrap}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.times button{padding:8px 0;border-radius:12px}
.times button[aria-pressed="true"]{background:var(--ink);color:var(--sky)}
.planwrap{border-radius:18px}
#stage{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.cap{background:var(--card);color:var(--card-ink);border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-height:92px;transition:background .8s}
#who{margin:0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
#say{margin:0;font:700 17px/1.3 var(--display)}
#fire{align-self:flex-start;margin-top:4px;font-size:13px;min-height:34px;padding:5px 12px}
#hint{margin:0;font-size:14px;min-height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1 1 140px}
#stats{margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;border:1.5px solid #fff}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:99px;border:2px solid var(--line);background:transparent;position:relative;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--line);transition:transform .2s}
.switch input:checked{background:var(--mate);border-color:var(--mate)}
.switch input:checked::after{transform:translateX(20px);background:#fff}
.keep{display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--line);padding-top:14px}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--card);color:var(--card-ink);min-height:40px}
#days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#days li{display:flex;gap:6px;align-items:center}
#days .day{flex:1;text-align:left;border-radius:12px;overflow-wrap:anywhere}
#days .day[aria-pressed="true"]{background:var(--ink);color:var(--sky)}
#days .mini{font-size:12px;padding:6px 10px;min-height:40px;border-width:1.5px}
#cmpNote{margin:0;font-size:14px}
#cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cmp figure{margin:0;background:var(--card);color:var(--card-ink);border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px}
#cmp svg{display:block;width:100%;height:auto;border-radius:8px}
#cmp figcaption{font-size:12px;line-height:1.3}
#cmp b{display:block;font-size:13px;overflow-wrap:anywhere}
footer{font-size:12px;opacity:.75;text-align:center;padding-top:6px}

/* plan */
.rl{font:700 9.5px var(--hand);fill:#2b2140;opacity:.8;transition:fill .8s;pointer-events:none}
#stage[data-time="night"] .rl{fill:#fff6c9}
.beam{opacity:0;transition:opacity .9s;pointer-events:none}
#stage[data-time="dawn"] .b-dawn{opacity:.6}
#stage[data-time="midday"] .b-mid{opacity:.55}
#stage[data-time="dusk"] .b-dusk{opacity:.6}
#stage[data-time="night"] .b-night{opacity:.3}
.amb{transition:opacity .8s,fill .8s;pointer-events:none}
.glow{transition:opacity .8s;pointer-events:none}
.lampdot{fill:#fff;stroke:#2b2140;stroke-width:1.2;transition:fill .5s}
.lampdot.on{fill:#ffd23f}
.spot{cursor:pointer;outline:none}
.spot .ring{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:2 4;stroke-linecap:round;opacity:0;transition:opacity .2s}
#stage.seeking .spot .ring{opacity:.95}
.spot.near .ring{stroke:#2b2140;stroke-width:3;opacity:1}
.spot:focus-visible .ring{opacity:1;stroke:#c2134a;stroke-width:3;stroke-dasharray:none}
.piece{cursor:grab;touch-action:none;outline:none}
.piece .hit{fill:transparent}
.piece:focus-visible .hit{stroke:#c2134a;stroke-width:2.5}
.piece .art{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.piece.carry{cursor:grabbing}
.piece.carry .art{transform:translateY(-5px) scale(1.14)}
.piece .selring{display:none;fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:5 4;transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.piece.sel .selring{display:block}
.flame,.pglow{display:none}
.lit .flame,.lit .pglow{display:block}
.lit .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
.lit .coal{fill:#ff8a1f}
.pulse{fill:none;stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse .7s ease-out forwards;pointer-events:none}
.sign{pointer-events:none}
.sign text{font:700 9px var(--hand);fill:#2b2140}
.trayhit{cursor:pointer}
.ph{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pl{fill:none;stroke-width:2.6;stroke-dasharray:.5 6.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.o0{stroke:#c2134a}.o1{stroke:#1746c9}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{from{transform:scale(.9,1.08) rotate(-4deg)}to{transform:scale(1.08,.92) rotate(5deg)}}
@keyframes pulse{from{transform:scale(.5);opacity:1}to{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
  .piece .selring,.lit .flame{animation:none}
  .pulse{animation:none;opacity:0}
}
</style>

/* ---------- storage ---------- */
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:null):v}catch(e){return k in mem?mem[k]:null}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
};

/* ---------- sound ---------- */
let ac=null,master=null,nbuf=null,muted=store.get('bb-rounds-mute')==='1';
function wake(){
  if(muted)return;
  try{
    if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();master=ac.createGain();master.gain.value=.55;master.connect(ac.destination);
      nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(ac.state==='suspended'){const r=ac.resume();if(r&&r.catch)r.catch(()=>{})}
  }catch(e){ac=null}
}
function tone(f,d,o){o=o||{};if(!ac||muted)return;try{const t=ac.currentTime+(o.delay||0),a=o.attack||.004,os=ac.createOscillator(),g=ac.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.g||.15,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
  os.connect(g);g.connect(master);os.start(t);os.stop(t+a+d+.05)}catch(e){}}
function noise(d,o){o=o||{};if(!ac||muted)return;try{const t=ac.currentTime+(o.delay||0),a=o.attack||.003,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=nbuf;s.loop=true;f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.ff||800,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+d);f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.g||.2,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+a+d+.05)}catch(e){}}

function mood(m){const fs=MOODS[m||'soft'];fs.forEach((f,i)=>tone(f,2.1,{g:.035,attack:.35,delay:.12+i*(m==='dinner'||m==='away'?.16:0)}))}

const hyp=(a,b,c,d)=>Math.hypot(a-c,b-d);
const r1=n=>Math.round(n*10)/10;

function roomAt(x,y){for(const k in ROOMS){const r=ROOMS[k].r;if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3])return k}return 'entry'}
function route(a,b){
  const ra=roomAt(a.x,a.y),rb=roomAt(b.x,b.y),anchors=[[a.x,a.y]];
  if(ra!==rb){const prev={};prev[ra]=null;const q=[ra];
    while(q.length){const c=q.shift();if(c===rb)break;for(const d of DOORS){const n=d[0]===c?d[1]:d[1]===c?d[0]:null;if(n&&!(n in prev)){prev[n]=[c,d];q.push(n)}}}
    const via=[];let c=rb;while(prev[c]){via.unshift(prev[c][1]);c=prev[c][0]}
    via.forEach(d=>anchors.push([d[2],d[3]]))}
  anchors.push([b.x,b.y]);
  const pts=[];
  for(let i=0;i<anchors.length-1;i++){const p=anchors[i],q=anchors[i+1],L=hyp(p[0],p[1],q[0],q[1])||1,n=Math.max(2,Math.ceil(L/6)),amp=(Math.random()-.5)*Math.min(16,L*.2),nx=-(q[1]-p[1])/L,ny=(q[0]-p[0])/L;
    for(let j=i?1:0;j<=n;j++){const t=j/n,w=Math.sin(Math.PI*t)*amp;pts.push([r1(p[0]+(q[0]-p[0])*t+nx*w),r1(p[1]+(q[1]-p[1])*t+ny*w)])}}
  return pts;
}
const plen=pts=>{let L=0;for(let i=1;i<pts.length;i++)L+=hyp(pts[i][0],pts[i][1],pts[i-1][0],pts[i-1][1]);return L};
const dOf=(pts,n)=>{n=Math.max(2,Math.min(pts.length,n||pts.length));let s='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<n&&i<pts.length;i++)s+='L'+pts[i][0]+' '+pts[i][1];if(pts.length===1)s+='L'+pts[0][0]+' '+pts[0][1];return s};

  const i=(d.owner?theirs:mine).indexOf(d);
  P[d.id]={def:d,g,x:0,y:0,at:'tray',lit:false,hidden:d.owner===1,home:d.owner?{x:74+i*72,y:532}:{x:30+i*43,y:466}};
  if(d.owner)g.style.display='none';

function setPos(p,x,y){p.x=x;p.y=y;p.g.setAttribute('transform',`translate(${r1(x)} ${r1(y)})`)}
function toTray(p){p.at='tray';order=order.filter(i=>i!==p.def.id);setPos(p,p.home.x,p.home.y)}
function land(p,spot){const s=SPOTS[spot];p.at=spot;order=order.filter(i=>i!==p.def.id);order.push(p.def.id);setPos(p,s.x,s.y-5)}
function lift(p){order=order.filter(i=>i!==p.def.id);p.at='air'}
function occupant(spot){for(const k in P)if(P[k].at===spot)return P[k];return null}
function setLit(p,on){p.lit=on;p.g.classList.toggle('lit',on)}
function resetPieces(){order=[];focus=null;for(const k in P){setLit(P[k],false);toTray(P[k])}}

function meaning(p){
  const s=SPOTS[p.at],d=p.def;
  if(d.fire&&!p.lit)return{cold:true,cap:`The ${d.name} is cold. Light it and the place will feel the heat.`};
  const m=M[`${d.id}|${p.at}|${time}`]||M[`${d.id}|${p.at}|*`];
  if(m)return m;
  const o={cap:d.dflt(ROOMS[s.room].name)};if(d.dl){o.lamp={};o.lamp[s.room]=d.dl}return o;
}
const AMB={dawn:['#ff7f9c',.12],midday:['#ffffff',0],dusk:['#8a2c6b',.2],night:['#0a0f3d',.62]};
function houseRender(){
  const st={};for(const r in ROOMS)st[r]={lamp:0,dark:false,sign:null};
  for(const id of order){const p=P[id];if(!SPOTS[p.at])continue;const m=meaning(p);if(m.cold)continue;const room=SPOTS[p.at].room;
    if(m.only)for(const r in st)if(r!==m.only){st[r].lamp=0;st[r].dark=true}
    if(m.dark)m.dark.forEach(r=>{st[r].dark=true;st[r].lamp=0});
    if(m.lamp)for(const r in m.lamp){if(r==='all'){for(const q in st){st[q].lamp=m.lamp.all;st[q].dark=false}}else{st[r].lamp=m.lamp[r];st[r].dark=false}}
    if(m.sign)st[room].sign=m.sign;
  }
  const a=AMB[time],sg=$('#signs');sg.textContent='';
  for(const r in ROOMS){const s=st[r];
    let col=a[0],op=a[1]*(1-.78*s.lamp);
    if(s.dark){col='#0a0f3d';op=Math.max(a[1],.66)}
    ambs[r].setAttribute('fill',col);ambs[r].setAttribute('opacity',r1(op*100)/100);
    glows[r].setAttribute('opacity',s.lamp);lampDots[r].classList.toggle('on',s.lamp>0);
    if(s.sign){const c=ROOMS[r].sign,w=s.sign.length*5+14,g=el('g',{class:'sign',transform:`translate(${c[0]} ${c[1]}) rotate(-5)`},sg);
      el('rect',{x:-w/2,y:-8,width:w,height:16,rx:3,fill:'#fffbe6',stroke:'#2b2140','stroke-width':1.2},g);
      el('circle',{cx:-w/2+5,cy:0,r:1.6,fill:'#ef476f'},g);
      const t=el('text',{x:3,y:3.2,'text-anchor':'middle'},g);t.textContent=s.sign}
  }
}
function say(p,withMood){
  const who=$('#who'),txt=$('#say'),fb=$('#fire');
  if(!p){who.textContent='Nothing placed yet';txt.textContent='The house is waiting to see what you pick up.';fb.hidden=true;return}
  const d=p.def;
  if(SPOTS[p.at]){const s=SPOTS[p.at],m=meaning(p);let c=m.cap;
    if(mates){for(const k in P){const q=P[k];if(q!==p&&q.def.owner!==d.owner&&SPOTS[q.at]&&SPOTS[q.at].room===s.room){c+=` You are both using the ${ROOMS[s.room].name}.`;break}}}
    who.textContent=`${cap(d.name)} · ${s.name} · ${time}`;txt.textContent=c;
    if(withMood&&!m.cold)mood(m.mood);
  }else if(p.at==='tray'){who.textContent=`${cap(d.name)} · shelf`;txt.textContent='Back on the shelf. The house lets that one go.'}
  else{who.textContent=`${cap(d.name)} · in your hand`;txt.textContent='Carrying counts. The house waits to see where you land.'}
  if(d.fire){fb.hidden=false;fb.textContent=(p.lit?'Snuff the ':'Light the ')+d.name}else fb.hidden=true;
}
function hint(t){$('#hint').textContent=t||''}
function autoHint(){
  const n=events.filter(e=>e.k==='m'&&e.o===0).length;
  if(sel)return hint(sel.def.fire?'Tap a dotted spot to carry it there. Tap it again to light or snuff it.':'Now tap a dotted spot, or tap the shelf to put it back.');
  if(n<2)return hint('Pick up a piece from the shelf. Drag it, or tap it and then tap a spot.');
  if(!flags.time)return hint('Change the time of day. The same spot can mean something else.');
  if(n<4)return hint('Keep going. Your path is the drawing of your day.');
  if(!flags.replayed)return hint('Press Replay my rounds to watch the day back.');
  if(!flags.saved)return hint('Name this day and save it, then compare it with another.');
  if(!mates)return hint('Switch on Who else lives here to see two sets of rounds overlap.');
  hint('');
}
function stats(){
  const f=o=>{const m=events.filter(e=>e.k==='m'&&e.o===o);return[m.length,Math.round(m.reduce((s,e)=>s+plen(e.pts),0)/24)]};
  const a=f(0);let h=`<span class="dot" style="background:#c2134a;margin-left:0"></span>You: ${a[0]} ${a[0]===1?'carry':'carries'}, about ${a[1]} steps`;
  if(mates){const b=f(1);h+=`<span class="dot" style="background:#1746c9"></span>Them: ${b[0]}, about ${b[1]} steps`}
  $('#stats').innerHTML=h;
}

/* ---------- paths ---------- */
function drawPath(parent,pts,o,n){const d=dOf(pts,n);return[el('path',{class:'ph',d},parent),el('path',{class:'pl o'+o,d},parent)]}
function redrawPaths(){const g=$('#paths');g.textContent='';events.forEach(e=>{if(e.k==='m')drawPath(g,e.pts,e.o)})}

function walk(p,pts,dur){
  return new Promise(res=>{
    if(reduce()||dur<=0||pts.length<2){const l=pts[pts.length-1];setPos(p,l[0],l[1]-5);return res()}
    const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i][0],pts[i][1],pts[i-1][0],pts[i-1][1]));
    const L=cum[cum.length-1]||1,live=drawPath($('#paths'),pts,p.def.owner,2);let t0=null,lastStep=0;
    p.g.classList.add('carry');
    const done=()=>{p.g.classList.remove('carry');live.forEach(n=>n.remove());res()};
    const tick=ts=>{
      if(t0===null)t0=ts;const k=Math.min(1,(ts-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,d=e*L;
      let i=1;while(i<pts.length-1&&cum[i]<d)i++;
      const seg=cum[i]-cum[i-1]||1,u=(d-cum[i-1])/seg,x=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*u,y=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*u;
      setPos(p,x,y-5);const dd=dOf(pts,i+1);live.forEach(n=>n.setAttribute('d',dd));
      if(d-lastStep>24){lastStep=d;step()}
      if(k<1&&!stopFlag)requestAnimationFrame(tick);else done();
    };
    requestAnimationFrame(tick);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,reduce()?Math.min(ms,120):ms));

function pulse(x,y){const c=el('circle',{class:'pulse',cx:x,cy:y,r:14},$('#fx'));setTimeout(()=>c.remove(),800)}
function landed(p,to,quiet){
  if(to==='tray')toTray(p);else{land(p,to);pulse(SPOTS[to].x,SPOTS[to].y)}
  focus=p;houseRender();
  if(!quiet){(MAT[p.def.mat]||MAT.stone)();buzz()}
  say(p,!quiet);
}
function commit(p,pts,to){
  if(pts.length<2)pts=[pts[0]||[p.x,p.y],pts[0]||[p.x,p.y]];
  events.push({k:'m',o:p.def.owner,p:p.def.id,pts,to,t:time});
  landed(p,to);redrawPaths();stats();autoHint();
}
function select(p){if(sel)sel.g.classList.remove('sel');sel=p;if(p){p.g.classList.add('sel');$('#pieces').appendChild(p.g)}stage.classList.toggle('seeking',!!p)}

async function walkTo(p,to){
  if(busy)return;
  const from=p.at==='tray'?SHELF:{x:p.x,y:p.y+5},dest=to==='tray'?SHELF:SPOTS[to];
  const pts=route(from,dest);
  busy=true;select(null);lift(p);houseRender();say(p);
  await walk(p,pts,Math.max(450,Math.min(1600,plen(pts)*7)));
  busy=false;commit(p,pts,to);
}
function toggleLit(p){
  setLit(p,!p.lit);events.push({k:'l',p:p.def.id,on:p.lit,t:time});
  if(p.lit){noise(.12,{ft:'highpass',ff:2000,g:.08});tone(900,.1,{to:1500,g:.03})}else noise(.22,{ff:1200,to:200,g:.12});
  focus=p;houseRender();say(p,p.lit);
}
function tap(p){
  if(busy)return;
  if(sel===p){if(p.def.fire)toggleLit(p);else select(null)}
  else{select(p);focus=p;say(p)}
  autoHint();
}

/* ---------- pointer: drag, or tap then tap ---------- */
function svgPt(ev){const m=stage.getScreenCTM();if(!m)return{x:0,y:0};return{x:(ev.clientX-m.e)/m.a,y:(ev.clientY-m.f)/m.d}}
function nearest(x,y){let b=null,bd=38;for(const k in SPOTS){const s=SPOTS[k],d=hyp(x,y,s.x,s.y);if(d<bd){bd=d;b=k}}return b}
function markNear(k){for(const q in SPOTS)SPOTS[q].g.classList.toggle('near',q===k)}
const pieceOf=t=>{const g=t.closest&&t.closest('.piece');return g?P[g.getAttribute('data-id')]:null};

stage.addEventListener('pointerdown',ev=>{
  wake();
  const p=pieceOf(ev.target);if(!p||busy||drag)return;
  if(ev.button!=null&&ev.button>0)return;
  $('#pieces').appendChild(p.g);
  try{p.g.setPointerCapture(ev.pointerId)}catch(e){}
  drag={p,id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,moved:false,pts:[],from:p.at,ox:p.x,oy:p.y,touch:ev.pointerType==='touch',d:0};
});
stage.addEventListener('pointermove',ev=>{
  if(!drag||ev.pointerId!==drag.id)return;
  const p=drag.p;
  if(!drag.moved){
    if(hyp(ev.clientX,ev.clientY,drag.sx,drag.sy)<7)return;
    drag.moved=true;select(null);stage.classList.add('seeking');p.g.classList.add('carry');
    if(SPOTS[drag.from]){drag.pts.push([SPOTS[drag.from].x,SPOTS[drag.from].y])}
    lift(p);focus=p;houseRender();say(p);hint('Let go on a dotted spot.');
  }
  const q=svgPt(ev),vb=stage.viewBox.baseVal,x=Math.max(8,Math.min(352,q.x)),y=Math.max(10,Math.min(vb.height-12,q.y-(drag.touch?22:0)));
  setPos(p,x,y);
  if(y+5<PLAN_BOTTOM){const l=drag.pts[drag.pts.length-1];
    if(!l){drag.pts.push([r1(x),r1(y+5)])}
    else{const dd=hyp(l[0],l[1],x,y+5);if(dd>=4){drag.pts.push([r1(x),r1(y+5)]);drag.d+=dd;if(drag.d>24){drag.d=0;step()}}}
    $('#paths').querySelectorAll('.live').forEach(n=>n.remove());
    if(drag.pts.length>1)drawPath($('#paths'),drag.pts,p.def.owner).forEach(n=>n.classList.add('live'));
  }
  markNear(y<PLAN_BOTTOM?nearest(x,y+5):null);
});
function endDrag(ev,cancel){
  if(!drag||ev.pointerId!==drag.id)return;
  const d=drag,p=d.p;drag=null;
  try{p.g.releasePointerCapture(ev.pointerId)}catch(e){}
  if(!d.moved){if(!cancel)tap(p);return}
  p.g.classList.remove('carry');stage.classList.remove('seeking');markNear(null);
  $('#paths').querySelectorAll('.live').forEach(n=>n.remove());
  const k=cancel?null:(p.y<PLAN_BOTTOM?nearest(p.x,p.y+5):null),inTray=!cancel&&p.y>=PLAN_BOTTOM-6;
  const back=msg=>{if(SPOTS[d.from]){land(p,d.from);houseRender()}else toTray(p);say(p);hint(msg)};
  if(k&&!occupant(k)){d.pts.push([SPOTS[k].x,SPOTS[k].y]);commit(p,d.pts,k)}
  else if(k)back('That spot is taken. Sills are small.');
  else if(inTray){if(d.from==='tray'){toTray(p);say(p);autoHint()}else{if(!d.pts.length)d.pts.push([d.ox,d.oy+5]);d.pts.push([SHELF.x,SHELF.y]);commit(p,d.pts,'tray')}}
  else back('Nowhere to land there. Aim for a little coloured tile.');
}
stage.addEventListener('pointerup',ev=>endDrag(ev,false));
stage.addEventListener('pointercancel',ev=>endDrag(ev,true));
stage.addEventListener('touchmove',ev=>{if(drag)ev.preventDefault()},{passive:false});
stage.addEventListener('contextmenu',ev=>{if(pieceOf(ev.target))ev.preventDefault()});

function spotTap(k){

  if(!sel)return hint(o?`${cap(o.def.name)} is on that spot.`:`That is the ${s.name==='by the stove'?'spot by the stove':s.name.replace(/^the /,'')}. Pick up a piece first.`);
  if(o&&o!==sel)return hint('That spot is taken. Sills are small.');

stage.addEventListener('click',ev=>{

$('#fire').addEventListener('click',()=>{wake();const p=sel||focus;if(p&&p.def.fire&&!busy){toggleLit(p);autoHint()}});

/* ---------- time of day ---------- */

  time=t;document.body.dataset.time=t;stage.dataset.time=t;
  document.querySelectorAll('.times button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
  houseRender();
  if(!quiet){say(focus,!!(focus&&SPOTS[focus.at]));autoHint()}

document.querySelector('.times').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||busy)return;wake();flags.time=true;setTime(b.dataset.t)});

/* ---------- rebuild, replay ---------- */
function rebuild(evs){
  resetPieces();
  for(const e of evs){const p=P[e.p];if(!p||p.hidden)continue;
    if(e.k==='l')setLit(p,e.on);else if(e.to==='tray')toTray(p);else if(!occupant(e.to)||occupant(e.to)===p){land(p,e.to);focus=p}}
  events=evs;redrawPaths();houseRender();stats();
}
async function replay(){
  if(busy){stopFlag=true;return}
  const evs=events.slice(),end=time;
  if(!evs.some(e=>e.k==='m'))return hint('Nothing to replay yet. Carry a piece first.');
  wake();busy=true;stopFlag=false;select(null);$('#replay').textContent='Stop';hint('Watching the day back.');
  resetPieces();events=[];redrawPaths();houseRender();say(null);
  await wait(350);
  for(const e of evs){
    if(stopFlag)break;const p=P[e.p];if(!p||p.hidden){events.push(e);continue}
    if(e.t!==time)setTime(e.t,true);
    if(e.k==='l'){setLit(p,e.on);events.push(e);focus=p;houseRender();say(p,e.on);await wait(450);continue}
    lift(p);houseRender();
    await walk(p,e.pts,Math.max(350,Math.min(1300,plen(e.pts)*5)));
    if(stopFlag)break;
    events.push(e);landed(p,e.to);redrawPaths();
    await wait(520);
  }
  stopFlag=false;rebuild(evs);setTime(end,true);say(focus);
  busy=false;flags.replayed=true;$('#replay').textContent='Replay my rounds';autoHint();
}
$('#replay').addEventListener('click',replay);
$('#fresh').addEventListener('click',()=>{if(busy)return;select(null);const keep=events.filter(e=>e.o===1&&e.k==='m');rebuild(mates?keep:[]);say(null);hint('Fresh day. Everything is back on the shelf.')});

  stage.setAttribute('viewBox',on?'0 0 360 564':'0 0 360 498');
  theirs.forEach(d=>{const p=P[d.id];p.hidden=!on;p.g.style.display=on?'':'none'});
}
const MATE_DAY=[['fern',['kitchenSill','bedSill','livingSill'],'dawn'],['pinwheel',['bedSill','livingSill','bookshelf'],'midday'],['lantern',['patioTable','bookshelf','couchArm'],'dusk'],['fern',['bookshelf','desk','livingSill'],'dusk']];

/* ---------- saved days ---------- */
function buildDay(list){

  list.forEach(m=>{const from=pos[m[0]]||SHELF,to=SPOTS[m[1]];evs.push({k:'m',o:0,p:m[0],pts:route(from,to),to:m[1],t:m[2]});pos[m[0]]=to;if(m[3])evs.push({k:'l',p:m[0],on:true,t:m[2]})});
  return evs;
}
let days=[],picked=[];
try{const raw=store.get('bb-rounds-days');if(raw){const a=JSON.parse(raw);if(Array.isArray(a))days=a.filter(d=>d&&Array.isArray(d.events)&&typeof d.name==='string')}}catch(e){days=[]}

  days=[
    {id:'ex1',name:'Example: slow Sunday',time:'night',mates:false,events:buildDay([['teapot','stove','dawn'],['ember','livingSill','dawn',1],['bowl','kitchenSill','midday'],['teapot','patioTable','midday'],['lamb','couchArm','dusk'],['candle','bedside','night',1]])},
    {id:'ex2',name:'Example: match day',time:'night',mates:false,events:buildDay([['ball','frontDoor','dawn'],['teapot','stove','dawn'],['ball','patioTable','midday'],['stone','desk','midday'],['bell','stove','dusk'],['ember','couchArm','dusk',1],['stone','bedside','night']])}
  ];
}
picked=days.slice(0,2).map(d=>d.id);
const persist=()=>store.set('bb-rounds-days',JSON.stringify(days));
function renderDays(){

    const x=document.createElement('button');x.type='button';x.className='mini';x.textContent='Delete';x.dataset.del=d.id;x.setAttribute('aria-label','Delete '+d.name);
    li.append(b,o,x);ul.appendChild(li)});

    const g=el('g',{},s),end={};let n=0,L=0;
    d.events.forEach(e=>{if(e.k!=='m')return;const pr=drawPath(g,e.pts,e.o);pr[0].setAttribute('stroke-width',9);pr[1].setAttribute('stroke-width',5);pr[1].setAttribute('stroke-dasharray','.5 11');if(e.o===0){n++;L+=plen(e.pts)}end[e.p]=e});

    const c=document.createElement('figcaption'),b=document.createElement('b');b.textContent=d.name;c.append(b,document.createTextNode(`${n} carries, about ${Math.round(L/24)} steps`));

}
$('#days').addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.pick){const id=t.dataset.pick;if(picked.includes(id))picked=picked.filter(i=>i!==id);else{picked.push(id);if(picked.length>2)picked.shift()}renderDays()}

$('#snd').addEventListener('click',()=>{muted=!muted;store.set('bb-rounds-mute',muted?'1':'0');sndLabel();if(!muted){wake();MAT.porcelain()}});

sndLabel();setTime('dawn',true);say(focus);autoHint();renderDays();
})();
</script>
