<style>
:root{
  /* layout: one constant room on top, one thin strip of controls beneath; two columns on wide screens */
  --ink:#0c0919; --panel:#191233; --line:#3a2c66;
  --paper:#f1e9ff; --mute:#a497cc;
  --ember:#ff8a3c; --gold:#ffd27a; --teal:#3fd6c4; --rose:#ff5fa2;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --label:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#241548 0%,var(--ink) 60%) var(--ink);color:var(--paper);font-family:var(--label);-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px;stroke:var(--paper);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="true"]{border-color:var(--rose)}
.icon[aria-pressed="true"] .on{display:none}
.icon[aria-pressed="false"] .off{display:none}

.stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px -20px #000,0 0 80px -30px var(--ember);background:#1a1236;touch-action:pan-y}
.stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#taper{touch-action:none;cursor:grab}
#taper.auto{transition:transform .55s cubic-bezier(.3,.7,.3,1)}
#hit,#stoneHit{cursor:pointer}
#hit:focus-visible{outline:none;stroke:var(--teal);stroke-width:2}
.fade{transition:opacity 1.4s ease}
.quick{transition:opacity .5s ease}
stop{transition:stop-color 1.4s ease}
#blind,#sash{transition:transform 1.6s cubic-bezier(.4,0,.2,1);transform-box:fill-box;transform-origin:50% 0}
#nbWin,.sw{transition:fill .8s ease}
.glow{mix-blend-mode:screen}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.07) skewX(2deg)}50%{transform:scale(1.04,.95) skewX(-2deg)}75%{transform:scale(.97,1.04) skewX(1deg)}100%{transform:scale(1,1) skewX(0)}}
@keyframes sway{0%,100%{transform:scale(1,1) skewX(-9deg)}50%{transform:scale(.95,1.06) skewX(-17deg)}}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes wave{0%{opacity:0;transform:scale(.5)}30%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}
@keyframes blip{0%{transform:scale(0);opacity:1}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes drop{0%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes ringin{0%{stroke-width:5;opacity:0}40%{opacity:1}100%{stroke-width:1.1;opacity:1}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite}
.flame.sway{animation:sway 1.7s ease-in-out infinite}
.waves path{transform-box:fill-box;transform-origin:50% 100%;opacity:0}
.sounding .waves path{animation:wave 2.2s ease-out infinite}
.sounding .waves path:nth-child(2){animation-delay:.5s}
.sounding .waves path:nth-child(3){animation-delay:1s}
#offerGlow{opacity:0}
.offer #offerGlow{animation:pulse 2.6s ease-in-out infinite}
#knock{opacity:0}
.knocking #knock{animation:pulse 1.5s ease-in-out infinite}
.blip{transform-box:fill-box;transform-origin:50% 50%;animation:blip .9s ease-out forwards}
.piece.arrive{animation:drop .8s ease-out}
.ring.new{animation:ringin 1.4s ease-out}

.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv{background:none;border:0;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border-radius:12px;color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.lv svg{width:26px;height:34px}
.lv .f1{fill:#3a2c66;transition:fill .4s}.lv .f2{fill:#2a1f52;transition:fill .4s}
.lv[aria-checked="true"]{color:var(--gold)}
.lv[aria-checked="true"] .f1{fill:var(--ember)}.lv[aria-checked="true"] .f2{fill:var(--gold)}
.lv.below .f1{fill:#8a4a3a}.lv.below .f2{fill:#b98a55}
.name{font-family:var(--display);font-size:22px;margin:0;line-height:1.15}
.name small{font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:2px}
#hint{font-family:var(--display);font-style:italic;font-size:16px;line-height:1.35;color:var(--gold);min-height:2.7em;margin:0}

.panel{background:linear-gradient(180deg,#1e1540,#150f2e);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel[hidden]{display:none}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#120c28;border-radius:999px;padding:0 14px;min-height:40px;font-size:13px;color:var(--paper)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:linear-gradient(180deg,#ffb056,#ff7a3c);border-color:#ffb056;color:#2a0f08;font-weight:600}
.chip.teal{border-color:var(--teal);color:var(--teal)}
.chip:disabled{opacity:.4;cursor:default}
.moments{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mo{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:#120c28;display:grid;place-items:center;padding:0;min-width:44px}
.mo svg{width:60%;height:60%;stroke:var(--mute);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mo[aria-checked="true"]{border-color:var(--gold);background:radial-gradient(circle at 50% 35%,#5a2f7a,#241548);box-shadow:0 0 18px -4px var(--ember)}
.mo[aria-checked="true"] svg{stroke:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:120px;height:32px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--gold) 45%,var(--rose))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--gold) 45%,var(--rose))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--paper);border:3px solid #2a1f52;margin-top:-9px;box-shadow:0 2px 8px #000}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--paper);border:3px solid #2a1f52}
input[type=date],input[type=number]{font:inherit;font-size:16px;color:var(--paper);background:#120c28;border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:40px;color-scheme:dark}
input[type=number]{width:72px;text-align:center;font-variant-numeric:tabular-nums}
output{font-variant-numeric:tabular-nums;font-size:13px;color:var(--gold);min-width:5.5em;text-align:right}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:-6px}
#mood{font-family:var(--display);font-style:italic;font-size:15px}
.make{display:flex;align-items:center;gap:12px}
#preview{width:84px;height:104px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 70%,#3a2360,#120c28);border:1px solid var(--line)}
.make .col{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
#how{font-size:14px;line-height:1.45;color:var(--paper);margin:0}
.pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;margin-top:8px;border:1px solid currentColor}
.pill.ok{color:var(--teal)}.pill.part{color:var(--gold)}.pill.miss{color:var(--rose)}
footer{font-size:11px;color:var(--mute);letter-spacing:.08em;text-align:center;padding-top:4px}
.side{display:flex;flex-direction:column;gap:12px}
@media (min-width:880px){
  .wrap{max-width:960px;display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);column-gap:28px;align-items:start;padding-top:24px}
  header,footer{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
  .offer #offerGlow,.knocking #knock{opacity:.8}
  .sounding .waves path{opacity:.6}
}
</style>
