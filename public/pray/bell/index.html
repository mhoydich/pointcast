<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin">
<script>(function(){var l=location,p=l.pathname;if(!/\/$/.test(p)&&!/\.html?$/.test(p))l.replace(p+"/"+l.search+l.hash)})()</script>
<title>Ring a bell · Pray</title>
<meta name="description" content="One bell. Strike it three times and let it ring out. It sounds different at dawn, by day, at dusk and at night.">
<meta property="og:title" content="Ring a bell">
<meta property="og:description" content="One bell. Strike it three times and let it ring out.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://pointcast.xyz/baby-bonfire/prayer/card.png">
<meta property="og:image:alt" content="A small hearth with a lit flame in its arched opening, in warm brown light.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#17152e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317152e'/%3E%3Ccircle cx='16' cy='17' r='7' fill='%23ff9a4a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../pray.css">
<style>
.top{text-align:center}
.top h1{font-size:34px;margin-top:6px}
.stage{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:300px;margin:8px 0}
.bell{position:relative;z-index:1;display:block;width:min(76vw,320px);aspect-ratio:200/230;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;touch-action:manipulation}
.bell svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 6%}
.bell.swing svg{animation:swing 1.6s ease-out}
@keyframes swing{0%{transform:rotate(0)}12%{transform:rotate(4deg)}36%{transform:rotate(-2.6deg)}60%{transform:rotate(1.4deg)}80%{transform:rotate(-.6deg)}100%{transform:rotate(0)}}
.bell:focus-visible{outline-offset:10px}
.ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:2px solid rgba(255,210,122,.7);pointer-events:none;opacity:0;animation:ring 5.5s cubic-bezier(.15,.6,.3,1) forwards}
@keyframes ring{0%{transform:scale(.5);opacity:.85}100%{transform:scale(4.2);opacity:0}}
.glow{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;opacity:.25;transition:opacity 2.5s ease;
  background:radial-gradient(circle,rgba(255,170,90,.35) 0,rgba(255,150,70,.12) 40%,rgba(255,150,70,0) 70%)}
.glow.hot{opacity:.75;transition:opacity .08s linear}
.below{text-align:center}
.hint{margin:12px 0 0;font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.done{margin:14px 0 0;font:italic 400 22px/1.3 var(--display);color:var(--paper);min-height:1.3em}
.after{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 0}
.forform{display:flex;gap:6px;max-width:360px;margin:10px auto 0}
.forform .field{flex:1 1 auto}
#forLink{max-width:360px;margin:8px auto 0;font-size:14px}
</style>
</head>
<body>
<main class="room">
  <a class="back" href="../">&larr; Pray</a>
  <header class="top">
    <h1>Ring a bell</h1>
    <p class="hour" id="hour">Any hour</p>
    <p class="forline" id="forLine" hidden></p>
    <p class="quiet" id="quiet">Strike it three times. Let each one ring out.</p>
  </header>

  <div class="stage" id="stage">
    <div class="glow" id="glow" aria-hidden="true"></div>
    <button class="bell" id="bell" type="button" aria-label="Strike the bell" aria-describedby="hint">
      <svg viewBox="0 0 200 230" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="bronze" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#5a3216"/><stop offset=".28" stop-color="#b8743a"/><stop offset=".42" stop-color="#e2a35e"/><stop offset=".62" stop-color="#9a5a2a"/><stop offset="1" stop-color="#4a2810"/>
          </linearGradient>
          <linearGradient id="lip" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#4a2810"/><stop offset=".4" stop-color="#c88848"/><stop offset="1" stop-color="#3e220e"/>
          </linearGradient>
        </defs>
        <path d="M86 18a14 14 0 0 1 28 0" fill="none" stroke="#9a5a2a" stroke-width="7" stroke-linecap="round"/>
        <path d="M100 22c-34 0-52 24-55 62l-5 66c-2 20-16 32-28 42h176c-12-10-26-22-28-42l-5-66c-3-38-21-62-55-62z" fill="url(#bronze)"/>
        <path d="M60 120h80" stroke="rgba(255,220,160,.28)" stroke-width="2"/>
        <path d="M54 140h92" stroke="rgba(40,20,8,.35)" stroke-width="2"/>
        <ellipse cx="100" cy="192" rx="90" ry="10" fill="url(#lip)"/>
        <circle cx="100" cy="210" r="11" fill="#6b3d1d"/>
        <circle cx="96" cy="206" r="3.5" fill="rgba(255,220,160,.35)"/>
      </svg>
    </button>
  </div>

  <div class="below">
    <div class="count" id="count" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="sr" id="countSr" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Tap the bell, or press Space</p>
    <noscript><p class="fine">The bell needs scripts to ring. Without them: stand still, count three slow breaths, and listen.</p></noscript>
    <p class="done" id="done" aria-live="polite"></p>
    <div id="after" hidden>
      <div class="after">
        <a class="ghost warm" href="../">Back to the door</a>
        <button class="ghost" id="forBtn" type="button" aria-expanded="false" aria-controls="forForm">Ring it for someone</button>
      </div>
      <form class="forform" id="forForm" autocomplete="off" hidden>
        <label class="sr" for="forName">Their first name</label>
        <input class="field" id="forName" type="text" maxlength="24" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="send" placeholder="Their first name">
        <button class="ghost" type="submit">Send</button>
      </form>
      <label class="sr" for="forLink">Link to send</label>
      <input class="field" id="forLink" type="text" readonly hidden>
      <p class="said" id="forSaid" role="status" aria-live="polite"></p>
    </div>
  </div>
</main>
<script src="../pray.js"></script>
<script>
(function(){
'use strict';
var P=window.Pray;if(!P)return;
var $=function(id){return document.getElementById(id)};
var part=P.part(),bell=$('bell'),stage=$('stage'),glow=$('glow'),marks=$('count').children;
$('hour').textContent={dawn:'The dawn bell',day:'The day bell',dusk:'The dusk bell',night:'The night bell'}[part];
var i=P.intent();if(i)$('quiet').textContent=P.INTENTS[i].line;
var who=P.forName();
if(who){$('forLine').textContent='A bell is rung for '+who+'.';$('forLine').hidden=false;$('hint').textContent='Touch anywhere to ring it'}

var n=0,complete=false,skipClick=false,skipKey=false,glowTimer=0;
function strike(){
  P.strike({part:part,vel:0.55+Math.random()*0.1});
  P.buzz(18);
  if(!P.still()){
    var r=document.createElement('div');r.className='ring';r.setAttribute('aria-hidden','true');stage.appendChild(r);
    setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r)},5700);
    bell.classList.remove('swing');void bell.offsetWidth;bell.classList.add('swing');
  }
  glow.classList.add('hot');clearTimeout(glowTimer);glowTimer=setTimeout(function(){glow.classList.remove('hot')},120);
  if(complete)return;
  n++;
  for(var k=0;k<marks.length;k++)marks[k].className=k<n?'on':'';
  $('countSr').textContent=n===1?'One.':n===2?'Two.':'Three.';
  if(n>=3){
    complete=true;P.markToday();
    setTimeout(function(){$('done').textContent=who?'Rung for '+who+'.':'Rung. Let it fade.';$('after').hidden=false;$('hint').textContent='It still rings if you strike it'},1400);
  }
}
bell.addEventListener('click',function(){if(skipClick){skipClick=false;return}strike()});
document.addEventListener('keydown',function(e){
  if(skipKey){skipKey=false;return}
  if(e.repeat)return;
  var t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='BUTTON'||tag==='A'||tag==='SUMMARY')return; /* those keep their own keys */
  if(e.key===' '||e.key==='Enter'){e.preventDefault();strike()}
});

/* opened from a link: the first touch rings it */
if(who){
  var evs=['pointerdown','keydown'];
  var wake=function(e){
    var t=e.target;
    if(e.type==='keydown'&&(e.key==='Tab'||e.key==='Shift'||e.key==='Escape'||e.key==='Alt'||e.key==='Meta'||e.key==='Control'))return;
    if(t&&t.closest&&t.closest('a,input,form'))return;
    evs.forEach(function(x){document.removeEventListener(x,wake,true)});
    var onBell=!!(t&&t.closest&&t.closest('#bell'));
    if(onBell&&(e.type!=='keydown'||e.key===' '||e.key==='Enter')){skipClick=true;setTimeout(function(){skipClick=false},900)} /* the click that follows this same touch or key */
    else if(e.type==='keydown')skipKey=true; /* the page's own key handler, just below */
    if(e.type==='keydown'&&!onBell&&(e.key===' '||e.key==='Enter'))e.preventDefault();
    strike();
  };
  evs.forEach(function(x){document.addEventListener(x,wake,true)});
}

/* ring it for someone: a link, nothing kept */
var forBtn=$('forBtn'),forForm=$('forForm'),forName=$('forName'),forSaid=$('forSaid');
forBtn.addEventListener('click',function(){
  var open=forForm.hidden;forForm.hidden=!open;forBtn.setAttribute('aria-expanded',open?'true':'false');
  if(open){forSaid.textContent='';try{forName.focus()}catch(e){}}
});
forForm.addEventListener('submit',function(e){
  e.preventDefault();
  var name=P.cleanName(forName.value);
  if(!name){forSaid.textContent=P.NAME_HELP;try{forName.focus()}catch(_){}return}
  forName.value=name;
  P.share({title:'A bell',text:'A bell is rung for '+name+'.',url:P.here({'for':name}),status:forSaid,field:$('forLink')});
});
window.__bell={get count(){return n},get audio(){return P.audioState()}};
})();
</script>
</body>
</html>
