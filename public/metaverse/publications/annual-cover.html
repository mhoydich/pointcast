<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/metaverse/publications/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#313d33">
<title>PointCast Metaverse · Annual-report cover</title>
<style>
:root{color-scheme:light;background:#eeeae0;color:#fff7e7;font:16px/1.4 Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit;text-underline-offset:.18em}
h1,h2,p{margin:0}
img{display:block;width:100%;height:100%;object-fit:cover}
nav,.cover{width:min(8.5in,100% - 1.5rem);margin:0 auto}
nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:#343b32;padding:1rem 0;font-size:.8rem}
.cover{background:#313d33;min-height:11in;padding:.56in;display:flex;flex-direction:column;gap:.22in}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid #b5b4a1;padding-bottom:.14in;font-size:.71rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.masthead span:first-child{display:flex;align-items:center;gap:.12in}
.mark{width:.18in;height:.18in;border:1px solid #e99772;background:linear-gradient(135deg,#e99772 49%,transparent 50%)}
h1,h2{font-family:Georgia,serif;font-weight:400}
h1{font-size:clamp(2.8rem,8.7vw,5.05rem);line-height:.88;letter-spacing:-.062em;margin-block:.22in .15in}
h1 span{color:#e99772}
h2{font-size:clamp(1.5rem,4vw,2rem);line-height:1.08;color:#efc0a5}
.wall{display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:1.57in 1.57in;gap:.09in;margin-top:.14in}
.wall a{display:block;overflow:hidden}
.wall a:first-child{grid-row:span 2}
.wall img{object-position:center}
.wall a:first-child img{object-position:42% center}
.wall a:last-child img{object-position:center 63%}
.report-status{display:grid;grid-template-columns:1fr 1fr;gap:.2in;border-block:1px solid #9caa94;padding:.14in 0;font-size:.78rem}
.report-status strong,.art-credit strong{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:.62rem}
.art-credit{display:flex;justify-content:space-between;align-items:start;gap:1rem;font-size:.69rem;color:#f7e3cb}
.art-credit > div:last-child{text-align:right}
.endline{margin-top:auto;border-top:1px solid #9caa94;padding-top:.12in;color:#efc0a5;text-transform:uppercase;font-size:.64rem;letter-spacing:.15em;font-weight:700}
@media(max-width:580px){.cover{padding:.26in;min-height:unset}.wall{grid-template-rows:1.1in 1.1in}.masthead{font-size:.58rem}}
@page{size:letter;margin:0}
@media print{
  :root{background:#313d33}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  nav{display:none}
  .cover{width:8.5in;height:11in;padding:.56in}
  .wall{grid-template-rows:2.13in 2.13in}
  h1{font-size:5.05rem}
}
</style>
</head>
<body>
<nav><a href="./">← Illustrated prospectus</a><a href="pointcast-metaverse-annual-cover.pdf" download>Download PDF ↓</a></nav>
<main class="cover">
  <header class="masthead"><span><i class="mark" aria-hidden="true"></i> PointCast</span><span>Design draft</span></header>
  <div>
    <h1>PointCast<br>Metaverse<span>.</span></h1>
    <h2>Annual report</h2>
  </div>
  <section class="wall" aria-label="Cover artwork">
    <a href="https://www.midjourney.com/jobs/a3f88f83-6b07-41c2-bc1c-2e633fb65aef?index=3"><img src="https://pointcast.xyz/images/pointcast-sorority-row/architect-cut.webp" alt="The Architect’s Cut. Midjourney job"></a>
    <a href="https://www.midjourney.com/jobs/332acac8-1bc5-4431-8a95-1454a3ab4b9f?index=0"><img src="https://pointcast.xyz/images/pointcast-sorority-row/missing-house.webp" alt="The Missing House. Midjourney job"></a>
    <a href="https://www.midjourney.com/jobs/7046e42f-eda1-4d2e-b845-3ade542a38e0?index=3"><img src="https://pointcast.xyz/images/pointcast-sorority-row/row-2030.webp" alt="Row 2030. Midjourney job"></a>
  </section>
  <div class="report-status">
    <p><strong>Reporting period</strong> Unspecified</p>
    <p><strong>Financial results</strong> No verified results</p>
  </div>
  <div class="art-credit">
    <div><strong>Cover artwork</strong> Michael Hoydich with Codex / OpenAI · Midjourney V8.1</div>
    <div><a href="https://pointcast.xyz/25/magazine/sorority-row">PointCast / Sorority Row</a></div>
  </div>
  <div class="endline">Architectural prototype · Cover only</div>
</main>
</body>
</html>
