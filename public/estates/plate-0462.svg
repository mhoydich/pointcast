<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Hoydich Estates — Plate I, the family fork">
  <defs>
    <pattern id="staff" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#16130f" opacity="0.75"/>
    </pattern>
    <style>
      .caps { font-family: 'Futura', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; letter-spacing: 0.2em; fill: #16130f; }
      .glyph { font-family: 'Bodoni 72', 'Didot', Georgia, serif; fill: #16130f; }
    </style>
  </defs>

  <rect width="800" height="800" fill="#efe9dc"/>

  <rect x="0" y="0" width="150" height="200" fill="#16130f"/>
  <rect x="510" y="0" width="120" height="260" fill="#e13a24">
    <animate attributeName="height" values="260;242;260" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="630" y="0" width="170" height="240" fill="#16130f"/>
  <text class="glyph" x="655" y="205" font-size="220" fill="#efe9dc">M</text>

  <rect x="160" y="118" width="640" height="26" fill="url(#staff)"/>
  <text class="caps" x="170" y="205" font-size="27">MICHAEL HOYDICH</text>

  <rect x="160" y="330" width="250" height="235" fill="#b6c8d6"/>
  <text class="glyph" x="-14" y="520" font-size="190">M</text>
  <rect x="160" y="425" width="620" height="26" fill="url(#staff)"/>
  <text class="caps" x="176" y="502" font-size="27">MORGAN FUKUNAGA HOYDICH</text>

  <rect x="415" y="565" width="225" height="155" fill="#eec32d">
    <animate attributeName="opacity" values="1;0.86;1" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text class="glyph" x="638" y="620" font-size="175">K</text>
  <rect x="0" y="595" width="450" height="26" fill="url(#staff)"/>
  <text class="caps" x="24" y="668" font-size="27">KANA JANE HOYDICH</text>

  <rect x="0" y="705" width="400" height="80" fill="#e13a24"/>
  <text class="glyph" x="20" y="782" font-size="160">K</text>
  <text class="caps" x="430" y="668" font-size="27">KENZO MONTANA HOYDICH</text>

  <rect x="0" y="740" width="800" height="60" fill="#16130f"/>
  <text class="caps" x="400" y="778" font-size="21" fill="#efe9dc" text-anchor="middle" letter-spacing="0.5em">EL SEGUNDO · 2026</text>
</svg>
