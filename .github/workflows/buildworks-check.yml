name: Buildworks checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/buildworks-check.yml'
      - 'src/pages/buildworks*'
      - 'src/data/buildworks.json'
      - 'src/lib/buildworks.mjs'
      - 'src/scripts/buildworks.mjs'
      - 'src/styles/buildworks.css'
      - 'public/images/buildworks/**'
      - 'public/buildworks/**'
      - 'tests/buildworks.test.mjs'
permissions:
  contents: read
concurrency:
  group: buildworks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/buildworks.test.mjs
      - name: Full PointCast production build
        run: npm run build
