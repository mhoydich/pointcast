name: Check after-hours gallery
on:
  pull_request:
    paths:
      - 'public/art/after-hours-2026-11-02/**'
      - 'scripts/check-after-hours-gallery.py'
      - '.github/workflows/after-hours-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify original images and gallery links
        run: python3 scripts/check-after-hours-gallery.py
