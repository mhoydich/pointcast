name: Nouns Money app checks

on:
  pull_request:
    paths:
      - '.github/workflows/nouns-money-app-check.yml'
      - 'src/lib/nouns-money-app-*'
      - 'src/data/nouns-money-*'
      - 'src/pages/nouns-money.astro'
      - 'src/pages/nouns-money.json.ts'
      - 'src/pages/nouns-money/app*'
      - 'src/pages/nouns-money/app/**'
      - 'src/scripts/nouns-money-app-*'
      - 'src/styles/nouns-money-*'
      - 'src/lib/ues-living-study-boundaries.mjs'
      - 'public/nouns-money/app/**'
      - 'public/images/nouns-money/flowers-2026/**'
      - 'public/images/nouns-money/currency-builder/**'
      - 'tests/nouns-money-*.test.mjs'
      - 'tests/ues-living-study-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nouns-money-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check artwork, local preferences, print planning, and middleware isolation
        run: >-
          node --test
          tests/nouns-money-app-model.test.mjs
          tests/nouns-money-client.test.mjs
          tests/nouns-money-catalog.test.mjs
          tests/nouns-money-collection-client.test.mjs
          tests/ues-living-study-boundaries.test.mjs
          tests/ues-living-study-middleware.test.mjs
