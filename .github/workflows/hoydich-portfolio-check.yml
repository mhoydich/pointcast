name: Check Hoydich portfolio
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hoydich-portfolio-check.yml'
      - 'src/components/HomeLatestProjects.astro'
      - 'src/components/HoydichIdentity.astro'
      - 'src/data/hoydich-portfolio.mjs'
      - 'src/data/hoydich-dashboard.mjs'
      - 'src/components/HoydichDashboard.astro'
      - 'src/scripts/hoydich-dashboard.mjs'
      - 'src/styles/hoydich-dashboard.css'
      - 'tests/hoydich-dashboard.test.mjs'
      - 'src/pages/hoydich*'
      - 'src/scripts/hoydich-portfolio.mjs'
      - 'src/styles/hoydich-portfolio.css'
      - 'tests/hoydich-portfolio.test.mjs'
      - 'scripts/package-hoydich-qa.mjs'
permissions:
  contents: read
concurrency:
  group: hoydich-portfolio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/hoydich-portfolio.test.mjs tests/hoydich-dashboard.test.mjs
      - name: Build the complete site
        run: |
          if ! npm run build:bare; then
            echo 'Retrying the full build once for transient upstream failures, following docs/OPERATIONS.md.'
            npm run build:bare
          fi
      - name: Verify the generated portfolio and artwork
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { JSDOM } from 'jsdom';
          import { portfolioPayload } from './src/data/hoydich-portfolio.mjs';
          import { dashboardPayload } from './src/data/hoydich-dashboard.mjs';
          const payload = { ...portfolioPayload(), dashboard: dashboardPayload() };
          const output = JSON.parse(readFileSync('dist/hoydich.json', 'utf8'));
          assert.deepEqual(output, payload);
          const document = new JSDOM(readFileSync('dist/hoydich/index.html', 'utf8')).window.document;
          const town = JSON.parse(readFileSync('src/data/town-inspector-report.json', 'utf8'));
          const health = JSON.parse(readFileSync('dist/health.json', 'utf8'));
          for (const key of Object.keys(town)) assert.deepEqual(health[key], town[key], `Built health report preserves ${key}`);
          const home = new JSDOM(readFileSync('dist/index.html', 'utf8')).window.document;
          assert.ok(home.getElementById('home-visit-title'));
          assert.ok(home.getElementById('home-share-title'));
          assert.equal(document.querySelectorAll('h1').length, 1);
          assert.equal(document.querySelectorAll('main').length, 1);
          assert.equal(document.querySelectorAll('[data-dashboard-row]').length, payload.dashboard.rows.length);
          assert.equal(document.querySelectorAll('[data-selected-proposal]').length, 3);
          assert.equal(document.querySelectorAll('[data-proposal]').length, 10);
          assert.equal(document.querySelectorAll('[data-chain-panel]').length, 4);
          assert.equal(document.querySelectorAll('[data-project-card]').length, payload.projects.length);
          assert.equal(document.querySelectorAll('[data-studio-card]').length, payload.studio.length);
          assert.equal(document.querySelectorAll('[data-native-card]').length, payload.native.length);
          for (const image of document.querySelectorAll('img')) {
            const src = image.getAttribute('src');
            if (src?.startsWith('/')) assert.ok(existsSync(`dist${src}`), `Built artwork exists: ${src}`);
          }
          for (const link of document.querySelectorAll('script[src]')) {
            const src = link.getAttribute('src');
            if (src?.startsWith('/')) assert.ok(existsSync(`dist${src}`), `Built script exists: ${src}`);
          }
          for (const link of document.querySelectorAll('#latest-links a[href]')) {
            const href = link.getAttribute('href');
            if (!href.startsWith('/')) continue;
            const url = new URL(href, 'https://pointcast.xyz');
            const path = /\.(json|txt)$/.test(url.pathname) ? `dist${url.pathname}` : `dist${url.pathname.replace(/\/$/, '')}/index.html`;
            assert.ok(existsSync(path), `Latest destination is built: ${href}`);
            if (url.hash) {
              const target = new JSDOM(readFileSync(path, 'utf8')).window.document;
              assert.ok(target.getElementById(url.hash.slice(1)), `Source fragment exists: ${href}`);
            }
          }
          console.log(`Verified ${payload.projects.length} public project families, ${payload.studio.length} studio threads and ${payload.native.length} native edition at ${payload.capturedAt}.`);
          JS
      - name: Package compiled homepage and portfolio for browser QA
        env:
          HOYDICH_QA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/package-hoydich-qa.mjs
      - name: Upload exact-head compiled QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoydich-compiled-${{ github.event.pull_request.head.sha }}
          path: .qa/hoydich-compiled/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
