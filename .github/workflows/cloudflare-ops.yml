name: Cloudflare ops (workers and migrations)

# Run by hand from the Actions tab (works from a phone). Nothing here runs on
# its own. It replaces the two jobs that still needed a terminal on Mike's Mac:
# deploying one worker from workers/*, and applying AUTH_DB migrations.
#
# Needs a repository secret CLOUDFLARE_OPS_TOKEN with "Workers Scripts: Edit"
# and "D1: Edit" on the account. It is a separate secret on purpose, so the
# token that publishes the site on every merge stays limited to Pages.

on:
  workflow_dispatch:
    inputs:
      job:
        description: What to do
        type: choice
        required: true
        default: list-migrations
        options:
          - list-migrations
          - apply-migrations
          - deploy-worker
      worker:
        description: Worker folder (deploy-worker only)
        type: choice
        default: presence
        options:
          - early-shift
          - kennel-daily
          - kennel-seals
          - keyboard-studio
          - morning-daily
          - pointcast-drum
          - presence
          - shwa-rooms
          - shwa-voice
          - sparrow-digest

permissions:
  contents: read

concurrency:
  group: cloudflare-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 699061394cac705067bad6a7a4bd2db5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OPS_TOKEN }}
      WRANGLER: npx --yes wrangler@4.158.0
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            workers
            migrations
            wrangler.toml
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for the ops token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=No token::CLOUDFLARE_OPS_TOKEN is not set. Create a Cloudflare API token with Workers Scripts: Edit and D1: Edit, and save it as that repository secret."
            exit 1
          fi

      # Lists what is and is not applied. Changes nothing.
      - name: List pending migrations
        if: inputs.job == 'list-migrations' || inputs.job == 'apply-migrations'
        run: $WRANGLER d1 migrations list pointcast-auth --remote

      # Applies every pending file in migrations/auth, in file-name order.
      # Read the list above first: a migration for a feature that is not
      # switched on yet is applied too.
      - name: Apply migrations
        if: inputs.job == 'apply-migrations'
        run: $WRANGLER d1 migrations apply pointcast-auth --remote

      - name: Deploy the worker
        if: inputs.job == 'deploy-worker'
        working-directory: workers/${{ inputs.worker }}
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi
          $WRANGLER deploy
