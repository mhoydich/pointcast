name: Loom away mark
on:
  pull_request:
    paths:
      - 'public/loom-availability.mjs'
      - 'src/lib/loom/bot-page.mjs'
      - 'src/pages/loom/index.astro'
      - 'tests/loom-availability.test.mjs'
      - 'tests/loom-bot-page.test.mjs'
      - '.github/workflows/loom-away-mark.yml'
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/loom-availability.test.mjs tests/loom-bot-page.test.mjs
