name: Loom away mark and For You third pass
on:
  pull_request:
    paths:
      - 'public/loom-availability.mjs'
      - 'src/lib/loom/bot-page.mjs'
      - 'src/pages/loom/index.astro'
      - 'tests/loom-availability.test.mjs'
      - 'tests/loom-bot-page.test.mjs'
      - 'tests/loom-for-you*.test.mjs'
      - 'tests/loom-v3-page.test.mjs'
      - 'src/lib/loom/for-*.mjs'
      - 'src/lib/loom/answer-reference.mjs'
      - '.github/workflows/loom-away-mark.yml'
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/loom-qa" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
          ln -s "$RUNNER_TEMP/loom-qa/node_modules" node_modules
      - run: node --test tests/loom-availability.test.mjs tests/loom-bot-page.test.mjs tests/loom-for-you.test.mjs tests/loom-v3-page.test.mjs tests/loom-for-you-third.test.mjs
      - run: npm run audit:agents
