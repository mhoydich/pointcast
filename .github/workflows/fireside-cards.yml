name: Check fireside cards
on:
  pull_request:
    paths:
      - 'public/sketches/fireside-cards/**'
      - 'tests/fireside-cards*'
      - '.github/workflows/fireside-cards.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/fireside-cards.test.mjs
      - run: node --check public/sketches/fireside-cards/client.mjs
      - run: npm run build:bare
