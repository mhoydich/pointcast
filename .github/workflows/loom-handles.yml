name: Loom claimed handles draft checks
on:
  pull_request:
    paths:
      - 'functions/api/loom.ts'
      - 'functions/api/loom/handles.ts'
      - 'functions/_lib/loom-handle-auth.ts'
      - 'src/lib/loom/handles.mjs'
      - 'src/lib/loom/service.mjs'
      - 'src/lib/loom/topic-page.mjs'
      - 'src/pages/loom/index.astro'
      - 'public/loom/handles/**'
      - 'migrations/auth/0035_loom_handles.sql'
      - 'tests/loom-handles*'
      - 'tests/loom-v3-page.test.mjs'
      - '.github/workflows/loom-handles.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/loom-handles*.test.mjs tests/loom.test.mjs tests/loom-v3-page.test.mjs tests/loom-front-doors.test.mjs tests/auth-session-post.test.mjs
      - run: npm run audit:agents
      - name: Compile routes only (no migration or deploy)
        run: |
          mkdir -p .off60-functions/api/loom
          printf '%s\n' "export { onRequest } from '../../functions/api/loom.ts';" > .off60-functions/api/loom.ts
          printf '%s\n' "export { onRequest } from '../../../functions/api/loom/handles.ts';" > .off60-functions/api/loom/handles.ts
          npx --yes wrangler@4.158.0 pages functions build .off60-functions --outdir /tmp/loom-handles-worker
      - run: npm run build:bare
