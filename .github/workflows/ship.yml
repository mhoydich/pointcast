name: Ship reviewed PRs

# The cloud merge for PointCast, so nothing waits on the Mac. It merges a pull
# request only when it has what AGENTS.md asks for before main:
#   - Codex review (X): the Codex GitHub reviewer reviewed the exact head commit
#     and flagged nothing at P0/P1 (or said it found no major issues);
#   - Mike's okay (MH): the `ship` label, added only when Mike said to publish
#     in his own words (quote him in the PR body);
#   - every check on the head commit green.
# Then it starts "Deploy PointCast to Cloudflare Pages" on main.
# A `hold` label or "Publish: hold" in the body keeps a PR open.
# Logic and tests: scripts/ship-pr.mjs, tests/ship-pr.test.mjs.

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review, reopened]
    branches: [main]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (blank sweeps every open PR labeled ship)'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: ship-pointcast
  cancel-in-progress: false

jobs:
  ship:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: scripts/ship-pr.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Merge if reviewed, okayed and green
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_JOB_NAME: ship
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            node scripts/ship-pr.mjs --pr "$PR_NUMBER"
          else
            node scripts/ship-pr.mjs
          fi
