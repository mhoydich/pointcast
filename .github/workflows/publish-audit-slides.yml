name: Publish audit slides

on:
  pull_request:
    paths:
      - '.github/workflows/publish-audit-slides.yml'
      - 'src/content/blocks/0723.json'
      - 'src/data/publish-audit-2026-10-19.mjs'
      - 'src/pages/publishing/2026-10-19.astro'
      - 'src/pages/publishing/2026-10-19.json.ts'
      - 'src/scripts/publish-audit-deck.mjs'
      - 'tests/publish-audit-2026-10-19.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check block 0723 and the Oct 19 slide deck
        run: node --test tests/publish-audit-2026-10-19.test.mjs
