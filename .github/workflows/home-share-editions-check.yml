name: Check home share editions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-share-editions-check.yml'
      - 'src/lib/home-share-editions*'
      - 'src/components/HomeShareEditions.astro'
      - 'src/components/HomeVisitWindow.astro'
      - 'src/data/home-visit-views.json'
      - 'src/lib/home-visit-*'
      - 'public/images/home-visit/**'
      - 'scripts/verify-home-visit.mjs'
      - 'tests/home-visit-*'
      - 'src/pages/share/home/**'
      - 'src/pages/index.astro'
      - 'src/layouts/BlockLayout.astro'
      - 'src/lib/unfurl/plan.mjs'
      - 'functions/_middleware.ts'
      - 'public/_headers'
      - 'public/images/home-share/**'
      - 'scripts/verify-home-share.mjs'
      - 'tests/home-share-editions.test.mjs'
      - 'tests/unfurl-freshness.test.mjs'

permissions:
  contents: read

concurrency:
  group: home-share-editions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify editions, visitor choices, and existing unfurls
        run: node --test tests/home-visit-deck.test.mjs tests/home-visit-controller.test.mjs tests/home-visit-content.test.mjs tests/home-share-editions.test.mjs tests/unfurl-engine.test.mjs tests/unfurl-freshness.test.mjs tests/kennel-club-og-today.test.mjs
      - name: Full build
        run: npm run build
      - name: Verify server-rendered edition metadata and built image bytes
        run: |
          node scripts/verify-home-share.mjs
          node scripts/verify-home-visit.mjs
      - name: Retain focused compiled homepage preview
        env:
          HOME_PREVIEW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import * as fs from 'node:fs/promises';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { JSDOM } from 'jsdom';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          if (process.env.HOME_PREVIEW_EXPECTED_HEAD && process.env.HOME_PREVIEW_EXPECTED_HEAD !== head) throw new Error('Preview head mismatch');
          const dist = await fs.realpath(path.resolve(process.env.HOME_PREVIEW_SOURCE_DIR || 'dist'));
          const out = path.resolve(process.env.HOME_PREVIEW_OUTPUT_DIR || 'home-preview');
          if ((await fs.readdir(out).catch(error => error.code === 'ENOENT' ? [] : Promise.reject(error))).length) throw new Error('Preview output must be empty');
          await fs.mkdir(out, { recursive: true });
          const origin = 'https://pointcast.xyz';
          const extensions = /\.(?:css|m?js|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico)$/i;
          const queue = [], seen = new Set(), files = [], missing = new Set(), external = new Set(), excluded = new Set();
          let bytes = 0;
          async function include(value, from = 'index.html', required = false) {
            if (!value || value.startsWith('data:') || value.startsWith('#')) return;
            const astroRoot = value.startsWith('_astro/'); // Vite preload maps use site-root asset paths.
            if (astroRoot || value.startsWith('/_astro/')) required = true;
            const url = new URL(astroRoot ? '/' + value : value, origin + '/' + from);
            if (url.origin !== origin) { external.add(url.href); return; }
            const relative = decodeURIComponent(url.pathname).replace(/^\/+/, '');
            if (/^(?:api|og|_worker\.js|_server|server|functions)(?:\/|$)/.test(relative)) {
              if (required) throw new Error('Required preview reference points to runtime output: ' + relative);
              excluded.add(relative); return;
            }
            if (relative !== 'index.html' && !extensions.test(relative)) return;
            if (relative.split('/').some(part => part.startsWith('.'))) throw new Error('Hidden preview reference: ' + relative);
            if (seen.has(relative)) return;
            const candidate = path.resolve(dist, relative);
            if (!candidate.startsWith(dist + path.sep)) throw new Error('Preview path escaped dist');
            let physical;
            try { physical = await fs.realpath(candidate); }
            catch (error) { if (error.code !== 'ENOENT' || required) throw error; missing.add(relative); return; }
            if (!physical.startsWith(dist + path.sep)) throw new Error('Preview symlink escaped dist');
            if (path.relative(dist, physical).split(path.sep).some(part => part.startsWith('.'))) throw new Error('Hidden physical preview reference');
            if (/^(?:api|og|_worker\.js|_server|server|functions)(?:\/|$)/.test(path.relative(dist, physical).split(path.sep).join('/'))) throw new Error('Preview symlink points to runtime output');
            const stat = await fs.stat(physical);
            if (!stat.isFile()) throw new Error('Preview reference is not a file');
            if (seen.size >= 2000 || bytes + stat.size > 150 * 1024 * 1024) throw new Error('Preview exceeds bounded file/byte budget');
            seen.add(relative); bytes += stat.size; queue.push(relative);
          }
          await include('/index.html', 'index.html', true);
          const html = await fs.readFile(path.join(dist, 'index.html'), 'utf8');
          const dom = new JSDOM(html); // Parsing only: no script execution or resource fetching.
          for (const node of dom.window.document.querySelectorAll('link[href], script[src], img[src], source[src], video[poster]')) {
            const tag = node.tagName.toLowerCase();
            if (tag === 'link' && !/\b(stylesheet|preload|modulepreload|icon)\b/.test(node.getAttribute('rel') || '')) continue;
            await include(node.getAttribute(tag === 'link' ? 'href' : tag === 'video' ? 'poster' : 'src'), 'index.html', tag === 'script' || tag === 'link');
          }
          for (const node of dom.window.document.querySelectorAll('[srcset]')) for (const item of node.getAttribute('srcset').split(',')) await include(item.trim().split(/\s+/)[0]);
          const artwork = [...dom.window.document.querySelectorAll('[data-home-visit-view] img')].map(node => node.getAttribute('src'));
          if (artwork.length !== 6 || new Set(artwork).size !== 6 || artwork.some(src => !src.startsWith('/images/home-visit/') || !src.endsWith('.webp'))) throw new Error('Expected all six visitor artworks');
          for (const src of artwork) await include(src, 'index.html', true);
          dom.window.close();
          for (let index = 0; index < queue.length; index++) {
            const relative = queue[index];
            const buffer = await fs.readFile(path.join(dist, relative));
            if (/\.(?:html|css|m?js)$/i.test(relative)) {
              const text = buffer.toString('utf8');
              for (const match of text.matchAll(/(?:url\(\s*|@import\s*|\bfrom\s*|\bimport\s*\(?\s*)["']?([^"'()\s;<>]+\.(?:css|m?js|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico)(?:[?#][^"'()\s;<>]*)?)/gi)) await include(match[1], relative, true);
              for (const match of text.matchAll(/["'`]([^"'`\s<>]+\.(?:css|m?js|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico)(?:[?#][^"'`\s<>]*)?)["'`]/gi)) await include(match[1], relative);
            }
            const target = path.join(out, relative);
            await fs.mkdir(path.dirname(target), { recursive: true });
            await fs.writeFile(target, buffer);
            files.push({ path: relative, bytes: buffer.length, sha256: createHash('sha256').update(buffer).digest('hex') });
          }
          files.sort((a, b) => a.path.localeCompare(b.path));
          const actualBytes = files.reduce((sum, file) => sum + file.bytes, 0);
          if (actualBytes > 150 * 1024 * 1024) throw new Error('Preview changed beyond byte budget');
          const manifest = { head, tree, scope: 'Compiled root homepage and referenced static assets only. Backend/API/OG routes and navigation pages are not included; third-party resources were not fetched.', artwork, files, bytes: actualBytes, omittedLocal: [...missing].sort(), externalReferences: [...external].sort(), excludedRuntime: [...excluded].sort() };
          await fs.writeFile(path.join(out, 'home-preview-manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify({ head, tree, files: files.length, bytes: actualBytes, artworks: artwork.length, omittedLocal: missing.size, externalReferences: external.size, excludedRuntime: excluded.size }));
          NODE
      - name: Upload compiled homepage for browser QA
        uses: actions/upload-artifact@v4
        with:
          name: pointcast-home-visit-${{ github.event.pull_request.head.sha }}
          path: home-preview/
          if-no-files-found: error
          retention-days: 3
