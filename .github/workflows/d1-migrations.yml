# Apply D1 migrations for pointcast-auth from the cloud, so no one needs a
# laptop with wrangler signed in. Run it by hand from the Actions tab.
# "list" (the default) only shows which migrations are not applied yet;
# "apply" applies them. Pages deploys never run migrations on their own.
name: D1 migrations (pointcast-auth)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list shows pending migrations; apply runs them"
        required: true
        default: list
        type: choice
        options: [list, apply]

permissions:
  contents: read

concurrency:
  group: d1-migrations-pointcast-auth
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Same account as the Pages deploy; the token cannot list accounts itself.
      CLOUDFLARE_ACCOUNT_ID: 699061394cac705067bad6a7a4bd2db5
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for the Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=No token::CLOUDFLARE_API_TOKEN is not set; nothing was changed."
            exit 1
          fi

      - name: Pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.158.0 d1 migrations list pointcast-auth --remote

      - name: Apply migrations
        if: inputs.action == 'apply'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.158.0 d1 migrations apply pointcast-auth --remote
