name: Loom progress prototype
on:
  pull_request:
    paths:
      - '.github/workflows/loom-progress.yml'
      - 'public/loom-lab/progress/**'
      - 'src/data/loom-progress-*.json'
      - 'scripts/*loom-progress*.mjs'
      - 'tests/loom-progress*'
permissions:
  contents: read
jobs:
  evidence-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-loom-progress-sample.mjs
      - run: git diff --exit-code -- public/loom-lab/progress/data.json
      - run: node --test tests/loom-progress.test.mjs
