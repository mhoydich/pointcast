name: UFOGP contract simulation
on:
  pull_request:
    paths:
      - 'contracts/ufogp/**'
      - '.github/workflows/ufogp-contracts.yml'
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r contracts/ufogp/requirements.txt
      - run: |
          mkdir -p /tmp/ufogp-simulation
          cd /tmp/ufogp-simulation
          python "$GITHUB_WORKSPACE/contracts/ufogp/test_contracts.py"
      - run: bash -n contracts/ufogp/originate.sh
