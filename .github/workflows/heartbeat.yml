name: Season Two Heartbeat

# The Season Two pulse — the smallest possible proof the autonomous loop
# is alive. Appends one line to HEARTBEAT.log, commits it back, and
# reports to the season thread. See SEASON-2.md.
#
# Triggers are schedule + manual dispatch only, so the commit this
# workflow pushes can never retrigger it.

on:
  schedule:
    - cron: "11 14 * * *" # 14:11 UTC — 7:11 am in El Segundo (PDT)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

env:
  SEASON_ISSUE: "731"

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Append the pulse
        run: |
          STAMP="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "${STAMP} · season two · pulse ${GITHUB_RUN_NUMBER} · the pot, still on" >> HEARTBEAT.log

      - name: Commit it back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEARTBEAT.log
          git commit -m "heartbeat: pulse $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Report to the season thread
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$SEASON_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "$(date -u '+%Y-%m-%d %H:%M') UTC — pulse ${GITHUB_RUN_NUMBER}. HEARTBEAT.log +1. The pot, still on."
