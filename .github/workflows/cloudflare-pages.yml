name: Deploy PointCast to Cloudflare Pages

# The Cloudflare Pages project "pointcast" is a Direct Upload project (it has no
# Git connection, and Cloudflare can't add one to an existing Direct Upload
# project). This workflow is the auto-deploy: every push to main builds the site
# and uploads it with wrangler, so what's on main is what's live.
#
# The repository secret CLOUDFLARE_API_TOKEN ("Cloudflare Pages: Edit" on the
# account) has been set since 2026-11-09, so this workflow is the normal way
# pointcast.xyz goes live. If the secret is ever removed, the build still runs
# and the deploy step is skipped with a warning.
#
# The gates and the smoke test below are the ones scripts/deploy.sh applies, so
# a release is held to the same bar whichever path ships it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: 699061394cac705067bad6a7a4bd2db5
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out PointCast
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Same gates as scripts/deploy.sh: a partial build never reaches the upload.
      - name: Gate the build
        run: |
          for page in index.html court/index.html blocks.json; do
            [ -f "dist/$page" ] || { echo "::error title=Gate::dist/$page is missing; not deploying"; exit 1; }
          done
          files=$(find dist -type f | wc -l | tr -d ' ')
          [ "$files" -ge 3000 ] || { echo "::error title=Gate::only $files files in dist; not deploying"; exit 1; }
          echo "build ok: $files files"

      - name: Check for the Cloudflare token
        id: token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            # A green run here does not mean the site changed. Say so where people look.
            echo "::warning title=Not deployed::Build passed, but nothing was deployed. CLOUDFLARE_API_TOKEN is not set, so pointcast.xyz still serves the last scripts/deploy.sh release, not ${GITHUB_SHA::8}."
            {
              echo "## Not deployed"
              echo ""
              echo "The build passed, but the deploy step was skipped because the \`CLOUDFLARE_API_TOKEN\` secret is not set."
              echo "pointcast.xyz still serves the last \`scripts/deploy.sh\` release, not \`${GITHUB_SHA::8}\`."
              echo ""
              echo "To ship this commit, run \`scripts/deploy.sh\` on the deploy machine (see docs/OPERATIONS.md)."
              echo "To see which merged blocks are not live, run \`npm run audit:publishing\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # wrangler-action installs wrangler 3 into the project, and that install
      # fails on the project's @cloudflare/workers-types 5 peer range. Running
      # wrangler 4 through npx keeps it out of the project's dependency tree.
      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --yes wrangler@4.158.0 pages deploy dist
          --project-name=pointcast
          --branch=main
          --commit-hash=${{ github.sha }}

      # The pages an outage hits first. A red run here means the release is
      # uploaded but something is wrong on production: look at the site now.
      - name: Smoke-test production
        if: steps.token.outputs.present == 'true'
        run: |
          bad=0
          for path in / /court/ /blocks.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 "https://pointcast.xyz${path}?deploy=${GITHUB_SHA::8}")
            if [ "$code" != 200 ]; then
              echo "::error title=Smoke::${path} returned ${code}"
              bad=1
            fi
          done
          exit "$bad"

      # Tell the outside world about new agent-written blocks (Bluesky, then
      # IndexNow). Skips itself until the two Bluesky secrets exist, and can
      # never fail or undo a deploy. Rules: docs/setup/broadcast.md.
      - name: Broadcast new blocks
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/broadcast.mjs
