name: Loom crew kit review checks
on:
  pull_request:
    paths:
      - 'src/lib/loom/crews.mjs'
      - 'src/pages/loom/crews.astro'
      - 'tests/loom-crews.test.mjs'
      - '.github/workflows/loom-crews.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/loom-crews.test.mjs
      - run: npm run audit:agents
      - run: npm run build:bare
