<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" shape-rendering="crispEdges">
  <!-- OG card for /drum-vs — 1v1 tug-of-war. Cream paper bg with the
       rope across the middle, two Nouns at the ends pulling, magenta
       marker in the center. Built 2026-04-30 PT for the friend-1v1
       sprint. -->
  <defs>
    <radialGradient id="paperWash" cx="30%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#fff5d8"/>
      <stop offset="100%" stop-color="#f8e8c0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paperWash)"/>

  <!-- Confetti scatter (subtle) -->
  <g opacity="0.5">
    <rect x="100" y="80"  width="10" height="10" fill="#d6346a" transform="rotate(20 105 85)"/>
    <rect x="180" y="120" width="9"  height="9"  fill="#f0c431" transform="rotate(-15 184 124)"/>
    <rect x="1080" y="90" width="10" height="10" fill="#3aa9c4" transform="rotate(40 1085 95)"/>
    <rect x="1020" y="140" width="9" height="9"  fill="#2f8c69" transform="rotate(-30 1024 144)"/>
    <circle cx="140" cy="540" r="5" fill="#f0c431"/>
    <circle cx="1080" cy="540" r="5" fill="#d6346a"/>
  </g>

  <!-- Midcentury corner blocks -->
  <rect x="0"    y="0"   width="16" height="16" fill="#d6346a"/>
  <rect x="1184" y="0"   width="16" height="16" fill="#3aa9c4"/>
  <rect x="0"    y="614" width="16" height="16" fill="#11100c"/>
  <rect x="1184" y="614" width="16" height="16" fill="#11100c"/>

  <!-- Top rule pair -->
  <rect x="0" y="70" width="1200" height="2" fill="#11100c"/>
  <rect x="0" y="76" width="1200" height="1" fill="#d6346a" opacity="0.55"/>

  <text x="60" y="52" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="5" fill="#11100c">
    PC · POINTCAST NETWORK / DRUM VS · 1v1
  </text>
  <g transform="translate(965, 34)">
    <rect width="180" height="28" rx="14" fill="#fff5d8" stroke="#d6346a" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#d6346a"/>
    <text x="32" y="19" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="700" letter-spacing="3" fill="#11100c">FIRST TO 50</text>
  </g>

  <!-- Title -->
  <text x="60" y="218" font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="120" font-weight="800" letter-spacing="9" fill="#11100c">
    DRUM
  </text>
  <text x="380" y="218" font-family="Lora, Georgia, serif" font-style="italic"
        font-size="120" font-weight="500" fill="#d6346a">
    vs
  </text>

  <!-- Tagline -->
  <text x="62" y="285" font-family="Lora, Georgia, serif" font-style="italic"
        font-size="32" font-weight="500" fill="#11100c">
    a 1v1 tug-of-war for friends.
  </text>
  <text x="62" y="322" font-family="Lora, Georgia, serif" font-style="italic"
        font-size="22" font-weight="500" fill="#6a5d45" opacity="0.85">
    send the link, pull the rope, your Nouns at each end.
  </text>

  <!-- The rope across the middle -->
  <g transform="translate(0, 410)">
    <!-- Left noun (P1) -->
    <g transform="translate(140, -32)">
      <rect x="-6" y="-6" width="124" height="124" fill="#11100c"/>
      <rect x="0" y="0" width="112" height="112" fill="#fff5d8"/>
      <image href="https://noun.pics/156.svg" x="0" y="0" width="112" height="112"
             preserveAspectRatio="none" image-rendering="pixelated"/>
      <rect x="0" y="0" width="6" height="6" fill="#d6346a"/>
      <rect x="106" y="106" width="6" height="6" fill="#d6346a"/>
    </g>
    <text x="196" y="115" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" font-weight="700" letter-spacing="3" fill="#11100c">P1 · LEFT</text>

    <!-- Rope (zebra-striped between the nouns) -->
    <g transform="translate(280, 50)">
      <!-- segments: alternating ink/magenta -->
      <rect x="0"   y="-8" width="40" height="16" fill="#11100c"/>
      <rect x="40"  y="-8" width="40" height="16" fill="#d6346a"/>
      <rect x="80"  y="-8" width="40" height="16" fill="#11100c"/>
      <rect x="120" y="-8" width="40" height="16" fill="#d6346a"/>
      <rect x="160" y="-8" width="40" height="16" fill="#11100c"/>
      <rect x="200" y="-8" width="40" height="16" fill="#d6346a"/>
      <rect x="240" y="-8" width="40" height="16" fill="#11100c"/>
      <rect x="280" y="-8" width="40" height="16" fill="#d6346a"/>
      <rect x="320" y="-8" width="40" height="16" fill="#11100c"/>
      <rect x="360" y="-8" width="40" height="16" fill="#d6346a"/>
      <rect x="400" y="-8" width="40" height="16" fill="#11100c"/>
      <rect x="440" y="-8" width="40" height="16" fill="#d6346a"/>
      <rect x="480" y="-8" width="40" height="16" fill="#11100c"/>
      <rect x="520" y="-8" width="40" height="16" fill="#d6346a"/>
      <rect x="560" y="-8" width="40" height="16" fill="#11100c"/>
    </g>

    <!-- Center marker (a flag/medallion) — slightly off-center to suggest pull -->
    <g transform="translate(560, 50)">
      <circle r="34" fill="#fff" stroke="#11100c" stroke-width="3"/>
      <circle r="32" fill="#fff" stroke="#d6346a" stroke-width="2"/>
      <text y="6" text-anchor="middle"
            font-family="JetBrains Mono, ui-monospace, monospace"
            font-size="15" font-weight="800" letter-spacing="2" fill="#11100c">VS</text>
    </g>

    <!-- Right noun (P2) -->
    <g transform="translate(940, -32)">
      <rect x="-6" y="-6" width="124" height="124" fill="#11100c"/>
      <rect x="0" y="0" width="112" height="112" fill="#fff5d8"/>
      <image href="https://noun.pics/805.svg" x="0" y="0" width="112" height="112"
             preserveAspectRatio="none" image-rendering="pixelated"/>
      <rect x="0" y="0" width="6" height="6" fill="#3aa9c4"/>
      <rect x="106" y="106" width="6" height="6" fill="#3aa9c4"/>
    </g>
    <text x="996" y="115" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="11" font-weight="700" letter-spacing="3" fill="#11100c">P2 · RIGHT</text>
  </g>

  <!-- Byline block -->
  <rect x="60" y="500" width="4" height="56" fill="#d6346a"/>
  <text x="82" y="525" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="17" font-weight="700" letter-spacing="3" fill="#11100c">
    SHARE THE LINK · TAP TO PULL · ROOM-SCOPED LATENCY
  </text>
  <text x="82" y="548" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="13" font-weight="500" letter-spacing="5" fill="#8c7a5e">
    POINTCAST.XYZ/DRUM-VS · EL SEGUNDO · CC0
  </text>

  <!-- Bottom strip -->
  <rect x="0" y="582" width="1200" height="2" fill="#d6346a" opacity="0.45"/>
  <text x="60" y="612" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="14" font-weight="600" letter-spacing="4" fill="#6a5d45">
    pointcast.xyz/drum-vs · live from el segundo · 2026
  </text>
  <g transform="translate(1050, 598)">
    <circle cx="4" cy="8" r="5" fill="#d6346a"/>
    <text x="14" y="14" font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="700" letter-spacing="4" fill="#11100c">
      ON AIR
    </text>
  </g>
</svg>
