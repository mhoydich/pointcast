<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Listening Grove — PointCast house campaign sketch</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0df;
      --ink: #142c24;
      --blue: #426fa6;
      --violet: #9d86b9;
      --leaf: #5f8758;
      --sun: #d6bd53;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e9e6da;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .card {
      width: min(92vw, 760px);
      aspect-ratio: 4 / 3;
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--ink) 62%, transparent);
      background:
        linear-gradient(90deg, transparent 0 31%, rgba(66,111,166,.15) 31% 57%, transparent 57%),
        linear-gradient(180deg, var(--paper), #ece7cd);
      isolation: isolate;
    }

    .field,
    .field::before,
    .field::after {
      position: absolute;
      content: "";
      border: 1px solid rgba(20,44,36,.55);
      transition: transform 900ms cubic-bezier(.2,.75,.15,1);
    }

    .field {
      width: 46%;
      height: 44%;
      left: 9%;
      top: 15%;
      background: rgba(157,134,185,.35);
    }

    .field::before {
      width: 82%;
      height: 112%;
      left: 83%;
      top: 42%;
      background: rgba(66,111,166,.22);
    }

    .field::after {
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      left: 42%;
      top: -24%;
      background: rgba(214,189,83,.5);
    }

    .tree {
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: 2px;
      height: 68%;
      background: var(--ink);
      transform-origin: bottom;
      transition: transform 900ms cubic-bezier(.2,.75,.15,1);
    }

    .tree span {
      position: absolute;
      display: block;
      width: 128px;
      height: 56px;
      border: 2px solid var(--leaf);
      border-width: 2px 0 0 2px;
      border-radius: 100% 0 0;
      transform-origin: right bottom;
    }

    .tree span:nth-child(1) { right: 0; top: 12%; transform: rotate(-20deg); }
    .tree span:nth-child(2) { left: 0; top: 28%; transform: rotate(25deg) scaleX(-1); }
    .tree span:nth-child(3) { right: 0; top: 46%; transform: rotate(-8deg) scale(.86); }
    .tree span:nth-child(4) { left: 0; top: 61%; transform: rotate(15deg) scale(-.72,.72); }

    .copy {
      position: absolute;
      inset: auto 5% 5%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      z-index: 3;
    }

    .eyebrow {
      margin: 0 0 7px;
      font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font: 500 clamp(38px, 7vw, 74px)/.9 Georgia, serif;
      letter-spacing: -.055em;
    }

    .facts {
      display: grid;
      gap: 4px;
      justify-items: end;
      font: 600 11px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .facts b {
      padding: 5px 8px;
      border: 1px solid var(--ink);
      background: rgba(244,240,223,.78);
    }

    .status {
      position: absolute;
      top: 4%;
      right: 4%;
      z-index: 3;
      padding: 5px 8px;
      border: 1px solid var(--ink);
      background: var(--paper);
      font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .card:hover .field { transform: translate3d(-8px, 5px, 0) rotate(-1deg); }
    .card:hover .field::before { transform: translate3d(12px, -10px, 0); }
    .card:hover .field::after { transform: scale(1.08); }
    .card:hover .tree { transform: rotate(1.5deg); }

    @media (prefers-reduced-motion: reduce) {
      .field, .field::before, .field::after, .tree { transition: none; }
    }

    @media (max-width: 560px) {
      .card { aspect-ratio: 4 / 5; }
      .copy { grid-template-columns: 1fr; }
      .facts { justify-items: start; }
    }
  </style>
</head>
<body>
  <article class="card" aria-label="The Listening Grove PointCast campaign preview">
    <div class="field" aria-hidden="true"></div>
    <div class="tree" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="status">House campaign · staged</p>
    <div class="copy">
      <div>
        <p class="eyebrow">PointCast · CH.GDN · Block 0492</p>
        <h1>The Listening Grove</h1>
      </div>
      <div class="facts" aria-label="Collection preview facts">
        <b>617 works</b>
        <b>49 living</b>
        <b>5 editions · 10ꜩ</b>
        <b>Mainnet off</b>
      </div>
    </div>
  </article>
</body>
</html>
