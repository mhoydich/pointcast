name = "pointcast-the-desk"
main = "src/index.ts"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "AUTH_DB"
database_name = "pointcast-auth"
database_id = "15de417a-2167-45e6-a7aa-340a7a99331c"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (wrangler secret put <name>), never committed and never in agent context:
#   DESK_OWNER_KEY      Mike only: /approve, /rearm (and /kill)
#   DESK_AGENT_KEY      Mike's agents: /propose (and /kill)
#   DESK_NTFY_URL       private ntfy topic URL for approval, halt and kill pushes
#   ALPACA_DATA_KEY_ID  Alpaca *paper* account market-data key (unset → Alpaca venue off)
#   ALPACA_DATA_SECRET
# Paper mode holds no trading keys and no withdrawal permissions anywhere.
