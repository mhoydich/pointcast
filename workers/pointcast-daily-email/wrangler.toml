# workers/pointcast-daily-email - daily PointCast update sender.
#
# Deploy separately from the main Pages site:
#   cd workers/pointcast-daily-email
#   npx wrangler deploy
#
# The worker previews by default. It sends only when:
#   - RESEND_API_KEY is set as a secret
#   - DAILY_EMAIL_SEND_MODE = "live"
#   - at least one opt-in recipient is supplied by DAILY_EMAIL_TO or KV

name = "pointcast-daily-email"
main = "src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# 16:30 UTC = 9:30 AM America/Los_Angeles on April 30, 2026.
# Cloudflare cron is UTC; adjust in winter if fixed Pacific wall time matters.
[triggers]
crons = ["30 16 * * *"]

# Optional. If bound, keys shaped sub:<email> are read as opt-in recipients.
# Values may be JSON: { "email": "person@example.com", "active": true }.
#
# [[kv_namespaces]]
# binding = "DAILY_EMAIL_AUDIENCE_KV"
# id = "REPLACE_ME_WITH_KV_ID"

[vars]
DAILY_EMAIL_SEND_MODE = "dry-run"
DAILY_EMAIL_FROM = "hello@pointcast.xyz"
DAILY_EMAIL_FROM_NAME = "PointCast"
DAILY_EMAIL_ORIGIN = "https://pointcast.xyz"
