name = "pointcast-kennel-daily"
main = "src/index.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 7 * * *"]

[vars]
KENNEL_DAILY_DRY_RUN = "false"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "pointcast-auth"
database_id = "15de417a-2167-45e6-a7aa-340a7a99331c"

[[send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["kennel@pointcast.xyz"]

[[services]]
binding = "PRESENCE_BUS"
service = "pointcast-presence"

[observability]
enabled = true
head_sampling_rate = 1

