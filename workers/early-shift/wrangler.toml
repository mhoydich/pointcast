name = "pointcast-early-shift"
main = "src/index.ts"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 13 * * *", "0 14 * * *"]

[vars]
EARLY_SHIFT_DRY_RUN = "false"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "pointcast-auth"
database_id = "15de417a-2167-45e6-a7aa-340a7a99331c"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (wrangler secret put <name>), not committed here:
#   AIRNOW_API_KEY    — unset means the Air feed records a `blocked` gap and never fetches.
#   YARD_RESIDENT_KEY — unset means POST /run answers 503 resident-key-unset.
