# pointcast-loom — the Loom's Durable Objects (one per log, list and record).
#
# The Pages project (../../wrangler.toml) binds LOOM to this Worker's class via
# script_name = "pointcast-loom", because Pages Functions cannot export DO
# classes. Deploy this Worker first, then Pages:
#
#   cd workers/loom && npx wrangler deploy
#
# Until it is deployed and bound, /api/loom keeps using the v1 KV layout.

name = "pointcast-loom"
main = "src/index.ts"
compatibility_date = "2026-09-14"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "LOOM"
class_name = "LoomDoc"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoomDoc"]
