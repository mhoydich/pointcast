name = "pointcast-keyboard-studio"
main = "src/index.ts"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[durable_objects.bindings]]
name = "KEYBOARD_STUDIO"
class_name = "KeyboardStudioRoom"

# The keyboard signal: one global note counter (see src/keyboard-signal.ts).
[[durable_objects.bindings]]
name = "KEYBOARD_SIGNAL"
class_name = "KeyboardSignal"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KeyboardStudioRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KeyboardSignal"]
